  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Demand Forecasting
        short: Planning
        icon: chart
        summary: SKU-location demand forecasts across a long-tail catalog and a branch network, blending sell-through, order history, seasonality and promotions.
        problem: A distributor forecasts hundreds of thousands of SKU-location pairs on a spreadsheet cadence, so slow movers overstock and fast movers stock out between refreshes.
        who_benefits: Category & Merch
        how_built: Order, POS and promotion feeds are conformed to Gold; fine-grained forecasts are trained in MLflow and scored per SKU-location, feeding replenishment and buy decisions.
        components:
          - Demand Forecasting
          - Model Serving
          - SAP S/4HANA
          - AI/BI
          - Feature Store
        stories:
          - title: Demand Forecasting at Scale on Databricks
            url: https://www.databricks.com/solutions/accelerators/demand-forecasting
          - title: Mondelez scales model experimentation on Databricks
            url: https://www.databricks.com/customers/mondelez
      - name: Inventory Optimization
        short: Working capital
        icon: store
        summary: Safety-stock, reorder-point and assortment decisions tuned to service-level targets and the cash tied up in inventory across every branch.
        problem: Inventory is set by static min-max rules per branch, so millions in working capital sit in the wrong SKUs while service levels still miss on the ones that matter.
        who_benefits: Supply Chain & Ops
        how_built: Forecasts and lead-time variability feed multi-echelon optimisation in Model Serving; recommendations surface in the Inventory Command app and write back to the ERP.
        components:
          - Inventory Command
          - Model Serving
          - Manhattan Active WMS
          - Lakehouse//RT
          - MLflow
        stories:
          - title: Supply Chain Distribution Optimization
            url: https://www.databricks.com/solutions/accelerators/supply-chain-distribution-optimization
      - name: Dynamic B2B Pricing
        short: Revenue
        icon: market
        summary: Contract and quote prices set per customer, product and volume against cost, competitor context and willingness to pay rather than a static price book.
        problem: Thousands of negotiated contract prices drift from cost, so margin leaks quietly on renewals and reps discount to the floor without knowing where the floor is.
        who_benefits: Sales & Commercial
        how_built: Vendavo and PROS pricing data are conformed in the lakehouse; elasticity and win-probability models score each quote through Model Serving behind the Pricing Cockpit.
        components:
          - Pricing Cockpit
          - Vendavo Pricing
          - PROS Pricing
          - Model Serving
          - AI/BI
        stories:
          - title: Databricks for Retail and Consumer Goods
            url: https://www.databricks.com/solutions/industries/retail-industry-solutions
      - name: Churn & Cross-Sell
        short: Growth
        icon: custlake
        summary: Predicting which accounts are drifting and which product lines they should be buying, scored against the order history the CRM and ERP already hold.
        problem: 'A distributor loses accounts quietly: orders taper for months before anyone notices, and cross-sell whitespace sits unworked because no one scores it.'
        who_benefits: Sales & Commercial
        how_built: Order and CRM history are activated through CustomerLake; churn and next-best-order models are scored in Model Serving and served into the rep's account view.
        components:
          - Feature Store
          - Model Serving
          - Salesforce Sales Cloud
          - CustomerLake
          - AI/BI
        stories:
          - title: Calculate Customer Lifetime Value
            url: https://www.databricks.com/solutions/accelerators/customer-lifetime-value
      - name: Fill-Rate & OTIF
        short: Service
        icon: gauge
        summary: 'On-time-in-full attacked before the miss: order, inventory and shipment state joined so an at-risk line is caught while it can still be expedited.'
        problem: Fill-rate and OTIF are reported after the customer is short-shipped, when the only options left are an apology and a credit.
        who_benefits: Supply Chain & Ops
        how_built: Order, inventory and shipment feeds stream into Lakehouse//RT; the OTIF Control Tower flags orders that will miss the promised date so ops can expedite or substitute.
        components:
          - OTIF Control Tower
          - Lakehouse//RT
          - Manhattan Active WMS
          - Oracle OTM
          - AI/BI
        stories:
          - title: Supply Chain Distribution Optimization
            url: https://www.databricks.com/solutions/accelerators/supply-chain-distribution-optimization
      - name: Supplier Scorecards
        short: Sourcing
        icon: sheet
        summary: Supplier performance measured on lead-time reliability, fill rate, quality and rebate compliance across every purchase order, not just the last complaint.
        problem: Supplier reviews run on anecdote and the loudest incident, because lead-time and fill data live in the ERP and never get turned into a scorecard.
        who_benefits: Category & Merch
        how_built: Purchase-order, receipt and EDI feeds are conformed to Gold; supplier scorecards are published as certified Metric Views and shared back to suppliers over Delta Sharing.
        components:
          - AI/BI
          - SAP S/4HANA
          - SPS Commerce EDI
          - Unity Catalog
          - Genie One
        stories:
          - title: 'Unilever: GenAI powers smarter operations'
            url: https://www.databricks.com/customers/unilever
      - name: Route & Logistics
        short: Logistics
        icon: stream
        summary: Delivery routes, carrier choice and last-mile execution optimised across the branch and DC network to cut freight cost and hit the delivery window.
        problem: Routes and carrier assignments are planned in silos per branch, so trucks run half-empty, freight spend climbs and delivery windows slip.
        who_benefits: Supply Chain & Ops
        how_built: Order, shipment and TMS feeds are conformed; route and load plans are generated in Model Serving and executed from the OTIF Control Tower against live in-transit state.
        components:
          - OTIF Control Tower
          - Oracle OTM
          - project44
          - Model Serving
          - Lakehouse//RT
        stories:
          - title: Scalable Route Generation on Databricks
            url: https://www.databricks.com/solutions/accelerators/scalable-route-generation
      - name: Rebate & Chargeback
        short: Margin
        icon: gavel
        summary: Supplier rebate accruals earned and customer chargebacks validated to contract terms, so net margin reflects the money actually owed and owing.
        problem: Rebates and chargebacks are reconciled in spreadsheets against contracts no one can find, so earned rebates go uncaptured and invalid chargebacks go unpaid.
        who_benefits: Finance & Rebates
        how_built: Contract terms, purchase and sales history are conformed in the lakehouse; the Rebate Manager app tracks accruals and disputes on Lakebase with governed writes.
        components:
          - Rebate Manager
          - SAP S/4HANA
          - AI/BI
          - Lakebase
          - Unity Catalog
      - name: B2B Personalization
        short: E-commerce
        icon: product
        summary: Search, product discovery and reorder guidance on the B2B web and punchout channels, tuned to the contract catalog and buying pattern of each account.
        problem: A distributor's e-commerce search buries the right part in a multi-million-SKU catalog, so buyers call the branch and the digital channel underperforms.
        who_benefits: Sales & Commercial
        how_built: Catalog and order history feed retrieval and recommendation models scored in Model Serving; personalised search and reorder lists serve into the commerce and punchout channels.
        components:
          - Pricing Cockpit
          - CustomerLake
          - Model Serving
          - SAP Commerce Cloud
          - AI/BI
        stories:
          - title: 'Grainger: GenAI product discovery across 2.5M SKUs'
            url: https://www.databricks.com/customers/grainger
          - title: Recommendation Engines for Personalization
            url: https://www.databricks.com/solutions/accelerators/recommendation-engines
      - name: Margin & Mix Analytics
        short: Profitability
        icon: chart
        summary: Gross-to-net margin decomposed by customer, product, branch and channel, so the business sees where mix, price and cost move the P&L.
        problem: Margin is reported at the top line, so the loss-making customers and SKUs hide inside a healthy average until a bad quarter exposes them.
        who_benefits: Finance & Rebates
        how_built: Sales, cost and rebate data are conformed to certified Metric Views; margin and mix are explored in AI/BI and Genie on the same definitions the executive team reads.
        components:
          - AI/BI
          - Unity Catalog
          - Genie One
          - SAP S/4HANA
          - Vendavo Pricing
        stories:
          - title: Reckitt on Databricks
            url: https://www.databricks.com/customers/reckitt
          - title: Ahold Delhaize on Databricks
            url: https://www.databricks.com/customers/ahold-delhaize
medallion:
  Bronze:
    short: Raw ERP, WMS, EDI feeds
    summary: Orders, shipments and invoices from the ERP, WMS pick and putaway events, TMS movements and inbound EDI transactions, landed exactly as received so a short-ship or a price can always be replayed as it stood.
  Silver:
    short: Conformed customer, SKU, order
    summary: Customers, SKUs, suppliers and orders resolved into single conformed entities across the ERP, WMS, CRM and commerce estates, with ship-to and bill-to hierarchies reconciled and EDI trading partners matched.
  Gold:
    short: Fill-rate, margin, forecast
    summary: 'Contracted products the commercial and operations teams run on: fill rate and OTIF by customer and branch, gross-to-net margin after rebates, inventory turns, and SKU-location demand forecasts.'
