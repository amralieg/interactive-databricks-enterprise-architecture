        kpis:
          - Fill rate
          - OTIF
          - Orders at risk
          - Backorder rate
          - Perfect order rate
        teams:
          - Supply Chain & Ops
          - Executive Office
          - Demand & supply planning
      - name: Margin & Rebate Recovery
        icon: aibi
        summary: Gross-to-net margin, rebate accruals and chargeback exposure.
        kpis:
          - Gross-to-net margin
          - Rebate accrual
          - Chargeback exposure
          - Margin leakage
          - Net profit
        teams:
          - Finance & Rebates
          - CFO & controllers
          - Executive Office
      - name: Inventory & Working Capital
        icon: aibi
        summary: Inventory turns, dead stock and working capital by SKU and branch.
        kpis:
          - Inventory turns
          - Days on hand
          - Dead stock value
          - Working capital
          - Stockout rate
        teams:
          - Supply Chain & Ops
          - Category & Merch
          - Finance & Rebates
      - name: Sales & Customer Health
        icon: aibi
        summary: Share of wallet, churn risk and cross-sell across the account base.
        kpis:
          - Share of wallet
          - Churn risk
          - Cross-sell rate
          - Win rate
          - Order frequency
        teams:
          - Sales & Commercial
          - Account management
          - Inside sales & e-commerce
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface. A managed Beta is available.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity AI Gateway
      - name: Claude Code
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity AI Gateway.
      - name: OpenAI Codex
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity AI Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity AI Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Inventory & Fill-Rate Agent
        icon: genie
        summary: Ask about stock positions, fill rate and orders at risk of missing OTIF.
        feeds:
          - SAP S/4HANA
          - Manhattan Active WMS
          - project44
          - Fill-rate, margin, forecast
        teams:
          - Supply Chain & Ops
          - Demand & supply planning
          - Warehouse operations
        questions:
          - Which SKU-locations are about to stock out on current demand?
          - What is fill rate by customer and branch this week?
          - Which open orders are at risk of missing OTIF today?
          - Where is working capital tied up in slow-moving inventory?
          - Which SKUs are dead stock across the branch network?
      - name: Margin & Rebates Agent
        icon: genie
        summary: Explore gross-to-net margin, rebate accruals and chargeback exposure.
        feeds:
          - SAP S/4HANA
          - Vendavo Pricing
          - Finance & Rebate Mart
          - Fill-rate, margin, forecast
        teams:
          - Finance & Rebates
          - CFO & controllers
          - Rebate & pricing admin
        questions:
          - What is gross-to-net margin by customer and category this month?
          - Which supplier rebate tiers are at risk of being missed this quarter?
          - Which customer chargebacks look invalid and worth disputing?
          - Which customers and SKUs are loss-making after rebates?
          - How much earned rebate is still uncaptured against contract terms?
      - name: Sales & Customer Growth Agent
        icon: genie
        summary: Answer share-of-wallet, churn and cross-sell questions across the account base.
        feeds:
          - Salesforce Sales Cloud
          - SAP Commerce Cloud
          - SAP S/4HANA
          - Conformed customer, SKU, order
        teams:
          - Sales & Commercial
          - Account management
          - Inside sales & e-commerce
        questions:
          - Which accounts are drifting and reducing order frequency?
          - Where is the biggest cross-sell whitespace by account?
          - What is share of wallet on our top 100 customers?
          - Which reps are below target on productivity this quarter?
          - How is the B2B web channel converting versus the branch?
      - name: Demand & Supplier Performance Agent
        icon: genie
        summary: Ask about SKU-location demand forecasts and supplier lead-time reliability.
        feeds:
          - Circana POS
          - SPS Commerce EDI
          - SAP S/4HANA
