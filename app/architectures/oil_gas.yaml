  - name: Regulatory & Reporting
    icon: gavel
    tiles:
      - name: GHG & Emissions Filing
        icon: gavel
        summary: Regulatory greenhouse submissions produced from governed sensor and flare data.
        citations:
          - epa-ghgrp
      - name: Production Tax Royalty
        icon: share
        summary: Royalty and severance filings from contracted Gold products.
        citations:
          - enablon
  - name: Published Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Published, contracted products discoverable in Unity Catalog Domains and shared over OpenSharing.
      - name: Sharing Recipients
        icon: share
        summary: JV partners, regulators and traders reading live tables with no copy.
  - name: Databricks Apps
    icon: apps
    tiles:
      - name: Production Control
        icon: gauge
        short: Deferment live
        summary: Well uptime, deferment pareto and lift setpoints on Databricks Apps over Lakebase.
      - name: Logistics Console
        icon: globe
        short: Cargo schedule
        summary: Nominations, linepack and vessel positions before export windows close.
      - name: Trading Workbench
        icon: market
        short: Exposure view
        summary: Physical and paper positions marked to benchmark on one surface.
      - name: HSE Dashboard
        icon: gavel
        short: Emissions live
        summary: Flare, leak and permit exceedances before inspections and board review.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Production & Reliability
        icon: aibi
        summary: Net production, deferment and facility uptime on certified operations Metric Views.
        kpis:
          - Net production
          - Deferment volume
          - Facility uptime
          - Hydrocarbon loss rate
          - Well availability
        teams:
          - Upstream Operations
          - Midstream & Terminals
          - Corporate & Asset Leaders
      - name: Logistics & Cargo
        icon: aibi
        summary: Nominations, linepack, imbalance and demurrage across the midstream chain.
        kpis:
          - Pipeline imbalance
          - Linepack
          - Demurrage exposure
          - Terminal throughput
          - Cargo on-time rate
        teams:
          - Midstream & Terminals
          - Cargo Marketing
          - Terminal Operations
      - name: Trading & Margin
        icon: aibi
        summary: Crack-spread margin, exposure, hedge effectiveness and lifting cost.
        kpis:
          - Crack-spread margin
          - Unit lifting cost
          - Exposure vs limit
          - Hedge effectiveness
          - Cargo netback
        teams:
          - Trading & Marketing
          - Risk & Middle Office
          - Corporate & Asset Leaders
      - name: HSE & Emissions
        icon: aibi
        summary: Flare and vent volumes, permit compliance, leaks and safety indicators.
        kpis:
          - Flare volume
          - GHG emissions
          - Permit exceedances
          - Open leaks
          - TRIR
        teams:
          - HSE & Compliance
          - Environmental & Emissions
          - Process Safety
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface. A managed Beta is available.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity AI Gateway
      - name: Claude Code
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity AI Gateway.
      - name: OpenAI Codex
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity AI Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity AI Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Production & Uptime Agent
        icon: genie
        summary: Ask about net production, deferment and facility uptime across assets in plain language.
        feeds:
          - AVEVA PI System
          - SLB OFM
          - Honeywell Experion
          - Conformed well, cargo
        teams:
          - Upstream Operations
          - Corporate & Asset Leaders
          - Production Engineer
        questions:
          - What was net production by asset yesterday versus plan?
          - Which wells are deferring the most volume right now, and why?
          - Which facilities have the worst uptime this month?
          - How much production is at risk from the current open alarms?
          - What is our hydrocarbon loss rate by asset this quarter?
      - name: Midstream & Cargo Agent
        icon: genie
        summary: Explore nominations, linepack, imbalance and cargo scheduling across the logistics chain.
        feeds:
          - Quorum PGAS
          - Kpler Cargo Tracking
          - Veson IMOS
          - AIS Vessel Tracks
        teams:
          - Midstream & Terminals
          - Cargo Marketing
          - Terminal Operations
        questions:
          - Which pipelines are running the largest imbalances today?
          - Which terminal is constraining export this week?
          - What is our current demurrage exposure by voyage?
          - Which cargoes are at risk of missing their loading window?
          - How does linepack compare to nominations across the system?
      - name: Trading & Margin Agent
        icon: genie
        summary: Answer questions on physical and paper positions, exposure and crack-spread margin.
        feeds:
          - ION Openlink Endur
          - Platts Price Assess
          - SAP IS-Oil
          - Production, margin, loss
        teams:
          - Trading & Marketing
          - Risk & Middle Office
          - Corporate & Asset Leaders
        questions:
          - What is our crack-spread margin by product today?
          - Which desks are closest to their exposure limits right now?
          - How effective are our current hedges against benchmark moves?
          - What is unit lifting cost by asset this month?
          - Which cargoes have the best netback against the benchmark?
      - name: HSE & Emissions Agent
        icon: genie
        summary: Ask about emissions, flare volumes, permits and safety incidents across facilities.
        feeds:
          - Enablon EHS
          - Sphera Risk Mgmt
          - FLIR Optical Gas Img
          - EPA GHGRP Templates
        teams:
          - HSE & Compliance
          - Environmental & Emissions
          - Process Safety
        questions:
          - What are our flare and vent volumes by facility this month?
          - Which permits are closest to their limit right now?
          - How many leaks were detected and how many are still open?
          - What is our TRIR trend across the portfolio this year?
          - Which facilities are driving the most greenhouse-gas emissions?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Well Performance
        short: Upstream
        icon: iot
        summary: Decline and artificial-lift optimisation when downhole conditions shift.
        problem: Declining wells and lift problems show up in daily reports long after production is lost, and downhole signals sit in historians nobody joins to the well test and reservoir picture.
        who_benefits: Upstream Operations
        how_built: Separator and downhole tags land in Lakehouse//RT beside well tests, then decline and lift models scored in Model Serving surface the intervention on the Production Control screen.
        components:
          - Production Control
          - AVEVA PI System
          - SLB OFM
          - Lakehouse//RT
          - Model Serving
        stories:
          - title: Devon Energy reimagines analytics and ML for oil & gas exploration
            url: https://www.databricks.com/customers/devon-energy
          - title: ARC Resources optimises drilling performance with real-time data
            url: https://www.databricks.com/blog/2022/05/24/arc-uses-a-lakehouse-architecture-for-real-time-data-insights-that-optimize-drilling-performance-and-lower-carbon-emissions.html
      - name: Facility Uptime
        short: Reliability
        icon: gauge
        summary: Compressor and separator trips predicted before production is deferred.
        problem: A compressor or separator trip defers production for hours, yet failures are found after the unit stops rather than predicted from the sensor drift that preceded them.
        who_benefits: Upstream Operations
        how_built: Historian tags stream into Lakehouse//RT and feed remaining-life and anomaly models tracked in MLflow and scored in Model Serving, raising work orders from the Production Control screen.
        components:
          - Production Control
          - AVEVA PI System
          - Model Serving
          - MLflow
          - Lakehouse//RT
        stories:
          - title: 'Databricks and Shell: industrial time series analytics on the Lakehouse'
            url: https://www.databricks.com/blog/developing-time-series-lakehouse-shell
          - title: Building ML models for predictive maintenance in oil & gas
            url: https://www.databricks.com/blog/2021/04/08/efficiently-building-ml-models-for-predictive-maintenance-in-the-oil-and-gas-industry-with-databricks.html
      - name: Pipeline Optimisation
        short: Midstream
        icon: stream
        summary: Linepack and nomination schedules tuned to minimise imbalance penalties.
        problem: Nominations, linepack and actual flow drift apart across a pipeline day, so imbalances and penalties are discovered after gate close when there is no time left to rebalance.
        who_benefits: Midstream & Terminals
        how_built: Pipeline SCADA and nomination feeds land in Lakehouse//RT, optimisation models scored in Model Serving rebalance linepack, and controllers act from the Logistics Console on certified AI/BI views.
        components:
          - Logistics Console
          - Quorum PGAS
          - Model Serving
          - Lakehouse//RT
          - AI/BI
        stories:
          - title: Pipeline Flow Monitoring on the Databricks Platform
            url: https://www.databricks.com/blog/pipeline-flow-monitoring
      - name: Cargo Scheduling
        short: Logistics
        icon: globe
        summary: Vessel and terminal slots aligned to production and demurrage exposure.
        problem: Vessel positions, terminal inventory and production plans live in separate systems, so cargo slots slip and demurrage runs up before anyone sees the whole export picture.
        who_benefits: Midstream & Terminals
        how_built: Cargo tracks and terminal feeds conform on Delta Lake, optimisation models scored in Model Serving align slots, and schedulers work the plan from the Logistics Console.
        components:
          - Logistics Console
          - Kpler Cargo Tracking
          - Veson IMOS
          - Model Serving
          - AI/BI
      - name: Trading Optimisation
        short: Commercial
        icon: market
        summary: Physical and hedge books reconciled before exposure limits breach.
        problem: Physical deals, paper hedges and benchmark curves are marked in different tools, so desks see exposure late and a limit breach surfaces only after the position has moved.
        who_benefits: Trading & Marketing
        how_built: Deal capture and price feeds conform under Unity Catalog, optimisation and MtM models scored in Model Serving mark books consistently, and desks work exposure from the Trading Workbench.
        components:
          - Trading Workbench
          - ION Openlink Endur
          - Platts Price Assess
          - Model Serving
          - Unity Catalog
      - name: Leak Detection
        short: HSE
        icon: observ
        summary: Optical gas imaging and sensor anomalies triaged to repair work orders.
        problem: Leaks are caught on periodic survey rounds, and the optical-gas and mass-balance signals that would flag a release early sit unlinked from the repair workflow.
        who_benefits: HSE & Compliance
        how_built: Imaging and sensor anomalies feed vision and AI Functions models scored in Model Serving on Lakehouse//RT, and detections become repair work orders on the HSE Dashboard.
        components:
          - HSE Dashboard
          - FLIR Optical Gas Img
          - AI Functions
          - Model Serving
          - Lakehouse//RT
        stories:
          - title: Pipeline Flow Monitoring detects leaks as small as 0.01% of throughput
            url: https://www.databricks.com/blog/pipeline-flow-monitoring
      - name: Emissions Reporting
        short: Regulatory
        icon: gavel
        summary: Flare and vent volumes filed from governed historian lineage.
        problem: Regulatory greenhouse filings are stitched from historian extracts and spreadsheets, so flare and vent volumes are hard to trace from sensor to submission when a regulator asks.
        who_benefits: HSE & Compliance
        how_built: Flare and emissions events conform on Delta Lake against EPA GHGRP layouts under Unity Catalog, giving one auditable lineage from sensor to filing surfaced on the HSE Dashboard.
        components:
          - HSE Dashboard
          - EPA GHGRP Templates
          - Enablon EHS
          - Unity Catalog
          - Delta Lake
        stories:
          - title: Repsol drives sustainability efforts with Databricks
            url: https://www.databricks.com/customers/repsol
          - title: Data and AI in action across the energy industry
            url: https://www.databricks.com/blog/powering-future-data-and-ai-action-across-energy-industry
      - name: Reserves Reconciliation
        short: Subsurface
        icon: sheet
        summary: Production and test data reconciled to reservoir models for booking.
        problem: Production actuals, well tests and reservoir models are reconciled by hand at booking time, so reserves estimates lag the field and the audit trail behind a booking is thin.
        who_benefits: Upstream Operations
        how_built: Well test and accounting data conform on Delta Lake under Unity Catalog against subsurface models, and reconciled balances surface for the subsurface team on the Production Control screen.
        components:
          - Production Control
          - SLB OFM
          - SAP IS-Oil
          - Delta Lake
          - Unity Catalog
        stories:
          - title: Devon Energy processes a full well in hours across geophysical and seismic data
            url: https://www.databricks.com/customers/devon-energy
      - name: Corrosion Monitoring
        short: Integrity
        icon: stream
        summary: Thickness and coupon data scored against inspection intervals.
        problem: Thickness readings and coupon results arrive on inspection cycles, so integrity risk is judged against a fixed interval rather than the actual corrosion rate the data shows.
        who_benefits: Midstream & Terminals
        how_built: Inspection and historian data feed corrosion-rate models tracked in MLflow and scored in Model Serving, so risk-based intervals and permits are raised from the HSE Dashboard.
        components:
          - HSE Dashboard
          - Sphera Risk Mgmt
          - AVEVA PI System
          - Model Serving
          - MLflow
        stories:
          - title: Predictive maintenance on sensor and maintenance-record data in oil & gas
            url: https://www.databricks.com/blog/2021/04/08/efficiently-building-ml-models-for-predictive-maintenance-in-the-oil-and-gas-industry-with-databricks.html
      - name: JV Allocation
        short: Finance
        icon: erp
        summary: Joint-venture splits validated before partner statements post.
        problem: Joint-venture splits are assembled from production accounting exports and reconciled in spreadsheets, so partner statements post late and disputes surface after the numbers are out.
        who_benefits: Corporate & Asset Leaders
        how_built: Production accounting and treasury data conform on Delta Lake under Unity Catalog, and validated allocations feed AI/BI so splits are checked before partner statements post.
        components:
          - SAP IS-Oil
          - Corporate Treasury Mart
          - Unity Catalog
          - Delta Lake
          - AI/BI
medallion:
  Bronze:
    short: Raw field and market
    summary: SCADA tags, well test results, LIMS assays, pipeline SCADA and deal capture tickets, landed exactly as received so a barrel or a pressure reading can always be replayed as it stood.
  Silver:
    short: Conformed well, cargo
    summary: Wells, facilities, pipelines and cargoes resolved into single conformed entities across production, operations and commercial systems, with allocation balances reconciled and nomination schedules stitched to one logistics record.
  Gold:
    short: Production, margin, loss
    summary: 'Contracted products operations and trading run on: net production and uptime, unit lifting cost, crack spread margin and hydrocarbon loss rates.'
