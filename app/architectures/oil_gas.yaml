name: Oil & Gas
description: 'Upstream production, midstream logistics and downstream refining: reservoir and facility telemetry, trading, and regulatory emissions reporting.'
sources:
  - name: Production & SCADA
    icon: iot
    tiles:
      - name: AVEVA PI System
        icon: iot
        summary: Separator pressures, flow rates and compressor tags from upstream and midstream historians.
        citations:
          - aveva-pi
        category: Process/Time-Series Historian
        what_it_is: Stores high-frequency separator, flow and compressor tags from upstream and midstream facilities as the operational time-series system of record.
        who_uses_it: Production engineers, facility operators and reliability engineers.
        data_out:
          batch:
            types:
              - structured
            volume: 20-80 GB/day tag history
            interval: Hourly / daily aggregates
          stream:
            types:
              - semi-structured
            volume: 50-500k tags/sec at peak
            interval: Continuous (sub-second sampling)
      - name: SLB OFM
        icon: stream
        summary: Well tests, decline curves and reservoir models the subsurface team updates.
        citations:
          - slb-ofm
        category: Production/Well Surveillance System
        what_it_is: Captures well tests, decline curves and reservoir surveillance data the subsurface team uses to model and forecast well performance.
        who_uses_it: Reservoir engineers, production engineers and subsurface geologists.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Daily well tests + periodic model updates
      - name: Honeywell Experion
        icon: gauge
        summary: DCS alarms, setpoints and batch sequences from refining units.
        citations:
          - honeywell-exp
        category: Distributed Control System (DCS)
        what_it_is: Runs refining and process units in real time and emits the alarms, setpoints and batch sequences that describe how the plant is operating.
        who_uses_it: Console operators, process control engineers and refinery operations.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 10-100k signals/sec
            interval: Continuous (sub-second)
  - name: Midstream & Logistics
    icon: stream
    tiles:
      - name: Quorum PGAS
        icon: erp
        summary: Pipeline nominations, allocations and imbalance statements.
        citations:
          - quorum-pgas
        category: Pipeline Nomination & Allocation System
        what_it_is: Manages pipeline nominations, scheduling, allocations and imbalance statements across gathering and transmission systems.
        who_uses_it: Pipeline schedulers, gas controllers and commercial operations.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Multiple nomination cycles daily
      - name: Veson IMOS
        icon: sheet
        summary: Marine chartering, voyage scheduling and demurrage tracking for cargo movements and terminal calls.
        citations:
          - opentext-vim
        category: Maritime Freight & Chartering Platform
        what_it_is: Handles marine chartering, voyage scheduling and demurrage tracking for cargo movements and terminal calls.
        who_uses_it: Chartering, marine operations and freight settlement teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Per-voyage + daily updates
      - name: Kpler Cargo Tracking
        icon: globe
        summary: Tanker positions, port calls and cargo lineage for export marketing.
        citations:
          - kpler
        category: Commodity Flow & Vessel Tracking
        what_it_is: Provides tanker positions, port calls and cargo lineage used to track physical flows for export marketing and supply intelligence.
        who_uses_it: Cargo marketing, supply analysts and freight traders.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.5-2 GB/day
            interval: Hourly position updates
          stream:
            types:
              - semi-structured
            volume: 100s of position events/sec
            interval: Continuous (AIS-derived)
  - name: Commercial & Trading
    icon: market
    tiles:
      - name: ION Openlink Endur
        icon: market
        summary: Physical deals, hedges and MtM for crude and products desks.
        citations:
          - ion-endur
        category: Energy Trading & Risk Management (ETRM)
        what_it_is: Captures physical and paper deals, hedges and mark-to-market for the crude and products trading desks across the book.
        who_uses_it: Crude and products traders, middle office and risk teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day deals + positions
            interval: Intraday + end-of-day marks
      - name: SAP IS-Oil
        icon: erp
        summary: Joint-venture allocations, production accounting and tax royalty postings.
        citations:
          - sap-is-oil
        category: Hydrocarbon Accounting ERP
        what_it_is: Runs joint-venture allocations, production accounting and tax and royalty postings on the industry-specific SAP oil and gas core.
        who_uses_it: Production accounting, joint-venture accounting and Finance.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Nightly batch + monthly close
      - name: Platts Price Assess
        icon: chart
        summary: Benchmark curves and differential indices the marketing desk marks to.
        citations:
          - platts
        category: Commodity Price Benchmark Provider
        what_it_is: Supplies benchmark price assessments, curves and differential indices the marketing and trading desks mark physical and paper positions to.
        who_uses_it: Trading, cargo marketing and risk teams.
        data_out:
          batch:
            types:
              - structured
            volume: MBs-GBs reference data
            interval: Daily assessment publication
  - name: Safety & Environment
    icon: gavel
    tiles:
      - name: Sphera Risk Mgmt
        icon: gavel
        summary: Process safety, MOC and incident investigations tied to facilities.
        citations:
          - sphera
        category: Process Safety & Operational Risk Platform
        what_it_is: Manages process safety, management-of-change and incident investigations tied to facilities and barriers.
        who_uses_it: Process safety, HSE and integrity engineers.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.5-2 GB/day cases + events
            interval: Hourly / daily
      - name: Enablon EHS
        icon: observ
        summary: Emissions events, flare logs and regulatory permit limits.
        citations:
          - enablon
        category: EHS & Emissions Management System
        what_it_is: Records emissions events, flare and vent logs and regulatory permit limits for environmental compliance.
        who_uses_it: Environmental and emissions teams and Regulatory compliance.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day events + logs
            interval: Hourly / daily
      - name: FLIR Optical Gas Img
        icon: iot
        summary: Leak detection surveys and repair verification imagery.
        category: Optical Gas Imaging / Leak Detection
        what_it_is: Produces optical-gas imaging surveys and repair-verification imagery used to detect and confirm fugitive hydrocarbon leaks.
        who_uses_it: LDAR survey crews, integrity and environmental teams.
        data_out:
          batch:
            types:
              - unstructured
            volume: 10s-100s of GB/survey
            interval: Per-survey (periodic campaigns)
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Corporate Treasury Mart
        icon: fed
        summary: Hedge effectiveness and working-capital marts queried in place under Unity Catalog.
        category: Enterprise Data Warehouse
        what_it_is: Corporate treasury hedge-effectiveness and working-capital marts kept in the incumbent warehouse and queried in place through federation rather than copied.
        who_uses_it: Treasury, Finance and Risk analysts.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: EPA GHGRP Templates
        icon: gavel
        summary: Greenhouse gas reporting layouts validated on ingest before filing windows.
        citations:
          - epa-ghgrp
        category: Regulatory Reporting Schema
        what_it_is: Greenhouse-gas reporting layouts and factors validated on ingest so emissions data conforms before filing windows.
        who_uses_it: Environmental reporting and Regulatory compliance teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: MBs (templates + factors)
            interval: Annual + periodic updates
      - name: AIS Vessel Tracks
        icon: globe
        summary: Marine AIS positions normalised for demurrage and cargo reconciliation.
        citations:
          - kpler
        category: Vessel Position (AIS) Feed
        what_it_is: Normalised marine AIS vessel positions used for demurrage calculation and cargo movement reconciliation.
        who_uses_it: Marine operations, demurrage and cargo marketing teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 100s-1000s of positions/sec
            interval: Continuous (near real-time)
      - name: Weather & Ocean Data
        icon: stream
        summary: Storm and swell feeds for offshore production and marine scheduling.
        category: Weather & Metocean Provider
        what_it_is: Storm, wind and swell forecasts used to plan offshore production, drilling and marine scheduling around weather windows.
        who_uses_it: Offshore operations, marine scheduling and HSE teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs/day gridded forecasts
            interval: Multiple forecast cycles daily
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Corporate & Asset Leaders
        mark: Genie One
        summary: The CEO on net production and cash margin; the CFO on hedge exposure and unit lifting cost when crude and product benchmarks move.
        uses:
          - - Genie One
            - Ask what yesterday's net production was by asset without waiting on operations reporting.
          - - AI/BI
            - Production, cost and margin on one certified set of Metric Views.
          - - Unity Catalog
            - Certification so "production" means one thing across SCADA and accounting.
        sub:
          - name: CEO
            cares: net production, cash margin and the trade between growth and the energy transition.
          - name: CFO & Treasury
            cares: unit lifting cost, hedge exposure and working capital as crude and product benchmarks move.
          - name: Chief Operating Officer
            cares: asset uptime, hydrocarbon loss and the HSE and compliance record across the portfolio.
        ucs:
          - JV Allocation
          - Trading Optimisation
          - Emissions Reporting
      - name: Upstream Operations
        mark: Lakehouse//RT
        summary: Field superintendents on well uptime, deferment volume and artificial lift when alarms spike, protecting net production and hydrocarbon loss rate.
        uses:
          - - Production Control
            - Deferment pareto and well ranking before the morning call.
          - - Lakehouse//RT
            - Live SCADA state at the latency a trip occurs at.
          - - AI/BI
            - Uptime and loss on governed definitions.
        sub:
          - name: Field Superintendent
            cares: well uptime, deferment volume and the morning production call.
          - name: Production Engineer
            cares: artificial lift, decline and the interventions that recover barrels.
          - name: Subsurface & Reservoir
            cares: well tests and reservoir models reconciled to actual production.
        ucs:
          - Well Performance
          - Facility Uptime
          - Reserves Reconciliation
          - Corrosion Monitoring
      - name: Midstream & Terminals
        mark: AI/BI
        summary: Pipeline controllers on nominations, linepack and imbalance when schedules slip, watching hydrocarbon loss and marine demurrage exposure.
        uses:
          - - Logistics Console
            - Cargo and linepack positions before nomination deadlines.
          - - AI/BI
            - Loss and imbalance on certified Metric Views.
          - - Genie One
            - Ask which terminal is constraining export this week.
        sub:
          - name: Pipeline Controller
            cares: nominations, linepack and imbalance before gate close.
          - name: Terminal Operations
            cares: vessel slots, tank inventory and marine demurrage exposure.
          - name: Integrity Engineer
            cares: corrosion, thickness and the inspection intervals on pipelines and terminals.
        ucs:
          - Pipeline Optimisation
          - Cargo Scheduling
          - Corrosion Monitoring
      - name: Trading & Marketing
        mark: Model Serving
        summary: Crude and products desks on deal capture, exposure and cargo optimisation, marking physical and paper books to crack-spread margin.
        uses:
          - - Trading Workbench
            - Physical and paper positions marked consistently.
          - - Model Serving
            - Optimisation models scored on live nominations.
          - - Unity Catalog
            - One cargo definition across ops and finance.
        sub:
          - name: Crude & Products Traders
            cares: physical and paper positions marked to crack-spread margin.
          - name: Risk & Middle Office
            cares: exposure limits, MtM and hedge effectiveness across the book.
          - name: Cargo Marketing
            cares: cargo optimisation and the benchmark differentials the desk marks to.
        ucs:
          - Trading Optimisation
          - Cargo Scheduling
          - Pipeline Optimisation
      - name: HSE & Compliance
        mark: Unity Catalog
        summary: Process safety and environmental teams on emissions, permits and incident trends, tracked on TRIR and flare volumes before regulator inspections.
        uses:
          - - HSE Dashboard
            - Flare and leak trends before regulator inspections.
          - - Unity Catalog
            - Lineage from sensor to regulatory filing.
          - - AI/BI
            - TRIR and emissions on governed definitions.
        sub:
          - name: Process Safety
            cares: MOC, incident trends and the barriers behind a safe envelope.
          - name: Environmental & Emissions
            cares: flare, vent and greenhouse filings from governed sensor lineage.
          - name: Regulatory Compliance
            cares: permit limits and the evidence trail before regulator inspections.
        ucs:
          - Leak Detection
          - Emissions Reporting
          - Corrosion Monitoring
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the SCADA, well test, LIMS assay and deal-capture feeds; own the Bronze to Silver path and the pager when a field pipeline breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for historian, ETRM and accounting sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on SCADA and allocation feeds.
          - - Lakewatch
            - Freshness on the production and margin tables operations reads.
        sub:
          - name: Historian & SCADA Eng
            cares: high-volume tag ingestion from PI and DCS into governed tables.
          - name: Pipeline Reliability
            cares: the Bronze to Silver path and the pager when a field feed breaks.
          - name: ETRM & Accounting Eng
            cares: deal-capture, allocation and royalty feeds landed for finance and trading.
        ucs:
          - Well Performance
          - Pipeline Optimisation
          - Emissions Reporting
      - name: Data Scientists
        mark: MLflow
        summary: Well-decline, facility-uptime, cargo-optimisation and leak-detection models, and whether they still hold six months after deployment across assets.
        uses:
          - - Feature Store
            - Historian and test features read identically in training and serving.
          - - MLflow
            - Every decline and uptime run tracked for audit and reproduction.
          - - Model Serving
            - Optimisation and failure models scored in the operational path.
        sub:
          - name: Production DS
            cares: well-decline, lift and facility-uptime models against historian data.
          - name: Optimisation DS
            cares: cargo, linepack and trading optimisation across live nominations.
          - name: Reliability & HSE DS
            cares: leak-detection and equipment-failure models and whether they still hold.
        ucs:
          - Facility Uptime
          - Leak Detection
          - Trading Optimisation
          - Well Performance
      - name: App Developers
        mark: Apps
        summary: Ship the production control, logistics and trading applications field and desk teams work in, hosted next to governed asset data.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for nomination state and governed writes.
          - - Agent Bricks
            - Agents that draft a deferment response against governed tools.
        sub:
          - name: Operations App Dev
            cares: production control and logistics screens field and desk teams work in.
          - name: Trading App Dev
            cares: the exposure and cargo surfaces the commercial desk marks books on.
          - name: Writeback & Integration
            cares: nomination and setpoint writeback into DCS and pipeline systems.
        ucs:
          - Pipeline Optimisation
          - Cargo Scheduling
          - Trading Optimisation
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    tiles:
      - name: Tableau / Qlik / ThoughtSpot
        icon: chart
        summary: External BI against serverless SQL warehouses, with Unity Catalog permissions enforced end to end.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for governed answers and field updates in the channel operations already works in (Beta).
      - name: Notebooks & IDEs
        icon: notebook
        summary: Notebooks, VS Code and JetBrains against governed data and Genie Code.
  - name: Operations Writeback
    icon: opdb
    tiles:
      - name: DCS Setpoint Push
        icon: stream
        summary: Approved operating targets written back within safe envelopes.
        citations:
          - honeywell-exp
      - name: Nomination Updates
        icon: erp
        summary: Revised pipeline and vessel nominations posted before gate close.
        citations:
          - quorum-pgas
      - name: Work Permit System
        icon: gavel
        summary: Maintenance permits raised from predicted equipment risk.
        citations:
          - sphera
  - name: Customers & Partners
    icon: partner
    tiles:
      - name: Cargo Assay API
        icon: api
        summary: Quality certificates served to traders and refiners from governed lab lineage.
        citations:
          - slb-ofm
      - name: JV Partner Sharing
        icon: share
        summary: Production and cost allocations shared to non-operated partners over Delta Sharing.
        citations:
          - sap-is-oil
      - name: Terminal Operator Feed
