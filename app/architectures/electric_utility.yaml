  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Transformer & Feeder Health
        short: Asset risk
        icon: iot
        summary: Distribution transformer and feeder failure risk scored from loading, condition and AMI voltage so replacements happen before the fault.
        problem: Transformer and feeder condition sits across EAM records, SCADA analogs and AMI voltage, so overloaded and aging assets fail in service instead of being replaced on a risk-ranked plan.
        who_benefits: Asset Management
        how_built: EAM condition, PI historian loading and AMI voltage are conformed on Delta Lake and scored for failure risk in Model Serving tracked in MLflow, ranking assets in the Asset Health Cockpit.
        components:
          - Asset Health Cockpit
          - ABB Ellipse EAM
          - AVEVA PI Historian
          - Model Serving
          - MLflow
        stories:
          - title: AusNet Services predicts asset risk with Databricks
            url: https://www.databricks.com/customers/ausnet-services
      - name: Grid Management
        short: Energy mix
        icon: stream
        summary: Feeder load, DER output and switching balanced so the distribution grid holds voltage and thermal limits as the energy mix shifts.
        problem: DER, storage and flexible load swing feeder state minute to minute while dispatch signals, inverter telemetry and the network model live apart, so the grid runs conservatively and hosting capacity is left unused.
        who_benefits: Grid Operations
        how_built: ADMS, DERMS and IEEE 2030.5 telemetry land in Lakehouse//RT and set-points are scored in Model Serving, written back as ADMS Switching Orders with feeder limits held in Lakebase.
        components:
          - Lakehouse//RT
          - Model Serving
          - GE Vernova ADMS
          - AutoGrid Flex DERMS
          - ADMS Switching Orders
        stories:
          - title: Octopus Energy builds the world's largest virtual power plant (2026 Customer Awards)
            url: https://www.databricks.com/blog/announcing-winners-2026-databricks-customer-awards
      - name: Predictive Maintenance
        short: Reliability
        icon: gauge
        summary: Failures on breakers, regulators and transformers predicted from condition and SCADA telemetry so plant is serviced on a planned window.
        problem: Grid plant is maintained on a calendar, so a failing breaker or regulator is found when it trips a feeder, not on a planned window, and crews chase symptoms across disconnected systems.
        who_benefits: Asset Management
        how_built: PI historian and EAM condition data feed remaining-life and anomaly models tracked in MLflow and scored in Model Serving, raising work orders from the Asset Health Cockpit.
        components:
          - Asset Health Cockpit
          - AVEVA PI Historian
          - ABB Ellipse EAM
          - MLflow
          - Model Serving
        stories:
          - title: What is predictive maintenance on the Databricks platform
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
      - name: Outage Response
        short: Storm & reliability
        icon: gauge
        summary: Restoring feeders and customers after weather and grid anomalies, optimising crew routing and switching against critical premises.
        problem: When a storm hits, outages, crews and switching orders live in separate systems, so the control centre restores feeders blind to which fix strands another circuit or a critical customer.
        who_benefits: Grid Operations
        how_built: AMI, SCADA, OMS and crew-vehicle telematics feeds land in Lakehouse//RT; restoration and crew-routing options are scored in Model Serving and run from the OMS Control Tower on Lakebase, writing switching back to ADMS.
        components:
          - OMS Control Tower
          - Lakehouse//RT
          - Model Serving
          - Milsoft OMS
          - Verizon Connect Fleet
          - Lakebase
        stories:
          - title: Alabama Power leverages Databricks for outage and storm modeling
            url: https://www.databricks.com/blog/alabama-power-leverages-databricks-outage-and-storm-modeling
          - title: Revolutionizing utility outage response with Databricks
            url: https://www.databricks.com/blog/revolutionizing-utility-outage-response
      - name: Load Forecasting
        short: Demand
        icon: chart
        summary: Short- and long-term demand forecasts that account for weather, DER and electrification load growth.
        problem: Demand is shifting under electrification, rooftop solar and heat waves, but forecasts built on last year's load and a spreadsheet miss the peaks that set purchased-power cost.
        who_benefits: Grid Operations
        how_built: Meter, weather and DER features are engineered in Feature Store and scored through Model Serving, tracked in MLflow, so the Load Forecast Console shows weather-adjusted load before the desk commits.
        components:
          - Load Forecast Console
          - Feature Store
          - Model Serving
          - MLflow
          - Weather Data Services
        stories:
          - title: Unlocking the future of energy with smart meter innovation (Southern Company)
            url: https://www.databricks.com/blog/unlocking-future-energy-smart-meter-innovation
      - name: Customer 360
        short: Customer
        icon: custlake
        summary: A single governed view of every premise, joining billing, AMI usage and interactions so the contact centre and programs act on one profile.
        problem: Customer data is split across CIS, payments and AMI, so agents answer high-bill and program questions from partial records and outreach targets the wrong premises.
        who_benefits: Customer Operations
        how_built: SAP IS-U, Oracle CCB and AMI usage conform on CustomerLake under Unity Catalog, so the contact centre, billing and programs read one governed premise profile in AI/BI.
        components:
          - CustomerLake
          - SAP IS-U
          - Oracle Utilities CCB
          - Unity Catalog
          - AI/BI
      - name: Outage Comms
        short: Comms
        icon: chat
        summary: Outage scope, estimated restoration and proactive notifications drafted for customers by an agent grounded in live OMS state.
        problem: During an event the contact centre and notification channels lag the control centre, so customers get stale or no restoration times and call volume spikes exactly when crews are stretched.
        who_benefits: Customer Operations
        how_built: Milsoft OMS state and Kubra channels join in Lakehouse//RT; an agent on Agent Bricks drafts restoration ETAs and outage notifications against governed tools for agent approval.
        components:
          - Milsoft OMS
          - Kubra Payment Portal
          - Agent Bricks
          - Lakehouse//RT
          - AI Functions
        stories:
          - title: 'Hawaiian Electric: AI agents transforming electric grid operations'
            url: https://www.databricks.com/blog/manual-autonomous-how-ai-agents-are-transforming-electric-grid-operations
      - name: Field Crew Assistant
        short: Field ops
        icon: apps
        summary: An assistant that gives field crews the switching plan, asset history and safety context for the job, and closes the work order on mobile.
        problem: Crews arrive with paper switching orders and no asset history, so jobs stall on missing context and completions are keyed in later, leaving the network model and work records stale.
        who_benefits: App Developers
        how_built: EAM history, the GIS network model and OMS dispatch conform under Unity Catalog; an assistant on Agent Bricks serves crews from Databricks Apps over Lakebase, writing completions back through OMS Crew Dispatch.
        components:
          - OMS Crew Dispatch
          - Esri ArcGIS Utility
          - Agent Bricks
          - Lakebase
          - Unity Catalog
      - name: Regulatory Reporting
        short: Regulatory
        icon: gavel
        summary: Reliability, DER and sustainability filings produced from the same governed tables operations runs on, traceable back to source.
        problem: SAIDI, SAIFI, DER interconnection and emissions filings are rebuilt each cycle from ledgers and exports the commission cannot trace, so filings lag and a number that cannot be sourced is one a regulator can strike.
        who_benefits: Regulatory & Rates
        how_built: Reliability, interconnection and emissions data conform to Gold under Unity Catalog and are published as governed Reliability Reporting products in AI/BI, filed with full lineage.
        components:
          - Reliability Reporting
          - Unity Catalog
          - AI/BI
          - Regulatory Cost Accounting
          - Data Products
      - name: Financial Analytics
        short: Finance
        icon: sheet
        summary: Revenue requirement, capital spend and collections tracked on governed ledgers so finance and rate design work from one set of numbers.
        problem: Cost-of-service, capital and collections numbers are spread across finance and operations systems, so each rate case and board pack rebuilds them and the numbers rarely reconcile.
        who_benefits: Regulatory & Rates
        how_built: Jurisdictional cost ledgers are queried in place under Unity Catalog and modelled in AI/BI with Genie One, so revenue requirement, capital and collections are read from one governed set for rate cases and the board.
        components:
          - Regulatory Cost Accounting
          - Unity Catalog
          - AI/BI
          - Genie One
          - Rate Case Submissions
medallion:
  Bronze:
    short: Raw meter and SCADA
    summary: AMI interval reads, SCADA analogs and events, CIS billing extracts, OMS outage tickets and GIS asset records, landed exactly as received so a meter read or a protection trip can always be replayed.
  Silver:
    short: Conformed meter, premise
    summary: Meters, premises, feeders and assets resolved into single conformed entities across AMI, CIS and GIS, with service point identifiers reconciled and outage events stitched to affected customers.
  Gold:
    short: SAIDI, losses, collections
    summary: 'Contracted products operations and regulators run on: SAIDI and SAIFI by circuit, technical and non-technical loss, collections effectiveness, and demand forecast accuracy.'
