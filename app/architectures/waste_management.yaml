agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Routes & Collection Agent
        icon: genie
        summary: Ask about route completion, missed stops and productivity across the fleet in plain language.
        feeds:
          - AMCS Dispatch
          - Geotab Fleet
          - RouteSmart
          - Conformed customer, route
        teams:
          - Collection Ops
          - Dispatch Supervisors
          - Route Managers
        questions:
          - Which routes are running behind schedule right now?
          - How many stops are at risk of being missed today?
          - Which routes have the highest cost per stop this week?
          - Where are trucks idling the most across the fleet?
          - How many service credits did missed stops cost us last month?
      - name: Disposal & MRF Agent
        icon: genie
        summary: Explore inbound tonnage, landfill airspace, contamination and bale revenue.
        feeds:
          - Paradigm Software
          - Machinex MRF SCADA
          - Landfill Gas Monitor
          - Cost per ton, diversion
        teams:
          - Disposal & MRF
          - Landfill Managers
          - MRF Plant Managers
        questions:
          - How much inbound tonnage did we take yesterday by material class?
          - How fast is landfill airspace being consumed against permit?
          - What is our contamination rate in the recycling stream this week?
          - What is forecast bale revenue against current commodity indices?
          - How is gas capture tracking across the wellfield?
      - name: Commercial & Churn Agent
        icon: genie
        summary: Answer questions on account margin, pricing and churn risk across the book.
        feeds:
          - AMCS Platform
          - Salesforce Service Cloud
          - Routeware Account
          - Cost per ton, diversion
        teams:
          - Commercial Sales
          - Account Managers
          - Pricing & Revenue
        questions:
          - Which accounts are below target margin right now?
          - Which commercial accounts are at highest churn risk this quarter?
          - How does cost-to-serve compare to price by segment?
          - Which contracts are up for renewal in the next 90 days?
          - Where would a price adjustment most improve margin without raising churn?
      - name: Sustainability & ESG Agent
        icon: genie
        summary: Ask about diversion, methane and emissions against franchise commitments.
        feeds:
          - Wastebits Reporting
          - Landfill Gas Monitor
          - EPA LMOP Data
          - Machinex MRF SCADA
        teams:
          - Sustainability
          - ESG Reporting
          - Diversion & Circularity
        questions:
          - What is our diversion rate by customer and site this month?
          - How are landfill methane emissions trending this year?
          - Which municipal contracts are behind on diversion targets?
          - What is fleet carbon intensity per ton collected?
          - How much recovered tonnage can we evidence for EPR obligations?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Route Optimization
        short: Collection
        icon: sheet
        summary: Residential and commercial routes rebalanced for miles, time and safety.
        problem: Residential and commercial routes are planned on last year's map, so trucks run extra miles, miss time windows and burn fuel while dispatchers cannot see the day as it actually unfolds.
        who_benefits: Collection Ops
        how_built: GPS, lift and completion feeds land in Lakehouse//RT and feed routing models in Model Serving, with optimised stop order pushed to driver devices from the Dispatch Console.
        components:
          - Dispatch Console
          - Lakehouse//RT
          - Model Serving
          - Geotab Fleet
          - RouteSmart
          - Delta Lake
        stories:
          - title: Cleanaway champions a sustainable means to waste management
            url: https://www.databricks.com/customers/cleanaway
          - title: Fleet optimization with CARTO & Databricks
            url: https://www.databricks.com/blog/fleet-optimization-carto-databricks
      - name: Missed Stop Prediction
        short: Service
        icon: stream
        summary: Stops at risk of miss flagged from GPS and historical patterns.
        problem: Missed pickups surface only when the customer calls, and by then the crew has left the street, a service credit is owed and the route has to be sent back the next day.
        who_benefits: Collection Ops
        how_built: GPS traces, lift-sensor reads and service history land through Lakeflow and score a miss-risk model in Model Serving, raising exceptions on the Dispatch Console before the truck leaves the zone.
        components:
          - Dispatch Console
          - Lakeflow
          - Model Serving
          - Lift Sensors & RFID
          - Salesforce Service Cloud
          - Feature Store
        stories:
          - title: Cleanaway champions a sustainable means to waste management
            url: https://www.databricks.com/customers/cleanaway
      - name: Contamination Detection
        short: Recycling
        icon: iot
        summary: Contamination events from lift sensors and MRF cameras.
        problem: Contaminated loads are caught at the MRF or not at all, so bales are downgraded, customers keep filling bins wrong and the recycling stream loses value with no feedback to the route.
        who_benefits: Disposal & MRF
        how_built: Lift-sensor events and MRF camera streams feed vision models in Model Serving, and contamination flags are written back to the customer account and the driver's next visit via the Dispatch Console.
        components:
          - Dispatch Console
          - Machinex MRF SCADA
          - Model Serving
          - Lift Sensors & RFID
          - AI Functions
          - Delta Lake
        stories:
          - title: Cleanaway champions a sustainable means to waste management
            url: https://www.databricks.com/customers/cleanaway
      - name: Landfill Airspace
        short: Disposal
        icon: db
        summary: Airspace consumption forecast against permitted capacity.
        problem: Remaining permitted airspace is tracked in spreadsheets from occasional surveys, so the site cannot see how fast it is filling or price inbound tonnage against the capacity it has left.
        who_benefits: Disposal & MRF
        how_built: Scale tickets and survey volumes are conformed on Delta Lake under Unity Catalog and forecast against permitted capacity in the Scalehouse Dashboard, so airspace burn is visible daily.
        components:
          - Scalehouse Dashboard
          - Paradigm Software
          - Delta Lake
          - Unity Catalog
          - AI/BI
          - Model Serving
      - name: Dynamic Pricing
        short: Commercial
        icon: market
        summary: Container and service fees adjusted to margin and churn risk.
        problem: Container and service fees are set once at contract and rarely revisited, so rising disposal and fuel cost quietly erodes margin and increases land as blunt across-the-board hikes.
        who_benefits: Commercial Sales
        how_built: Cost-to-serve, disposal and churn signals are conformed under Unity Catalog and scored in Model Serving, surfacing per-account price and margin guidance in the Commercial Pricing Hub.
        components:
          - Commercial Pricing Hub
          - Model Serving
          - Unity Catalog
          - AMCS Platform
          - AI/BI
          - Delta Lake
      - name: Fleet Maintenance
        short: Assets
        icon: iot
        summary: Predictive maintenance from telematics before breakdown on route.
        problem: A truck that breaks down mid-route strands a full load and blows the day's schedule, yet maintenance runs on fixed mileage rather than the engine and idle data the fleet already streams.
        who_benefits: Collection Ops
        how_built: Geotab and ELD telemetry stream into Lakehouse//RT and feed remaining-life models tracked in MLflow and scored in Model Serving, so a service is booked before a breakdown lands on route.
        components:
          - Dispatch Console
          - Geotab Fleet
          - Motive ELD
          - Lakehouse//RT
          - Model Serving
          - MLflow
        stories:
          - title: What is Predictive Maintenance?
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
          - title: 'Vinli: fleet optimization powered by AI'
            url: https://www.databricks.com/customers/vinli
      - name: MRF Commodity Revenue
        short: Recycling
        icon: market
        summary: Bale revenue forecast against commodity index movements.
        problem: Bale revenue swings with volatile commodity indices, but throughput, quality and price sit in separate systems so the MRF cannot forecast revenue or decide when to sell against the market.
        who_benefits: Disposal & MRF
        how_built: MRF throughput and bale weights are conformed on Delta Lake and joined to commodity indices, with revenue forecast in the Scalehouse Dashboard and AI/BI so the site sells into strength.
        components:
          - Scalehouse Dashboard
          - Machinex MRF SCADA
          - Recycling Market Indices
          - Delta Lake
          - AI/BI
          - Model Serving
        stories:
          - title: Sustainability in Aluminum Production
            url: https://www.databricks.com/blog/sustainability-aluminum-production
      - name: Customer Churn
        short: Sales
        icon: custlake
        summary: Commercial account churn scored from service quality and price.
        problem: Commercial accounts leave after a run of missed pickups or a price rise, but service quality, billing and pricing live in separate systems so churn first shows as the cancellation notice.
        who_benefits: Commercial Sales
        how_built: Service, billing and interaction history are conformed under Unity Catalog and scored in Model Serving, with at-risk accounts surfaced in the Commercial Pricing Hub before renewal.
        components:
          - Commercial Pricing Hub
          - Salesforce Service Cloud
          - Model Serving
          - Unity Catalog
          - Feature Store
          - AI/BI
      - name: Municipal Franchise
        short: Contracts
        icon: gavel
        summary: Franchise fee and service level evidence for city audits.
        problem: City franchise contracts demand tonnage, diversion and service-level evidence on schedule, and assembling it by hand from scale and route systems for each audit is slow and hard to defend.
        who_benefits: Sustainability
        how_built: Scale, route and diversion data are conformed into governed Gold products under Unity Catalog and published to city contracts over OpenSharing from the Diversion Registry.
        components:
          - Diversion Registry
          - Wastebits Reporting
          - Unity Catalog
          - OpenSharing
          - Data Products
          - Delta Lake
      - name: Carbon & Methane
        short: ESG
        icon: chart
        summary: Landfill gas capture and fleet emissions for sustainability reporting.
        problem: Landfill gas capture and fleet emissions are reported from spreadsheets months late, so the team cannot show franchise partners live progress against methane and carbon commitments.
        who_benefits: Sustainability
        how_built: Landfill gas readings and fleet telemetry are conformed on Delta Lake under Unity Catalog and modelled for capture and emissions, with evidence assembled in the Diversion Registry and AI/BI.
        components:
          - Diversion Registry
          - Landfill Gas Monitor
          - EPA LMOP Data
          - Unity Catalog
          - Delta Lake
          - AI/BI
