      - name: Safety Analytics
        short: EHS
        icon: gavel
        summary: Leading indicators predicting recordable incidents.
        problem: Incidents are counted after they happen, while leading indicators like near-misses and inspection gaps sit in field apps no one aggregates until TRIR has already moved.
