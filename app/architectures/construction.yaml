name: Construction
description: Capital projects, job costing, field operations, subcontractor management, and BIM coordination across general contractors and owners.
sources:
  - name: Project Management
    icon: sheet
    tiles:
      - name: Procore
        icon: sheet
        summary: RFIs, submittals, daily logs and punch lists.
        citations:
          - procore
        category: Construction Project Management
        what_it_is: Runs RFIs, submittals, daily logs and punch lists across the project, the field system of record for coordination and change.
        who_uses_it: Project Managers, Project Engineers and Field Superintendents.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-5 GB/day
            interval: Hourly / nightly sync
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous webhook events
      - name: Autodesk Build
        icon: apps
        summary: Issues, checklists and field photos on BIM context.
        citations:
          - autodesk-build
        category: Construction Project Management / Field
        what_it_is: Captures issues, checklists and field photos on BIM context, joining quality and progress evidence to the model.
        who_uses_it: Project Engineers, Field Superintendents and Quality Managers.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 2-10 GB/day incl. photos
            interval: Hourly sync
      - name: Primavera P6
        icon: sheet
        summary: Master schedules, critical path and earned value.
        citations:
          - primavera
        category: Project Scheduling (CPM)
        what_it_is: Holds master schedules, critical path and earned value, the schedule baseline SPI and forecast at completion are measured against.
        who_uses_it: Project Managers, Cost Controllers and Planners.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-3 GB/day
            interval: Weekly + progress-update batch
  - name: ERP & Job Cost
    icon: erp
    tiles:
      - name: Trimble Viewpoint Vista
        icon: erp
        summary: Job cost, AP, payroll and equipment billing.
        citations:
          - viewpoint
        category: Construction ERP & Job Cost
        what_it_is: Holds job cost, AP, payroll and equipment billing, the financial system of record behind WIP and forecast at completion.
        who_uses_it: GC President & COO, Cost Controllers and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-10 GB/day
            interval: Nightly batch + month-end close
      - name: Sage 300 CRE
        icon: erp
        summary: Project accounting, change orders and WIP.
        citations:
          - sage-cre
        category: Construction ERP & Job Cost
        what_it_is: Runs project accounting, change orders and WIP, the source of committed cost and change-order margin impact.
        who_uses_it: Project Managers, Cost Controllers and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Nightly batch
      - name: Oracle Aconex
        icon: share
        summary: Document control and transmittals.
        citations:
          - aconex
        category: Document Control & Collaboration
        what_it_is: Manages document control and transmittals across project parties, the record of drawings, RFIs and submittal correspondence.
        who_uses_it: Project Engineers, Document controllers and Owners.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 1-5 GB/day incl. documents
            interval: Hourly / daily sync
  - name: BIM & Design
    icon: product
    tiles:
      - name: Autodesk Revit
        icon: product
        summary: Design models, quantities and clash contexts.
        citations:
          - revit
        category: BIM Authoring
        what_it_is: Authors the design models, quantities and clash context, the source geometry coordination and takeoff are built on.
        who_uses_it: Project Engineers, BIM coordinators and Design teams.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: GBs per model revision
            interval: Per model revision
      - name: Navisworks
        icon: apps
        summary: 4D simulations and clash detection runs.
        citations:
          - navisworks
        category: BIM Coordination & Clash Detection
        what_it_is: Runs 4D simulations and clash detection, producing the clash results ranked against schedule to prevent field rework.
        who_uses_it: Project Managers, BIM coordinators and Project Engineers.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 100s of MB per run
            interval: Per coordination run
      - name: Bentley iTwin
        icon: globe
        summary: Digital twin synchronization for infrastructure.
        citations:
          - itwin
        category: Digital Twin Platform
        what_it_is: Synchronises digital twins for infrastructure assets, aligning design, construction and as-built state over the project lifecycle.
        who_uses_it: Project Engineers, Owners and Infrastructure design teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs per sync
            interval: Scheduled twin sync
  - name: Field & Equipment
    icon: iot
    tiles:
      - name: Samsara Fleet
        icon: iot
        summary: Equipment location, utilization and DVIR.
        citations:
          - samsara
        category: Equipment Telematics
        what_it_is: Streams equipment location, utilization and DVIR inspection events from owned machines across jobsites.
        who_uses_it: Field Superintendents, General Superintendents and Fleet teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of pings/sec across fleet
            interval: Continuous (seconds)
      - name: United Rentals Total Control
        icon: stream
        summary: Rental fleet hours, utilization and geofence alerts.
        citations:
          - united-rentals
        category: Rental Fleet Management
        what_it_is: Reports rental fleet hours, utilization and geofence alerts, the source for idle-asset and rental-cost analysis.
        who_uses_it: Field Superintendents, Equipment managers and Cost Controllers.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Hourly batch
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous geofence / usage events
      - name: OpenSpace
        icon: iot
        summary: 360 site capture with progress and safety analytics.
        citations:
          - openspace
        category: Reality Capture & Site Progress
        what_it_is: Provides 360 site capture with progress and safety analytics, turning walkthroughs into progress and quality signals.
        who_uses_it: Field Superintendents, Project Engineers and Safety Managers.
        data_out:
          batch:
            types:
              - unstructured
              - semi-structured
            volume: GBs per capture
            interval: Per site walk (daily/weekly)
  - name: Safety & Quality
    icon: gavel
    tiles:
      - name: ISNetworld
        icon: gavel
        summary: Contractor prequalification and safety scores.
        citations:
          - isnetworld
        category: Contractor Prequalification
        what_it_is: Holds contractor prequalification and safety scores, the risk basis for subcontractor selection before award.
        who_uses_it: Estimating, Preconstruction and EHS teams.
        data_out:
          batch:
            types:
              - structured
            volume: 100s of MB
            interval: Daily + on-demand refresh
      - name: HammerTech
        icon: gavel
        summary: Site inductions, permits and incident logs.
        citations:
          - hammertech
        category: EHS / Safety Management
        what_it_is: Captures site inductions, permits, observations and incident logs, the leading-indicator source behind safety analytics.
        who_uses_it: Safety & Quality, Safety Managers and EHS Directors.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.5-2 GB/day
            interval: Hourly / daily sync
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Owner Reporting Mart
        icon: fed
        summary: Owner KPI and portfolio marts queried in place under Unity Catalog.
        category: Owner Reporting Warehouse
        what_it_is: Owner KPI and portfolio marts kept in the incumbent warehouse and queried in place through federation rather than copied.
        who_uses_it: GC President & COO, Regional VPs and Owner reporting analysts.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: Dodge Construction Network
        icon: market
        summary: Bid opportunities and project leads by geography.
        citations:
          - dodge
        category: Construction Market Intelligence
        what_it_is: Provides bid opportunities and project leads by geography, the pipeline signal for preconstruction and pursuit decisions.
        who_uses_it: Estimating, Preconstruction and Bid & Sales teams.
        data_out:
          batch:
            types:
              - structured
            volume: 100s of MB
            interval: Daily lead feed
      - name: IFC / COBie / BCF
        icon: chart
        summary: openBIM model, asset and issue exchange (buildingSMART) parsed on arrival for coordination.
        citations:
          - rsmeans
        category: openBIM Exchange Standard
        what_it_is: openBIM model, asset and issue exchange (IFC/COBie/BCF) parsed on arrival to coordinate models and handover data across tools.
        who_uses_it: Project Engineers, BIM coordinators and Owners.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs per exchange
            interval: Per model exchange
      - name: OSHA Incident Data
        icon: gavel
        summary: Industry injury rates for safety benchmarking.
        citations:
          - osha
        category: Safety Benchmark Data
        what_it_is: Supplies industry injury and incident rates used to benchmark the firm's TRIR and safety performance.
        who_uses_it: Safety & Quality, EHS Directors and Executive teams.
        data_out:
          batch:
            types:
              - structured
            volume: MBs
            interval: Annual / periodic release
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: GC President & COO
        mark: Genie One
        summary: The CEO on backlog and margin; the COO on labor productivity, schedule variance and safety, watching forecast at completion and TRIR.
        uses:
          - - Genie One
            - Ask which jobs are below margin this month.
          - - AI/BI
            - WIP and margin on certified Metric Views.
          - - Unity Catalog
            - One cost code definition across ERP and field.
        sub:
          - name: Chief Executive
            cares: backlog, forecast at completion and the margin the board is underwriting.
          - name: Chief Operating Officer
            cares: labor productivity, schedule variance and the safety record across the portfolio.
          - name: Regional VP
            cares: job-level margin and delivery risk across the region's active work.
        ucs:
          - WIP Forecasting
          - Portfolio Benchmarking
          - Earned Value Mgmt
          - Safety Analytics
      - name: Project Managers
        mark: AI/BI
        summary: Schedule, budget, change orders and subcontractor performance, run on CPI, SPI, RFI aging and forecast at completion.
        uses:
          - - Project Command
            - Earned value and forecast at completion by job.
          - - AI/BI
            - RFI and CO aging on governed Procore data.
        sub:
          - name: Senior Project Manager
            cares: cost, schedule and change-order exposure on the largest jobs.
          - name: Project Engineer
            cares: RFIs, submittals and BIM coordination keeping the field unblocked.
          - name: Cost Controller
            cares: CPI, SPI and forecast at completion against the budget.
        ucs:
          - Earned Value Mgmt
          - Change Order Control
          - Schedule Recovery
          - BIM Clash Prevention
      - name: Estimating
        mark: Model Serving
        summary: Bid pricing, risk allowances and historical productivity, judged on win rate, margin sensitivity and unit-cost variance.
        uses:
          - - Bid Analyzer
            - Win probability and margin sensitivity.
          - - Model Serving
            - Productivity models in the estimating path.
        sub:
          - name: Chief Estimator
            cares: bid margin, risk allowances and the win-rate target.
          - name: Preconstruction Lead
            cares: trade coverage, subcontractor prequalification and scope gaps before award.
          - name: Cost Analyst
            cares: unit-cost benchmarks and historical productivity behind each bid.
        ucs:
          - Subcontractor Risk
          - Labor Productivity
          - Portfolio Benchmarking
      - name: Field Superintendents
        mark: Lakehouse//RT
        summary: Daily production, labor hours and safety observations, tracked on units per labor hour, equipment idle time and near-miss rate.
        uses:
          - - Field Daily Log
            - Production quantities vs plan in real time.
          - - Lakehouse//RT
            - Equipment utilization at site latency.
        sub:
          - name: General Superintendent
            cares: crew deployment, production rates and equipment across active sites.
          - name: Site Superintendent
            cares: daily production against plan and the trades on the critical path.
          - name: Field Engineer
            cares: layout, quantities and the as-built record feeding cost.
        ucs:
          - Labor Productivity
          - Equipment Utilization
          - Schedule Recovery
      - name: Safety & Quality
        mark: Apps
        summary: Incident prevention, inspections and closeout documentation, measured on TRIR, leading-indicator closure and punch-list burndown.
        uses:
          - - Safety Dashboard
            - Leading indicators before TRIR moves.
          - - Apps
            - Inspection apps on governed field data.
        sub:
          - name: EHS Director
            cares: TRIR, leading-indicator closure and the OSHA reporting record.
          - name: Safety Manager
            cares: site inductions, permits and near-miss follow-up in the field.
          - name: Quality Manager
            cares: inspections, punch-list burndown and closeout documentation.
        ucs:
          - Safety Analytics
          - Subcontractor Risk
          - BIM Clash Prevention
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land Procore daily logs, ERP job costs, BIM revisions and equipment telematics; own Bronze to Silver and the pager when the WIP tables stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for ERP, project-management and field sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on cost and schedule feeds.
          - - Lakewatch
            - Freshness on the WIP and margin tables PMs read at month-end.
        sub:
          - name: Lead Data Engineer
            cares: the WIP and margin pipelines PMs read at month-end close.
          - name: Ingestion Engineer
            cares: Procore, ERP and telematics connectors landing Bronze to Silver.
          - name: Platform Engineer
            cares: Unity Catalog governance and the pager when a feed stalls.
        ucs:
          - Earned Value Mgmt
          - WIP Forecasting
          - Equipment Utilization
      - name: Data Scientists
        mark: MLflow
        summary: Bid win-probability, productivity-forecast and safety-leading-indicator models, and whether they still hold across a new project type and region.
        uses:
          - - Feature Store
            - Job and cost-code features read identically in training and serving.
          - - MLflow
            - Every bid and productivity model tracked for audit and reproduction.
          - - Model Serving
            - Productivity and risk models scored in the estimating path.
        sub:
          - name: ML Engineer
            cares: productivity, risk and forecast models in the estimating and PM path.
          - name: Applied Scientist
            cares: bid win-probability and schedule-recovery scenario models.
          - name: MLOps Engineer
            cares: MLflow tracking and Model Serving for every deployed model.
        ucs:
          - Labor Productivity
          - Subcontractor Risk
          - Schedule Recovery
      - name: App Developers
        mark: Apps
        summary: Ship the project command, bid analyzer, field daily log and safety dashboard apps PMs and superintendents work in, next to governed job data.
        uses:
          - - Apps
            - Field and project screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for daily-log and inspection state.
          - - Agent Bricks
            - Agents that draft change orders and recovery plans against governed tools.
        sub:
          - name: Full-Stack Developer
            cares: the Project Command and Field Daily Log screens PMs and crews work in.
          - name: Mobile Developer
            cares: the field and inspection apps superintendents use on site.
          - name: Agent Developer
            cares: agents drafting change orders and recovery plans on governed data.
        ucs:
          - Change Order Control
          - Safety Analytics
          - Schedule Recovery
