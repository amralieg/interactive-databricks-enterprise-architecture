      - name: BIM Clash Prevention
        short: Design
        icon: product
        summary: Clashes resolved before they become field rework.
        problem: Clashes between structural, mechanical and electrical models surface in the field as rework, because coordination runs in siloed BIM tools disconnected from the schedule.
        who_benefits: Project Managers
        how_built: Revit and Navisworks clash runs land under Unity Catalog and are joined to P6 activities on Delta Lake, so unresolved clashes are ranked by schedule impact in AI/BI.
        components:
          - Autodesk Revit
          - Navisworks
          - Primavera P6
          - Unity Catalog
          - Delta Lake
          - AI/BI
      - name: Subcontractor Risk
        short: Supply
        icon: zplug
        summary: Prequalification and performance scored before award.
        problem: Subcontractor prequalification, safety scores and past performance sit in separate systems, so trades are awarded on price without a clear view of delivery and default risk.
        who_benefits: Estimating
        how_built: ISNetworld scores and historical performance conform on Delta Lake and feed a risk model in Model Serving, surfaced through the Bid Analyzer before a trade is awarded.
        components:
          - Bid Analyzer
          - ISNetworld
          - Model Serving
          - Unity Catalog
          - Delta Lake
          - MLflow
      - name: Schedule Recovery
        short: Planning
        icon: sheet
        summary: Recovery options costed when critical path slips.
        problem: When the critical path slips, recovery options are argued in meetings without cost, so crews are added or resequenced with no view of the margin hit until it is already spent.
        who_benefits: Project Managers
        how_built: P6 progress and job cost conform on Delta Lake and recovery scenarios are costed with AI Functions in Project Command, so the cheapest path back to plan is chosen fast.
        components:
          - Project Command
          - Primavera P6
          - AI Functions
          - Model Serving
          - Delta Lake
          - Unity Catalog
      - name: WIP Forecasting
        short: Finance
        icon: erp
        summary: Revenue and cost at completion before month-end close.
        problem: Work-in-progress and cost at completion are assembled manually from ERP and field data at month-end, so revenue and margin are known too late to steer the job.
        who_benefits: GC President & COO
        how_built: ERP job cost and field production conform through Lakeflow on Delta Lake, and forecast-at-completion models in Model Serving publish WIP to AI/BI before close.
        components:
          - Trimble Viewpoint Vista
          - Sage 300 CRE
          - Lakeflow
          - Model Serving
          - AI/BI
          - Delta Lake
