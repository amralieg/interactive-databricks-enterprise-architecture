agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Job Cost & WIP Agent
        icon: genie
        summary: Ask about job margin, earned value and forecast at completion across the portfolio.
        feeds:
          - Trimble Viewpoint Vista
          - Sage 300 CRE
          - Primavera P6
          - Margin, schedule, safety
        teams:
          - Project Managers
          - Cost Controllers
          - GC President & COO
        questions:
          - Which jobs are below their forecast margin this month?
          - What is CPI and SPI by job right now?
          - How much change-order exposure is pending but not yet approved?
          - Which jobs have the largest variance to forecast at completion?
          - What is total backlog and projected revenue by region?
      - name: Field Production & Equipment Agent
        icon: genie
        summary: Explore labor productivity, daily production and equipment utilisation.
        feeds:
          - Procore
          - Samsara Fleet
          - United Rentals Total Control
          - Conformed projects and WBS
        teams:
          - Field Superintendents
          - General Superintendent
          - Site Superintendent
        questions:
          - What is units per labor hour by trade and job this week?
          - Which equipment is sitting idle while another site waits?
          - Which crews are behind the daily production plan?
          - What is equipment utilisation by asset across active sites?
          - Which trades are on the critical path and slipping?
      - name: Safety & Quality Agent
        icon: genie
        summary: Answer leading-indicator, incident and punch-list questions across sites.
        feeds:
          - HammerTech
          - OSHA Incident Data
          - Autodesk Build
          - Margin, schedule, safety
        teams:
          - Safety & Quality
          - EHS Director
          - Safety Manager
        questions:
          - Which sites have rising near-miss rates before TRIR moves?
          - What is our TRIR by region and job type this year?
          - Which inspection and permit items are overdue?
          - Where is punch-list burndown behind at closeout?
          - Which subcontractors have the worst safety observation record?
      - name: Estimating & Subcontractor Risk Agent
        icon: genie
        summary: Ask about bid win rate, unit costs and subcontractor prequalification.
        feeds:
          - ISNetworld
          - Dodge Construction Network
          - Trimble Viewpoint Vista
          - Conformed projects and WBS
        teams:
          - Estimating
          - Chief Estimator
          - Preconstruction Lead
        questions:
          - What is our bid win rate by job type and region?
          - Which subcontractors carry the highest default or safety risk?
          - How do our unit costs compare to historical productivity?
          - Which trades have thin coverage on upcoming bids?
          - Where are margins most sensitive on the current pipeline?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Earned Value Mgmt
        short: Finance
        icon: chart
        summary: CPI and SPI integrated across ERP and schedule systems.
        problem: CPI and SPI live in the scheduler while actual cost sits in the ERP, so earned value is rebuilt by hand in spreadsheets and is stale the moment the job moves.
        who_benefits: Project Managers
        how_built: ERP job cost and P6 progress land through Lakeflow and conform on Delta Lake under Unity Catalog, so Project Command serves one certified CPI and SPI per job.
        components:
          - Project Command
          - Trimble Viewpoint Vista
          - Primavera P6
          - Lakeflow
          - Unity Catalog
          - Delta Lake
        stories:
          - title: Hanwha builds an integrated data system for smarter decision making
            url: https://www.databricks.com/customers/hanwha-corporation
      - name: Change Order Control
        short: Commercial
        icon: erp
        summary: Pending and approved COs tracked against margin impact.
        problem: Pending change orders sit in email and PM tools while their margin impact lives in the ERP, so exposure is unknown until a CO is approved and the job has already moved.
        who_benefits: Project Managers
        how_built: Procore COs and Sage job cost conform under Unity Catalog and Project Command tracks each pending and approved CO against forecast margin before it is signed.
        components:
          - Project Command
          - Procore
          - Sage 300 CRE
          - Unity Catalog
          - AI/BI
          - Delta Lake
        stories:
          - title: Hanwha builds an integrated data system for smarter decision making
            url: https://www.databricks.com/customers/hanwha-corporation
      - name: Labor Productivity
        short: Field
        icon: people
        summary: Units per labor hour benchmarked by trade and job.
        problem: Daily production and labor hours are logged on paper and in field apps, so units per labor hour by trade is only known weeks later at cost close, too late to correct.
        who_benefits: Field Superintendents
        how_built: Field Daily Log lands production quantities and hours through Lakeflow into Delta Lake, benchmarking units per labor hour by trade and job in AI/BI at site latency.
        components:
          - Field Daily Log
          - Procore
          - Lakeflow
          - Delta Lake
          - AI/BI
          - Lakehouse//RT
        stories:
          - title: Novade improves construction safety and efficiency with Databricks
            url: https://www.databricks.com/customers/novade
      - name: Equipment Utilization
        short: Fleet
        icon: iot
        summary: Owned and rented assets ranked by idle time and cost.
        problem: Owned and rented assets scatter across yards and jobsites, so idle machines keep billing while another site waits, and no one can see true utilization by asset.
        who_benefits: Field Superintendents
        how_built: Samsara and rental telematics stream into Lakehouse//RT and are joined to jobsite geofences on Delta Lake, ranking assets by idle time and cost in the Field Daily Log.
        components:
          - Field Daily Log
          - Samsara Fleet
          - United Rentals Total Control
          - Lakehouse//RT
          - Delta Lake
          - AI/BI
        stories:
          - title: Maximizing equipment utilization through geospatial analytics
