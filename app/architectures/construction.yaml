agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Cost & Completion Agent
        icon: genie
        summary: Track job margin, earned value and forecast at completion across the portfolio.
        feeds:
          - Trimble Viewpoint Vista
          - Sage 300 CRE
          - Primavera P6
          - Margin, schedule, safety
        teams:
          - Project Managers
          - Cost Controllers
          - GC President & COO
        questions:
          - Which jobs are below their forecast margin this month?
          - What is CPI and SPI by job right now?
          - How much change-order exposure is pending but not yet approved?
          - Which jobs have the largest variance to forecast at completion?
          - What is total backlog and projected revenue by region?
      - name: Field & Fleet Agent
        icon: genie
        summary: Run daily production, site progress and equipment health across active sites.
        feeds:
          - Procore
          - Samsara Fleet
          - United Rentals Total Control
          - Conformed projects and WBS
        teams:
          - Field Superintendents
          - General Superintendent
          - Site Superintendent
        questions:
          - What is units per labor hour by trade and job this week?
          - Which equipment is sitting idle while another site waits?
          - Which crews are behind the daily production plan?
          - What is equipment utilisation by asset across active sites?
          - Which trades are on the critical path and slipping?
      - name: Site Safety Agent
        icon: genie
        summary: Surface leading indicators, incidents and punch-list risk across sites.
        feeds:
          - HammerTech
          - OSHA Incident Data
          - Autodesk Build
          - Margin, schedule, safety
        teams:
          - Safety & Quality
          - EHS Director
          - Safety Manager
        questions:
          - Which sites have rising near-miss rates before TRIR moves?
          - What is our TRIR by region and job type this year?
          - Which inspection and permit items are overdue?
          - Where is punch-list burndown behind at closeout?
          - Which subcontractors have the worst safety observation record?
      - name: Bid & Estimating Agent
        icon: genie
        summary: Score bid win rate, unit costs and subcontractor prequalification before award.
        feeds:
          - ISNetworld
          - Dodge Construction Network
          - Trimble Viewpoint Vista
          - Conformed projects and WBS
        teams:
          - Estimating
          - Chief Estimator
          - Preconstruction Lead
        questions:
          - What is our bid win rate by job type and region?
          - Which subcontractors carry the highest default or safety risk?
          - How do our unit costs compare to historical productivity?
          - Which trades have thin coverage on upcoming bids?
          - Where are margins most sensitive on the current pipeline?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Bid & Proposal Intelligence
        short: Preconstruction
        icon: market
        summary: Win probability, unit-cost basis and subcontractor risk brought together so bids are priced on evidence, not memory.
        problem: Estimators price new work from memory and scattered historical jobs, and subcontractor prequalification, safety and past performance sit in separate systems, so trades are awarded on price without a clear read on cost basis or delivery risk.
        who_benefits: Estimating
        how_built: Dodge leads, ISNetworld scores and Viewpoint historical cost conform on Delta Lake under Unity Catalog; win-probability and subcontractor-risk models tracked in MLflow score through Model Serving, and Mosaic AI drafts proposal narratives in the Bid Analyzer.
        components:
          - Bid Analyzer
          - Dodge Construction Network
          - ISNetworld
          - Model Serving
          - MLflow
          - Mosaic AI
      - name: Earned Value & Completion Monitoring
        short: Controls
        icon: chart
        summary: CPI, SPI and forecast at completion integrated across ERP and schedule so progress is read on one certified basis.
        problem: CPI and SPI live in the scheduler while actual cost sits in the ERP, so earned value is rebuilt by hand in spreadsheets and is stale the moment the job moves.
        who_benefits: Project Managers
        how_built: ERP job cost and P6 progress land through Lakeflow and conform on Delta Lake under Unity Catalog, so Project Command serves one certified CPI, SPI and forecast at completion per job on AI/BI.
        components:
          - Project Command
          - Trimble Viewpoint Vista
          - Primavera P6
          - Lakeflow
          - Unity Catalog
          - Delta Lake
        stories:
          - title: Hanwha builds an integrated data system for smarter decision making
            url: https://www.databricks.com/customers/hanwha-corporation
      - name: BIM Design Coordination & Simulation
        short: Design
        icon: product
        summary: Clashes and 4D sequence options explored against the schedule before the field ever builds them.
        problem: Clashes between structural, mechanical and electrical models surface in the field as rework, because coordination and 4D what-if run in siloed BIM tools disconnected from the schedule and cost.
        who_benefits: Project Managers
        how_built: Revit, Navisworks and iTwin clash and 4D runs land under Unity Catalog and join to P6 on Delta Lake, so unresolved clashes and simulated sequences are ranked by schedule and cost impact in AI/BI before the field builds them.
        components:
          - Autodesk Revit
          - Navisworks
          - Bentley iTwin
          - Primavera P6
          - Unity Catalog
          - AI/BI
      - name: Site Progress & Reality Capture
        short: Field
        icon: iot
        summary: 360 site capture turned into percent-complete, quality and condition signals against the plan.
        problem: Progress is argued from walkthrough photos and daily logs nobody aggregates, so percent-complete, quality gaps and site conditions are known late and rework is caught only after it is buried.
        who_benefits: Field Superintendents
