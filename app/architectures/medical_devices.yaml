name: Medical Devices
description: 'Design, manufacture and post-market support of regulated medical devices: PLM and requirements, MES and quality, complaint and CAPA, connected-device telemetry, and regulatory submissions.'
sources:
  - name: PLM & Engineering
    icon: dev
    tiles:
      - name: PTC Windchill
        icon: dev
        summary: 'Product lifecycle management: the system of record for device design, BOMs, change orders and the design history file.'
        citations:
          - windchill
        category: Product Lifecycle Management (PLM)
        what_it_is: The system of record for device design, BOMs, change orders and the design history file across the product's lifecycle.
        who_uses_it: Design & systems eng, Verification & validation and Regulatory affairs.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 1-5 GB/day
            interval: Nightly batch + on change order
      - name: Siemens Teamcenter
        icon: erp
        summary: PLM for BOM, requirements and change control where Teamcenter is the incumbent design backbone.
        citations:
          - teamcenter
        category: Product Lifecycle Management (PLM)
        what_it_is: PLM for BOM, requirements and change control where Teamcenter is the incumbent design backbone for the device portfolio.
        who_uses_it: Design & systems eng, Reliability engineering and Supply chain.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 1-5 GB/day
            interval: Nightly batch + on change
      - name: Jama Connect
        icon: docs
        summary: Requirements, verification and validation traceability from design inputs to test evidence for regulated products.
        citations:
          - jama
        category: Requirements Management / ALM
        what_it_is: Traces requirements, verification and validation from design inputs to test evidence for regulated products.
        who_uses_it: Verification & validation, Design & systems eng and Compliance & audit.
        data_out:
          batch:
            types:
              - structured
            volume: 0.2-1 GB/day
            interval: Nightly sync
  - name: Quality & Reg
    icon: gavel
    tiles:
      - name: MasterControl QMS
        icon: gavel
        summary: 'Quality management: document control, training, nonconformances, CAPA and audit trails under 21 CFR Part 11.'
        citations:
          - mastercontrol
        category: Quality Management System (QMS)
        what_it_is: Manages document control, training, nonconformances, CAPA and audit trails under 21 CFR Part 11 across the quality system.
        who_uses_it: Head of quality, Compliance & audit and Line quality.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 0.5-3 GB/day
            interval: Nightly + event-driven
      - name: Veeva Vault Quality
        icon: gavel
        summary: Cloud QMS and QualityDocs for complaint, deviation and CAPA workflows across sites.
        citations:
          - veeva
        category: Quality Management System (QMS)
        what_it_is: Cloud QMS and QualityDocs running complaint, deviation and CAPA workflows and controlled content across sites.
        who_uses_it: Head of quality, Regulatory affairs and Compliance & audit.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 0.5-2 GB/day
            interval: Nightly + on approval
      - name: TrackWise Digital
        icon: gavel
        summary: 'Complaint management and CAPA of record: intake, MDR decisioning and adverse-event workflows.'
        citations:
          - trackwise
        category: Complaint & CAPA Management (QMS)
        what_it_is: 'The complaint and CAPA system of record: complaint intake, MDR decisioning and adverse-event workflows for the device portfolio.'
        who_uses_it: Post-market surveillance, Head of quality and Regulatory affairs.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 0.5-3 GB/day complaints + narratives
            interval: Hourly / daily intake
      - name: ETQ Reliance
        icon: gavel
        summary: Quality and EHS management for nonconformance, supplier quality and CAPA where ETQ is the incumbent.
        citations:
          - etq
        category: Quality & EHS Management (QMS)
        what_it_is: Manages nonconformance, supplier quality and CAPA (and EHS) where ETQ Reliance is the incumbent quality platform.
        who_uses_it: Line quality, Supply chain and Compliance & audit.
        data_out:
          batch:
            types:
              - structured
            volume: 0.2-1 GB/day
            interval: Nightly + event-driven
  - name: Manufacturing & MES
    icon: compute
    tiles:
      - name: Siemens Opcenter MES
        icon: compute
        summary: 'Manufacturing execution: electronic batch records, work orders, genealogy and in-line quality on the line.'
        citations:
          - opcenter
        category: Manufacturing Execution System (MES)
        what_it_is: Runs electronic batch records, work orders, genealogy and in-line quality on the line, the system of record for how a device was built.
        who_uses_it: Process & plant eng, Line quality and Supply chain.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 5-30 GB/day
            interval: Per-lot + shift batch
          stream:
            types:
              - semi-structured
            volume: line events at process latency
            interval: Continuous on the line
      - name: Rockwell Plex MES
        icon: compute
        summary: Cloud MES for production tracking, quality and genealogy across discrete device manufacturing.
        citations:
          - plex
        category: Manufacturing Execution System (MES)
        what_it_is: Cloud MES for production tracking, quality and genealogy across discrete device manufacturing.
        who_uses_it: Process & plant eng, Line quality and Supply chain.
        data_out:
          batch:
            types:
              - structured
            volume: 2-15 GB/day
            interval: Per-lot + shift batch
          stream:
            types:
              - semi-structured
            volume: production events on the line
            interval: Continuous
      - name: Tulip Frontline Ops
        icon: apps
        summary: Composable frontline operations and digital work instructions on the manufacturing floor.
        citations:
          - tulip
        category: Frontline Operations / Digital Work Instructions
        what_it_is: Composable frontline operations and digital work instructions on the manufacturing floor, capturing operator steps and station data.
        who_uses_it: Line quality, Process & plant eng and Application Engineers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: station events as steps complete
            interval: Continuous during shifts
      - name: AVEVA PI Historian
        icon: iot
        summary: 'Process historian: equipment and process time-series that underpins SPC, OEE and anomaly detection.'
        citations:
          - avevapi
        category: Process Historian (Time-Series)
        what_it_is: Process historian holding equipment and process time-series that underpins SPC, OEE and anomaly detection on the line.
        who_uses_it: Process & plant eng, Quality DS and Reliability engineering.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1000s of tags/sec
            interval: Continuous time-series
  - name: ERP, Service & CRM
    icon: erp
    tiles:
      - name: SAP S/4HANA
        icon: erp
        summary: The ERP of record for procurement, inventory, production orders and finance across the device business.
        citations:
          - sap
        category: ERP
        what_it_is: The ERP of record for procurement, inventory, production orders and finance across the device business.
        who_uses_it: Supply chain, Process & plant eng and Finance.
        data_out:
          batch:
            types:
              - structured
            volume: 10-50 GB/day
            interval: Nightly batch + hourly deltas
      - name: ServiceMax
        icon: orch
        summary: 'Field service management: installed base, service contracts, work orders and parts for the device fleet.'
        citations:
          - servicemax
        category: Field Service Management (FSM)
        what_it_is: Manages the installed base, service contracts, work orders and parts for the device fleet in the field.
        who_uses_it: Field service, Customer success and Sales & marketing.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Nightly sync + intraday
      - name: Salesforce
        icon: crm
        summary: Commercial CRM for accounts, orders and device utilisation across sales and customer success.
        citations:
          - salesforce
        category: CRM
        what_it_is: Commercial CRM for accounts, orders and device utilisation across sales and customer success.
        who_uses_it: Sales & marketing, Customer success and Field service.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Nightly sync
          stream:
            types:
              - semi-structured
            volume: engagement events as they occur
            interval: Continuous CDC
      - name: LabWare LIMS
        icon: db
        summary: 'Laboratory information management: test results, specifications and out-of-spec dispositions for release.'
        citations:
          - labware
        category: Laboratory Information Management System (LIMS)
        what_it_is: Holds test results, specifications and out-of-spec dispositions that gate device and component release.
        who_uses_it: Line quality, Process & plant eng and Head of quality.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-3 GB/day
            interval: Nightly batch + result release
  - name: Regulatory & Telemetry
    icon: iot
    tiles:
      - name: FDA GUDID / UDI
        icon: gavel
        summary: Unique Device Identification records and the Global UDI Database, the reference for device identity and labelling.
        citations:
          - gudid
        category: Device Identification Registry (UDI)
        what_it_is: Unique Device Identification records and the Global UDI Database, the reference for device identity and labelling.
        who_uses_it: Regulatory affairs, Compliance & audit and Supply chain.
        data_out:
          batch:
            types:
              - structured
            volume: MBs-GBs (UDI records)
            interval: On registration + periodic sync
      - name: FDA MAUDE Events
        icon: gavel
        summary: Manufacturer and User Facility Device Experience adverse-event reports, the public post-market safety record.
        citations:
          - maude
        category: Public Adverse-Event Database (Devices)
        what_it_is: Manufacturer and User Facility Device Experience adverse-event reports, the public post-market safety record used for signal benchmarking.
        who_uses_it: Post-market surveillance, Medical affairs and Regulatory affairs.
        data_out:
          batch:
            types:
              - semi-structured
            volume: GBs (periodic event files)
            interval: Monthly reference releases
      - name: Device Telemetry
        icon: iot
        summary: 'Connected-device and IoMT telemetry from the installed base: usage, alarms and sensor streams from every unit.'
        category: Connected-Device / IoMT Telemetry
        what_it_is: 'Connected-device and IoMT telemetry from the installed base: usage, alarms and sensor streams from every unit in the field.'
        who_uses_it: Telemetry Eng, Field service and Reliability engineering.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 10s-100s of GB/day at fleet scale
            interval: Continuous (MQTT / Kafka)
      - name: HL7 FHIR Feeds
        icon: api
        summary: Interoperability feeds carrying device, observation and outcome resources to and from clinical systems.
        citations:
          - fhir
        category: Clinical Interoperability Standard (FHIR)
        what_it_is: Interoperability feeds carrying device, observation and outcome resources to and from clinical systems for real-world data.
        who_uses_it: Clinical Affairs, Medical affairs and Application Engineers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 10s-100s of resources/sec
            interval: Continuous (API / event)
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Complaint & RWE Marts
        icon: fed
        summary: Historical complaint, clinical and real-world evidence marts left where they are and queried in place under Unity Catalog, which avoids a second copy of the audited numbers.
        category: Complaint & Real-World Evidence Warehouse
        what_it_is: Historical complaint, clinical and real-world evidence marts kept in the incumbent warehouse and queried in place through federation, avoiding a second copy of the audited numbers.
        who_uses_it: Clinical Affairs, Post-market surveillance and Health economics.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: openFDA APIs
        icon: api
        summary: Device classification, recall and adverse-event data ingested from the FDA open data APIs for benchmarking.
        citations:
          - openfda
        category: Public Device Data API (openFDA)
        what_it_is: Device classification, recall and adverse-event data ingested from the FDA open data APIs for benchmarking and signal context.
        who_uses_it: Post-market surveillance, Regulatory affairs and Quality DS.
        data_out:
          batch:
            types:
              - semi-structured
            volume: GBs (API extracts)
            interval: Weekly / on-demand pulls
      - name: EU EUDAMED
        icon: gavel
        summary: European device registration, UDI and vigilance data exchanged with the EUDAMED database under EU MDR.
        citations:
          - eudamed
        category: EU Device Registration & Vigilance (EUDAMED)
        what_it_is: European device registration, UDI and vigilance data exchanged with the EUDAMED database under EU MDR.
        who_uses_it: Regulatory affairs, Compliance & audit and Post-market surveillance.
        data_out:
          batch:
            types:
              - structured
            volume: MBs-GBs (registration + vigilance)
            interval: On registration + periodic sync
      - name: Device Events
        icon: stream
        summary: MQTT and Kafka topics carrying connected-device telemetry, alarms and MES events, landed as structured events.
        category: Device Event Stream (MQTT/Kafka)
        what_it_is: MQTT and Kafka topics carrying connected-device telemetry, alarms and MES events, landed as structured events for real-time monitoring.
        who_uses_it: Telemetry Eng, Field service and Line quality.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-10k events/sec at fleet scale
            interval: Continuous (MQTT / Kafka)
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: R&D & Engineering
        mark: AI/BI
        summary: Design and systems engineering on product architecture and requirements in the design history file, verification and validation against design inputs, and reliability engineering turning field returns into design changes.
        uses:
          - - AI/BI
            - Design-verification coverage and field reliability on certified Metric Views.
          - - MLflow
            - Reliability and failure-mode models tracked for design reviews and audit.
          - - Unity Catalog
            - Requirements, design history and change control governed with lineage across the estate.
        sub:
          - name: Design & systems eng
            cares: product architecture and requirements in the DHF.
          - name: Verification & validation
            cares: test evidence against design inputs and requirements.
          - name: Reliability engineering
            cares: failure modes and field returns feeding design changes.
        ucs:
          - Design & Reliability
          - Predictive Servicing
          - Complaint & CAPA
      - name: Quality & Reg
        mark: Genie One
        summary: The head of quality on complaint and CAPA backlog and audit readiness; regulatory affairs on submissions, UDI registration and MDR timeliness; compliance and audit on QSR, ISO 13485 and recall exposure.
        uses:
          - - Genie One
            - Ask which lots and products drive this quarter's complaints without an analyst pull.
          - - AI/BI
            - Complaint rate, CAPA cycle time and submission status on one certified set of Metric Views.
          - - Unity Catalog
            - Audit trails and lineage supporting 21 CFR Part 11 and ISO 13485.
        sub:
          - name: Head of quality
            cares: complaint and CAPA backlog and audit readiness.
          - name: Regulatory affairs
            cares: submissions, UDI registration and MDR timeliness.
          - name: Compliance & audit
            cares: QSR, ISO 13485 and recall exposure.
        ucs:
          - Complaint & CAPA
          - Post-Market Vigilance
          - Regulatory Submissions
          - Traceability & Recall
      - name: Manufacturing Ops
        mark: Lakehouse//RT
        summary: Process and plant engineering on first-pass yield, OEE and process capability, line quality on nonconformance and disposition, and supply chain on component availability and supplier quality.
        uses:
          - - Yield & OEE Cockpit
            - Line yield and downtime flagged before a lot is at risk.
          - - Lakehouse//RT
            - Live MES and equipment state at the latency a line moves at.
          - - Model Serving
            - Defect and yield models scored against in-line inspection.
        sub:
          - name: Process & plant eng
            cares: first-pass yield, OEE and process capability.
          - name: Line quality
            cares: nonconformance, disposition and SPC at the line.
          - name: Supply chain
            cares: component availability and supplier quality.
        ucs:
          - MES Yield & Quality
          - Supply Chain Risk
          - Traceability & Recall
      - name: Commercial & Svc
        mark: AI/BI
        summary: Sales and marketing on territory attainment and device utilisation, the field service organisation on installed-base uptime and service contracts, and customer success on onboarding and consumable replenishment.
        uses:
          - - AI/BI
            - Territory attainment, device utilisation and service SLAs on certified views.
          - - Model Serving
            - Service and churn models scored in the dispatch and account path.
          - - Genie One
            - Ask which accounts are below utilisation target this quarter.
        sub:
          - name: Sales & marketing
            cares: territory attainment and device utilisation.
          - name: Field service
            cares: installed-base uptime and service contracts.
          - name: Customer success
            cares: onboarding and consumable replenishment.
        ucs:
          - Sales & Territory
          - Predictive Servicing
          - Supply Chain Risk
      - name: Clinical Affairs
        mark: Model Serving
        summary: Medical affairs on real-world evidence and clinical value, post-market surveillance on complaint and adverse-event signal, and health economics on outcomes and value evidence.
        uses:
          - - Model Serving
            - Safety-signal and outcome models scored across complaint, RWD and registry data.
          - - AI Functions
            - Adverse-event narratives and literature classified at scale from unstructured text.
          - - AI/BI
            - Signal trends and real-world outcomes on governed, certified views.
        sub:
          - name: Medical affairs
            cares: real-world evidence and clinical value.
          - name: Post-market surveillance
            cares: complaint and adverse-event signal.
          - name: Health economics
            cares: outcomes and value evidence.
        ucs:
          - Post-Market Vigilance
          - Real-World Evidence
          - Complaint & CAPA
  - name: Technical
    icon: code
    tiles:
      - name: Telemetry Eng
        mark: Lakeflow
        summary: Land connected-device and IoMT telemetry over MQTT and Kafka, complaint intake and MES events; own the Bronze to Silver path and the pager when the device-fleet tables stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for QMS, PLM, ERP and MES sources.
          - - Auto Loader
            - Device event and log files landed incrementally into Bronze.
          - - Lakewatch
            - Freshness on the fleet and complaint tables quality reads each morning.
      - name: Quality DS
        mark: MLflow
        summary: Complaint text classification, adverse-event coding, anomaly detection on process and telemetry, and reliability models, and whether they still hold as products and processes change.
        uses:
          - - Feature Store
            - Device, lot and complaint features read identically in training and serving.
          - - MLflow
            - Every classifier and reliability model tracked for audit and reproduction.
          - - Model Serving
            - Complaint triage and anomaly models scored in the quality path.
      - name: Application Engineers
        mark: Apps
        summary: Ship the CAPA Command Center, Device Fleet Monitor and Submission Workbench apps quality and service teams work in, hosted next to governed device data.
        uses:
          - - Apps
            - Device-connectivity and complaint-handling screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for CAPA state and disposition writes.
          - - Agent Bricks
            - Agents that draft complaint summaries against governed tools.
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    tiles:
      - name: Tableau / Power BI
        icon: chart
        summary: Executive and quality dashboards against serverless SQL with Unity Catalog permissions.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for complaint and yield answers in the channel quality already works in.
      - name: Notebooks & IDEs
        icon: notebook
        summary: Engineering and data-science notebooks against governed device and quality data.
  - name: Providers & Partners
    icon: partner
    tiles:
      - name: Provider FHIR Exchange
        icon: api
        summary: Device and outcome data exchanged with hospital systems over HL7 FHIR.
        citations:
          - fhir
      - name: Distributor Portals
        icon: globe
        summary: Inventory, UDI and field-action status shared to distributors and GPOs.
      - name: Contract Mfg Sharing
        icon: share
        summary: CMOs and suppliers reading live quality and demand tables over Delta Sharing.
  - name: Operational Writeback
    icon: opdb
    tiles:
      - name: QMS CAPA Writeback
        icon: gavel
        summary: CAPAs and dispositions written back into the QMS so the action reaches the system quality works in.
        citations:
          - mastercontrol
      - name: MES Disposition
        icon: compute
        summary: Lot hold, release and rework decisions written back to the MES at the line.
        citations:
