        summary: Predicted service dispatch raised in the field-service system against the installed base.
        citations:
          - servicemax
  - name: Regulatory & Reporting
    icon: gavel
    tiles:
      - name: FDA UDI & MDR Filing
        icon: gavel
        summary: UDI records and MDR reports filed to GUDID and MAUDE from governed device tables.
        citations:
          - gudid
      - name: EU MDR / EUDAMED
        icon: share
        summary: Registration and vigilance reporting filed to EUDAMED under EU MDR from certified Gold.
        citations:
          - eudamed
  - name: Published Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Published, contracted device and quality products discoverable in Unity Catalog Domains.
      - name: Sharing Recipients
        icon: share
        summary: Suppliers, CMOs and registries reading live tables with no copy and no egress duplication.
  - name: Databricks Apps
    icon: apps
    tiles:
      - name: CAPA Command Center
        icon: gavel
        short: Complaint & CAPA
        summary: Complaints, nonconformances and CAPAs triaged by risk with root-cause evidence assembled from QMS, MES and complaint text, on Databricks Apps over Lakebase.
      - name: Device Fleet Monitor
        icon: iot
        short: Connected-device health
        summary: Installed-base telemetry by device and site, flagging units trending to failure so service is dispatched before a field event.
      - name: Yield & OEE Cockpit
        icon: gauge
        short: Line performance
        summary: Live first-pass yield, downtime and SPC against the shift target, flagging lots and lines at risk before disposition.
      - name: Submission Workbench
        icon: docs
        short: Regulatory & UDI
        summary: Where regulatory affairs assembles UDI, 510(k) and MDR submissions from governed device, design-history and complaint tables.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Complaint & CAPA
        icon: aibi
        summary: Complaint and MDR rates, CAPA cycle time and backlog on certified Metric Views.
        kpis:
          - Complaint rate
          - MDR rate
          - CAPA cycle time
          - CAPA backlog
          - Repeat complaints
        teams:
          - Quality & Reg
          - Clinical Affairs
          - Head of quality
      - name: Manufacturing Yield & OEE
        icon: aibi
        summary: First-pass yield, OEE and nonconformance across the lines.
        kpis:
          - First-pass yield
          - OEE
          - Scrap rate
          - Nonconformance rate
          - Line downtime
        teams:
          - Manufacturing Ops
          - Quality & Reg
          - Process & plant eng
      - name: Field Service & Reliability
        icon: aibi
        summary: Installed-base uptime, reliability and service SLAs across the fleet.
        kpis:
          - Installed-base uptime
          - MTBF
          - Unplanned service calls
          - SLA attainment
          - Device utilisation
        teams:
          - Commercial & Svc
          - R&D & Engineering
          - Field service
      - name: Regulatory & Vigilance
        icon: aibi
        summary: Submission status, UDI coverage and MDR timeliness across regions.
        kpis:
          - Submission status
          - UDI registration coverage
          - MDR timeliness
          - Recall exposure
          - Signal count
        teams:
          - Quality & Reg
          - Clinical Affairs
          - Regulatory affairs
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface. A managed Beta is available.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity AI Gateway
      - name: Claude Code
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity AI Gateway.
      - name: OpenAI Codex
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity AI Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity AI Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Complaints & CAPA Agent
        icon: genie
        summary: Ask which products and lots drive complaints and where CAPA is aging, in plain language.
        feeds:
          - TrackWise Digital
          - MasterControl QMS
          - FDA MAUDE Events
          - Yield, complaint rate, CAPA
        teams:
          - Quality & Reg
          - Head of quality
          - Compliance & audit
        questions:
          - Which products and lots drive this quarter's complaints?
          - What is the complaint and MDR rate by device family?
          - Which CAPAs are open past their target closure date?
          - Where are complaints repeating across sites and products?
          - How does our complaint rate compare to MAUDE peers?
      - name: Manufacturing Yield & Quality Agent
        icon: genie
        summary: Explore first-pass yield, OEE and nonconformance across the lines.
        feeds:
          - Siemens Opcenter MES
          - AVEVA PI Historian
          - LabWare LIMS
          - Conformed device, lot, complaint
        teams:
          - Manufacturing Ops
          - Process & plant eng
          - Line quality
        questions:
          - What is first-pass yield by line and product this week?
          - Which lines have the most downtime and why?
          - Where is process capability drifting toward a limit?
          - Which lots are held by out-of-spec LIMS results?
          - What is the nonconformance rate by station?
      - name: Connected Device Fleet Agent
        icon: genie
        summary: Answer uptime, utilisation and service questions across the installed base.
        feeds:
          - Device Telemetry
          - ServiceMax
          - HL7 FHIR Feeds
          - Conformed device, lot, complaint
        teams:
          - Commercial & Svc
          - Field service
          - Telemetry Eng
        questions:
          - Which units are trending toward a field failure?
          - What is installed-base uptime by device and site?
          - Which accounts are below device-utilisation target?
          - How many service calls were unplanned this month?
          - Which consumables need replenishment across the fleet?
      - name: Post-Market & RWE Agent
        icon: genie
        summary: Ask about emerging safety signals and real-world outcomes across complaints and telemetry.
        feeds:
          - FDA MAUDE Events
          - Complaint & RWE Marts
          - Device Telemetry
          - Yield, complaint rate, CAPA
        teams:
          - Clinical Affairs
          - Post-market surveillance
          - Medical affairs
        questions:
          - Which device families show an emerging safety signal?
          - What is the real-world failure rate versus the label?
          - Which complaints correlate with telemetry anomalies?
          - How is device performance trending by indication?
          - Which signals are approaching a reportable threshold?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Complaint & CAPA
        short: Quality
        icon: gavel
        summary: Complaints, nonconformances and MDR events triaged by severity and probable cause, with CAPA opened and tracked to closure.
        problem: Complaints, nonconformances and MDR events sit in separate systems, so severity is judged inconsistently, root cause is reconstructed by hand and CAPA backlog ages toward the next audit.
        who_benefits: Quality & Reg
        how_built: Complaint intake, MES nonconformances and adverse-event feeds land in the lakehouse; text models triage severity and probable cause in Model Serving and open CAPAs from the CAPA Command Center on Lakebase.
        components:
          - CAPA Command Center
          - TrackWise Digital
          - MasterControl QMS
          - Model Serving
          - AI Functions
          - Lakebase
        stories:
          - title: Databricks for Healthcare and Life Sciences
            url: https://www.databricks.com/solutions/industries/healthcare-and-life-sciences
      - name: Post-Market Vigilance
        short: Safety
        icon: ztarget
        summary: Emerging safety signal detected across complaints, adverse events and device telemetry before field exposure grows.
        problem: Safety signal hides across complaints, adverse events, registries and device telemetry; by the time a trend clears a manual review the field exposure has already grown.
        who_benefits: Clinical Affairs
        how_built: Complaint, adverse-event and telemetry feeds are conformed to Gold; signal-detection models score emerging trends in Model Serving and surface them to surveillance before they become recalls.
        components:
          - FDA MAUDE Events
          - Device Telemetry
          - Model Serving
          - AI/BI
          - Complaint & RWE Marts
        stories:
          - title: Real-World Evidence Solution Accelerator
            url: https://www.databricks.com/solutions/accelerators/real-world-evidence
          - title: Databricks for Healthcare and Life Sciences
            url: https://www.databricks.com/solutions/industries/healthcare-and-life-sciences
      - name: Predictive Servicing
        short: Field service
        icon: iot
        summary: Connected devices scored on telemetry so service is dispatched before an unplanned failure in the field.
        problem: Connected devices in the field fail between planned visits, and without telemetry the first signal is an unplanned service call or a complaint, not a prediction.
        who_benefits: Commercial & Svc
        how_built: IoMT telemetry streams into Lakehouse//RT; remaining-useful-life models score each unit in Model Serving and dispatch is raised in ServiceMax from the Device Fleet Monitor.
        components:
          - Device Fleet Monitor
          - Device Telemetry
          - Lakehouse//RT
          - Model Serving
          - ServiceMax
          - MLflow
        stories:
          - title: 'Insulet: connected Omnipod device analytics on Databricks'
            url: https://www.databricks.com/customers/insulet/lakeflow-connect
          - title: GE Healthcare builds device and patient views on Databricks
            url: https://www.databricks.com/company/newsroom/press-releases/databricks-introduces-lakehouse-for-the-healthcare-and-life-sciences-industries-to-drive-transformation-across-healthcare-ecosystem
      - name: MES Yield & Quality
        short: Manufacturing
        icon: gauge
        summary: First-pass yield and scrap attacked at the line with in-line defect scoring rather than at final inspection.
        problem: First-pass yield and scrap are reviewed after the lot, so a drifting process is caught at final inspection or in the field instead of at the line.
        who_benefits: Manufacturing Ops
        how_built: MES, historian and inspection data are conformed to certified Metric Views; defect and yield models score in-line in Model Serving and the Yield & OEE Cockpit flags lots at risk before disposition.
        components:
          - Yield & OEE Cockpit
          - Siemens Opcenter MES
          - AVEVA PI Historian
          - Model Serving
          - AI/BI
        stories:
          - title: Insulet cuts manufacturing data latency on Databricks
            url: https://www.databricks.com/customers/insulet/lakeflow-connect
      - name: Supply Chain Risk
        short: Supply chain
        icon: network
        summary: Supplier and component exposure scored so shortages and bad lots are moved before they stop a build or reach a device.
        problem: Single-source components and opaque supplier quality mean a shortage or a bad lot is discovered at the line, after it has already stopped a build or reached a device.
        who_benefits: Manufacturing Ops
        how_built: ERP, supplier and MES feeds are joined in the lakehouse; risk models score supplier and component exposure so buffers and qualifications are moved before a shortage or nonconformance lands.
        components:
          - SAP S/4HANA
          - Genie
          - Model Serving
          - AI/BI
          - Lakeflow
        stories:
          - title: Integra Life Sciences gains a global supply and demand view
            url: https://www.databricks.com/customers/integra-life-sciences
      - name: Regulatory Submissions
        short: Regulatory
        icon: docs
        summary: UDI, 510(k) and MDR submissions assembled from governed device, design-history and complaint tables with lineage.
        problem: UDI, 510(k) and MDR submissions are assembled by hand from PLM, QMS and complaint systems, so filing is slow and every regulator's format is a fresh manual export.
        who_benefits: Quality & Reg
        how_built: Device, design-history and complaint tables are governed under Unity Catalog; the Submission Workbench assembles UDI/GUDID and MDR packages with lineage from the same certified data.
        components:
          - Submission Workbench
          - FDA GUDID / UDI
          - EU EUDAMED
          - Unity Catalog
          - AI Functions
        stories:
          - title: Databricks for Healthcare and Life Sciences
            url: https://www.databricks.com/solutions/industries/healthcare-and-life-sciences
      - name: Sales & Territory
        short: Commercial
        icon: market
        summary: Territory attainment and consumable forecasting grounded in how the installed base is actually used, not just orders.
        problem: Sales sees orders but not device utilisation, so territory calls and consumable forecasts are made blind to how the installed base is actually used.
        who_benefits: Commercial & Svc
        how_built: CRM, order and device-utilisation data are conformed to Gold; attainment and utilisation are read in AI/BI and Genie on the definitions the commercial team already reports.
        components:
          - Salesforce
          - AI/BI
          - Genie One
          - Unity Catalog
      - name: Real-World Evidence
        short: Clinical
        icon: chart
        summary: Real-world device performance assembled from registries, claims and telemetry for indications, value and safety.
        problem: Device performance in the real world lives in registries, claims and telemetry that never meet, so evidence for indications, value and safety takes months to assemble.
        who_benefits: Clinical Affairs
        how_built: Real-world data from registries, claims and device telemetry is conformed on the lakehouse using the RWE accelerator; outcome and comparative-effectiveness models run in Model Serving.
        components:
          - HL7 FHIR Feeds
          - Complaint & RWE Marts
          - Model Serving
          - AI/BI
          - Delta Lake
        stories:
          - title: Real-World Evidence Solution Accelerator
            url: https://www.databricks.com/solutions/accelerators/real-world-evidence
          - title: Integra Life Sciences unifies data for patient care
            url: https://www.databricks.com/customers/integra-life-sciences
      - name: Traceability & Recall
        short: Traceability
        icon: share
        summary: Device history and lot genealogy stitched so a recall is scoped from component to patient in minutes.
        problem: When a lot is suspect, tracing every affected device from component to patient and scoping the recall is a manual genealogy hunt across MES, PLM and distribution.
        who_benefits: Quality & Reg
        how_built: Device history and lot genealogy are stitched in Silver from MES, PLM and distribution; a recall query scopes affected units in minutes and writes disposition back to the QMS.
        components:
          - Siemens Opcenter MES
          - PTC Windchill
          - MasterControl QMS
          - Unity Catalog
          - AI/BI
        stories:
          - title: Databricks for Healthcare and Life Sciences
            url: https://www.databricks.com/solutions/industries/healthcare-and-life-sciences
      - name: Design & Reliability
        short: Engineering
        icon: dev
        summary: Field returns, complaints and telemetry joined to requirements so reliability lessons reach design reviews directly.
        problem: Field returns and complaints carry the design lessons, but they reach engineering as quarterly summaries, long after the next design freeze has passed.
        who_benefits: R&D & Engineering
        how_built: Complaint, return and telemetry signal is joined to requirements and design history in the lakehouse; failure-mode and reliability models in MLflow feed design reviews directly.
        components:
          - PTC Windchill
          - Jama Connect
          - Device Telemetry
          - MLflow
          - Model Serving
          - Feature Store
        stories:
          - title: Predictive maintenance on the Databricks Lakehouse
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
          - title: Insulet guides product updates with live device data
            url: https://www.databricks.com/customers/insulet/lakeflow-connect
medallion:
  Bronze:
    short: Raw device and quality feeds
    summary: Complaint intake and MDR events, MES lot and process records, PLM change orders, LIMS results and connected-device telemetry, landed exactly as received so a complaint or a batch record can be replayed as it stood.
  Silver:
    short: Conformed device, lot, complaint
    summary: Devices, lots, components and complaints resolved into single conformed entities across PLM, MES, QMS and field systems, with UDI-DI reconciled and device history stitched from component to finished good.
  Gold:
    short: Yield, complaint rate, CAPA
    summary: 'Contracted products the quality and operations teams run on: first-pass yield and OEE by line, complaint and MDR rates by product and lot, CAPA cycle time, and field reliability by device family.'
