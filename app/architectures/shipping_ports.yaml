        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity AI Gateway
      - name: Claude Code
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity AI Gateway.
      - name: OpenAI Codex
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity AI Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity AI Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Berth & Vessel Operations Agent
        icon: genie
        summary: Ask about crane productivity, berth idle time and vessel arrival reliability.
        feeds:
          - Navis N4 TOS
          - Kalmar Insight
          - AIS Vessel Tracking
          - Throughput, dwell, crane rate
        teams:
          - Terminal Operations
          - Berth Planner
          - Shift Manager
        questions:
          - What were crane moves per hour by vessel and berth on the last shift?
          - How much berth idle time did we lose to plan versus execution today?
          - Which approaching vessels have the least reliable declared ETA?
          - What is the anchorage queue and expected berthing order right now?
          - Which cranes show the highest fuel burn per move this week?
      - name: Container Dwell & Yard Agent
        icon: genie
        summary: Explore dwell days, demurrage exposure and yard density across the stacks.
        feeds:
          - CyberLogitec OPUS
          - Identec RFID Gates
          - Descartes Customs
          - Conformed vessel, visit, unit
        teams:
          - Landside Logistics
          - Yard Controller
          - Terminal Operations
        questions:
          - Which containers are about to breach free-dwell and accrue demurrage?
          - What is average container dwell by line and cargo type this month?
          - Which yard blocks are most congested and driving rehandles?
          - How many units are held by customs and blocking their slots?
          - What is our demurrage exposure by customer right now?
      - name: Gate & Landside Flow Agent
        icon: genie
        summary: Answer truck turnaround, gate queue and intermodal handoff questions.
        feeds:
          - Identec RFID Gates
          - SAP TM for Ports
          - Navis N4 TOS
          - Throughput, dwell, crane rate
        teams:
          - Landside Logistics
          - Gate Manager
          - Intermodal Planner
        questions:
          - What is average truck turnaround time by gate and hour today?
          - Which stage of the gate process is the current bottleneck?
          - How does appointment compliance compare to actual arrivals?
          - Which rail consists are at risk of going out light this window?
          - What is drayage carrier slot compliance this week?
      - name: Tariff & Revenue Assurance Agent
        icon: genie
        summary: Ask about handling and storage revenue, rebates and billed-versus-actual moves.
        feeds:
          - Jade Master Terminal
          - Tideworks Mainsail
          - Navis N4 TOS
          - Throughput, dwell, crane rate
        teams:
          - Commercial & Tariffs
          - Tariff Manager
          - Revenue Assurance
        questions:
          - Where do billed moves diverge from actual crane and gate events?
          - Which customers exceeded free dwell but were not billed storage?
          - How much storage and demurrage revenue did we bill this month?
          - Which rebate tiers are customers close to triggering?
          - What is revenue per vessel call by line this quarter?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Berth Productivity
        short: Vessel ops
        icon: gauge
        summary: Crane moves per hour and berth idle time attributed to plan versus execution.
        problem: Crane rate and berth idle time live in TOS and crane logs separately, so a shift that loses productivity to plan versus execution is only reconstructed next day, after the vessel sailed.
        who_benefits: Terminal Operations
        how_built: Navis N4 TOS moves and Kalmar Insight equipment telemetry land through Lakeflow and conform on Delta Lake, so berth productivity is attributed to plan versus execution and read in the Berth Planner.
        components:
          - Berth Planner
          - Navis N4 TOS
          - Kalmar Insight
          - Lakeflow
          - Delta Lake
          - AI/BI
        stories:
          - title: PTP gains real-time operational insights with Databricks Lakehouse
            url: https://www.tigeranalytics.com/perspectives/case-study/delivering-real-time-operational-insights-for-ptp-with-databricks-lakehouse/
          - title: From raw shipping data to real-time predictions on Databricks
            url: https://community.databricks.com/t5/technical-blog/from-raw-shipping-data-to-real-time-predictions-in-one-platform/ba-p/153713
      - name: Container Dwell
        short: Yard ops
        icon: db
        summary: Dwell days and demurrage exposure predicted before free time expires.
        problem: Free-dwell clocks tick across thousands of boxes at once, so by the time a spreadsheet flags the units about to breach, demurrage has accrued and the yard is congested with stale containers.
        who_benefits: Landside Logistics
        how_built: Gate, TOS and customs events feed dwell features scored in Model Serving, and predicted breaches surface in the Yard Density Map so operators clear boxes before free time expires.
        components:
          - Yard Density Map
          - Model Serving
          - Identec RFID Gates
          - Descartes Customs
          - Feature Store
          - Delta Lake
        stories:
          - title: Kotahi improves container movement visibility with Azure Databricks
            url: https://www.databricks.com/customers/kotahi
      - name: Gate Turnaround
        short: Landside
        icon: stream
        summary: Truck visit duration decomposed by queue, OCR and yard handoff.
        problem: Truck visit time blends queueing, OCR read failures and yard handoff delays, but the causes sit buried in gate and TOS logs, so drivers wait and appointment capacity is set by rule of thumb.
        who_benefits: Landside Logistics
        how_built: Identec gate OCR and TOS handoff events land through Lakeflow and are decomposed on Delta Lake, so the Gate Optimizer matches appointment slots to real turnaround by queue, OCR and yard stage.
        components:
          - Gate Optimizer
          - Identec RFID Gates
          - Navis N4 TOS
          - Lakeflow
          - Delta Lake
          - AI/BI
      - name: Crane Sequencing
        short: Equipment
        icon: iot
        summary: Crane work lists optimised for twin-lift and minimum rehandle.
        problem: Crane work lists are built by hand against the stow plan, so twin-lift chances are missed and avoidable rehandles pile up, dragging moves per hour down when the berth window is tightest.
        who_benefits: Terminal Operations
        how_built: Stow, yard-slot and crane telemetry are conformed on Delta Lake and optimised with Model Serving, and the sequence is written back to the Navis N4 TOS dispatch list for the gang to work.
        components:
          - Berth Planner
          - Navis N4 TOS
          - Kalmar Insight
          - Model Serving
          - Delta Lake
          - Apache Spark
      - name: Vessel ETA Reliability
        short: Planning
        icon: globe
        summary: AIS-derived ETA accuracy scored against declared schedules.
        problem: Carrier-declared ETAs drift by hours against what AIS actually shows, so berths and gangs are planned to a schedule already wrong, and the terminal absorbs the idle time or the scramble.
        who_benefits: Terminal Operations
        how_built: AIS Vessel Tracking and MarineTraffic history feed ETA models tracked in MLflow and scored in Model Serving, so the Berth Planner ranks declared schedules against a live AIS-derived arrival.
        components:
          - Berth Planner
          - AIS Vessel Tracking
          - MarineTraffic API
          - Model Serving
          - MLflow
          - Lakehouse//RT
        stories:
          - title: From raw shipping data to real-time predictions on Databricks
            url: https://community.databricks.com/t5/technical-blog/from-raw-shipping-data-to-real-time-predictions-in-one-platform/ba-p/153713
      - name: Customs Clearance
        short: Compliance
        icon: gavel
        summary: Pre-arrival screening and hold resolution before cargo lands.
        problem: Declarations, holds and inspections arrive from brokers and the single window on their own clocks, so a box can reach the quay still held and the desk learns only when discharge stalls.
        who_benefits: Customs & Security
        how_built: Descartes and Customs Single Window feeds conform through Lakeflow into the Customs Hold Console, so pre-arrival screening and hold resolution happen on one governed view before cargo lands.
        components:
          - Customs Hold Console
          - Descartes Customs
          - Customs Single Window
          - Lakeflow
          - Unity Catalog
          - AI/BI
        stories:
          - title: Hapag-Lloyd uses Databricks to enhance audit and compliance efficiency
            url: https://www.databricks.com/customers/hapag-lloyd
      - name: Intermodal Rail Load
        short: Rail
        icon: partner
        summary: Train loading plans matched to vessel discharge and yard slots.
        problem: Rail load plans are built before the vessel finishes discharge, so when the box mix or yard position shifts the train works from stale lists, wagons go out light and ramp slots are wasted.
        who_benefits: Landside Logistics
        how_built: TOS discharge events and SAP TM rail orders conform on Delta Lake, so load plans in the Gate Optimizer are matched to actual discharge and yard slots and shared to the ramp over OpenSharing.
        components:
          - Gate Optimizer
          - SAP TM for Ports
          - Navis N4 TOS
          - Delta Lake
          - OpenSharing
          - AI/BI
      - name: Tariff & Storage Revenue
        short: Commercial
        icon: market
        summary: Handling and storage charges reconciled to actual moves.
        problem: Handling and storage charges bill from the TOS, but rebates, contract rates and free-dwell exceptions live in other systems, so revenue leaks wherever billed and actual moves diverge.
        who_benefits: Commercial & Tariffs
        how_built: Jade Master Terminal and Tideworks Mainsail data conform on Delta Lake and reconcile to actual crane and gate events, so handling and storage revenue is verified on certified AI/BI views.
        components:
          - Jade Master Terminal
          - Tideworks Mainsail
          - Navis N4 TOS
          - Delta Lake
          - AI/BI
          - Unity Catalog
        stories:
          - title: Hafnia modernizes maritime operations with Lakebase
            url: https://www.databricks.com/customers/hafnia/lakebase
      - name: Dangerous Goods
        short: Safety
        icon: gavel
        summary: DG declarations validated against stow position and segregation rules.
        problem: DG declarations are checked against stow position and segregation rules by hand, so a mis-declared or wrongly stowed hazardous box can reach the yard, caught only at inspection.
        who_benefits: Customs & Security
        how_built: INTTRA eBL and PCS declarations conform through Lakeflow and are validated against stow position on Delta Lake, so segregation breaches surface in the Customs Hold Console before the box is worked.
        components:
          - Customs Hold Console
          - INTTRA eBL
          - Port Community System
          - Lakeflow
          - Delta Lake
          - Unity Catalog
      - name: Environmental Reporting
        short: ESG
        icon: chart
        summary: Emissions and noise metrics reported to port authority programs.
        problem: Emissions, energy and noise metrics for port-authority programs are stitched by hand from crane fuel, vessel AIS and equipment telemetry each cycle, so numbers arrive late and untraced.
        who_benefits: Port Director Office
        how_built: AIS, crane fuel and equipment telemetry conform on Delta Lake with Unity Catalog lineage, so emissions metrics are computed once and reported to port-authority programs from certified AI/BI products.
        components:
          - AIS Vessel Tracking
          - Kalmar Insight
          - Unity Catalog
          - Delta Lake
          - AI/BI
          - Data Products
        stories:
          - title: Leveraging ESG data to operationalize sustainability with Databricks
            url: https://www.databricks.com/blog/2020/11/11/leveraging-esg-data-to-operationalize-sustainability.html
medallion:
  Bronze:
    short: Raw port and vessel feeds
    summary: TOS moves, AIS position reports, berth plans, customs declarations and gate transactions, landed exactly as received so a dwell time or a crane move can always be replayed.
  Silver:
    short: Conformed vessel, visit, unit
    summary: Vessels, port calls, containers and bills of lading resolved into single conformed entities across TOS, PCS and carrier systems, with voyage legs stitched to one visit.
  Gold:
    short: Throughput, dwell, crane rate
    summary: 'Contracted products terminal and port authority teams run on: crane moves per hour, truck turnaround, vessel berth productivity, container dwell and demurrage exposure.'
