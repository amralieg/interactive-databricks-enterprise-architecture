name: Shipping & Ports
description: 'Port and terminal operations: vessel scheduling, berth and crane allocation, cargo handling, customs clearance, and landside logistics across container and bulk terminals.'
sources:
  - name: Terminal Operating
    icon: erp
    tiles:
      - name: Navis N4 TOS
        icon: erp
        summary: 'Terminal operating system: vessel plans, yard slots, crane dispatch and gate transactions.'
        citations:
          - navis-n4
        category: Terminal Operating System (TOS)
        what_it_is: Holds the system-of-record for vessel stow plans, yard slots, crane dispatch and gate transactions, emitting the move events every terminal KPI is built on.
        who_uses_it: Terminal Operations, Berth Planners and Yard Controllers.
        data_out:
          batch:
            types:
              - structured
            volume: 10-40 GB/day
            interval: Hourly batch + end-of-shift
          stream:
            types:
              - semi-structured
            volume: hundreds-thousands of moves/sec at peak
            interval: Continuous move events
      - name: CyberLogitec OPUS
        icon: db
        summary: Container yard inventory, equipment control and rail loading for multi-modal terminals.
        citations:
          - cyberlogitec
        category: Terminal Operating System (TOS)
        what_it_is: Manages container yard inventory, equipment control and rail loading for multi-modal terminals, the source of stack and rehandle state.
        who_uses_it: Terminal Operations, Yard Controllers and Intermodal Planners.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Hourly batch
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous yard events
      - name: SAP TM for Ports
        icon: sheet
        summary: Landside transport orders, appointment scheduling and carrier billing.
        citations:
          - sap-tm
        category: Transportation Management System (TMS)
        what_it_is: Handles landside transport orders, appointment scheduling and carrier billing, feeding rail and truck movement into terminal planning.
        who_uses_it: Landside Logistics, Intermodal Planners and Commercial & Tariffs teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-8 GB/day
            interval: Nightly batch + hourly deltas
  - name: Vessel & Traffic
    icon: stream
    tiles:
      - name: Port Community System
        icon: api
        summary: Berth requests, pilot orders and customs pre-arrival messages exchanged with carriers.
        citations:
          - pcs
        category: Port Community System (PCS)
        what_it_is: Exchanges berth requests, pilot orders and customs pre-arrival messages between carriers, agents and the port, the shared operating picture for a call.
        who_uses_it: Terminal Operations, Harbour Master and Customs & Security teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: tens-hundreds of messages/sec
            interval: Continuous message flow
      - name: AIS Vessel Tracking
        icon: globe
        summary: Position, ETA and anchorage queue for every vessel approaching the port.
        citations:
          - ais
        category: Vessel Position (AIS)
        what_it_is: Broadcasts vessel position, speed, ETA and anchorage queue for every ship approaching the port, the ground truth for arrival timing.
        who_uses_it: Terminal Operations, Berth Planners and Harbour Master.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of position reports/sec
            interval: Continuous (seconds-minutes)
      - name: MarineTraffic API
        icon: partner
        summary: Historical track, port calls and congestion signals for schedule planning.
        citations:
          - marinetraffic
        category: Maritime Data Provider
        what_it_is: Provides historical vessel tracks, port-call history and congestion signals used to plan schedules and validate declared ETAs.
        who_uses_it: Terminal Operations, Berth Planners and ETA & Dwell Modelers.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-5 GB/day
            interval: Hourly / daily API pulls
  - name: Cargo & Customs
    icon: gavel
    tiles:
      - name: Descartes Customs
        icon: gavel
        summary: Import and export declarations, duty calculation and hold status from customs brokers.
        citations:
          - descartes-customs
        category: Customs & Trade Compliance
        what_it_is: Processes import and export declarations, duty calculation and hold status from customs brokers, driving pre-arrival clearance and holds.
        who_uses_it: Customs & Security, Customs Compliance and Landside Logistics teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-4 GB/day
            interval: Hourly + on-demand
      - name: CargoWise One
        icon: market
        summary: Freight forwarding, house bills and milestone events for containerised cargo.
        citations:
          - cargowise
        category: Freight Forwarding Platform
        what_it_is: Runs freight-forwarding operations, house bills and milestone events for containerised cargo, joining forwarder detail to terminal units.
        who_uses_it: Commercial & Tariffs, Customs Compliance and forwarder account teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-5 GB/day
            interval: Daily + milestone events
      - name: INTTRA eBL
        icon: product
        summary: Electronic bills of lading and booking confirmations from ocean carriers.
        citations:
          - inttra
        category: Electronic Bill of Lading Network
        what_it_is: Carries electronic bills of lading and booking confirmations from ocean carriers, the documentary basis for cargo release and DG declarations.
        who_uses_it: Customs & Security, DG Officers and documentation teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.5-2 GB/day
            interval: Continuous documents / daily batch
  - name: Equipment & Yard
    icon: iot
    tiles:
      - name: Kalmar Insight
        icon: iot
        summary: RTG and STS crane telemetry, spreader cycles and fuel burn by shift.
        citations:
          - kalmar-tv
        category: Crane & Equipment Telemetry
        what_it_is: Streams RTG and STS crane telemetry, spreader cycles and fuel burn by shift, the source of crane productivity and emissions data.
        who_uses_it: Terminal Operations, Shift Managers and Environmental reporting teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of readings/sec
            interval: Continuous equipment telemetry
      - name: Identec RFID Gates
        icon: stream
        summary: Automated gate OCR, RFID and chassis identification at in-gate and out-gate.
        citations:
          - identec
        category: Gate Automation & OCR
        what_it_is: Captures automated gate OCR, RFID and chassis identification at in-gate and out-gate, decomposing truck turnaround into stages.
        who_uses_it: Landside Logistics, Gate Managers and Yard Controllers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: tens-hundreds of gate events/sec
            interval: Continuous gate transactions
      - name: SICK Yard Automation
        icon: partner
        summary: Automated straddle carrier and AGV position for high-throughput yards.
        citations:
          - sick-yard
        category: Yard Automation Sensors
        what_it_is: Reports automated straddle carrier and AGV position and status for high-throughput yards, feeding equipment balance and safety analytics.
        who_uses_it: Terminal Operations, Yard Controllers and automation engineering teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of position events/sec
            interval: Continuous (seconds)
  - name: Finance & Tariffs
    icon: market
    tiles:
      - name: Jade Master Terminal
        icon: erp
        summary: Storage, handling and demurrage invoices reconciled against actual moves.
        citations:
          - oracle-port
        category: Terminal Billing & Revenue
        what_it_is: Generates storage, handling and demurrage invoices reconciled against actual crane and gate moves, the source of billed-versus-actual revenue.
        who_uses_it: Commercial & Tariffs, Revenue Assurance and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Daily billing cycles
      - name: Tideworks Mainsail
        icon: chart
        summary: Published tariffs, rebates and contract rates applied to each service event.
        citations:
          - hph-tariff
        category: Tariff & Rate Management
        what_it_is: Maintains published tariffs, rebates and contract rates applied to each service event, the pricing reference behind revenue leakage analysis.
        who_uses_it: Commercial & Tariffs, Tariff Managers and Key Account Managers.
        data_out:
          batch:
            types:
              - structured
            volume: MBs-GBs (rates + events)
            interval: Daily rate refresh
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Carrier Schedule Marts
        icon: fed
        summary: Vessel schedules and capacity marts left with carriers and queried in place under Unity Catalog.
        category: Carrier Schedule Warehouse
        what_it_is: Carrier-side vessel schedule and capacity marts kept with the lines and queried in place through federation rather than copied into the terminal.
        who_uses_it: Terminal Operations, Berth Planners and Commercial & Tariffs analysts.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: UN/EDIFACT COPRAR / CODECO
        icon: stream
        summary: COPRAR and CODECO vessel and gate moves and IFTMIN and IFTSTA transport messages from shipping lines, parsed on arrival.
        citations:
          - edifact
        category: EDI Transaction Messages
        what_it_is: Carries COPRAR/CODECO vessel and gate moves and IFTMIN/IFTSTA transport messages from shipping lines, parsed on arrival and matched to units.
        who_uses_it: Terminal Operations, Customs Compliance and Integration Engineers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: tens-hundreds of messages/sec
            interval: Continuous message flow
      - name: Port Authority AIS Feed
        icon: api
        summary: Real-time berth occupancy and pilot boarding events from the port authority.
        citations:
          - pcs
        category: Port Authority Data Feed
        what_it_is: Provides real-time berth occupancy and pilot-boarding events from the port authority, aligning the terminal to harbour-wide movement.
        who_uses_it: Terminal Operations, Harbour Master and Berth Planners.
        data_out:
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous (near real-time)
      - name: Customs Single Window
        icon: gavel
        summary: Government clearance status and inspection results consumed inbound.
        citations:
          - descartes-customs
        category: Government Single Window
        what_it_is: Consumes government clearance status and inspection results inbound, the authoritative signal for whether a box may be released.
        who_uses_it: Customs & Security, Customs Compliance and Port Security teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.5-2 GB/day
            interval: Hourly + event-driven
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Port Director Office
        mark: Genie One
        summary: The port director on throughput and revenue per call; the COO on berth productivity, truck queues and the terminal's demurrage exposure.
        uses:
          - - Genie One
            - Ask what yesterday's vessel productivity cost without analyst delay.
          - - AI/BI
            - Crane rate and dwell on certified Metric Views.
          - - Unity Catalog
            - One definition of dwell across terminal and finance.
        sub:
          - name: Port Director
            cares: throughput, revenue per call and the port's standing against neighbouring gateways.
          - name: Chief Operating Officer
            cares: berth productivity, truck queues and the terminal's demurrage exposure each shift.
          - name: Harbour Master
            cares: vessel safety, berth allocation and traffic through the approach channel.
        ucs:
          - Berth Productivity
          - Tariff & Storage Revenue
          - Vessel ETA Reliability
          - Environmental Reporting
      - name: Terminal Operations
        mark: Lakehouse//RT
        summary: Berth planners and shift managers on crane allocation, yard density and vessel cut-off, defending crane moves per hour on the stow plan.
        uses:
          - - Berth Planner
            - Live berth and crane plan against AIS ETA and yard capacity.
          - - Lakehouse//RT
            - Gate and crane state at terminal-line latency.
        sub:
          - name: Berth Planner
            cares: the berth and crane plan against AIS ETA, stow and yard capacity.
          - name: Shift Manager
            cares: crane moves per hour and gang deployment across the working shift.
          - name: Yard Controller
            cares: slot density, rehandles and equipment balance across the stacks.
        ucs:
          - Berth Productivity
          - Crane Sequencing
          - Vessel ETA Reliability
          - Container Dwell
      - name: Commercial & Tariffs
        mark: AI/BI
        summary: Tariff managers on contract compliance, rebate accuracy and storage revenue leakage where free-dwell days slip past the billed clock.
        uses:
          - - AI/BI
            - Handling revenue and demurrage on certified views.
          - - Genie One
            - Ask which customers exceed free dwell this week.
        sub:
          - name: Tariff Manager
            cares: contract rates, rebate accuracy and storage revenue leakage on free-dwell days.
          - name: Key Account Manager
            cares: line and shipper agreements and volume commitments per service.
          - name: Revenue Assurance
            cares: billed moves reconciled to the actual crane and gate events.
        ucs:
          - Tariff & Storage Revenue
          - Container Dwell
          - Berth Productivity
      - name: Landside Logistics
        mark: Model Serving
        summary: Truck appointment and rail planners on gate queues and intermodal handoff, matching slots to yard density before demurrage accrues.
        uses:
          - - Gate Optimizer
            - Appointment slots scored against yard density and cut-off.
          - - Model Serving
            - Dwell prediction models before demurrage accrues.
        sub:
          - name: Gate Manager
            cares: truck appointment slots, gate queues and turnaround time at the terminal.
          - name: Intermodal Planner
            cares: rail consist, train windows and the yard-to-ramp handoff.
          - name: Drayage Coordinator
            cares: carrier slot compliance and container availability at pickup.
        ucs:
          - Gate Turnaround
          - Container Dwell
          - Intermodal Rail Load
      - name: Customs & Security
        mark: Lakeflow
        summary: Compliance teams on customs holds, inspection outcomes and dangerous-goods declarations validated against stow position and segregation.
        uses:
          - - Customs Hold Console
            - Declaration status and inspection outcomes in one governed view.
          - - Lakeflow
            - PCS and customs feeds conformed for compliance analytics.
        sub:
          - name: Customs Compliance
            cares: declaration status, holds and inspection outcomes before cargo lands.
          - name: DG Officer
            cares: dangerous-goods segregation, stow position and hazmat documentation.
          - name: Port Security
            cares: ISPS access control, seals and screening across the terminal perimeter.
        ucs:
          - Customs Clearance
          - Dangerous Goods
          - Container Dwell
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land TOS moves, AIS position reports, PCS messages and customs feeds; own Bronze to Silver and the pager when a dwell or crane table breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for TOS, PCS and carrier sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on AIS and gate feeds.
          - - Lakewatch
            - Freshness on the dwell tables the berth desk reads each shift.
        sub:
          - name: Ingestion Engineer
            cares: TOS moves, AIS position reports, PCS and customs feeds landed on arrival.
          - name: Pipeline Engineer
            cares: Bronze-to-Silver conformance and expectations on the dwell and crane tables.
          - name: Platform SRE
            cares: the pager when a dwell or crane table the berth desk reads breaks.
        ucs:
          - Berth Productivity
          - Container Dwell
          - Vessel ETA Reliability
          - Customs Clearance
      - name: Data Scientists
        mark: MLflow
        summary: Dwell-prediction, vessel-ETA, crane-sequencing and gate-turnaround models, and whether they still hold as schedules and yard density shift.
        uses:
          - - Feature Store
            - Vessel and yard features read identically in training and serving.
          - - MLflow
            - Every ETA and dwell experiment tracked for audit.
          - - Model Serving
            - Dwell and ETA models scored on approaching calls.
        sub:
          - name: ETA & Dwell Modeler
            cares: vessel-ETA and container-dwell models as schedules and yard density shift.
          - name: Optimisation Scientist
            cares: crane-sequencing and berth-allocation under twin-lift and rehandle limits.
          - name: MLOps Engineer
            cares: feature parity and drift on the ETA and dwell models in production.
        ucs:
          - Container Dwell
          - Vessel ETA Reliability
          - Crane Sequencing
          - Gate Turnaround
      - name: App Developers
        mark: Apps
        summary: Ship the Berth Planner, Gate Optimizer and Yard Density apps terminal teams work in, hosted next to governed TOS and AIS data.
        uses:
          - - Apps
            - Terminal screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for appointment and dispatch writes.
          - - Agent Bricks
            - Agents that draft crane sequences against governed tools.
        sub:
          - name: Full-Stack Engineer
            cares: the Berth Planner, Gate Optimizer and Yard Density screens teams work in.
          - name: Backend Engineer
            cares: appointment and dispatch writes on serverless Postgres next to governed data.
          - name: Agent Developer
            cares: agents that draft crane sequences against governed terminal tools.
        ucs:
          - Berth Productivity
          - Gate Turnaround
          - Container Dwell
consumers:
