  - name: Databricks Apps
    icon: apps
    tiles:
      - name: Berth Planner
        icon: gauge
        short: Vessel scheduling
        summary: Berth and crane plans scored against AIS ETA, yard density and labour availability.
      - name: Gate Optimizer
        icon: stream
        short: Truck appointments
        summary: Appointment slots and gate lanes matched to yard capacity and vessel cut-off.
      - name: Yard Density Map
        icon: iot
        short: Slot utilisation
        summary: Live yard occupancy and rehandle risk before the vessel gang lands.
      - name: Customs Hold Console
        icon: gavel
        short: Clearance status
        summary: Declaration holds, inspections and release milestones in one operations view.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Vessel & Berth Productivity
        icon: aibi
        summary: Crane moves per hour, berth utilisation and vessel ETA reliability.
        kpis:
          - Crane moves per hour
          - Berth utilisation
          - Berth idle time
          - Vessel ETA accuracy
          - Gang productivity
        teams:
          - Terminal Operations
          - Port Director Office
          - Berth Planner
      - name: Container Dwell & Demurrage
        icon: aibi
        summary: Dwell days, demurrage exposure and yard density across the terminal.
        kpis:
          - Container dwell
          - Demurrage exposure
          - Yard density
          - Rehandle rate
          - Customs hold count
