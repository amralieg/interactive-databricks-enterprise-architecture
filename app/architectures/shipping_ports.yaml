          - Yard Controller
          - Commercial & Tariffs
      - name: Gate Turnaround & Intermodal
        icon: aibi
        summary: Truck turnaround, gate queues and rail loading performance.
        kpis:
          - Truck turnaround
          - Gate queue length
          - Appointment compliance
          - Rail utilisation
          - Drayage slot compliance
        teams:
          - Landside Logistics
          - Gate Manager
          - Intermodal Planner
      - name: Tariff & Storage Revenue
        icon: aibi
        summary: Handling and storage revenue reconciled to actual moves with leakage.
        kpis:
          - Handling revenue
          - Storage revenue
          - Revenue leakage
          - Rebate accuracy
          - Revenue per call
        teams:
          - Commercial & Tariffs
          - Tariff Manager
          - Revenue Assurance
  - name: Agent Harnesses
