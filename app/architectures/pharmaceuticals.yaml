    short: Raw trial and plant
    summary: EDC case reports, lab LIMS results, MES batch records, safety cases and distribution shipments, landed exactly as received so a subject visit or a batch lot can always be replayed as it stood.
  Silver:
    short: Conformed subject, batch
    summary: Patients, sites, batches and products resolved into single conformed entities across clinical, quality and supply systems, with randomisation and genealogy reconciled and adverse events stitched to one safety record.
  Gold:
    short: Enrollment, yield, safety
    summary: 'Contracted products clinical and commercial leaders run on: enrollment versus plan, batch yield and release rate, and serious adverse event rates by product.'
