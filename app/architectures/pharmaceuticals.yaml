  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface. A managed Beta is available.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity AI Gateway
      - name: Claude Code
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity AI Gateway.
      - name: OpenAI Codex
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity AI Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity AI Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Enrollment & Trials Agent
        icon: genie
        summary: Ask how enrollment is tracking and where data quality is at risk before database lock.
        feeds:
          - Medidata Rave EDC
          - Veeva Vault CTMS
          - Oracle Clinical One
          - Enrollment, yield, safety
        teams:
          - Clinical Operations
          - Biopharma Leaders
          - Clinical Trial Managers
        questions:
          - How is enrollment pacing versus protocol by site and country?
          - Which sites are under-enrolling this month?
          - What is query aging by site ahead of database lock?
          - Where is the protocol-deviation rate trending up?
          - Which studies are at risk of missing their readout date?
      - name: Manufacturing & Batch Release Agent
        icon: genie
        summary: Explore batch release, yield and open deviations across the GMP suites.
        feeds:
          - Werum PAS-X
          - LabWare LIMS
          - SAP S/4HANA PP
          - Conformed subject, batch
        teams:
          - Mfg & Supply
          - Manufacturing Operations
          - Quality Control
        questions:
          - Which batches are held by open deviations right now?
          - What is first-pass yield by product and line this month?
          - Where is LIMS release testing behind schedule?
          - Which lines have the most right-first-time failures?
          - How does batch release rate compare to the plan?
      - name: Safety Signals Agent
        icon: genie
        summary: Answer adverse-event, signal and reporting-timeliness questions across the safety database.
        feeds:
          - ArisGlobal LifeSphere
          - FDA FAERS Feeds
          - Enrollment, yield, safety
        teams:
          - Medical & Safety
          - Pharmacovigilance
          - Quality & Reg
        questions:
          - What is the SAE rate by product this quarter?
          - Which events are disproportionate versus FAERS reference?
          - How many ICSRs are in the processing backlog?
          - Which expedited reports are near their reporting deadline?
          - What is the average case-processing time this month?
      - name: Quality & Inspection Agent
        icon: genie
        summary: Ask about CAPA aging, repeat deviations and lineage before FDA and EMA inspections.
        feeds:
          - MasterControl QMS
          - Veeva QualityDocs
          - LabWare LIMS
          - Conformed subject, batch
        teams:
          - Quality & Reg
          - Quality Assurance
          - Regulatory Affairs
        questions:
          - Which CAPAs are open past their target closure date?
          - What deviations are repeating across sites and products?
          - Can we trace this batch from record to submission annex?
          - How long is change control taking to close?
          - Which sites carry the most audit exposure right now?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Enrollment Forecast
        short: Clinical
        icon: chart
        summary: Site and country enrollment predicted against protocol timelines.
        problem: Enrollment slips against protocol timelines and nobody sees it until a site is months behind, so rescue sites and budget are approved late and the readout date drifts.
        who_benefits: Clinical Operations
        how_built: EDC and CTMS feeds land through Lakeflow and enrollment is modelled in Model Serving, surfaced site by site in the Trial Command Centre on Lakebase before database lock.
        components:
          - Trial Command Centre
          - Medidata Rave EDC
          - Lakeflow
          - Model Serving
          - AI/BI
        stories:
          - title: Novo Nordisk transforms clinical trials with AI
            url: https://www.databricks.com/customers/novo-nordisk
          - title: How Amgen modernized analytics to speed drug development
            url: https://www.databricks.com/blog/2022/03/22/amgen-modernizes-analytics-with-a-unified-data-lakehouse-to-speed-drug-development-delivery.html
      - name: Protocol Deviation
        short: Data quality
        icon: people
        summary: Visit and dosing deviations surfaced before database lock.
