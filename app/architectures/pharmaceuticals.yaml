        short: Enrollment live
        summary: Site enrollment, queries and monitoring backlog on Databricks Apps over Lakebase.
      - name: Batch Release Cockpit
        icon: gavel
        short: GxP release
        summary: Open deviations and LIMS results blocking shipment before pallets leave.
      - name: Safety Signal Hub
        icon: gauge
        short: Pharmacovigilance
        summary: Emerging adverse event signals triaged before periodic safety reports.
      - name: Quality Command
        icon: product
        short: CAPA control
        summary: Deviation trends and CAPA aging before regulatory inspections.
  - name: AI/BI Dashboards
