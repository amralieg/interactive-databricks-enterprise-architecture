name: Pharmaceuticals
description: 'Drug discovery through commercial: clinical trials, GxP manufacturing, regulatory submissions and pharmacovigilance for biopharma and generics.'
sources:
  - name: Clinical & EDC
    icon: people
    tiles:
      - name: Medidata Rave EDC
        icon: people
        summary: Case report forms, visit schedules and query management from pivotal trials.
        citations:
          - medidata-rave
        category: Electronic Data Capture (EDC)
        what_it_is: Captures case report forms, visit schedules and query management from pivotal trials, the operational system of record for clinical data collection.
        who_uses_it: Clinical Data Management, Clinical Trial Managers and CRAs.
        data_out:
          batch:
            types:
              - structured
            volume: 1-10 GB/day per study
            interval: Nightly extracts + intraday queries
          stream:
            types:
              - semi-structured
            volume: form events on save
            interval: Continuous CDC on eCRF
      - name: Veeva Vault CTMS
        icon: sheet
        summary: Site feasibility, monitoring visits and enrollment tracking.
        citations:
          - veeva-ctms
        category: Clinical Trial Management System (CTMS)
        what_it_is: Tracks site feasibility, monitoring visits and enrollment against plan across the trial's sites and countries.
        who_uses_it: Clinical Operations, Clinical Trial Managers and Clinical Supply.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-3 GB/day
            interval: Nightly sync
      - name: Oracle Clinical One
        icon: db
        summary: Unified clinical data hub for trials across modalities and regions.
        citations:
          - oracle-clinical
        category: Clinical Data Management & Randomization Platform
        what_it_is: Unified clinical data hub combining data capture and randomization for trials across modalities and regions on one platform.
        who_uses_it: Clinical Data Management, Clinical Supply and Biostatistics.
        data_out:
          batch:
            types:
              - structured
            volume: 1-6 GB/day per study
            interval: Nightly batch extracts
          stream:
            types:
              - semi-structured
            volume: randomization events on demand
            interval: Continuous at randomization
  - name: GxP Manufacturing
    icon: stream
    tiles:
      - name: Werum PAS-X
        icon: stream
        summary: Electronic batch records, weighing and dispensing, and review by exception across GMP suites.
        citations:
          - opcenter-pharma
        category: Manufacturing Execution System (MES)
        what_it_is: Runs electronic batch records, weighing and dispensing and review-by-exception across GMP suites, the system of record for how a batch was made.
        who_uses_it: Manufacturing Operations, Quality Assurance and GxP Validation Engineering.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 5-30 GB/day batch records
            interval: Per-batch + shift batch
          stream:
            types:
              - semi-structured
            volume: line events at batch latency
            interval: Continuous during runs
      - name: Rockwell PharmaSuite
        icon: iot
        summary: Packaging line events, serialization and line clearance records.
        citations:
          - pharmasuite
        category: Manufacturing Execution System (MES)
        what_it_is: Captures packaging-line events, serialization and line-clearance records for finished-goods packaging and DSCSA compliance.
        who_uses_it: Manufacturing Operations, Serialization & Distribution and Quality Assurance.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 100s-1000s of events/sec
            interval: Continuous on the line
      - name: SAP S/4HANA PP
        icon: erp
        summary: Production orders, material consumption and co-product yields.
        citations:
          - sap-s4
        category: ERP (Production Planning)
        what_it_is: Holds production orders, material consumption and co-product yields, tying the plant to procurement, inventory and finance.
        who_uses_it: Supply Chain Planning, Manufacturing Operations and Finance.
        data_out:
          batch:
            types:
              - structured
            volume: 10-50 GB/day
            interval: Nightly batch + hourly deltas
  - name: Quality & LIMS
    icon: gavel
    tiles:
      - name: LabWare LIMS
        icon: gavel
        summary: Stability, release and environmental monitoring assay results.
        citations:
          - labware
        category: Laboratory Information Management System (LIMS)
        what_it_is: Manages stability, release and environmental-monitoring assay results so QC testing gates batch release from one record.
        who_uses_it: Quality Control, Quality Assurance and Manufacturing Operations.
        data_out:
          batch:
            types:
              - structured
            volume: 1-8 GB/day
            interval: Nightly batch + result release
      - name: MasterControl QMS
        icon: gavel
        summary: Deviations, CAPA and change control tied to batches and sites.
        citations:
          - mastercontrol
        category: Quality Management System (QMS)
        what_it_is: Manages deviations, CAPA and change control tied to batches and sites, the quality system of record for GxP compliance.
        who_uses_it: Quality Assurance, Regulatory Affairs and Manufacturing Operations.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 0.5-3 GB/day
            interval: Nightly + event-driven
      - name: Veeva QualityDocs
        icon: product
        summary: Specifications, SOPs and approved label artwork.
        citations:
          - veeva-quality
        category: Quality Document / Content Management
        what_it_is: Controls specifications, SOPs and approved label artwork so the current, approved document governs every batch and submission.
        who_uses_it: Quality Assurance, Regulatory Affairs and Manufacturing Operations.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 0.2-1 GB/day
            interval: Nightly + on approval
  - name: Safety & Commercial
    icon: custlake
    tiles:
      - name: ArisGlobal LifeSphere
        icon: gavel
        summary: Individual case safety reports, signal detection and regulatory submissions.
        citations:
          - arisglobal
        category: Pharmacovigilance / Safety System
        what_it_is: Processes individual case safety reports, runs signal detection and drives regulatory safety submissions for marketed and investigational products.
        who_uses_it: Pharmacovigilance, Medical Affairs and Regulatory Affairs.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: 1-4 GB/day cases + narratives
            interval: Hourly / daily intake
      - name: IQVIA OCE
        icon: partner
        summary: Field force activity, sample accountability and call notes.
        citations:
          - iqvia-oce
        category: Life Sciences CRM / Commercial Engagement
        what_it_is: Captures field-force activity, sample accountability and call notes for commercial engagement with healthcare professionals.
        who_uses_it: Commercial Field, Sales Operations and Medical Affairs.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Nightly sync + intraday
      - name: Veeva CRM
        icon: custlake
        summary: HCP engagement, consent and medical inquiry workflows.
        citations:
          - veeva-crm
        category: Life Sciences CRM (HCP Engagement)
        what_it_is: Runs HCP engagement, consent and medical-inquiry workflows across field and medical teams for compliant omnichannel outreach.
        who_uses_it: Commercial Field, Medical Affairs and Compliance.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Nightly sync
          stream:
            types:
              - semi-structured
            volume: engagement events as they occur
            interval: Continuous CDC
      - name: Salesforce Life Sciences Cloud
        icon: custlake
        summary: Commercial CRM for field engagement, HCP and account management and market access, the go-to-market system of record for the commercial team.
        citations:
          - sf-lsc
        category: Life Sciences CRM (Commercial)
        what_it_is: Runs commercial field engagement, HCP and account management and market-access workflows, the go-to-market CRM emitting call, sample and engagement activity for the commercial organisation kept separate from medical.
        who_uses_it: Commercial Field, Sales Operations and Market Access teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Nightly sync + intraday
          stream:
            types:
              - semi-structured
            volume: engagement events as they occur
            interval: Continuous CDC
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Partner CMO Inventory
        icon: fed
        summary: Contract manufacturer batch status queried in place under Unity Catalog.
        category: Contract Manufacturer (CMO) Inventory System
        what_it_is: Batch status and inventory held at contract manufacturers, queried in place through federation rather than copied into the platform.
        who_uses_it: Supply Chain Planning, Manufacturing Operations and Quality Assurance.
        data_out:
          batch:
            types:
              - structured
            volume: GB-scale partner inventory
            interval: Queried on demand (federated)
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: CDISC SDTM / ADaM
        icon: api
        summary: Clinical datasets validated on ingest against CDISC standards before submission builds.
        citations:
          - cdisc
        category: Clinical Data Standards (CDISC)
        what_it_is: Clinical datasets validated on ingest against the SDTM and ADaM standards so submission builds start from conformant, traceable data.
        who_uses_it: Biostatistics, Clinical Data Management and Regulatory Affairs.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB per study
            interval: Per submission build
      - name: FDA FAERS Feeds
        icon: gavel
        summary: Public safety reference cases consumed inbound for signal triage.
        citations:
          - fda-faers
        category: Public Adverse-Event Database
        what_it_is: Public FDA adverse-event reports consumed inbound as a reference for signal triage and disproportionality benchmarking against the safety database.
        who_uses_it: Pharmacovigilance, Safety Signal Science and Medical Affairs.
        data_out:
          batch:
            types:
              - semi-structured
            volume: GBs (quarterly case files)
            interval: Quarterly reference releases
      - name: GS1 EPCIS Pharma
        icon: stream
        summary: Serialization and distribution events for DSCSA traceability.
        citations:
          - gs1-epcis
        category: Serialization / Track-and-Trace Standard (EPCIS)
        what_it_is: Serialization and distribution events in the EPCIS standard that give item-level traceability across the supply chain for DSCSA compliance.
        who_uses_it: Serialization & Distribution, Supply Chain Planning and Quality Assurance.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 100s-1000s of events/sec
            interval: Continuous (event)
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Biopharma Leaders
        mark: Genie One
        summary: The CEO on pipeline milestones and supply readiness; the CFO on inventory and write-offs when a pivotal trial reads out or a launch scales.
        uses:
          - - Genie One
            - Ask what enrollment pace is versus protocol without waiting on clinical ops.
          - - AI/BI
            - Enrollment, yield and safety on one certified set of Metric Views.
          - - Unity Catalog
            - Certification so "SAE" means one thing across safety and clinical.
        sub:
          - name: CEO
            cares: the pipeline milestones and whether supply is ready when a launch scales.
          - name: CFO & Treasury
            cares: inventory, write-offs and the capital a launch and its trials consume.
          - name: Chief Commercial Officer
            cares: launch uptake, country sequencing and revenue against forecast.
        ucs:
          - Enrollment Forecast
          - Demand & Supply
          - Safety Signal Detect
      - name: Clinical Operations
        mark: AI/BI
        summary: Study managers on enrollment versus plan, data quality and monitoring backlog, watching the protocol deviation rate before database lock.
        uses:
          - - Trial Command Centre
            - Site enrollment and query aging before database lock.
          - - AI/BI
            - Enrollment and protocol deviation on governed definitions.
          - - Genie One
            - Ask which sites are under-enrolling this month.
        sub:
          - name: Clinical Trial Managers
            cares: enrollment versus plan, site activation and monitoring backlog.
          - name: Clinical Data Management
            cares: query aging and data quality before database lock.
          - name: Clinical Supply
            cares: drug supply forecast against enrollment and protocol demand.
        ucs:
          - Enrollment Forecast
          - Protocol Deviation
          - Demand & Supply
      - name: Mfg & Supply
        mark: Lakehouse//RT
        summary: Plant and supply on batch release rate, yield and cold-chain integrity when a launch scales past the demand the supply plan forecast.
        uses:
          - - Batch Release Cockpit
            - Open deviations blocking release before ship.
          - - Lakehouse//RT
            - Line state at the latency a batch runs at.
          - - Model Serving
            - Yield models scored on historian and LIMS feeds.
        sub:
          - name: Manufacturing Operations
            cares: batch release rate and yield across the GMP suites.
          - name: Supply Chain Planning
            cares: launch supply, cold-chain lanes and shortage risk.
          - name: Serialization & Distribution
            cares: DSCSA trace and saleable returns across partners.
        ucs:
          - Yield Optimisation
          - Batch Genealogy
          - Cold Chain Integrity
          - Serialization Trace
      - name: Quality & Reg
        mark: Unity Catalog
        summary: QA and RA on deviations, submissions and inspection readiness, tracking batch release rate and CAPA aging before FDA and EMA audits.
        uses:
          - - Quality Command
            - CAPA aging and repeat deviations before audits.
          - - Unity Catalog
            - Lineage from batch record to submission annex.
          - - AI/BI
            - Release rate and deviation rate on certified Metric Views.
        sub:
          - name: Quality Assurance
            cares: deviations, CAPA aging and repeat findings before inspections.
          - name: Regulatory Affairs
            cares: submissions and inspection readiness across FDA and EMA.
          - name: Quality Control
            cares: release and stability testing turnaround from the LIMS.
        ucs:
          - Inspection Readiness
          - Batch Genealogy
          - Serialization Trace
      - name: Medical & Safety
        mark: Model Serving
        summary: Pharmacovigilance and medical affairs on safety narratives and scientific engagement, watching serious adverse event rates and signal timeliness, kept firewalled from commercial so medical stays non-promotional.
        uses:
          - - Safety Signal Hub
            - Emerging signals triaged before periodic reports.
          - - Model Serving
            - Disproportionality and signal models scored on case data.
          - - Apps
            - Medical inquiry workflows on governed data.
        sub:
          - name: Pharmacovigilance
            cares: adverse-event signals and SAE rates before periodic reports.
          - name: Medical Affairs
            cares: medical inquiries and non-promotional scientific engagement with HCPs.
          - name: Drug Safety Physician
            cares: causality, labeling impact and the benefit-risk narrative.
        ucs:
          - Safety Signal Detect
      - name: Commercial
        mark: CustomerLake
        summary: 'The go-to-market side: field force, sales operations and market access on HCP engagement, launch uptake and payer coverage, firewalled from medical so promotional activity stays compliant.'
        uses:
          - - CustomerLake
            - HCP segments and next-best-action without copying CRM elsewhere.
          - - Model Serving
            - Next-best-action and launch-uptake models scored into the field workflow.
          - - AI/BI
            - Launch uptake, coverage and field activity on certified Metric Views.
        sub:
          - name: Commercial Field
            cares: compliant outreach coverage and the next action per HCP.
          - name: Sales Operations
            cares: targeting, incentive compensation and field-force effectiveness.
          - name: Market Access
            cares: payer coverage, contracting and launch uptake by market.
        ucs:
          - HCP Engagement
          - Demand & Supply
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the EDC, LIMS, MES batch and safety-case feeds; own the Bronze to Silver path and the pager when a GxP pipeline breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for EDC, LIMS and MES sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on batch and safety-case feeds.
          - - Lakewatch
            - Freshness on the enrollment and release tables study teams read.
        sub:
          - name: Ingestion Engineering
            cares: the EDC, LIMS, MES and safety-case connectors and their freshness.
          - name: GxP Validation Engineering
            cares: validated pipelines and expectations that hold under audit.
          - name: Streaming Platform
            cares: cold-chain and packaging-line events landed at batch latency.
        ucs:
          - Batch Genealogy
          - Protocol Deviation
          - Cold Chain Integrity
      - name: Data Scientists
        mark: MLflow
        summary: Enrollment-forecast, yield, safety-signal and cold-chain models, and whether they still hold six months after deployment under GxP validation.
        uses:
          - - Feature Store
            - Historian and LIMS features read identically in training and serving.
          - - MLflow
            - Every enrollment and yield run tracked for audit and reproduction.
          - - Model Serving
            - Yield and signal models scored on historian and ICSR feeds.
        sub:
          - name: Clinical Modelling
            cares: enrollment-forecast and protocol-deviation models per site.
          - name: Manufacturing Modelling
            cares: yield and cold-chain models on historian and LIMS history.
          - name: Safety Signal Science
            cares: disproportionality and NLP models over ICSR and case text.
        ucs:
          - Enrollment Forecast
          - Yield Optimisation
          - Safety Signal Detect
      - name: App Developers
        mark: Apps
        summary: Ship the trial command, batch release and safety-signal applications clinical and quality teams work in, hosted next to governed GxP data.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for release-decision state and governed writes.
          - - Agent Bricks
            - Agents that draft a deviation summary against governed tools.
        sub:
          - name: Clinical & Safety Apps
            cares: the Trial Command Centre and Safety Signal Hub screens.
          - name: Quality & Release Apps
            cares: the Batch Release Cockpit and Quality Command workflows.
          - name: Commercial Apps
            cares: the HCP engagement and medical-inquiry screens over governed data.
        ucs:
          - Batch Genealogy
          - Safety Signal Detect
          - Inspection Readiness
          - HCP Engagement
consumers:
  - name: BI & Productivity
