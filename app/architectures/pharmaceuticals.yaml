      - name: Yield Optimisation
        short: Manufacturing
        icon: iot
        summary: Process parameters scored on yield using historian and LIMS history.
        problem: Batch yield swings with process parameters nobody can correlate in time, so investigations run weeks after a low-yield lot and the same loss repeats on the next campaign.
        who_benefits: Mfg & Supply
        how_built: Historian and LIMS history feed yield models in Feature Store and Model Serving, with runs tracked in MLflow, so process parameters are scored against yield before the next batch runs.
