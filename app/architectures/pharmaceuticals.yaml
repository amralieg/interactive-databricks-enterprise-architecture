      - name: Batch Genealogy
        short: Traceability
        icon: stream
        summary: Raw material to finished dose traced in minutes during quality holds.
        problem: When a quality hold hits, tracing raw-material lots to finished doses across MES, LIMS and ERP takes days of manual reconciliation, and every hour the batch sits is cost and supply risk.
        who_benefits: Mfg & Supply
        how_built: Batch records, LIMS results and material moves are conformed on Delta Lake under Unity Catalog, so genealogy from raw lot to finished dose resolves in minutes in the Batch Release Cockpit.
