agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Product & Growth Agent
        icon: genie
        summary: Ask about activation, engagement and retention across the product in plain language.
        feeds:
          - Segment CDP
          - Amplitude Analytics
          - Snowplow Behavioral
          - Conformed account, user, subscription
        teams:
          - Growth & Analytics
          - Exec & Product
          - Analytics Engineers
        questions:
          - What is activation rate by signup cohort this month?
          - Which features correlate most with 90-day retention?
          - Where in onboarding do free users most often stall?
          - Which accounts show rising engagement but no paid upgrade?
          - What is free-to-paid conversion by acquisition channel?
      - name: Revenue & Retention Agent
        icon: genie
        summary: Explore ARR, net revenue retention and churn across segments and cohorts.
        feeds:
          - Salesforce Sales Cloud
          - Stripe Billing
          - Zuora Billing
          - NRR, activation, health, margin
        teams:
          - Revenue & Sales
          - Finance & RevOps
          - Exec & Product
        questions:
          - What is net revenue retention by segment this quarter?
