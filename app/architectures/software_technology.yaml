  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Product Usage Analytics
        short: Product
        icon: chart
        summary: Feature adoption, funnels and engagement measured on one governed event stream so product, growth and finance read the same activity.
        problem: Product events sit in a CDP and three analytics tools that each define "active" differently, so no two teams agree on adoption or what actually drives retention.
        who_benefits: Growth & Analytics
        how_built: Segment and Snowplow events land through Lakeflow and are conformed to certified Metric Views; funnels and adoption are explored in AI/BI from the Growth Command Center.
        components:
          - Amplitude Analytics
          - Snowplow Behavioral
          - AI/BI
          - Growth Command Center
          - Unity Catalog
        stories:
          - title: Grammarly scales product analytics on Databricks
            url: https://www.databricks.com/customers/grammarly
          - title: Adobe brings creativity to life with data intelligence
            url: https://www.databricks.com/customers/adobe
      - name: PLG Activation
        short: Activation
        icon: zfunnel
        summary: Product-led onboarding and free-to-paid conversion, with the activation moment identified and nudged per account rather than left to chance.
        problem: Most self-serve signups never reach the activation moment, and the teams that could intervene find out weeks later from a dashboard instead of in the flow.
        who_benefits: Growth & Analytics
        how_built: Product events are scored against activation and conversion models in Model Serving; nudges are pushed back through Reverse ETL to CDP and the Growth Command Center on Lakehouse//RT.
        components:
          - Segment CDP
          - Model Serving
          - Reverse ETL to CDP
          - Growth Command Center
          - Lakehouse//RT
        stories:
          - title: Iterable activates lifecycle journeys on Databricks
            url: https://www.databricks.com/customers/iterable
          - title: Zapier powers real-time customer experiences
            url: https://www.databricks.com/customers/zapier
      - name: Churn & NRR Prediction
        short: Retention
        icon: people
        summary: Predicting churn and net revenue retention from product, support and billing signals so the save happens before the renewal, not at it.
        problem: Churn shows up in the renewal number when it is too late to act, while the leading signals sit unjoined across product usage, support tickets and billing.
        who_benefits: Exec & Product
        how_built: Usage, support and billing features feed churn and expansion models tracked in MLflow and scored in Model Serving; risk surfaces in the Customer Health Hub for the owning team.
        components:
          - Segment CDP
          - Model Serving
          - Feature Store
          - Customer Health Hub
          - MLflow
        stories:
          - title: SciPlay lifts retention with churn prediction
            url: https://www.databricks.com/customers/sciplay
          - title: SEGA Europe improves player retention with AI
            url: https://www.databricks.com/customers/sega
      - name: Usage-Based Billing
        short: Monetization
        icon: gauge
        summary: Metered consumption rated and reconciled to invoices before the close, so the company bills exactly what customers actually used.
        problem: Usage-based pricing leaks revenue when metering, rating and the invoice disagree, and the reconciliation of consumed to billed only surfaces after the period closes.
        who_benefits: Finance & RevOps
        how_built: Raw usage from the metering layer is conformed in the lakehouse, rated against the plan, and written back to billing from the Metering Console so invoices match consumption.
        components:
          - m3ter Metering
          - Stripe Billing
          - Usage to Billing
          - Metering Console
          - AI/BI
      - name: Customer Health Scoring
        short: Success
        icon: custlake
        summary: A single account health score composed from product, support and billing signals and routed to the CSM in the CRM they already work in.
        problem: Customer success works from gut feel and a stale spreadsheet because the signals of health live in product, support and billing systems that never meet.
        who_benefits: Revenue & Sales
        how_built: Health features are assembled in the Feature Store and scored in Model Serving; the score and its drivers are written back to Salesforce through CRM Health Writeback and shown in the Customer Health Hub.
        components:
          - Salesforce Sales Cloud
          - Model Serving
          - CRM Health Writeback
          - Customer Health Hub
          - Feature Store
        stories:
          - title: Calculate customer lifetime value on Databricks
            url: https://www.databricks.com/solutions/accelerators/customer-lifetime-value
      - name: GenAI Support Deflection
        short: Support
        icon: chat
        summary: A governed assistant that resolves common support questions from the product docs and ticket history, deflecting volume before it reaches an agent.
        problem: Support volume scales with the customer base, and the answers already exist in docs and past tickets, but agents re-solve the same questions by hand every day.
        who_benefits: Growth & Analytics
        how_built: Zendesk and Intercom history and product docs are governed in Unity Catalog and served to an Agent Bricks assistant with AI Functions and Model Serving, deflecting and summarising tickets.
        components:
          - Zendesk Support
          - Intercom
          - Agent Bricks
          - AI Functions
          - Model Serving
        stories:
          - title: Lumen reaches 35% ticket deflection with GenAI
            url: https://www.databricks.com/customers/lumen-technologies
          - title: Lippert improves customer support with Agent Bricks
            url: https://www.databricks.com/customers/lippert
      - name: Entitlement Telemetry
        short: Security
        icon: key
        summary: Access, permission and feature-entitlement events monitored for drift and abuse, so what a customer can reach always matches what they bought.
        problem: Entitlements drift as plans change and integrations proliferate, and access anomalies hide in event logs no one joins to the contract or the customer record.
        who_benefits: Platform & Security
        how_built: Access and permission events stream into Lakehouse//RT; anomaly models in Model Serving flag drift and abuse, and corrected limits are pushed back through Entitlement Sync under Unity Catalog.
        components:
          - Kafka Event Streams
          - Lakehouse//RT
          - Entitlement Sync
          - Model Serving
          - Unity Catalog
      - name: Experimentation & A/B
        short: Experiments
        icon: ztarget
        summary: A/B and feature-flag experiments read out on one governed metric definition, so product ships on evidence rather than the loudest opinion.
        problem: Experiment readouts disagree with the analytics tool and with finance because each computes the metric its own way, so results are argued rather than trusted.
        who_benefits: Growth & Analytics
        how_built: Exposure and outcome events are conformed to certified Metric Views; experiments are analysed in AI/BI with runs tracked in MLflow and surfaced from the Growth Command Center.
        components:
          - Amplitude Analytics
          - AI/BI
          - MLflow
          - Growth Command Center
          - Unity Catalog
        stories:
          - title: Statsig runs experimentation at scale on Databricks
            url: https://www.databricks.com/customers/statsig
      - name: Sales Pipeline Forecast
        short: Forecast
        icon: market
        summary: Pipeline coverage and win-rate forecast enriched with product-usage and conversation signals, so the number reflects what the installed base is doing.
        problem: The forecast is a rep-entered guess disconnected from how accounts actually use the product, so coverage looks healthy right up until the quarter misses.
        who_benefits: Revenue & Sales
        how_built: Salesforce pipeline and Gong conversation data are conformed and scored for win and expansion propensity in Model Serving; coverage and slip are read in the Revenue Cockpit on AI/BI.
        components:
          - Salesforce Sales Cloud
          - Gong Revenue AI
          - Model Serving
          - Revenue Cockpit
          - AI/BI
        stories:
          - title: Sales forecasting and attribution solution accelerator
            url: https://www.databricks.com/solutions/accelerators/sales-forecasting
      - name: Cloud COGS & Margin
        short: Margin
        icon: zcloudgear
        summary: Cloud cost of goods allocated to product and customer so gross margin is known per account, not just at the company level.
        problem: Cloud spend is the largest line in COGS but lands as one undifferentiated bill, so no one can say which product or customer is actually margin-positive.
        who_benefits: Finance & RevOps
        how_built: FOCUS-format cost exports are joined to usage and the customer hierarchy in the lakehouse; margin by product and account is served in AI/BI and the Metering Console under one definition.
        components:
          - FinOps Cost Exports
          - AI/BI
          - Cloud Warehouse Marts
          - Metering Console
          - Unity Catalog
medallion:
  Bronze:
    short: Raw product and billing events
    summary: Product telemetry from the CDP and behavioural stack, Stripe and Zuora billing and metering records, CRM opportunities, support tickets and Git and CI events, landed exactly as received so a usage spike or an invoice can always be replayed as it stood.
  Silver:
    short: Conformed account, user, subscription
    summary: Accounts, users, subscriptions and product entities resolved into single conformed entities across the CRM, billing and telemetry estates, with anonymous device ids stitched to known users and free and paid workspaces reconciled to one customer hierarchy.
  Gold:
    short: NRR, activation, health, margin
    summary: 'Contracted products the revenue and product teams run on: net revenue retention and churn by cohort, PLG activation and conversion funnels, customer health scores, usage-based revenue and metering accuracy, and cloud cost of goods and gross margin by product.'
