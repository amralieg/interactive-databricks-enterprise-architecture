pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Exec & Product
        mark: Genie One
        summary: The CEO on growth, net revenue retention and the path to profitable scale; the Chief Product Officer on activation, engagement and the roadmap that actually moves retention.
        uses:
          - - Genie One
            - Ask what this month's NRR was by segment, or which features drive retention, without booking analyst time.
          - - AI/BI
            - ARR, NRR, activation and engagement on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the business glossary, so "active" and "retained" mean one thing across the company.
        sub:
          - name: CEO
            cares: growth, net revenue retention and the path to profitable scale.
          - name: Chief Product Officer
            cares: activation, engagement and the roadmap that moves retention.
        ucs:
          - Product Usage Analytics
          - Churn & NRR Prediction
          - PLG Activation
          - Cloud COGS & Margin
      - name: Revenue & Sales
        mark: Model Serving
        summary: The Chief Revenue Officer on pipeline coverage and win rate; sales leadership on forecast accuracy and expansion in the installed base; RevOps on territory, quota and the accuracy of the number.
        uses:
          - - Revenue Cockpit
            - Coverage, slip and win-rate on the same numbers the board sees.
          - - Model Serving
            - Win-propensity and expansion-likelihood scored inside the CRM path.
          - - AI/BI
            - Forecast, coverage and net expansion on governed pipeline data.
        sub:
          - name: Chief Revenue Officer
            cares: pipeline coverage, win rate and net expansion.
          - name: Sales leadership
            cares: forecast accuracy and expansion in the installed base.
          - name: RevOps
            cares: territory, quota and the accuracy of the number.
        ucs:
          - Sales Pipeline Forecast
          - Customer Health Scoring
          - Usage-Based Billing
      - name: Finance & RevOps
        mark: AI/BI
        summary: The CFO on gross margin, cash and the efficiency of growth; RevOps and finance on usage-based revenue recognition, metering accuracy and the reconciliation of billed to consumed.
        uses:
          - - AI/BI
            - Margin, the ARR bridge and cash efficiency on certified Metric Views.
          - - Metering Console
            - Metered consumption reconciled to invoices before the close.
          - - Genie One
            - Ask which accounts are under-billed this month without a finance pull.
        sub:
          - name: CFO
            cares: gross margin, cash and the efficiency of growth.
          - name: RevOps & billing
            cares: usage-based revenue, metering accuracy and billed-to-consumed.
        ucs:
          - Usage-Based Billing
          - Cloud COGS & Margin
          - Sales Pipeline Forecast
      - name: Growth & Analytics
        mark: Lakehouse//RT
        summary: Growth teams on activation, conversion and expansion loops; product analytics on funnels, feature adoption and experiment readouts; lifecycle marketing on onboarding and reactivation.
        uses:
          - - Growth Command Center
            - Onboarding funnels and activation nudges scored per account.
          - - AI/BI
            - A/B readouts on governed event data with one metric definition.
          - - Lakehouse//RT
            - Live product state at the latency an onboarding flow moves at.
        sub:
          - name: Growth
            cares: activation, free-to-paid conversion and expansion loops.
          - name: Product analytics
            cares: funnels, feature adoption and experiment readouts.
          - name: Lifecycle marketing
            cares: onboarding, reactivation and in-product messaging.
        ucs:
          - PLG Activation
          - Product Usage Analytics
          - Experimentation & A/B
          - GenAI Support Deflection
      - name: Platform & Security
        mark: Lakeflow
        summary: The CTO on developer velocity and reliability; platform engineering on the pipelines and the golden signals; the security and trust team on entitlement drift and access telemetry.
        uses:
          - - Lakeflow
            - Product, billing and telemetry feeds conformed for analytics.
          - - Entitlement Sync
            - Access and permission events monitored for drift and abuse.
          - - MLflow
            - Reliability and anomaly models tracked for audit and reproduction.
        sub:
          - name: CTO
            cares: developer velocity, reliability and platform cost.
          - name: Platform engineering
            cares: the pipelines, golden signals and incident response.
          - name: Security & trust
            cares: entitlement drift, access telemetry and abuse.
        ucs:
          - Entitlement Telemetry
          - Churn & NRR Prediction
          - Product Usage Analytics
  - name: Technical
    icon: code
    tiles:
      - name: Platform & Data Eng
        mark: Lakeflow
        summary: Land the CRM, billing, telemetry and Git feeds with Fivetran, Airbyte and Kafka; run dbt and Airflow on the Bronze to Silver path; own the pager when the activation and revenue tables stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for Salesforce, Stripe and SaaS telemetry sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on event and billing feeds.
          - - Lakewatch
            - Freshness on the activation and revenue tables the business reads every morning.
        sub:
          - name: Ingestion engineers
            cares: CRM, billing and telemetry feeds into Bronze.
          - name: Streaming engineers
            cares: Kafka product and usage events into Lakehouse//RT.
          - name: Platform & governance
            cares: Unity Catalog permissions and the pipeline SLAs.
        ucs:
          - Product Usage Analytics
          - Usage-Based Billing
          - Entitlement Telemetry
      - name: Applied ML Scientists
        mark: MLflow
        summary: Churn, expansion, propensity and support-deflection models built in Python with PyTorch, scikit-learn and Hugging Face, and whether they still hold once pricing, packaging and the product change.
        uses:
          - - Feature Store
            - Account and usage features read identically in training and serving.
          - - MLflow
            - Every churn and experiment run tracked for audit and reproduction.
          - - Model Serving
            - Propensity and deflection models scored in the product and CRM path.
        sub:
          - name: Growth & churn modelers
            cares: activation, conversion and churn-risk models.
          - name: Applied GenAI
            cares: support-deflection and copilot agents on governed data.
          - name: MLOps
            cares: tracking and serving models in the operational path.
        ucs:
          - Churn & NRR Prediction
          - Sales Pipeline Forecast
          - GenAI Support Deflection
      - name: Analytics Engineers
        mark: AI/BI
        summary: Model the semantic layer in dbt and serve it to Looker, Hex and Mode; own the metric definitions behind NRR, activation and margin so every team reads the same number.
        uses:
          - - AI/BI
            - Certified Metric Views for NRR, activation and gross margin.
          - - Genie One
            - Natural-language answers over the governed semantic layer.
          - - Unity Catalog
            - One definition of active, retained and billed across the stack.
        sub:
          - name: Metrics engineers
            cares: the NRR, activation and margin definitions.
          - name: BI & enablement
            cares: self-serve dashboards and Genie for the business teams.
        ucs:
          - Product Usage Analytics
          - Cloud COGS & Margin
          - Customer Health Scoring
