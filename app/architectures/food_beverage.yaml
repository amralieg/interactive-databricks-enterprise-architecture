          - title: 'Agents for production lines: trusted decisions in real time'
            url: https://www.databricks.com/blog/agents-production-lines-trusted-decisions-real-time
      - name: Sustainable Sourcing
        short: ESG
        icon: globe
        summary: Ingredient provenance and carbon intensity traced from farm through finished goods.
        problem: Ingredient provenance and carbon intensity sit in disconnected spreadsheets, so scope-3 and sourcing claims cannot be traced from farm to finished goods when a buyer or regulator asks.
        who_benefits: CEO & COO
        how_built: Supplier, ERP and commodity data are conformed into governed data products under Unity Catalog and shared to partners and auditors over OpenSharing with lineage intact.
