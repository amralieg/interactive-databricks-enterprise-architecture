          - title: How Dow built a carbon footprint ledger to accelerate sustainability at scale
            url: https://www.databricks.com/blog/how-dow-built-carbon-footprint-ledger-databricks-accelerate-sustainability-scale
      - name: Co-pack Visibility
        short: Network
        icon: partner
        summary: Third-party production status and inventory reconciled without manual spreadsheet chases.
        problem: Third-party production status and inventory at co-packers arrive by email and spreadsheet, so planners chase batch and stock positions by hand and the network view is always stale.
