          - title: Scaling supply chain AI with Databricks Apps
            url: https://www.databricks.com/customers/a2go/databricks-apps
      - name: OEE & Downtime
        short: Operations
        icon: chart
        summary: Top loss categories by line and shift with root cause tied to MES reason codes.
        problem: OEE is stitched together from spreadsheets and unlogged stoppages, so the dashboard number hides the real losses and the top downtime causes stay invisible by line and shift.
        who_benefits: Plant Operations
        how_built: Filler, MES and downtime feeds land in Lakehouse//RT and roll up into governed OEE Metric Views in AI/BI, with Genie answering loss questions by line and shift.
        components:
          - Rockwell FactoryTalk
          - Siemens Opcenter MES
          - Lakehouse//RT
          - AI/BI
          - Genie
        stories:
