          - Model Serving
          - AI/BI
          - Delta Lake
      - name: Workforce Safety
        short: HSE
        icon: gavel
        summary: Incident, permit and barrier signals surfaced so unsafe conditions are caught early.
        problem: Safety signals live across permit-to-work, incident and barrier systems, so leading indicators of an unsafe condition are only connected after an incident when the investigation reconstructs them.
        who_benefits: HSE & Compliance
        how_built: Permit, incident and barrier data conform under Unity Catalog on Delta Lake, and leading-indicator models scored in Model Serving surface unsafe trends for the team on the HSE Dashboard.
        components:
          - HSE Dashboard
          - Sphera Risk Mgmt
          - Model Serving
          - Unity Catalog
          - Delta Lake
      - name: Regulatory Compliance
        short: Regulatory
        icon: erp
        summary: Permit limits and evidence assembled from governed data before an inspection.
        problem: Regulatory evidence is stitched from extracts and spreadsheets at inspection time, so permit limits and the trail behind a filing are hard to trace from source to submission when a regulator asks.
        who_benefits: HSE & Compliance
        how_built: Permit, emissions and production data conform under Unity Catalog on Delta Lake, giving one auditable lineage from source to filing surfaced for compliance on the HSE Dashboard.
        components:
          - HSE Dashboard
          - Enablon EHS
          - SAP IS-Oil
          - Unity Catalog
          - Delta Lake
      - name: Emissions & Flaring
        short: Sustainability
        icon: observ
        summary: Flare, vent and leak volumes filed from governed historian lineage.
        problem: Regulatory greenhouse filings are stitched from historian extracts and spreadsheets, so flare, vent and leak volumes are hard to trace from sensor to submission when a regulator asks.
        who_benefits: HSE & Compliance
        how_built: Flare and emissions events conform on Delta Lake against EPA GHGRP layouts under Unity Catalog, and optical-gas detections scored in Model Serving give one auditable lineage on the HSE Dashboard.
