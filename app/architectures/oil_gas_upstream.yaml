agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Production Optimization Agent
        icon: genie
        summary: Ask about net production, deferment, artificial lift and well surveillance across assets in plain language.
        feeds:
          - AVEVA PI System
          - SLB OFM
          - Emerson Zedi
          - Conformed well, cargo
        teams:
          - Field & Production Operations
          - Subsurface & Reservoir
          - Production Engineer
        questions:
          - What was net production by asset yesterday versus plan?
          - Which wells are deferring the most volume right now, and why?
          - Which lifted wells are running off their optimum setpoint today?
          - How much production is at risk from the current open alarms?
          - What is our hydrocarbon loss rate by asset this quarter?
      - name: Asset Reliability Agent
        icon: genie
        summary: Explore rotating-equipment health, predicted failures and maintenance backlog across facilities.
        feeds:
          - AVEVA PI System
          - IBM Maximo
          - Sphera Risk Mgmt
          - Conformed well, cargo
        teams:
          - Field & Production Operations
          - Reliability Engineer
          - Maintenance Planner
        questions:
          - Which compressors and ESPs are trending toward failure this month?
          - What is the maintenance backlog by facility and asset class?
          - Which assets have the worst uptime this quarter?
          - How much deferred production traces back to equipment trips?
          - Which work orders are overdue against their planned window?
      - name: Crude Marketing Agent
        icon: genie
        summary: Answer questions on netback, exposure, hedge effectiveness and materials supply.
        feeds:
          - ION Openlink Endur
          - Platts Price Assess
          - SAP IS-Oil
          - Production, margin, loss
        teams:
          - Commercial & Supply
          - Risk & Middle Office
          - Corporate & Asset Leaders
        questions:
          - What is our crude netback by stream today?
          - Which desks are closest to their exposure limits right now?
          - How effective are our current hedges against benchmark moves?
          - What is unit lifting cost by asset this month?
          - Which materials are at risk of stocking out before planned work?
      - name: HSE & Emissions Agent
        icon: genie
        summary: Ask about emissions, flare volumes, permits and safety incidents across facilities.
        feeds:
          - Enablon EHS
          - Sphera Risk Mgmt
          - FLIR Optical Gas Img
          - EPA GHGRP Templates
        teams:
          - HSE & Compliance
          - Environmental & Emissions
          - Process Safety
        questions:
          - What are our flare and vent volumes by facility this month?
          - Which permits are closest to their limit right now?
          - How many leaks were detected and how many are still open?
          - What is our TRIR trend across the portfolio this year?
          - Which facilities are driving the most greenhouse-gas emissions?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Well Production Surveillance
        short: Production
        icon: iot
        summary: Well and flow anomalies caught from telemetry before they show up as lost barrels.
        problem: Under-performing wells and flow problems show up in daily reports long after production is lost, and downhole and separator signals sit in historians nobody joins to the well test picture.
        who_benefits: Field & Production Operations
        how_built: Wellhead and separator tags land in Lakehouse//RT beside well tests, then surveillance and anomaly models scored in Model Serving surface the deferment on the Production Control screen.
        components:
          - Production Control
          - AVEVA PI System
          - SLB OFM
          - Lakehouse//RT
          - Model Serving
        stories:
          - title: Devon Energy reimagines analytics and ML for oil & gas exploration
            url: https://www.databricks.com/customers/devon-energy
          - title: ARC Resources optimises drilling performance with real-time data
            url: https://www.databricks.com/blog/2022/05/24/arc-uses-a-lakehouse-architecture-for-real-time-data-insights-that-optimize-drilling-performance-and-lower-carbon-emissions.html
      - name: Artificial Lift Optimization
        short: Production
        icon: gauge
        summary: ESP, gas-lift and plunger setpoints tuned to lift more barrels at less energy.
        problem: Artificial-lift setpoints are tuned by hand on rounds, so wells run off their optimum and lift energy and failures climb between visits while the telemetry that would guide them goes unused.
        who_benefits: Field & Production Operations
        how_built: Lift and telemetry tags stream into Lakehouse//RT and feed lift-optimisation models tracked in MLflow and scored in Model Serving, writing approved setpoints back through the Production Control screen.
