            url: https://www.databricks.com/blog/pipeline-flow-monitoring
medallion:
  Bronze:
    short: Raw field and market
    summary: SCADA and historian tags, well test results, seismic and log volumes, work orders and deal capture tickets, landed exactly as received so a barrel or a pressure reading can always be replayed as it stood.
  Silver:
    short: Conformed well, cargo
    summary: Wells, facilities, reservoirs and cargoes resolved into single conformed entities across production, subsurface and commercial systems, with allocation balances reconciled and reservoir models stitched to actual production.
  Gold:
    short: Production, margin, loss
    summary: 'Contracted products operations and marketing run on: net production and uptime, unit lifting cost, crude netback and hydrocarbon loss rates.'
