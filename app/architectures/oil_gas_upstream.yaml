name: Oil & Gas Upstream
description: 'Exploration and production operators: subsurface and seismic interpretation, reservoir management, well and facility telemetry, artificial-lift and rotating-equipment reliability, materials planning, crude marketing and emissions reporting across operated and non-operated assets.'
sources:
  - name: Well & Field SCADA
    icon: iot
    tiles:
      - name: AVEVA PI System
        icon: iot
        summary: Wellhead pressures, separator flow rates and ESP and compressor tags from field historians.
        citations:
          - aveva-pi
        category: Process/Time-Series Historian
        what_it_is: Stores high-frequency wellhead, separator, artificial-lift and compressor tags from producing fields as the operational time-series system of record.
        who_uses_it: Production engineers, facility operators and reliability engineers.
        data_out:
          batch:
            types:
              - structured
            volume: 20-80 GB/day tag history
            interval: Hourly / daily aggregates
          stream:
            types:
              - semi-structured
            volume: 50-500k tags/sec at peak
            interval: Continuous (sub-second sampling)
      - name: SLB OFM
        icon: stream
        summary: Well tests, decline curves and surveillance data the production and reservoir teams maintain.
        citations:
          - slb-ofm
        category: Production/Well Surveillance System
        what_it_is: Captures well tests, decline curves and well surveillance data used to model and forecast well and field performance.
        who_uses_it: Reservoir engineers, production engineers and subsurface geologists.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Daily well tests + periodic model updates
      - name: Emerson Zedi
        icon: gauge
        summary: Remote well telemetry, plunger-lift cycles and tank levels from unmanned and remote sites.
        citations:
          - emerson-zedi
        category: Oilfield SCADA & Production Monitoring
        what_it_is: Collects remote well telemetry, plunger and gas-lift cycles and tank levels from unmanned and marginal well sites over field radio and cellular links.
        who_uses_it: Field operators, production technicians and remote operations centres.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 5-40k tags/sec
            interval: Continuous (near real-time)
  - name: Subsurface & Geoscience
    icon: globe
    tiles:
      - name: SLB Petrel
        icon: network
        summary: Seismic volumes, interpreted horizons and static and dynamic reservoir models.
        citations:
          - slb-petrel
        category: Subsurface Interpretation & Modelling
        what_it_is: Holds seismic volumes, interpreted horizons, well logs and the static and dynamic reservoir models the subsurface team builds for field development.
        who_uses_it: Geophysicists, geologists and reservoir engineers.
        data_out:
          batch:
            types:
              - unstructured
              - structured
            volume: 100s of GB-TB per survey
            interval: Per-survey + periodic model updates
      - name: Esri ArcGIS
        icon: globe
        summary: Well locations, lease boundaries, pipelines and facility layers on a spatial system of record.
        citations:
          - esri-arcgis
        category: Geographic Information System (GIS)
        what_it_is: Maintains well locations, lease and licence boundaries, gathering lines and facility layers as the operator spatial system of record.
        who_uses_it: Land teams, facilities engineering and field operations.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs of spatial layers
            interval: On change + periodic refresh
  - name: Enterprise & Assets
    icon: erp
    tiles:
      - name: SAP S/4HANA
        icon: erp
        summary: Finance postings, materials master and cost objects for the producing organisation.
        citations:
          - sap-s4
        category: Enterprise Resource Planning (ERP)
        what_it_is: Runs finance postings, the materials master, cost objects and purchasing that back office and operations transact on.
        who_uses_it: Finance, materials management and cost controllers.
        data_out:
          batch:
            types:
              - structured
            volume: 10-50 GB/day
            interval: Nightly batch + hourly deltas
      - name: IBM Maximo
        icon: gauge
        summary: Asset registers, work orders and maintenance history for wells, facilities and rotating equipment.
        citations:
          - ibm-maximo
        category: Enterprise Asset Management (EAM)
        what_it_is: Manages asset registers, preventive and corrective work orders and maintenance history for wells, facilities and rotating equipment.
        who_uses_it: Maintenance planners, reliability engineers and facility operations.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day work orders
            interval: Hourly / event-driven
      - name: SAP Ariba
        icon: sheet
        summary: Requisitions, supplier catalogues and materials sourcing for field operations.
        citations:
          - sap-ariba
        category: Procurement & Supply Management
        what_it_is: Handles requisitions, supplier catalogues, sourcing events and materials commitments that keep field operations supplied.
        who_uses_it: Procurement, materials planning and supply chain teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Continuous + nightly batch
  - name: Commercial & Accounting
    icon: market
    tiles:
      - name: ION Openlink Endur
        icon: market
        summary: Physical crude and gas deals, hedges and mark-to-market for the marketing desk.
        citations:
          - ion-endur
        category: Energy Trading & Risk Management (ETRM)
        what_it_is: Captures physical and paper crude and gas deals, hedges and mark-to-market for the marketing and risk desks.
        who_uses_it: Crude and gas marketers, middle office and risk teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day deals + positions
            interval: Intraday + end-of-day marks
      - name: SAP IS-Oil
        icon: erp
        summary: Joint-venture allocations, production accounting and royalty and severance postings.
        citations:
          - sap-is-oil
        category: Hydrocarbon Accounting ERP
        what_it_is: Runs joint-venture allocations, production accounting and royalty and severance postings on the industry-specific SAP oil and gas core.
        who_uses_it: Production accounting, joint-venture accounting and Finance.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Nightly batch + monthly close
      - name: Platts Price Assess
        icon: chart
        summary: Benchmark curves and differential indices the marketing desk marks to.
        citations:
          - platts
        category: Commodity Price Benchmark Provider
        what_it_is: Supplies benchmark price assessments, curves and differential indices the marketing and risk desks mark physical and paper positions to.
        who_uses_it: Crude marketing, supply analysts and risk teams.
        data_out:
          batch:
            types:
              - structured
            volume: MBs-GBs reference data
            interval: Daily assessment publication
  - name: Safety & Environment
    icon: gavel
    tiles:
      - name: Sphera Risk Mgmt
        icon: gavel
        summary: Process safety, management-of-change and incident investigations tied to facilities.
        citations:
          - sphera
        category: Process Safety & Operational Risk Platform
        what_it_is: Manages process safety, management-of-change and incident investigations tied to facilities and barriers.
        who_uses_it: Process safety, HSE and integrity engineers.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.5-2 GB/day cases + events
            interval: Hourly / daily
      - name: Enablon EHS
        icon: observ
        summary: Emissions events, flare logs and regulatory permit limits.
        citations:
          - enablon
        category: EHS & Emissions Management System
        what_it_is: Records emissions events, flare and vent logs and regulatory permit limits for environmental compliance.
        who_uses_it: Environmental and emissions teams and Regulatory compliance.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day events + logs
            interval: Hourly / daily
      - name: FLIR Optical Gas Img
        icon: iot
        summary: Leak detection surveys and repair verification imagery from field campaigns.
        category: Optical Gas Imaging / Leak Detection
        what_it_is: Produces optical-gas imaging surveys and repair-verification imagery used to detect and confirm fugitive hydrocarbon leaks at well pads and facilities.
        who_uses_it: LDAR survey crews, integrity and environmental teams.
        data_out:
          batch:
            types:
              - unstructured
            volume: 10s-100s of GB/survey
            interval: Per-survey (periodic campaigns)
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Corporate Treasury Mart
        icon: fed
        summary: Hedge effectiveness and working-capital marts queried in place under Unity Catalog.
        category: Enterprise Data Warehouse
        what_it_is: Corporate treasury hedge-effectiveness and working-capital marts kept in the incumbent warehouse and queried in place through federation rather than copied.
        who_uses_it: Treasury, Finance and Risk analysts.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: OPC-UA Well Gateway
        icon: iot
        summary: Field protocol bridges normalising RTU and PLC well telemetry on ingest before historian landing.
        citations:
          - opc-ua
        category: OT Protocol Gateway
        what_it_is: Bridges field OPC-UA, RTU and PLC protocols and normalises well and facility telemetry on ingest before historian landing.
        who_uses_it: Controls engineers, OT/IT integration and Streaming data engineers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 5-40k tags/sec
            interval: Continuous OT telemetry
      - name: EPA GHGRP Templates
        icon: gavel
        summary: Greenhouse gas reporting layouts validated on ingest before filing windows.
        citations:
          - epa-ghgrp
        category: Regulatory Reporting Schema
        what_it_is: Greenhouse-gas reporting layouts and factors validated on ingest so emissions data conforms before filing windows.
        who_uses_it: Environmental reporting and Regulatory compliance teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: MBs (templates + factors)
            interval: Annual + periodic updates
      - name: Weather & Metocean Data
        icon: stream
        summary: Storm and swell feeds for offshore production and field scheduling.
        category: Weather & Metocean Provider
        what_it_is: Storm, wind and swell forecasts used to plan offshore production, drilling and field logistics around weather windows.
        who_uses_it: Offshore operations, drilling and HSE teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs/day gridded forecasts
            interval: Multiple forecast cycles daily
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Corporate & Asset Leaders
        mark: Genie One
        summary: The CEO on net production and reserves; the CFO on hedge exposure and unit lifting cost when crude and gas benchmarks move.
        uses:
          - - Genie One
            - Ask what yesterday net production was by asset without waiting on operations reporting.
          - - AI/BI
            - Production, cost and reserves on one certified set of Metric Views.
          - - Unity Catalog
            - Certification so production means one thing across SCADA and accounting.
        sub:
          - name: CEO
            cares: net production, reserves replacement and the trade between growth and the energy transition.
          - name: CFO & Treasury
            cares: unit lifting cost, hedge exposure and working capital as crude and gas benchmarks move.
          - name: Chief Operating Officer
            cares: asset uptime, hydrocarbon loss and the HSE and compliance record across the portfolio.
        ucs:
          - Reservoir Management
          - Crude Marketing & Trading
          - Emissions & Flaring
      - name: Field & Production Operations
        mark: Lakehouse//RT
        summary: Field superintendents on well uptime, deferment volume and artificial lift when alarms spike, protecting net production and hydrocarbon loss rate.
        uses:
          - - Production Control
            - Deferment pareto and well ranking before the morning call.
          - - Lakehouse//RT
            - Live SCADA state at the latency a trip occurs at.
          - - AI/BI
            - Uptime and loss on governed definitions.
        sub:
          - name: Field Superintendent
            cares: well uptime, deferment volume and the morning production call.
          - name: Production Engineer
            cares: artificial lift, decline and the interventions that recover barrels.
          - name: Reliability Engineer
            cares: rotating-equipment health and the failures that defer production.
        ucs:
          - Well Production Surveillance
          - Artificial Lift Optimization
          - Rotating Equipment Health
      - name: Subsurface & Reservoir
        mark: AI/BI
        summary: Geoscience and reservoir teams on seismic interpretation, well tests and depletion, reconciling models to actual production before booking.
        uses:
          - - Reservoir Workbench
            - Interpreted horizons and simulation runs beside actual production.
          - - AI/BI
            - Depletion and recovery on governed definitions.
          - - Genie One
            - Ask which wells are diverging from the reservoir forecast.
        sub:
          - name: Geophysicist
            cares: seismic interpretation and the structural picture behind the field.
          - name: Reservoir Engineer
            cares: depletion, recovery factor and the models reconciled to production.
          - name: Production Geologist
            cares: well placement and the correlation between logs and performance.
        ucs:
          - Reservoir Management
          - Seismic Interpretation
          - Well Production Surveillance
      - name: Commercial & Supply
        mark: Model Serving
        summary: Crude marketing and materials teams on netback, hedge exposure and keeping rigs and facilities supplied without over-committing working capital.
        uses:
          - - Trading Workbench
            - Physical and paper positions marked consistently.
          - - Model Serving
            - Netback and materials-demand models scored on live plans.
          - - Unity Catalog
            - One barrel and one material definition across ops and finance.
        sub:
          - name: Crude & Gas Marketing
            cares: netback, benchmark differentials and the marks the desk carries.
          - name: Risk & Middle Office
            cares: exposure limits, mark-to-market and hedge effectiveness across the book.
          - name: Materials & Procurement
            cares: supplier lead times and the materials that keep field work on schedule.
        ucs:
          - Crude Marketing & Trading
          - Materials & Supply Planning
      - name: HSE & Compliance
        mark: Unity Catalog
        summary: Process safety and environmental teams on emissions, permits and incident trends, tracked on TRIR and flare volumes before regulator inspections.
        uses:
          - - HSE Dashboard
            - Flare and leak trends before regulator inspections.
          - - Unity Catalog
            - Lineage from sensor to regulatory filing.
          - - AI/BI
            - TRIR and emissions on governed definitions.
        sub:
          - name: Process Safety
            cares: management-of-change, incident trends and the barriers behind a safe envelope.
          - name: Environmental & Emissions
            cares: flare, vent and greenhouse filings from governed sensor lineage.
          - name: Regulatory Compliance
            cares: permit limits and the evidence trail before regulator inspections.
        ucs:
          - Workforce Safety
          - Regulatory Compliance
          - Emissions & Flaring
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the SCADA, well test, EAM and deal-capture feeds; own the Bronze to Silver path and the pager when a field pipeline breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for historian, SAP and ETRM sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on SCADA and allocation feeds.
          - - Lakewatch
            - Freshness on the production and emissions tables operations reads.
        sub:
          - name: Historian & SCADA Eng
            cares: high-volume tag ingestion from PI and field SCADA into governed tables.
          - name: Pipeline Reliability
            cares: the Bronze to Silver path and the pager when a field feed breaks.
          - name: Accounting & EAM Eng
            cares: allocation, work-order and royalty feeds landed for finance and reliability.
        ucs:
          - Well Production Surveillance
          - Rotating Equipment Health
          - Regulatory Compliance
      - name: Data Scientists
        mark: MLflow
        summary: Well-decline, lift-optimisation, seismic-interpretation and equipment-failure models, and whether they still hold six months after deployment across assets.
        uses:
          - - Feature Store
            - Historian and test features read identically in training and serving.
          - - MLflow
            - Every decline and reservoir run tracked for audit and reproduction.
          - - Model Serving
            - Optimisation and failure models scored in the operational path.
        sub:
          - name: Production DS
            cares: well-decline, lift and rate-transient models against historian data.
          - name: Subsurface DS
            cares: seismic-interpretation and reservoir models across the field.
          - name: Reliability DS
            cares: equipment-failure and remaining-life models and whether they still hold.
        ucs:
          - Artificial Lift Optimization
          - Seismic Interpretation
          - Reservoir Management
          - Rotating Equipment Health
      - name: App Developers
        mark: Apps
        summary: Ship the production control, reservoir and marketing applications field and desk teams work in, hosted next to governed asset data.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for well and materials state and governed writes.
          - - Agent Bricks
            - Agents that draft a deferment response against governed tools.
        sub:
          - name: Operations App Dev
            cares: production control and reservoir screens field and subsurface teams work in.
          - name: Marketing App Dev
            cares: the exposure and netback surfaces the commercial desk marks books on.
          - name: Writeback & Integration
            cares: setpoint and requisition writeback into SCADA and procurement systems.
        ucs:
          - Well Production Surveillance
          - Materials & Supply Planning
          - Crude Marketing & Trading
