      - name: Crude Marketing & Trading
        short: Commercial
        icon: market
        summary: Physical and hedge books reconciled before exposure limits breach.
        problem: Physical deals, paper hedges and benchmark curves are marked in different tools, so the desk sees exposure late and a limit breach surfaces only after the position has moved.
        who_benefits: Commercial & Supply
        how_built: Deal capture and price feeds conform under Unity Catalog, netback and mark-to-market models scored in Model Serving mark books consistently, and the desk works exposure from the Trading Workbench.
