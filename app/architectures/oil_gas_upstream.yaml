      - name: Rotating Equipment Health
        short: Reliability
        icon: stream
        summary: Compressor and pump failures predicted before production is deferred.
        problem: A compressor, pump or ESP failure defers production for hours, yet failures are found after the unit stops rather than predicted from the sensor drift that preceded them.
        who_benefits: Field & Production Operations
        how_built: Historian tags stream into Lakehouse//RT and feed remaining-life and anomaly models tracked in MLflow and scored in Model Serving, raising work orders on the Production Control screen.
        components:
          - Production Control
          - AVEVA PI System
          - IBM Maximo
