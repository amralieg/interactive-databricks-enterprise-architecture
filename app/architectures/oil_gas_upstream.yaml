            url: https://www.databricks.com/blog/powering-future-data-and-ai-action-across-energy-industry
      - name: Materials & Supply Planning
        short: Supply chain
        icon: partner
        summary: Field materials demand forecast so rig and facility work is never waiting on parts.
        problem: Materials demand is set from static reorder tables, so field work waits on long-lead parts while warehouses carry the wrong stock and expedite costs pile up on the busiest campaigns.
        who_benefits: Commercial & Supply
        how_built: SAP Ariba and Maximo demand and lead-time data conform on Delta Lake and are scored in Model Serving, so materials plans track real variability on certified AI/BI views for planners.
