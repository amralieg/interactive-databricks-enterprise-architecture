      - name: Reservoir Management
        short: Subsurface
        icon: sheet
        summary: Depletion and recovery tracked against reservoir models to guide field development.
        problem: Production actuals, well tests and reservoir models are reconciled by hand, so depletion and recovery are judged against a stale model and the case for infill and injection lags the field.
        who_benefits: Subsurface & Reservoir
        how_built: Well test and production data conform on Delta Lake under Unity Catalog against dynamic models, and reconciled depletion and recovery surface for the team on the Reservoir Workbench.
