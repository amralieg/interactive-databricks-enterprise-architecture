      - name: Seismic Interpretation
        short: Subsurface
        icon: network
        summary: Seismic volumes and logs interpreted at scale to sharpen the structural picture.
        problem: Seismic volumes and well logs are interpreted on isolated workstations, so the structural picture is slow to update and the compute to reprocess a survey is hard to marshal when a decision is due.
        who_benefits: Subsurface & Reservoir
        how_built: Seismic and log data land on Delta Lake, and interpretation and attribute models tracked in MLflow and scored in Model Serving surface interpreted horizons for the team on the Reservoir Workbench.
