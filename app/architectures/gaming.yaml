  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Player Churn Prediction
        short: Retention
        icon: gauge
        summary: Identifying players likely to lapse from session decay and economy frustration before they uninstall.
        problem: Session frequency and spend decay quietly, and by the time a dashboard shows a title bleeding players the churn has happened and winning them back costs far more than keeping them.
        who_benefits: Live Ops & Product
        how_built: Session, economy and payment signals land through Lakeflow and feed churn models in Feature Store and Model Serving, so at-risk cohorts surface in the Live Ops Console before they lapse.
        components:
          - Live Ops Console
          - Model Serving
          - Feature Store
          - MLflow
          - Custom Game Servers
          - Lakeflow
        stories:
          - title: Changing the game in player retention (SEGA Europe)
            url: https://www.databricks.com/customers/sega
          - title: FunPlus gains new player insights to optimize gaming
            url: https://www.databricks.com/customers/funplus
      - name: LTV & Monetisation
        short: Revenue
        icon: market
        summary: Cohort lifetime value and payer conversion scored per acquisition channel and title.
        problem: Acquisition is bought on installs, not value, so spend chases cheap users who never pay while genuinely high-value players go underbid and the payback on each channel stays a guess.
        who_benefits: Marketing & UA
        how_built: Cohort spend and behaviour are engineered in Feature Store and scored in Model Serving, and predicted LTV lands in the UA Optimiser and AI/BI so bids and offers align to value per channel.
        components:
          - UA Optimiser
          - Model Serving
          - Feature Store
          - AI/BI
          - AppsFlyer Attribution
          - Adyen Payments
        stories:
          - title: Personalizing players' experiences with recommendation systems
            url: https://www.databricks.com/blog/personalizing-players-experiences-recommendation-systems
          - title: Creating a player centric experience in games
            url: https://www.databricks.com/blog/creating-player-centric-experience-games
      - name: Live Ops Balancing
        short: Economy
        icon: sheet
        summary: Sink and source tuning tested against simulated economy health before patches ship.
        problem: 'Economy tuning ships on instinct: a drop-rate or price change can drain a currency sink or wreck retention, and the feedback only lands days later once the patch is already live.'
        who_benefits: Live Ops & Product
        how_built: Session and economy events stream into Lakehouse//RT on Delta Lake, so sinks and sources are simulated in the Live Ops Console and balanced against cohort impact before a patch ships.
        components:
          - Live Ops Console
          - Lakehouse//RT
          - Delta Lake
          - AI/BI
          - PlayFab Backend
          - Apache Spark
        stories:
          - title: Sega delivers real-time gaming insights with Spark Declarative Pipelines
            url: https://www.databricks.com/customers/sega/spark-declarative-pipelines
          - title: Supercell masters the art and science of ForeverGames
            url: https://www.databricks.com/customers/supercell
      - name: Fraud & Bonus Abuse
        short: Risk
        icon: stream
        summary: Multi-accounting, collusion and promo abuse detected from device, payment and play graphs.
        problem: Multi-accounting, collusion and promo abuse hide across device, payment and play data, and siloed rules miss coordinated rings until the bonus and chargeback losses are already gone.
        who_benefits: Risk & Compliance
        how_built: Device, payment and session graphs are conformed on Delta Lake and scored in Model Serving, so velocity and collusion clusters surface in the Fraud Command Centre before withdrawals release.
        components:
          - Fraud Command Centre
          - Model Serving
          - SEON Fraud Prevention
          - GeoComply Location
          - Delta Lake
          - Feature Store
        stories:
          - title: Managing and analyzing game data at scale
            url: https://www.databricks.com/blog/managing-analyzing-game-data-scale
      - name: Responsible Gaming
        short: Compliance
        icon: gavel
        summary: Self-exclusion, deposit limits and harm markers enforced from governed player state.
        problem: Harm markers, deposit limits and self-exclusion live in separate systems, so intervention comes too late and regulators penalise operators who cannot prove they acted on the warning signs.
        who_benefits: Risk & Compliance
        how_built: Player state is conformed under Unity Catalog and scored in Model Serving for harm markers, so limits and self-exclusion enforce from governed data and every intervention is auditable.
        components:
          - Fraud Command Centre
          - Model Serving
          - Unity Catalog
          - GeoComply Location
          - AI/BI
          - Feature Store
        stories:
          - title: Responsible Gaming solution accelerator
            url: https://www.databricks.com/solutions/accelerators/responsible-gaming
      - name: Matchmaking Quality
        short: Engagement
        icon: people
        summary: Queue times and match fairness optimised without opening exploit vectors.
        problem: Long queues and lopsided matches push players away, but tuning for fairness can open exploit vectors, and studios rarely have the live signal to balance both without guesswork.
        who_benefits: Live Ops & Product
        how_built: Match, skill and session telemetry stream into Lakehouse//RT and feed matchmaking models in Model Serving, so queue time and fairness are tuned against real outcomes, not static brackets.
        components:
          - Model Serving
          - Lakehouse//RT
          - Custom Game Servers
          - Feature Store
          - MLflow
          - AI/BI
        stories:
          - title: Personalizing players' experiences with recommendation systems
            url: https://www.databricks.com/blog/personalizing-players-experiences-recommendation-systems
      - name: Content Personalisation
        short: Live ops
        icon: custlake
        summary: Offers and events targeted per player segment from in-game behaviour, not batch exports.
        problem: Offers and events are batched to broad segments from stale exports, so a player sees content that ignores what they just did in-game and the moment to convert or re-engage has passed.
        who_benefits: Player Experience
        how_built: In-game behaviour is resolved in CustomerLake and scored in Model Serving, so per-segment offers and events trigger through Braze Lifecycle from governed data without nightly exports.
        components:
          - Player 360
          - CustomerLake
          - Model Serving
          - Braze Lifecycle
          - AI Functions
          - Salesforce Gaming CRM
        stories:
          - title: Announcing Heroic Labs Satori integration with Databricks
            url: https://www.databricks.com/blog/announcing-heroic-labs-satori-integration-databricks
          - title: Creating a player centric experience in games
            url: https://www.databricks.com/blog/creating-player-centric-experience-games
      - name: Chargeback Prevention
        short: Payments
        icon: market
        summary: High-risk instruments and behaviours blocked before authorisation settles.
        problem: Chargebacks land weeks after the deposit, so a risky card or behaviour is only caught once the money and the goods are gone, and manual review cannot keep pace with authorisation volume.
        who_benefits: Risk & Compliance
        how_built: Payment, device and behaviour features are scored in Model Serving in the authorisation path, so high-risk instruments are blocked from the Fraud Command Centre before settlement completes.
        components:
          - Fraud Command Centre
          - Model Serving
          - Adyen Payments
          - SEON Fraud Prevention
          - Feature Store
          - Delta Lake
      - name: Regulatory GGR
        short: Reporting
        icon: gavel
        summary: Jurisdiction-accurate gross gaming revenue reconciled across platform and RGS content.
        problem: Gross gaming revenue must reconcile across platform, wallet and remote game servers per jurisdiction, yet the numbers sit in separate systems and filing windows leave no room for manual fixes.
        who_benefits: Risk & Compliance
        how_built: Platform, RGS and payment feeds are conformed under Unity Catalog into contracted Gold products, so jurisdiction-accurate GGR reports are produced from one governed source, not a spreadsheet.
        components:
          - Unity Catalog
          - Data Products
          - Pragmatic Play RGS
          - Regulator GGR Feeds
          - AI/BI
          - Delta Lake
      - name: Studio Royalty
        short: Partners
        icon: product
        summary: Third-party title revenue share calculated from governed round and jackpot data.
        problem: Third-party title revenue share is calculated from partner ledgers and manual round exports, so royalties are slow, disputed and hard to reconcile against what actually happened in the game.
        who_benefits: CEO & CFO
        how_built: Round and jackpot data are conformed on Delta Lake and shared as governed products over OpenSharing, so studio royalties compute from the platform's own record and reconcile with partners.
        components:
          - Pragmatic Play RGS
          - Publisher Revenue Share
          - Delta Lake
          - OpenSharing
          - Data Products
          - Unity Catalog
medallion:
  Bronze:
    short: Raw event streams
    summary: Client telemetry, payment authorisations, KYC decisions, game server events and marketing sends, landed exactly as received so a session or a wager can always be replayed.
  Silver:
    short: Conformed player, session
    summary: Players, devices, sessions and titles resolved into single conformed entities across platform, payments and CRM, with cross-device identity stitched to one profile.
  Gold:
    short: ARPDAU, LTV, churn
    summary: 'Contracted products product and finance run on: ARPDAU and payer conversion, cohort LTV, churn and reactivation, and fraud loss rate.'
