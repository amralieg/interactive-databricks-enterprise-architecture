name: Automotive
description: 'Automotive OEMs: vehicle design and simulation, plant manufacturing and quality, dealer networks and customer 360, connected services and aftersales across the tier supply base and mobility fleets.'
sources:
  - name: Engineering & PLM
    icon: product
    tiles:
      - name: Siemens Teamcenter
        icon: product
        summary: EBOM, change orders and variant configuration through SOP.
        citations:
          - teamcenter
        category: PLM System
        what_it_is: System of record for the engineering BOM, change orders and variant configuration carried through to start of production.
        who_uses_it: Vehicle engineering, change management and Configuration management.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 5-20 GB/day
            interval: On change release + nightly
      - name: Dassault 3DEXPERIENCE
        icon: product
        summary: CAD, simulation and manufacturing process definitions.
        citations:
          - 3dexperience
        category: CAD / PLM Platform
        what_it_is: Holds CAD geometry, simulation results and manufacturing process definitions for vehicle and component design.
        who_uses_it: Design engineers, CAE/simulation and Manufacturing engineering.
        data_out:
          batch:
            types:
              - structured
              - unstructured
            volume: GBs (CAD + simulation)
            interval: On design release
      - name: PTC Windchill
        icon: product
        summary: Part masters, effectivity and supplier packages.
        citations:
          - windchill
        category: PLM System
        what_it_is: Manages part masters, effectivity dates and supplier data packages across programs standardized on Windchill.
        who_uses_it: Component engineering, Supplier engineering and Configuration management.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: On change release + nightly
  - name: Procurement & ERP
    icon: erp
    tiles:
      - name: Ivalua
        icon: erp
        summary: Source-to-contract and procure-to-pay across raw, partial and assembled parts.
        citations:
          - ivalua
        category: Source-to-Pay / Procurement
        what_it_is: Runs source-to-contract and procure-to-pay across raw, partial and assembled parts, holding supplier contracts, purchase orders and lead-time commitments across the supply base.
        who_uses_it: Procurement, Supplier management and Materials planning.
        data_out:
          batch:
            types:
              - structured
            volume: 2-8 GB/day
            interval: Nightly + hourly deltas
      - name: SAP S/4HANA
        icon: erp
        summary: ERP of record for procurement, inventory, production orders and finance.
        citations:
          - sap-s4auto
        category: Enterprise ERP
        what_it_is: System of record for procurement, inventory, production orders and finance across the automotive business, feeding cost, purchase-order and materials data to the plant.
        who_uses_it: Procurement, Production planning and Finance.
        data_out:
          batch:
            types:
              - structured
            volume: 20-80 GB/day
            interval: Nightly batch + hourly deltas
  - name: Manufacturing MES
    icon: iot
    tiles:
      - name: Siemens Opcenter
        icon: iot
        summary: Line sequencing, torque traces, andon events by station.
        citations:
          - opcenter
        category: Manufacturing Execution System (MES)
        what_it_is: Runs line sequencing and captures torque traces, station cycle data and andon events across the assembly line.
        who_uses_it: Plant operations, production engineering and Quality.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 2-10k events/sec at peak
            interval: Continuous station events
      - name: Rockwell FactoryTalk
        icon: iot
        summary: PLC tags, quality checks and downtime reason codes.
        citations:
          - factorytalk
        category: Industrial Automation / SCADA
        what_it_is: Streams PLC tags, in-line quality checks and downtime reason codes from controlled assembly and body-shop assets.
        who_uses_it: Controls engineers, plant operations and Continuous improvement.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 5-20k tags/sec
            interval: Continuous high-frequency telemetry
      - name: Bosch Nexeed
        icon: stream
        summary: Tier-1 JIT sequencing and logistics for assembly plants.
        citations:
          - nexeed
        category: Manufacturing Operations / JIS-JIT
        what_it_is: Coordinates tier-1 just-in-sequence and just-in-time part sequencing and logistics feeding the assembly plant.
        who_uses_it: Plant logistics, materials management and Tier-1 suppliers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous sequencing events
  - name: Dealer & Retail
    icon: market
    tiles:
      - name: CDK Global DMS
        icon: erp
        summary: Dealer inventory, deals, F&I and service ROs.
        citations:
          - cdk
        category: Dealer Management System (DMS)
        what_it_is: Runs dealer inventory, vehicle deals, F&I and service repair orders across the dealer network.
        who_uses_it: Dealer principals, sales and service managers and OEM Sales operations.
        data_out:
          batch:
            types:
              - structured
            volume: 2-8 GB/day
            interval: Nightly + hourly deltas
      - name: Reynolds ERA
        icon: erp
        summary: Retail, parts and service transactions across dealer groups.
        citations:
          - reynolds
        category: Dealer Management System (DMS)
        what_it_is: Processes retail, parts and service transactions across dealer groups on the Reynolds platform.
        who_uses_it: Dealer groups, parts and service operations and OEM Sales operations.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
