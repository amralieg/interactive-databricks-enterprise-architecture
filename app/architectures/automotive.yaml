      - name: VinSolutions CRM
        icon: custlake
        summary: Leads, appointments and sold-not-reported tracking.
        citations:
          - vinsolutions
        category: Automotive Retail CRM
        what_it_is: Tracks dealer leads, appointments and sold-not-reported activity across the sales funnel.
        who_uses_it: Dealer sales teams, BDC and OEM Marketing analytics.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Hourly sync
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous lead events
  - name: Connected Vehicle
    icon: stream
    tiles:
      - name: OEM Telematics Gateway
        icon: iot
        summary: CAN signals, GPS and remote diagnostics from connected fleets.
        citations:
          - telematics
        category: Connected Vehicle Telematics
        what_it_is: Ingests CAN bus signals, GPS and remote diagnostics streamed from the connected vehicle fleet.
        who_uses_it: Connected-vehicle engineering, Aftersales and Data science.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 50-500k signals/sec (fleet)
            interval: Continuous vehicle telemetry
      - name: HERE HD Maps
        icon: globe
        summary: Lane-level map tiles for ADAS and navigation features.
        citations:
          - here-maps
        category: HD Mapping / Location Data
        what_it_is: Supplies lane-level HD map tiles and location data feeding ADAS and navigation features.
        who_uses_it: ADAS engineering, navigation and Connected-vehicle teams.
        data_out:
          batch:
            types:
              - semi-structured
            volume: GBs (map tiles)
            interval: Periodic map updates
      - name: Aptiv Smart Vehicle
        icon: zplug
        summary: Sensor fusion and software-defined feature telemetry.
        citations:
          - aptiv
        category: Vehicle Software / Sensor Platform
        what_it_is: Provides sensor-fusion output and software-defined vehicle feature telemetry from the vehicle architecture.
        who_uses_it: ADAS/software engineering and Connected-vehicle data teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 10-100k signals/sec
            interval: Continuous sensor telemetry
  - name: Aftersales & Parts
    icon: zplug
    tiles:
      - name: SAP Aftermarket
        icon: erp
        summary: Parts catalog, supersession and dealer ordering.
        citations:
          - sap-aftermarket
        category: Aftermarket / Parts ERP
        what_it_is: Manages the parts catalog, supersession chains and dealer parts ordering across the aftermarket.
        who_uses_it: Parts planning, aftersales operations and Dealer parts teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Nightly + hourly deltas
      - name: Mitchell Repair
        icon: product
        summary: Labor guides, TSBs and repair procedures.
        citations:
          - mitchell
        category: Repair Information System
        what_it_is: Provides labor time guides, technical service bulletins and repair procedures used in service.
        who_uses_it: Service technicians, warranty analysts and Aftersales engineering.
        data_out:
          batch:
            types:
              - semi-structured
              - unstructured
            volume: 100s of MB/day
            interval: Periodic content updates
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Finance & Warranty Mart
        icon: fed
        summary: Warranty accrual and revenue recognition marts queried in place under Unity Catalog.
        category: Enterprise Data Warehouse
        what_it_is: Warranty accrual and revenue-recognition marts kept in the incumbent warehouse and queried in place through federation rather than copied.
        who_uses_it: Finance, Warranty management and Revenue accounting.
        data_out:
          batch:
            types:
