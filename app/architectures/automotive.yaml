agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Plant Quality & Throughput Agent
        icon: genie
        summary: Ask about OEE, defect PPM and launch-curve progress by line and station.
        feeds:
          - Siemens Opcenter
          - Rockwell FactoryTalk
          - Bosch Nexeed
          - Quality, throughput, loyalty
        teams:
          - Manufacturing
          - Quality Engineering
          - Plant Manager
        questions:
          - What was plant OEE by line and shift yesterday?
          - Which stations are driving defect PPM this week?
          - How is the launch curve tracking against SOP targets by week?
          - Which andon events caused the most line downtime?
          - What is first-time-through quality by line this month?
      - name: Warranty & Field Quality Agent
        icon: genie
        summary: Explore warranty cost, field failures and supplier chargebacks across the fleet.
        feeds:
          - Finance & Warranty Mart
          - SAP Aftermarket
          - Mitchell Repair
          - Conformed vehicles and parts
        teams:
          - Quality Engineering
          - Aftersales
          - Supplier Quality
        questions:
          - What is warranty cost per vehicle by model and model year?
          - Which failure modes are emerging fastest in the field?
          - Which supplier lots are linked to recoverable chargebacks?
          - Where is time-to-containment slipping by defect cluster?
          - Which VINs are candidates for an OTA fix versus a recall?
      - name: Dealer & Sales Agent
        icon: genie
        summary: Answer inventory, days-supply and conquest questions across the dealer network.
        feeds:
          - CDK Global DMS
          - VinSolutions CRM
          - Polk Registration
          - Quality, throughput, loyalty
        teams:
          - Sales & Marketing
          - Incentive Planning
          - Digital Marketing
        questions:
          - What is days supply by dealer and configuration right now?
          - Which markets are over- or under-allocated versus demand?
          - What is incentive spend per unit versus margin by region?
          - What is our conquest rate against key competitors this quarter?
          - Which leads are highest-propensity and unassigned?
      - name: Connected Vehicle & Service Agent
        icon: genie
        summary: Ask about connected diagnostics, battery health and service retention.
        feeds:
          - OEM Telematics Gateway
          - Aptiv Smart Vehicle
          - VinSolutions CRM
          - Conformed vehicles and parts
        teams:
          - Aftersales
          - Service Operations
          - Connected-Vehicle ML
        questions:
          - Which VINs show fault signatures predicting a failure soon?
          - What is EV battery state-of-health distribution by fleet?
          - What is service retention rate by dealer and region?
          - Which parts are predicted to be needed by DC next month?
          - Which connected faults should trigger a proactive service offer?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Predictive Quality
        short: Manufacturing
        icon: iot
        summary: Torque and vision anomalies predicted before vehicles leave the station.
        problem: Defects are caught at final inspection or in the field, long after the station that caused them, so scrap, rework and warranty cost are locked in before anyone sees the pattern.
        who_benefits: Manufacturing
        how_built: Torque and vision checks stream into Lakehouse//RT; station features in Feature Store feed Model Serving models that flag suspect builds on the Plant Cockpit before the station releases.
        components:
          - Plant Cockpit
          - Lakehouse//RT
          - Model Serving
          - Feature Store
          - Siemens Opcenter
        stories:
          - title: Toyota uses Zerobus Ingest for real-time factory data
            url: https://www.databricks.com/customers/toyota/lakeflow-connect
          - title: Predictive quality starts where defect detection stops
            url: https://www.databricks.com/blog/predictive-quality-starts-where-defect-detection-stops
      - name: Vehicle Design Simulation
        short: Engineering
        icon: network
        summary: Aero, mass and crash design-space explored with simulation and surrogate models before metal is cut.
        problem: Each design iteration waits on a full CAE run and a physical prototype, so aero, mass and crash trade-offs are explored slowly and late, and the design-space that would cut fuel and cost is never fully searched.
        who_benefits: Manufacturing
        how_built: Dassault 3DEXPERIENCE CAD and simulation results with Teamcenter configuration are conformed on Delta Lake; surrogate models trained in MLflow and served through Model Serving explore the design-space so trade-offs are proven virtually before build.
        components:
          - Dassault 3DEXPERIENCE
          - Siemens Teamcenter
          - Model Serving
          - MLflow
          - Feature Store
      - name: Connected Diagnostics
        short: Telematics
        icon: stream
        summary: Remote fault prediction triggering proactive service offers.
        problem: Faults are discovered when a warning light comes on or the vehicle is towed in, and the telemetry that would have predicted the failure sits unused in the connected-vehicle stream.
        who_benefits: Aftersales
        how_built: CAN signals and remote diagnostics land in Lakehouse//RT; fault models tracked in MLflow and served through Model Serving raise proactive service offers in the Service Advisor App.
        components:
          - Service Advisor App
          - OEM Telematics Gateway
          - Lakehouse//RT
          - Model Serving
          - MLflow
        stories:
          - title: Rivian improves vehicle health and performance with Databricks
            url: https://www.databricks.com/customers/rivian
      - name: Warranty Recovery
        short: Aftersales
        icon: erp
        summary: Supplier chargebacks matched to field failure modes.
        problem: Warranty spend is written off as a cost of doing business because linking a field failure to the responsible supplier lot and claim is manual, so recoverable chargebacks are never pursued.
        who_benefits: Aftersales
        how_built: Warranty claims, parts and field failures are conformed under Unity Catalog and analysed in Quality Command and AI/BI, matching failure modes to supplier lots so chargebacks are recovered.
        components:
          - Quality Command
          - Finance & Warranty Mart
          - AI/BI
          - Unity Catalog
          - SAP Aftermarket
      - name: Dealer Inventory Opt
        short: Retail
        icon: market
        summary: Allocation and days supply tuned by market demand.
        problem: Vehicles pile up on some dealer lots while hot configurations sell out elsewhere, because allocation runs on stale days-supply numbers rather than live market demand by region.
        who_benefits: Sales & Marketing
        how_built: DMS inventory and registration demand are conformed on Delta Lake and scored in Model Serving, so allocation and days-supply targets are tuned by market and pushed back to dealer systems.
        components:
          - CDK Global DMS
          - Model Serving
          - AI/BI
          - Polk Registration
          - Delta Lake
        stories:
          - title: Al-Futtaim becomes customer-centric with Databricks
            url: https://www.databricks.com/customers/al-futtaim
      - name: Customer & Dealer 360
        short: Retail
        icon: custlake
        summary: One governed view of the customer and dealer across CRM, DMS and registration for sales and marketing.
        problem: The same customer shows up in the CRM, the DMS and registration data as three different records, so sales and marketing cannot see one owner across purchase, service and conquest and every campaign targets a fragment.
        who_benefits: Sales & Marketing
        how_built: VinSolutions leads, CDK deals and service history and Polk registration are resolved to one VIN and owner under Unity Catalog, so a governed customer and dealer 360 is read in AI/BI and asked of Genie.
        components:
          - CDK Global DMS
          - VinSolutions CRM
          - Polk Registration
          - Unity Catalog
          - AI/BI
      - name: Dealer Service Assistant
        short: Aftersales
        icon: apps
        summary: A governed assistant giving service advisors next-best repair, parts and retention actions on the vehicle in the bay.
        problem: A service advisor juggles repair procedures, connected fault codes and warranty rules across separate screens, so diagnosis is slow, fixes miss first visit and retention offers are guessed rather than grounded in the vehicle's history.
        who_benefits: Aftersales
        how_built: Mitchell repair procedures, telematics fault codes and governed service history are grounded through Mosaic AI and Model Serving into the Service Advisor App, so advisors get next-best repair, parts and retention actions on the vehicle in front of them.
        components:
          - Service Advisor App
          - Mitchell Repair
          - OEM Telematics Gateway
          - Mosaic AI
          - Model Serving
      - name: Parts Forecasting
        short: Aftersales
        icon: product
        summary: Dealer and DC parts stock against failure curves.
        problem: Dealers stock out of the parts customers actually need while capital sits in slow movers, because parts planning ignores the failure curves and field signals that predict real demand.
        who_benefits: Aftersales
        how_built: Failure, telematics and parts data are conformed on Delta Lake and scored in Model Serving with runs tracked in MLflow, positioning dealer and DC stock against predicted failure curves.
        components:
          - Service Advisor App
          - SAP Aftermarket
          - Model Serving
          - MLflow
          - OEM Telematics Gateway
        stories:
          - title: Volvo Group increases inventory visibility with Databricks
            url: https://www.databricks.com/customers/volvo/lakeflow-declarative-pipelines
      - name: EV Battery Health
        short: Mobility
        icon: iot
        summary: State of health scored for resale and fleet redeployment.
        problem: An EV's residual value and second-life potential hinge on battery state of health, but that signal is locked in raw telemetry, so resale and fleet redeployment decisions are made blind.
        who_benefits: Aftersales
        how_built: Battery telemetry streams into Lakehouse//RT; state-of-health models tracked in MLflow and served through Model Serving score each pack for resale, warranty and fleet redeployment.
        components:
          - OEM Telematics Gateway
          - Model Serving
          - Lakehouse//RT
          - MLflow
          - Feature Store
        stories:
          - title: Mercedes-Benz transforms the car experience with Databricks
            url: https://www.databricks.com/customers/mercedes-benz
      - name: Supplier Lead-Time Risk
        short: Supply chain
        icon: network
        summary: Supplier lead times and JIS/JIT risk scored before a late part starves the line.
        problem: Just-in-sequence and just-in-time builds depend on parts landing to a tight window, but lead-time and PO commitments sit in procurement and ERP apart from plant sequencing, so a slipping supplier is discovered when the line starves.
        who_benefits: Manufacturing
        how_built: Ivalua contract and PO lead times and SAP S/4HANA materials data are conformed on Delta Lake and scored in Model Serving against Bosch Nexeed sequencing, flagging JIS/JIT risk on the Plant Cockpit before a shortage stops the build.
        components:
          - Ivalua
          - SAP S/4HANA
          - Bosch Nexeed
          - Model Serving
          - Plant Cockpit
        stories:
          - title: Supply chain and distribution optimization on Databricks
            url: https://www.databricks.com/solutions/accelerators/supply-chain-distribution-optimization
