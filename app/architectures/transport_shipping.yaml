  - name: Databricks Apps
    icon: apps
    tiles:
      - name: Control Tower
        icon: globe
        short: Shipment visibility
        summary: Live shipments, ETA risk and detention exposure on a map with exception workflows.
      - name: Warehouse Pulse
        icon: db
        short: DC operations
        summary: Pick waves, labour and dock capacity against outbound cut-off.
      - name: Rate Engine Workbench
        icon: market
        short: Pricing
        summary: Contract, spot and accessorial rates before tender and audit.
      - name: Driver Mobile Hub
        icon: apps
        short: Last mile
        summary: Stop sequence, POD capture and exception codes on driver devices.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: OTIF & Service Performance
        icon: aibi
        summary: On-time-in-full, dwell and exception rates across lanes and customers.
        kpis:
          - OTIF
          - On-time %
          - Dwell time
          - Exception rate
          - Appointment compliance
        teams:
          - Transportation Ops
          - CEO & Network Office
          - In-Transit Exceptions
      - name: Cost per Mile & Freight Spend
        icon: aibi
        summary: Freight spend, cost per mile and accessorials with fuel surcharge recovery.
        kpis:
          - Cost per mile
          - Freight spend
          - Accessorial spend
          - Empty miles
          - Fuel surcharge recovery
        teams:
          - Commercial & Pricing
          - Finance & Claims
          - CEO & Network Office
      - name: Warehouse Productivity
        icon: aibi
        summary: Pick rate, dock utilisation, labour and yard turns across the DC network.
        kpis:
          - Pick rate
          - Dock utilisation
          - Labour hours per unit
          - Wave completion
          - Yard turns
        teams:
          - Warehouse Ops
          - DC Manager
          - Yard & Dock
      - name: Carrier Scorecards
        icon: aibi
        summary: Carrier OTIF, tender acceptance, claims and cost variance per lane.
        kpis:
          - Carrier OTIF
          - Tender acceptance
          - Claims rate
          - Cost variance
          - Capacity commitment
        teams:
          - Commercial & Pricing
          - Carrier Procurement
          - Bid & Sales
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
