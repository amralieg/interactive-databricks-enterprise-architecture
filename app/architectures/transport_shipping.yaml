          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity AI Gateway
      - name: Claude Code
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity AI Gateway.
      - name: OpenAI Codex
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity AI Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity AI Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Shipment Visibility & ETA Agent
        icon: genie
        summary: Ask where a load is, why it is late and which shipments are at ETA risk right now.
        feeds:
          - project44 Visibility
          - FourKites
          - Samsara Fleet
          - Conformed shipment, leg, asset
        teams:
          - Transportation Ops
          - Dispatch
          - In-Transit Exceptions
        questions:
          - Which shipments are at risk of missing their delivery appointment today?
          - What is our on-time delivery rate by lane this week versus last?
          - Which loads are currently in a detention or dwell exception?
          - How accurate has our predicted ETA been against actual arrival by carrier?
          - Which customers have the most late shipments this month and why?
      - name: Carrier Performance & Spend Agent
        icon: genie
        summary: Explore carrier OTIF, cost per mile and freight spend across lanes and modes.
        feeds:
          - MercuryGate TMS
          - EDI VAN (Cleo)
          - SAP TM Settlement
          - OTIF, cost per mile
        teams:
          - Commercial & Pricing
          - Carrier Procurement
          - Finance & Claims
        questions:
          - Which carriers have the best OTIF and lowest cost per mile on our top lanes?
          - What is our tender acceptance rate by carrier this quarter?
          - Which lanes are running above contract rate on the spot market?
          - How much freight spend goes to accessorials by carrier?
          - Which carriers have the highest claims rate against tendered volume?
      - name: Warehouse & Yard Operations Agent
        icon: genie
        summary: Answer pick rate, dock and yard questions across the DC network.
        feeds:
          - Manhattan Active WMS
          - SAP EWM
          - Transporeon
          - Conformed shipment, leg, asset
        teams:
          - Warehouse Ops
          - DC Manager
          - Yard & Dock
        questions:
          - What is pick rate by DC and shift against the outbound cut-off?
          - Which dock doors are the bottleneck for outbound loads today?
          - How long are trailers dwelling in the yard before they are worked?
          - Which waves are behind plan and at risk of missing the carrier appointment?
          - What is labour utilisation versus the planned staffing by DC?
      - name: Detention & Freight Audit Agent
        icon: genie
        summary: Ask about detention exposure, accessorials and invoice-to-contract variance.
        feeds:
          - Transporeon
          - SAP TM Settlement
          - EDI X12 214/210
          - OTIF, cost per mile
        teams:
          - Finance & Claims
          - Freight Audit & Pay
          - Detention & Accessorials
        questions:
          - Which shipments are accruing detention past contracted free time right now?
          - How much recoverable detention did we fail to bill last month?
          - Which carriers show the most invoice-to-contract variance?
          - What is our duplicate-charge rate on audited freight bills?
          - How much fuel surcharge did we recover versus the index this quarter?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Route Optimization
        short: Planning
        icon: sheet
        summary: Multi-stop routes optimised for miles, HOS and appointment windows.
        problem: Multi-stop routes are built by hand against static maps, so miles, driver-hour limits and appointment windows never line up and every re-plan after a disruption is slow guesswork.
        who_benefits: Transportation Ops
        how_built: TMS orders land through Lakeflow onto Delta Lake, distance and time matrices are built with Apache Spark, and optimised stop sequences are scored in Model Serving and pushed to the Control Tower.
        components:
          - Control Tower
          - Oracle OTM
          - Apache Spark
          - Model Serving
          - Delta Lake
        stories:
          - title: Scalable Route Generation solution accelerator
            url: https://www.databricks.com/solutions/accelerators/scalable-route-generation
          - title: iFood tests business hypotheses with Databricks and Tableau
            url: https://www.databricks.com/customers/ifood
          - title: Cleanaway optimises its collection fleet with Databricks
            url: https://www.databricks.com/customers/cleanaway
      - name: Predictive ETA
        short: Visibility
        icon: globe
        summary: ETA refined from telematics, traffic and historical lane performance.
        problem: Customers are quoted an ETA from a fixed transit table, so traffic, weather and dwell stay invisible until a load is already late and the shipper calls asking where it is.
        who_benefits: Transportation Ops
        how_built: Telematics and status events stream into Lakehouse//RT, lane and dwell features are read from Feature Store, and Model Serving refines an ETA surfaced live in the Control Tower and shipper feeds.
        components:
          - Control Tower
          - project44 Visibility
          - Lakehouse//RT
          - Feature Store
          - Model Serving
        stories:
          - title: 'Customer Story: J.B. Hunt'
            url: https://www.databricks.com/customers/jbhunt
      - name: Detention Management
        short: Finance
        icon: market
        summary: Detention clock and claims raised before free time expires.
        problem: Free-time clocks live in emails and driver texts, so detention is discovered after it accrues, claims miss the filing window and recoverable charges quietly become absorbed cost.
        who_benefits: Finance & Claims
        how_built: Arrival and departure events land through Lakeflow, dwell against contracted free time is computed on Delta Lake, and detention exposure and claims surface in the Control Tower and AI/BI.
        components:
          - Control Tower
          - Transporeon
          - Lakeflow
          - Delta Lake
          - AI/BI
      - name: Load Consolidation
        short: TMS
        icon: erp
        summary: LTL and partial loads combined to improve utilisation and margin.
        problem: Partial and LTL loads are booked lane by lane with no view of what else moves nearby, so trucks run half full, empty miles pile up and margin leaks on every under-utilised move.
        who_benefits: Commercial & Pricing
        how_built: Order and tender data land on Delta Lake, candidate consolidations are scored with Apache Spark and Model Serving, and recommended load builds surface in the Control Tower before tender.
        components:
          - Control Tower
          - Blue Yonder TMS
          - Apache Spark
          - Model Serving
          - Delta Lake
      - name: Warehouse Slotting
        short: WMS
        icon: db
        summary: Pick path and slot placement tuned to velocity and seasonality.
        problem: Slot assignments are set once and rarely revisited, so fast movers sit far from the dock, pick paths grow and labour is burned walking the floor as seasonal velocity shifts.
        who_benefits: Warehouse Ops
        how_built: WMS moves and order history land through Lakeflow, velocity and affinity features are built in Feature Store, and Model Serving proposes slot placement surfaced in Warehouse Pulse.
        components:
          - Warehouse Pulse
          - Manhattan Active WMS
          - Feature Store
          - Model Serving
          - Delta Lake
        stories:
          - title: Volvo Group increases inventory visibility with Databricks
            url: https://www.databricks.com/customers/volvo/lakeflow-declarative-pipelines
      - name: Carrier Scorecards
        short: Procurement
        icon: partner
        summary: OTIF, cost and claims history scored per carrier and lane.
        problem: Carrier performance is judged on memory and stale spreadsheets, so award decisions miss which carriers actually hit OTIF, ran clean on claims and held rate on a given lane.
        who_benefits: Commercial & Pricing
        how_built: TMS, EDI status and claims data are conformed under Unity Catalog, OTIF, cost and claims metrics are certified in AI/BI, and per-carrier scorecards are worked in the Rate Engine Workbench.
        components:
          - Rate Engine Workbench
          - MercuryGate TMS
          - Unity Catalog
          - AI/BI
          - Delta Lake
        stories:
          - title: 'J.B. Hunt: dynamic freight matching at scale'
            url: https://www.databricks.com/customers/jbhunt
      - name: Freight Audit
        short: Finance
        icon: chart
        summary: Invoices matched to contract, POD and accessorial rules before payment.
        problem: Carrier invoices are checked by hand against contracts and accessorial rules, so overbilling slips through, duplicate charges get paid and the team only samples a fraction of freight bills.
        who_benefits: Finance & Claims
        how_built: Invoices, contracts and POD events land on Delta Lake, AI Functions match each charge to rate and accessorial rules under Unity Catalog, and exceptions surface in the Rate Engine Workbench.
        components:
          - Rate Engine Workbench
          - SAP TM Settlement
          - AI Functions
          - Unity Catalog
          - Delta Lake
      - name: Cold Chain Monitoring
        short: Compliance
        icon: iot
        summary: Temperature excursions flagged for food and pharma loads.
        problem: Reefer temperature is checked only at pickup and delivery, so an excursion mid-transit is found after the food or pharma load is already spoiled and the whole shipment has to be written off.
        who_benefits: Transportation Ops
        how_built: Reefer and telematics readings stream in through Zerobus into Lakehouse//RT, thresholds are scored in Model Serving, and excursions raise alerts on the Control Tower before product is lost.
        components:
          - Control Tower
          - Samsara Fleet
          - Zerobus
          - Lakehouse//RT
          - Model Serving
      - name: Yard Management
        short: Operations
        icon: stream
        summary: Trailer location and dock door assignment to cut yard turns.
        problem: Nobody knows which trailer sits at which door or where in the yard, so drivers hunt for equipment, dock doors stall and detention builds while the DC waits on trailers it has on site.
        who_benefits: Warehouse Ops
        how_built: Gate, telematics and appointment events land in Lakehouse//RT, dock and yard state is held in Lakebase, and door assignments and trailer moves are worked from Warehouse Pulse.
        components:
          - Warehouse Pulse
          - Transporeon
          - Lakehouse//RT
          - Lakebase
          - Model Serving
      - name: Scope 3 Emissions
        short: Sustainability
        icon: gavel
        summary: Emissions per shipment calculated for shipper ESG reporting.
        problem: Shippers demand emissions per shipment, but the mileage, mode and fuel data needed sit across TMS and telematics, so carbon is estimated with crude averages that will not survive an audit.
        who_benefits: CEO & Network Office
        how_built: Shipment, mode and fuel data are conformed under Unity Catalog, emissions per load are computed on Delta Lake, and certified figures publish as Data Products shared to shippers over OpenSharing.
        components:
          - Data Products
          - OpenSharing
          - Unity Catalog
          - Delta Lake
          - AI/BI
        stories:
          - title: How Dow Built a Carbon Footprint Ledger on Databricks
            url: https://www.databricks.com/blog/how-dow-built-carbon-footprint-ledger-databricks-accelerate-sustainability-scale
          - title: Michelin democratizes business insights with Databricks
            url: https://www.databricks.com/customers/michelin
medallion:
  Bronze:
    short: Raw shipment and fleet feeds
    summary: TMS orders, WMS moves, ELD logs, carrier EDI and shipper tender events, landed exactly as received so a detention charge or a missed appointment can always be replayed.
  Silver:
    short: Conformed shipment, leg, asset
    summary: Shipments, legs, stops and assets resolved into single conformed entities across TMS, WMS and telematics, with multi-stop routes stitched to one delivery.
  Gold:
    short: OTIF, cost per mile
    summary: 'Contracted products operations and finance run on: on-time-in-full by lane, cost per mile, warehouse pick rate, detention and fuel surcharge recovery.'
