          - Finance & Claims
          - CEO & Network Office
      - name: Warehouse Productivity
        icon: aibi
        summary: Pick rate, dock utilisation, labour and yard turns across the DC network.
        kpis:
          - Pick rate
          - Dock utilisation
          - Labour hours per unit
          - Wave completion
          - Yard turns
        teams:
          - Warehouse Ops
          - DC Manager
          - Yard & Dock
      - name: Carrier Scorecards
        icon: aibi
        summary: Carrier OTIF, tender acceptance, claims and cost variance per lane.
        kpis:
          - Carrier OTIF
          - Tender acceptance
          - Claims rate
          - Cost variance
          - Capacity commitment
        teams:
