          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity AI Gateway
      - name: Claude Code
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity AI Gateway.
      - name: OpenAI Codex
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity AI Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity AI Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Shipment Tracking & Routing Agent
        icon: genie
        summary: Track where a load is, why it is late and which shipments are at ETA risk right now.
        feeds:
          - project44 Visibility
          - FourKites
          - Samsara Fleet
          - Conformed shipment, leg, asset
        teams:
          - Transportation Ops
          - Dispatch
          - In-Transit Exceptions
        questions:
          - Which shipments are at risk of missing their delivery appointment today?
          - What is our on-time delivery rate by lane this week versus last?
          - Which loads are currently in a detention or dwell exception?
          - How accurate has our predicted ETA been against actual arrival by carrier?
          - Which customers have the most late shipments this month and why?
      - name: Fleet & Carrier Agent
        icon: genie
        summary: Optimize carrier OTIF, cost per mile and freight spend across lanes and modes.
        feeds:
          - MercuryGate TMS
          - EDI VAN (Cleo)
          - SAP TM Settlement
          - OTIF, cost per mile
        teams:
          - Commercial & Pricing
          - Carrier Procurement
          - Finance & Claims
        questions:
          - Which carriers have the best OTIF and lowest cost per mile on our top lanes?
          - What is our tender acceptance rate by carrier this quarter?
          - Which lanes are running above contract rate on the spot market?
          - How much freight spend goes to accessorials by carrier?
          - Which carriers have the highest claims rate against tendered volume?
      - name: Warehouse & Yard Agent
        icon: genie
        summary: Run pick rate, dock and yard operations across the DC network.
        feeds:
          - Manhattan Active WMS
          - SAP EWM
          - Transporeon
          - Conformed shipment, leg, asset
        teams:
          - Warehouse Ops
          - DC Manager
          - Yard & Dock
        questions:
          - What is pick rate by DC and shift against the outbound cut-off?
          - Which dock doors are the bottleneck for outbound loads today?
          - How long are trailers dwelling in the yard before they are worked?
          - Which waves are behind plan and at risk of missing the carrier appointment?
          - What is labour utilisation versus the planned staffing by DC?
      - name: Detention & Freight Audit Agent
        icon: genie
        summary: Recover detention exposure, accessorials and invoice-to-contract variance.
        feeds:
          - Transporeon
          - SAP TM Settlement
          - EDI X12 214/210
          - OTIF, cost per mile
        teams:
          - Finance & Claims
          - Freight Audit & Pay
          - Detention & Accessorials
        questions:
          - Which shipments are accruing detention past contracted free time right now?
          - How much recoverable detention did we fail to bill last month?
          - Which carriers show the most invoice-to-contract variance?
          - What is our duplicate-charge rate on audited freight bills?
          - How much fuel surcharge did we recover versus the index this quarter?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Route Optimization
        short: Planning
        icon: sheet
        summary: Multi-stop routes optimised for miles, HOS and appointment windows.
        problem: Multi-stop routes are built by hand against static maps, so miles, driver-hour limits and appointment windows never line up and every re-plan after a disruption is slow guesswork.
        who_benefits: Transportation Ops
        how_built: TMS orders land through Lakeflow onto Delta Lake, distance and time matrices are built with Apache Spark, and optimised stop sequences are scored in Model Serving and pushed to the Control Tower.
        components:
          - Control Tower
          - Oracle OTM
          - Apache Spark
          - Model Serving
          - Delta Lake
        stories:
          - title: Scalable Route Generation solution accelerator
            url: https://www.databricks.com/solutions/accelerators/scalable-route-generation
          - title: iFood tests business hypotheses with Databricks and Tableau
            url: https://www.databricks.com/customers/ifood
          - title: Cleanaway optimises its collection fleet with Databricks
            url: https://www.databricks.com/customers/cleanaway
      - name: Freight Demand Forecasting
        short: Planning
        icon: chart
        summary: Freight volume forecast by lane and week so capacity and carrier commitments track real demand.
        problem: Freight volume by lane and week is guessed from last year and the sales pipeline, so capacity is committed and carriers are contracted against demand that never shows or arrives all at once.
        who_benefits: Commercial & Pricing
        how_built: TMS order and tender history conform on Delta Lake, lane and seasonality features are read from Feature Store, and demand models tracked in MLflow score by lane in Model Serving to feed capacity and bid decisions in AI/BI.
        components:
          - Oracle OTM
          - Blue Yonder TMS
          - Feature Store
          - Model Serving
          - MLflow
          - AI/BI
      - name: Fleet Planning & Optimization
        short: Fleet
        icon: network
        summary: Tractors, trailers and drivers positioned against committed volume to cut idle equipment and empty miles.
        problem: Tractors, trailers and drivers are positioned by habit, so equipment sits idle in one region while another turns down loads, and empty repositioning miles quietly eat the margin.
        who_benefits: Transportation Ops
        how_built: Telematics and TMS assignments stream into Lakehouse//RT and conform on Delta Lake, and network-flow and positioning models in Model Serving balance equipment and drivers against committed volume in the Control Tower.
        components:
          - Control Tower
          - Samsara Fleet
          - Oracle OTM
          - Lakehouse//RT
          - Model Serving
          - MLflow
        stories:
          - title: 'J.B. Hunt: dynamic freight matching at scale'
            url: https://www.databricks.com/customers/jbhunt
      - name: Load Consolidation
        short: TMS
        icon: erp
        summary: LTL and partial loads combined to improve utilisation and margin.
        problem: Partial and LTL loads are booked lane by lane with no view of what else moves nearby, so trucks run half full, empty miles pile up and margin leaks on every under-utilised move.
        who_benefits: Commercial & Pricing
        how_built: Order and tender data land on Delta Lake, candidate consolidations are scored with Apache Spark and Model Serving, and recommended load builds surface in the Control Tower before tender.
        components:
          - Control Tower
          - Blue Yonder TMS
          - Apache Spark
          - Model Serving
          - Delta Lake
      - name: Vehicle Predictive Maintenance
        short: Asset health
        icon: iot
        summary: Tractor and trailer failures predicted from engine and fault signals before they strand a load.
        problem: Tractors and trailers break down on the road with no warning, so a failure strands a load, triggers an emergency roadside repair and blows the delivery window, while engine and fault signals sit unused in telematics.
        who_benefits: Transportation Ops
        how_built: Samsara engine diagnostics, Geotab maintenance alerts and Omnitracs signals stream into Lakehouse//RT and conform on Delta Lake, and remaining-life and fault models tracked in MLflow score in Model Serving so failures become scheduled shop visits.
        components:
          - Samsara Fleet
          - Geotab Fleet
          - Omnitracs ELD
          - Lakehouse//RT
          - Model Serving
          - MLflow
      - name: Incident & Roadside Assistant
        short: Field service
        icon: globe
        summary: An agent that pulls the accident, breakdown or exception together and drafts the roadside response, re-route and customer update.
        problem: When a truck is in an accident, breakdown or exception, dispatch pieces the story together from phone calls and disparate systems, so the right roadside response, re-route and customer update all lag the event.
        who_benefits: Transportation Ops
        how_built: Dashcam, ELD and visibility exception events land in Lakehouse//RT, and a Mosaic AI agent grounded on governed shipment and asset data drafts the roadside response, re-route and customer notification in the Control Tower.
        components:
          - Control Tower
          - Samsara Fleet
          - Omnitracs ELD
          - project44 Visibility
          - Mosaic AI
          - Lakehouse//RT
      - name: Shipper Customer 360
        short: Customer
        icon: custlake
        summary: One account view of every shipper's orders, service and billing so churn and whitespace are seen before a shipper leaves.
        problem: A 3PL's shippers are managed account by account with no unified view, so churn signals, service complaints and whitespace hide across TMS, visibility and billing systems until a shipper is already leaving.
        who_benefits: Commercial & Pricing
        how_built: Shipper orders, service events and billing conform under Unity Catalog into one account view, and churn and share-of-wallet models score in Model Serving, surfaced with Genie and AI/BI for the account team.
        components:
          - Shipper TMS Marts
          - Oracle OTM
          - project44 Visibility
          - Model Serving
          - AI/BI
          - Genie One
        stories:
          - title: 'Customer Story: J.B. Hunt'
            url: https://www.databricks.com/customers/jbhunt
      - name: Driver & Workforce Safety
        short: Safety
        icon: gavel
        summary: Unsafe driving and fatigue flagged from dashcam, harsh-driving and HOS signals before a crash or CSA hit.
        problem: Unsafe driving and fatigue surface only after a crash or a CSA score hit, while the dashcam, harsh-driving and hours-of-service signals that predict them sit unaggregated across telematics and ELD systems.
        who_benefits: Transportation Ops
        how_built: Samsara dashcam, Geotab harsh-driving, Omnitracs HOS and FMCSA safety data conform on Delta Lake, and risk models in Model Serving flag drivers and behaviours before an incident, surfaced in AI/BI for coaching.
        components:
          - Samsara Fleet
          - Geotab Fleet
          - Omnitracs ELD
          - FMCSA SAFER Feed
          - Model Serving
          - AI/BI
      - name: Detention & Freight Audit
        short: Working capital
        icon: market
        summary: Detention caught before free time expires and every carrier invoice matched to contract and POD before payment.
        problem: Free-time clocks live in emails and driver texts while carrier invoices are checked by hand, so detention accrues unbilled, claims miss the filing window and overbilling and duplicate charges quietly get paid.
        who_benefits: Finance & Claims
        how_built: Arrival, departure, invoice and POD events land through Lakeflow on Delta Lake, AI Functions match each charge to rate and accessorial rules under Unity Catalog, and detention exposure and audit exceptions surface in the Control Tower and Rate Engine Workbench.
        components:
          - Control Tower
          - Rate Engine Workbench
          - Transporeon
          - SAP TM Settlement
          - AI Functions
          - Unity Catalog
      - name: Scope 3 Emissions
        short: Sustainability
        icon: gavel
        summary: Emissions per shipment calculated for shipper ESG reporting.
        problem: Shippers demand emissions per shipment, but the mileage, mode and fuel data needed sit across TMS and telematics, so carbon is estimated with crude averages that will not survive an audit.
        who_benefits: CEO & Network Office
        how_built: Shipment, mode and fuel data are conformed under Unity Catalog, emissions per load are computed on Delta Lake, and certified figures publish as Data Products shared to shippers over OpenSharing.
        components:
          - Data Products
          - OpenSharing
          - Unity Catalog
          - Delta Lake
          - AI/BI
        stories:
          - title: How Dow Built a Carbon Footprint Ledger on Databricks
            url: https://www.databricks.com/blog/how-dow-built-carbon-footprint-ledger-databricks-accelerate-sustainability-scale
          - title: Michelin democratizes business insights with Databricks
            url: https://www.databricks.com/customers/michelin
medallion:
  Bronze:
    short: Raw shipment and fleet feeds
    summary: TMS orders, WMS moves, ELD logs, carrier EDI and shipper tender events, landed exactly as received so a detention charge or a missed appointment can always be replayed.
  Silver:
    short: Conformed shipment, leg, asset
    summary: Shipments, legs, stops and assets resolved into single conformed entities across TMS, WMS and telematics, with multi-stop routes stitched to one delivery.
  Gold:
    short: OTIF, cost per mile
    summary: 'Contracted products operations and finance run on: on-time-in-full by lane, cost per mile, warehouse pick rate, detention and fuel surcharge recovery.'
