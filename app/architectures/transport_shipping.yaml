name: Transport & Logistics
description: 'Freight carriers and 3PLs: transportation management, warehouse execution, route optimisation, fleet telematics, and shipper visibility across road, rail and last mile.'
sources:
  - name: TMS & Planning
    icon: erp
    tiles:
      - name: Oracle OTM
        icon: erp
        summary: Transportation planning, tendering, execution and freight payment.
        citations:
          - oracle-otm
        category: Transportation Management System (TMS)
        what_it_is: Plans and tenders loads, executes shipments across modes and settles freight, holding the system-of-record for orders, legs and carrier assignments.
        who_uses_it: Transportation Ops, Dispatch and Carrier Procurement teams.
        data_out:
          batch:
            types:
              - structured
            volume: 10-40 GB/day
            interval: Hourly extracts + nightly batch
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous CDC on tender and status
      - name: Blue Yonder TMS
        icon: sheet
        summary: Load building, mode selection and carrier assignment.
        citations:
          - blue-yonder-tms
        category: Transportation Management System (TMS)
        what_it_is: Builds loads, selects mode and assigns carriers against network constraints, feeding planned versus executed movement for consolidation analysis.
        who_uses_it: Transportation Ops, Linehaul Planning and Commercial & Pricing teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Nightly batch + intraday deltas
      - name: MercuryGate TMS
        icon: market
        summary: Multi-modal rating, routing and carrier scorecards.
        citations:
          - mercurygate
        category: Multi-Modal TMS & Rating
        what_it_is: Rates and routes multi-modal freight and maintains carrier scorecards, the basis for spot-versus-contract rating and award decisions.
        who_uses_it: Commercial & Pricing, Carrier Procurement and Bid & Sales teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-10 GB/day
            interval: Daily rating + scorecard refresh
  - name: WMS & Fulfillment
    icon: db
    tiles:
      - name: Manhattan Active WMS
        icon: db
        summary: Receiving, putaway, picking and shipping execution.
        citations:
          - manhattan-wms
        category: Warehouse Management System (WMS)
        what_it_is: Executes receiving, putaway, picking and shipping on the DC floor and emits the move events behind pick rate, slotting and labour analytics.
        who_uses_it: Warehouse Ops, DC Managers and Inbound & Slotting teams.
        data_out:
          batch:
            types:
              - structured
            volume: 10-50 GB/day
            interval: Hourly batch
          stream:
            types:
              - semi-structured
            volume: hundreds of moves/sec at peak
            interval: Continuous move events
      - name: SAP EWM
        icon: erp
        summary: Warehouse management integrated to manufacturing and retail flows.
        citations:
          - sap-ewm
        category: Warehouse Management System (WMS)
        what_it_is: Runs extended warehouse management tied into manufacturing and retail order flows, the source of stock movements and task confirmations.
        who_uses_it: Warehouse Ops, Inbound & Slotting and Data Engineers.
        data_out:
          batch:
            types:
              - structured
            volume: 5-25 GB/day
            interval: Nightly batch + hourly deltas
      - name: Körber WMS
        icon: stream
        summary: High-bay and automated storage execution for 3PL campuses.
        citations:
          - korber-wms
        category: Warehouse Management System (WMS)
        what_it_is: Executes high-bay and automated storage across 3PL campuses, emitting equipment and task telemetry from ASRS and conveyor systems.
        who_uses_it: Warehouse Ops, Yard & Dock and automation engineering teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-10 GB/day
            interval: Hourly batch
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous automation telemetry
  - name: Fleet & Telematics
    icon: iot
    tiles:
      - name: Samsara Fleet
        icon: iot
        summary: GPS, ELD, dashcam and engine diagnostics for owned and leased fleets.
        citations:
          - samsara
        category: Fleet Telematics & ELD
        what_it_is: Streams GPS position, hours-of-service logs, dashcam events and engine diagnostics from the tractor and trailer fleet.
        who_uses_it: Transportation Ops, Dispatch and Fleet maintenance teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-10k pings/sec across fleet
            interval: Continuous (seconds)
      - name: Geotab Fleet
        icon: stream
        summary: Vehicle location, idle time and maintenance alerts.
        citations:
          - geotab
        category: Fleet Telematics
        what_it_is: Reports vehicle location, idle time, harsh-driving events and maintenance alerts from telematics devices across the fleet.
        who_uses_it: Transportation Ops, Fleet maintenance and Safety teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds-thousands of pings/sec
            interval: Continuous (seconds)
      - name: Omnitracs ELD
        icon: partner
        summary: Hours of service, route compliance and driver workflow.
        citations:
          - omnitracs
        category: Electronic Logging Device (ELD) / HOS
        what_it_is: Captures hours-of-service logs, route compliance and driver workflow events used for HOS compliance and dispatch feasibility.
        who_uses_it: Transportation Ops, Safety & Compliance and Dispatch teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous (near real-time)
  - name: Carrier & Freight
    icon: partner
    tiles:
      - name: project44 Visibility
        icon: api
        summary: Real-time shipment tracking across LTL, TL and parcel networks.
        citations:
          - project44
        category: Real-Time Transportation Visibility
        what_it_is: Aggregates carrier tracking across LTL, TL and parcel into real-time shipment position and status events for ETA and exception management.
        who_uses_it: Transportation Ops, In-Transit Exceptions and Customer service teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-5k status events/sec
            interval: Continuous (API / webhook)
      - name: FourKites
        icon: globe
        summary: Predictive ETA and exception management for shipper portals.
        citations:
          - fourkites
        category: Real-Time Transportation Visibility
        what_it_is: Provides predictive ETA and exception signals across the carrier network, fed to shipper portals and control-tower workflows.
        who_uses_it: Transportation Ops, In-Transit Exceptions and Shipper account teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds-thousands of events/sec
            interval: Continuous (API / webhook)
      - name: EDI VAN (Cleo)
        icon: stream
        summary: 204 tender, 214 status and 210 invoice messages with carriers.
        citations:
          - cleo-edi
        category: EDI / B2B Integration Network
        what_it_is: Exchanges 204 tender, 214 status and 210 invoice EDI messages with carriers, the trading-partner backbone for tender and settlement.
        who_uses_it: Transportation Ops, Freight Audit & Pay and Integration Engineers.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Multiple daily batches
          stream:
            types:
              - semi-structured
            volume: tens-hundreds of messages/sec
            interval: Continuous message flow
  - name: Finance & Claims
    icon: chart
    tiles:
      - name: SAP TM Settlement
        icon: market
        summary: Freight accruals, audit and payment matched to proof of delivery.
        citations:
          - sap-tm-settle
        category: Freight Audit & Payment
        what_it_is: Accrues, audits and settles freight against contract rates and proof of delivery, the source of invoice-to-contract variance.
        who_uses_it: Finance & Claims, Freight Audit & Pay and Detention & Accessorials teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-8 GB/day
            interval: Daily settlement cycles
      - name: Transporeon
        icon: partner
        summary: Dock appointment, yard management and detention billing.
        citations:
          - transporeon
        category: Dock Appointment & Yard Management
        what_it_is: Manages dock appointments, yard slotting and detention billing, emitting arrival and departure events that drive the free-time clock.
        who_uses_it: Warehouse Ops, Yard & Dock and Detention & Accessorials teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Hourly
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous gate / appointment events
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Shipper TMS Marts
        icon: fed
        summary: Shipper order and ASN marts queried in place under Unity Catalog.
        category: Shipper Data Warehouse
        what_it_is: Shipper-side order and ASN marts kept in the incumbent warehouse and queried in place through federation rather than copied.
        who_uses_it: Commercial & Pricing, Shipper account and Finance & Claims analysts.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: EDI X12 214/210
        icon: stream
        summary: Standard shipment status and freight invoice messages parsed on arrival.
        citations:
          - cleo-edi
        category: EDI Transaction Messages
        what_it_is: Standard X12 214 shipment status and 210 freight invoice messages parsed on arrival and joined to shipments for status and audit.
        who_uses_it: Transportation Ops, Freight Audit & Pay and Integration Engineers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: tens-hundreds of messages/sec
            interval: Continuous message flow
      - name: FMCSA SAFER Feed
        icon: gavel
        summary: Carrier safety and authority status for onboarding checks.
        citations:
          - fmcsa
        category: Carrier Safety & Authority Data
        what_it_is: Provides carrier safety ratings, operating authority and insurance status used to vet carriers at onboarding and re-check.
        who_uses_it: Carrier Procurement, Safety & Compliance and Onboarding teams.
        data_out:
          batch:
            types:
              - structured
            volume: 100s of MB
            interval: Weekly + on-demand pulls
      - name: Fuel Index APIs
        icon: market
        summary: Weekly fuel surcharge indices consumed for rating updates.
        citations:
          - transporeon
        category: Fuel Surcharge Index
        what_it_is: Publishes weekly fuel-price indices consumed to update fuel surcharge schedules and landed-cost rating.
        who_uses_it: Commercial & Pricing, Freight Audit & Pay and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: MBs
            interval: Weekly index refresh
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: CEO & Network Office
        mark: Genie One
        summary: The CEO on margin per load; the COO on OTIF and fleet utilisation, trading empty miles and detention against the contracted service.
        uses:
          - - Genie One
            - Ask what last week's lane margin was without analyst delay.
          - - AI/BI
            - OTIF and cost per mile on certified Metric Views.
          - - Unity Catalog
            - One shipment definition across TMS and WMS.
        sub:
          - name: Chief Executive
            cares: margin per load and the network-wide trade between service and cost.
          - name: Chief Operating Officer
            cares: OTIF, fleet utilisation and the empty-mile and detention bill.
          - name: Network Strategy
            cares: lane design, capacity commitments and the network's carbon footprint.
        ucs:
          - Load Consolidation
          - Carrier Scorecards
          - Scope 3 Emissions
          - Route Optimization
      - name: Transportation Ops
        mark: Lakehouse//RT
        summary: Dispatchers on tender acceptance, in-transit exceptions and appointment compliance, moving loads before ETA risk becomes a detention charge.
        uses:
          - - Control Tower
            - Live shipments, ETA risk and detention exposure on one map.
          - - Lakehouse//RT
            - ELD and TMS state at dispatch latency.
        sub:
          - name: Dispatch
            cares: tender acceptance and getting the load covered before the appointment.
          - name: Linehaul Planning
            cares: multi-stop routing against driver-hour limits and delivery windows.
          - name: In-Transit Exceptions
            cares: ETA risk and the detention clock while freight is moving.
        ucs:
          - Route Optimization
          - Predictive ETA
          - Cold Chain Monitoring
          - Detention Management
      - name: Warehouse Ops
        mark: Apps
        summary: DC managers on pick rate, labour balance and outbound cut-off, releasing waves so the dock clears before the carrier appointment closes.
        uses:
          - - Warehouse Pulse
            - Pick waves, dock doors and labour plan against cut-off.
          - - Apps
            - Floor apps hosted next to governed WMS data.
        sub:
          - name: DC Manager
            cares: pick rate, dock capacity and hitting the outbound cut-off.
          - name: Inbound & Slotting
            cares: putaway, slot placement and how velocity drives the pick path.
          - name: Yard & Dock
            cares: trailer moves, dock-door assignment and yard turns.
        ucs:
          - Warehouse Slotting
          - Yard Management
          - Load Consolidation
      - name: Commercial & Pricing
        mark: Model Serving
        summary: Pricing analysts on lane rates, accessorials and shipper contracts, scoring spot versus contract margin before a load is tendered.
        uses:
          - - Rate Engine Workbench
            - Contract and spot rates before tender.
          - - Model Serving
            - Dynamic pricing models in the bid path.
        sub:
          - name: Pricing Analytics
            cares: lane rates, accessorials and spot-versus-contract margin.
          - name: Carrier Procurement
            cares: carrier sourcing, scorecards and capacity commitments.
          - name: Bid & Sales
            cares: shipper RFPs and the contract book behind tendered volume.
        ucs:
          - Load Consolidation
          - Carrier Scorecards
          - Predictive ETA
      - name: Finance & Claims
        mark: AI/BI
        summary: Freight audit and claims teams on detention, fuel surcharge recovery and accrual variance, matching each invoice to contract and POD.
        uses:
          - - AI/BI
            - Accrual variance and audit findings on certified views.
          - - Genie One
            - Ask which carriers exceed detention thresholds.
        sub:
          - name: Freight Audit & Pay
            cares: invoice-to-contract matching, duplicate charges and accrual variance.
          - name: Detention & Accessorials
            cares: free-time clocks, fuel surcharge and detention recovery.
          - name: Claims
            cares: loss, damage and the POD evidence behind each claim.
        ucs:
          - Freight Audit
          - Detention Management
          - Carrier Scorecards
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land TMS orders, WMS moves, ELD logs and carrier EDI; own Bronze to Silver and the pager when an OTIF or cost-per-mile table breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for TMS, WMS and telematics sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on EDI and ELD feeds.
          - - Lakewatch
            - Freshness on the OTIF tables the control tower reads through the day.
        sub:
          - name: Source Onboarding
            cares: TMS, WMS, ELD and carrier EDI connectors and schemas.
          - name: Pipeline & Quality
            cares: Bronze-to-Silver expectations on EDI and telematics feeds.
          - name: Platform Reliability
            cares: the pager when an OTIF or cost-per-mile table breaks.
        ucs:
          - Predictive ETA
          - Freight Audit
          - Cold Chain Monitoring
      - name: Data Scientists
        mark: MLflow
        summary: Predictive-ETA, route-optimisation, dynamic-pricing and carrier-scoring models, and whether they still hold as lanes and fuel indices shift.
        uses:
          - - Feature Store
            - Shipment and lane features read identically in training and serving.
          - - MLflow
            - Every ETA and pricing experiment tracked for audit.
          - - Model Serving
            - ETA and pricing models scored in the dispatch and bid path.
        sub:
          - name: ETA & Routing Models
            cares: predictive ETA and multi-stop optimisation as lanes shift.
          - name: Pricing Science
            cares: dynamic lane pricing and accessorial models in the bid path.
          - name: Carrier & Network
            cares: carrier scoring and network-flow models on shifting capacity.
        ucs:
          - Route Optimization
          - Predictive ETA
          - Carrier Scorecards
      - name: App Developers
        mark: Apps
        summary: Ship the Control Tower, Warehouse Pulse and Rate Engine apps operations and pricing teams work in, next to governed TMS and WMS data.
        uses:
          - - Apps
            - Operations screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for appointment and wave state writes.
          - - Agent Bricks
            - Agents that draft tender responses against governed tools.
        sub:
          - name: Ops App Dev
            cares: Control Tower and Warehouse Pulse next to governed data.
          - name: Driver & Mobile
            cares: stop sequence, POD capture and exception codes on devices.
          - name: Agents & Writeback
            cares: tender-response agents and appointment writeback on Lakebase.
        ucs:
          - Route Optimization
          - Yard Management
          - Warehouse Slotting
