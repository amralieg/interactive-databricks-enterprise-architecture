        summary: Live shipments, ETA risk and detention exposure on a map with exception workflows.
      - name: Warehouse Pulse
        icon: db
        short: DC operations
        summary: Pick waves, labour and dock capacity against outbound cut-off.
      - name: Rate Engine Workbench
        icon: market
