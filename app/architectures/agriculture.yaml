          - Elevator throughput
          - Truck wait time
          - Cost per acre
          - Grain shrink
        teams:
          - Co-op Executive Board
          - Chief Operating Officer
          - Origination
      - name: Carbon & Patronage
        icon: aibi
        summary: Enrolled acres, credits issued and patronage pools by grower.
        kpis:
