name: Agriculture
description: Farm operations, crop planning, input supply, commodity trading, and sustainability reporting across grower networks and co-ops.
sources:
  - name: Farm Management
    icon: sheet
    tiles:
      - name: John Deere Operations Center
        icon: iot
        summary: Machine telemetry, as-applied maps and field boundaries from connected equipment.
        citations:
          - john-deere
        category: Farm Management (FMIS) / Machine Data
        what_it_is: Streams machine telemetry, as-applied maps and field boundaries from connected equipment, the ground truth for operations and prescriptions.
        who_uses_it: Agronomy, Precision Ag Specialists and Field Scouts.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-10 GB/day in season
            interval: Daily + per-operation sync
          stream:
            types:
              - semi-structured
            volume: hundreds of machine events/sec at peak
            interval: Continuous in-field telemetry
      - name: Climate FieldView
        icon: iot
        summary: Planting, spraying and harvest layers with hybrid performance by field.
        citations:
          - climate-fieldview
        category: Farm Management (FMIS) / Agronomy
        what_it_is: Holds planting, spraying and harvest layers with hybrid performance by field, feeding yield response and prescription analysis.
        who_uses_it: Agronomy, Lead Agronomists and Field Scouts.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.5-5 GB/day in season
            interval: Daily layer sync
      - name: Traction Ag
        icon: sheet
        summary: Field plans, input tracking and profit and loss by field for growers.
        citations:
          - granular
        category: Farm Financial & Field Management
        what_it_is: Maintains field plans, input tracking and profit and loss by field for growers, the basis for cost-per-bushel analysis.
        who_uses_it: Finance & Risk, Agronomy and grower operations teams.
        data_out:
          batch:
            types:
              - structured
            volume: 100s of MB
            interval: Daily sync
  - name: ERP & Supply Chain
    icon: erp
    tiles:
      - name: SAP S/4HANA Agribusiness
        icon: erp
        summary: Grain contracts, settlements and inventory across elevators and processing.
        citations:
          - sap-agri
        category: Agribusiness ERP
        what_it_is: Holds grain contracts, settlements and inventory across elevators and processing, the system of record for commodity supply chain and finance.
        who_uses_it: Grain Merchandising, Finance & Risk and Sustainability teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Nightly batch + hourly deltas
      - name: Oracle Food & Beverage
        icon: erp
        summary: Procurement, production and lot traceability for processors.
        citations:
          - oracle-fb
        category: Food & Beverage ERP
        what_it_is: Runs procurement, production and lot traceability for processors, the source of lot lineage behind traceability claims.
        who_uses_it: Sustainability, Finance & Risk and processing operations teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-10 GB/day
            interval: Nightly batch
      - name: Agvance (SSI)
        icon: erp
        summary: Co-op grain accounting, patronage and settlements for ag retailers.
        citations:
          - agvance
        category: Co-op Grain Accounting
        what_it_is: Handles co-op grain accounting, patronage and settlements for ag retailers, the source of patronage pools and member returns.
        who_uses_it: Finance & Risk, CFO & Controller and Member board teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Nightly batch + settlement runs
  - name: Commodity Markets
    icon: market
    tiles:
      - name: CME Group Futures
        icon: market
        summary: Corn, soybean and wheat futures, options and settlement prices.
        citations:
          - cme
        category: Commodity Futures Exchange
        what_it_is: Carries corn, soybean and wheat futures, options and settlement prices, the hedging benchmark behind basis and position management.
        who_uses_it: Grain Merchandising, Risk Desk and Head Merchandisers.
        data_out:
          batch:
            types:
              - structured
            volume: GBs (settlements + history)
            interval: Daily settlement
          stream:
            types:
              - structured
            volume: hundreds of ticks/sec
            interval: Continuous market data
      - name: DTN ProphetX
        icon: market
        summary: Cash bids, basis and local elevator prices by location.
        citations:
          - dtn
        category: Cash Grain & Basis Data
        what_it_is: Provides cash bids, basis and local elevator prices by location, the local price signal for origination and basis trading.
        who_uses_it: Grain Merchandising, Origination and Risk Desk teams.
        data_out:
          batch:
            types:
              - structured
            volume: 100s of MB
            interval: Multiple intraday updates
          stream:
            types:
              - structured
            volume: tens of quotes/sec
            interval: Continuous cash bids
      - name: Barchart cmdty
        icon: chart
        summary: Historical cash and futures curves for hedging analysis.
        citations:
          - barchart
        category: Market Data & Analytics
        what_it_is: Supplies historical cash and futures curves for hedging analysis, the reference series behind basis-forecast models.
        who_uses_it: Grain Merchandising, Quant & Basis and Data Scientists.
        data_out:
          batch:
            types:
              - structured
            volume: GBs (historical curves)
            interval: Daily refresh
  - name: Weather & Imagery
    icon: stream
    tiles:
      - name: DTN Weather
        icon: stream
        summary: Hyperlocal forecasts, growing degree days and spray windows.
        citations:
          - dtn-weather
        category: Agricultural Weather Data
        what_it_is: Delivers hyperlocal forecasts, growing degree days and spray windows, joined to field boundaries for risk and operations timing.
        who_uses_it: Agronomy, Co-op Executive Board and Field Scouts.
        data_out:
          stream:
            types:
              - semi-structured
            volume: tens of updates/sec
            interval: Continuous forecast updates
      - name: Planet Labs Imagery
        icon: iot
        summary: Daily satellite NDVI and change detection by parcel.
        citations:
          - planet
        category: Satellite Imagery
        what_it_is: Provides daily satellite NDVI and change detection by parcel, the in-season crop-condition signal behind yield forecasts.
        who_uses_it: Agronomy, Yield Modeling and Precision Ag Specialists.
        data_out:
          batch:
            types:
              - unstructured
              - structured
            volume: GBs/day (imagery + derived)
            interval: Daily scenes
      - name: Sentinel Hub
        icon: globe
        summary: Copernicus optical and radar scenes for crop condition.
        citations:
          - sentinel
        category: Satellite Imagery
        what_it_is: Supplies Copernicus optical and radar scenes for crop condition, complementing NDVI through cloud cover and for verification.
        who_uses_it: Agronomy, Yield Modeling and Carbon Quantification teams.
        data_out:
          batch:
            types:
              - unstructured
              - structured
            volume: GBs per revisit
            interval: Per satellite revisit
  - name: Sustainability
    icon: gavel
    tiles:
      - name: Regrow MRV
        icon: gavel
        summary: Practice verification and carbon quantification for regenerative programs.
        citations:
          - regrow
        category: Carbon MRV Platform
        what_it_is: Handles practice verification and carbon quantification for regenerative programs, the measurement basis behind issued credits.
        who_uses_it: Sustainability, MRV & Verification and Carbon Program Lead teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.5-2 GB/day
            interval: Daily + verification cycles
      - name: Indigo Carbon
        icon: partner
        summary: Carbon credit issuance and soil carbon sampling workflows.
        citations:
          - indigo
        category: Carbon Credit Program
        what_it_is: Runs carbon credit issuance and soil-carbon sampling workflows, the issuance and sampling record for the carbon registry.
        who_uses_it: Sustainability, Carbon Program Lead and Scope 3 Reporting teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 100s of MB
            interval: Per sampling / issuance cycle
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Legacy Co-op Mart
        icon: fed
        summary: Patronage and historical elevator marts queried in place under Unity Catalog.
        category: Co-op Data Warehouse
        what_it_is: Patronage and historical elevator marts kept in the legacy warehouse and queried in place through federation rather than copied.
        who_uses_it: Finance & Risk, CFO & Controller and Member board analysts.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: USDA NASS QuickStats
        icon: api
        summary: County yield, acreage and production statistics ingested for benchmarking.
        citations:
          - usda-nass
        category: Government Ag Statistics
        what_it_is: Provides county yield, acreage and production statistics ingested for benchmarking grower and regional performance.
        who_uses_it: Agronomy, Finance & Risk and Data Scientists.
        data_out:
          batch:
            types:
              - structured
            volume: 100s of MB
            interval: Periodic USDA releases
      - name: USDA RMA Crop Insurance
        icon: gavel
        summary: Policy, acreage and indemnity files for risk programs.
        citations:
          - usda-rma
        category: Crop Insurance Data
        what_it_is: Supplies policy, acreage and indemnity files for risk programs, the basis for crop-insurance exposure and coverage analysis.
        who_uses_it: Finance & Risk, Crop Insurance and Counterparty Risk teams.
        data_out:
          batch:
            types:
              - structured
            volume: 100s of MB
            interval: Periodic + reporting cycles
      - name: AgGateway ADAPT
        icon: zplug
        summary: Standardized machine and application data from mixed OEM fleets.
        citations:
          - aggateway
        category: Machine Data Standard (ADAPT)
        what_it_is: Standardises machine and application data from mixed OEM fleets, letting agronomy read as-applied data regardless of equipment brand.
        who_uses_it: Agronomy, Precision Ag Specialists and Data Engineers.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 0.5-3 GB/day in season
            interval: Per-operation sync
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Co-op Executive Board
        mark: Genie One
        summary: The CEO on margin per bushel and land strategy; the COO on harvest logistics, elevator throughput and cost per acre.
        uses:
          - - Genie One
            - Ask what last harvest cost per acre without analyst delay.
          - - AI/BI
            - Margin and yield on certified Metric Views.
          - - Unity Catalog
            - One bushel definition across operations and finance.
        sub:
          - name: CEO
            cares: margin per bushel, land strategy and the trade between growth and grower returns.
          - name: Chief Operating Officer
            cares: harvest logistics, elevator throughput and cost per acre across the network.
          - name: Member Board
            cares: patronage returns and the long-term value delivered back to grower-owners.
        ucs:
          - Harvest Logistics
          - Weather Risk Alerts
          - Patronage Planning
          - Input Cost Optimization
      - name: Agronomy
        mark: AI/BI
        summary: Hybrid selection, variable-rate prescriptions and scouting priorities, judged on yield per acre, input cost per bushel and nitrogen use.
        uses:
          - - Prescription Workbench
            - VR seed and nitrogen plans by productivity zone.
          - - AI/BI
            - Yield response curves on governed trial data.
        sub:
          - name: Lead Agronomist
            cares: hybrid selection and variable-rate plans that lift yield per acre.
          - name: Field Scouts
            cares: scouting priorities and where pest and disease pressure is building.
          - name: Precision Ag Specialist
            cares: productivity-zone mapping and nitrogen use efficiency by field.
        ucs:
          - Yield Forecasting
          - Variable-Rate Prescriptions
          - Weather Risk Alerts
      - name: Grain Merchandising
        mark: Model Serving
        summary: Basis trading, hedging and origination against futures and local bids, managed on position, basis exposure and hedge P&L.
        uses:
          - - Merchandising Desk
            - Position and basis exposure by location.
          - - Model Serving
            - Basis forecast models in the pricing path.
        sub:
          - name: Head Merchandiser
            cares: basis positions and hedge P&L against futures and local bids.
          - name: Origination
            cares: grower contracts and where to bid to fill the elevator at target basis.
          - name: Risk Desk
            cares: position limits and futures and basis exposure across locations.
        ucs:
          - Basis Trading
          - Harvest Logistics
          - Input Cost Optimization
      - name: Sustainability
        mark: Lakehouse//RT
        summary: Carbon programs, practice verification and Scope 3 reporting, tracked on carbon intensity, enrolled acres and credits issued per grower.
        uses:
          - - Carbon Registry
            - Issuance pipeline and practice compliance by grower.
          - - Lakehouse//RT
            - Practice events at operational latency.
        sub:
          - name: Carbon Program Lead
            cares: enrolled acres, practice compliance and credits issued per grower.
          - name: MRV & Verification
            cares: the measurement and verification behind every credit sent to a buyer.
          - name: Scope 3 Reporting
            cares: carbon intensity and water metrics reported to food-company buyers.
        ucs:
          - Carbon MRV
          - Supply Chain Traceability
      - name: Finance & Risk
        mark: AI/BI
        summary: Patronage, crop insurance and counterparty exposure, watching patronage pools, indemnity exposure and off-margin contracts.
        uses:
          - - AI/BI
            - Patronage and hedge P&L on certified views.
          - - Genie One
            - Ask which contracts are off-margin this week.
        sub:
          - name: CFO & Controller
            cares: patronage pools, working capital and grain accounting through fiscal close.
          - name: Crop Insurance
            cares: acreage reporting, indemnity exposure and RMA program compliance.
          - name: Counterparty Risk
            cares: off-margin contracts and counterparty exposure across the book.
        ucs:
          - Crop Insurance Analytics
          - Input Cost Optimization
          - Patronage Planning
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land equipment telemetry, satellite imagery, FMIS field plans and exchange ticks; own Bronze to Silver and the pager when the basis and yield tables stall.
        uses:
          - - Lakeflow Connect
            - Managed connectors for FMIS, ERP and commodity-market sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on machine and imagery feeds.
          - - Lakewatch
            - Freshness on the basis and yield tables merchandisers read at open.
        sub:
          - name: Ingestion Engineering
            cares: equipment telemetry, imagery and exchange ticks landed Bronze to Silver.
          - name: Pipeline On-Call
            cares: the pager when the basis and yield tables stall before market open.
          - name: Data Quality
            cares: expectations on machine, imagery and FMIS feeds before agronomy reads them.
        ucs:
          - Yield Forecasting
          - Basis Trading
          - Harvest Logistics
      - name: Data Scientists
        mark: MLflow
        summary: Yield-forecast, basis and soil-carbon quantification models built from imagery and trial data, and whether they still hold across a shifting season.
        uses:
          - - Feature Store
            - Field and weather features read identically in training and serving.
          - - MLflow
            - Every yield and basis model tracked for audit and reproduction.
          - - Model Serving
            - Basis and yield models scored in the pricing and prescription path.
        sub:
          - name: Yield Modeling
            cares: in-season yield forecasts from imagery, weather and hybrid response.
          - name: Quant & Basis
            cares: basis and hedge models that hold across a shifting season.
          - name: Carbon Quantification
            cares: soil-carbon models that survive third-party verification.
        ucs:
          - Yield Forecasting
          - Basis Trading
          - Carbon MRV
      - name: App Developers
        mark: Apps
        summary: Ship the harvest command, prescription workbench and carbon registry apps agronomy and merchandising work in, hosted next to governed field data.
        uses:
          - - Apps
            - Operational screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for prescription and contract state.
          - - Agent Bricks
            - Agents that draft prescriptions and offers against governed tools.
        sub:
          - name: Operational Apps
            cares: harvest command and prescription workbench next to governed field data.
          - name: Registry & Contracts
            cares: carbon registry and contract state on serverless Postgres.
          - name: Agent Builders
            cares: agents that draft prescriptions and offers against governed tools.
        ucs:
          - Harvest Logistics
          - Variable-Rate Prescriptions
          - Carbon MRV
