          - Credits issued
          - Carbon intensity
          - Practice compliance
          - Patronage pool
        teams:
          - Sustainability
          - Finance & Risk
          - Carbon Program Lead
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface. A managed Beta is available.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity AI Gateway
      - name: Claude Code
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity AI Gateway.
      - name: OpenAI Codex
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity AI Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity AI Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Yield & Agronomy Agent
        icon: genie
        summary: Ask about in-season yield, crop condition and prescription performance by field.
        feeds:
          - Planet Labs Imagery
          - Climate FieldView
          - John Deere Operations Center
          - Yield, margin and carbon
        teams:
          - Agronomy
          - Lead Agronomist
          - Precision Ag Specialist
        questions:
          - What is the current yield estimate by field and hybrid?
          - Which fields show declining crop condition on recent imagery?
          - How did variable-rate prescriptions perform versus flat rate?
          - Which fields have the best nitrogen use efficiency this season?
          - Where is pest or disease pressure building right now?
      - name: Basis & Merchandising Agent
        icon: genie
        summary: Explore basis positions, hedge exposure and origination against futures and local bids.
        feeds:
          - CME Group Futures
          - DTN ProphetX
          - SAP S/4HANA Agribusiness
          - Yield, margin and carbon
        teams:
          - Grain Merchandising
          - Head Merchandiser
          - Risk Desk
        questions:
          - What is our basis position by location right now?
          - How much futures and basis exposure is open against limits?
          - Where should we bid to fill the elevator at target basis?
          - What is hedge P&L by commodity this month?
          - Which contracts are off-margin at current prices?
      - name: Harvest & Elevator Ops Agent
        icon: genie
        summary: Answer harvest progress, elevator throughput and logistics bottleneck questions.
        feeds:
          - John Deere Operations Center
          - Agvance (SSI)
          - DTN Weather
          - Conformed fields and assets
        teams:
          - Co-op Executive Board
          - Chief Operating Officer
          - Origination
        questions:
          - What is harvest progress by region and crop today?
          - Where are elevator and dryer queues building right now?
          - Which routes have the longest truck wait at receiving?
          - What is cost per acre this harvest versus plan?
          - Which spray or harvest windows are at weather risk this week?
      - name: Carbon & Sustainability Agent
        icon: genie
        summary: Ask about enrolled acres, practice verification and credits issued per grower.
        feeds:
          - Regrow MRV
          - Indigo Carbon
          - Planet Labs Imagery
          - Yield, margin and carbon
        teams:
          - Sustainability
          - Carbon Program Lead
          - MRV & Verification
        questions:
          - How many acres are enrolled in carbon programs by practice?
          - Which enrolled fields are missing practice verification evidence?
          - How many credits have been issued per grower this cycle?
          - What is carbon intensity by crop for Scope 3 reporting?
          - Which practices are at risk of failing third-party verification?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Yield Forecasting
        short: Production
        icon: chart
        summary: In-season yield estimates from imagery, weather and hybrid response.
        problem: Yield is guessed from last year's average and a windshield survey, so seed, input and marketing decisions are made months before anyone has a defensible number per field.
        who_benefits: Agronomy
        how_built: Satellite imagery, weather and hybrid-trial features are engineered in Feature Store and scored through Model Serving, with runs tracked in MLflow across the season.
        components:
          - Harvest Command
          - Planet Labs Imagery
          - Model Serving
          - Feature Store
          - MLflow
        stories:
          - title: Agerpoint partners with Databricks for agriculture data intelligence
            url: https://www.agerpoint.com/blog/agerpoint-partners-with-databricks-to-scale-enterprise-data-intelligence-for-agriculture-and-nature-systems
          - title: Databricks spatial joins for crop yield analysis and forecasting
            url: https://www.databricks.com/blog/databricks-spatial-joins-now-17x-faster-out-box
      - name: Variable-Rate Prescriptions
        short: Agronomy
        icon: iot
        summary: Input rates optimized by zone rather than flat application.
        problem: Inputs go on at flat rates because field, soil and yield layers live in different tools and never line up, so money is spent on acres that cannot return it.
        who_benefits: Agronomy
        how_built: Soil, yield and imagery layers are scored with AI Functions and Model Serving in the Prescription Workbench, then written back to the applicator and Deere Operations Center as VR files.
        components:
          - Prescription Workbench
          - Model Serving
          - AI Functions
          - John Deere Operations Center
          - Delta Lake
        stories:
          - title: 'Geospatial Unbounded: variable-rate prescription from soil, zones and weather'
            url: https://www.databricks.com/blog/geospatial-unbounded-spatial-sql-ga-aibi-maps-delta-sharing-and-iceberg-v3
      - name: Basis Trading
        short: Merchandising
        icon: market
        summary: Local basis positions managed against futures and storage.
        problem: Basis is tracked on spreadsheets against futures and a dozen local bids, so positions and hedge exposure lag the market and a bad basis call quietly erodes margin on every bushel.
        who_benefits: Grain Merchandising
        how_built: Futures, cash bids and position feeds land in Lakehouse//RT and basis-forecast models scored in Model Serving surface position and exposure in the Merchandising Desk.
        components:
          - Merchandising Desk
          - Lakehouse//RT
          - Model Serving
          - CME Group Futures
          - DTN ProphetX
      - name: Harvest Logistics
        short: Operations
        icon: stream
        summary: Truck routing and elevator scheduling to minimize wait and shrink.
        problem: At harvest, trucks, elevators and dryers are coordinated by phone, so queues build, grain shrinks in the wait and no one sees where the network is bottlenecked until it is too late.
        who_benefits: Co-op Executive Board
        how_built: Scale tickets, equipment telemetry and elevator status stream into Lakehouse//RT and route-and-scheduling logic surfaces live queues and dryer capacity in Harvest Command.
        components:
          - Harvest Command
          - Lakehouse//RT
          - John Deere Operations Center
          - Model Serving
          - Delta Lake
      - name: Crop Insurance Analytics
        short: Risk
        icon: gavel
        summary: Acreage and indemnity exposure modeled before planting decisions.
        problem: Acreage and indemnity exposure is pieced together from policy files after planting, so coverage and risk decisions are made without a clear picture of what is really at stake.
        who_benefits: Finance & Risk
        how_built: USDA RMA policy and acreage files are conformed under Unity Catalog and modeled in AI/BI, so indemnity exposure and coverage scenarios are analysed before planting decisions are locked.
        components:
          - USDA RMA Crop Insurance
          - Unity Catalog
          - AI/BI
          - Delta Lake
          - Genie One
        stories:
          - title: Real-Time Agricultural Risk Portfolio Management
            url: https://www.databricks.com/resources/demos/videos/real-time-agricultural-risk-portfolio-management
      - name: Carbon MRV
        short: Sustainability
        icon: partner
        summary: Practice verification and quantification for credit programs.
        problem: Carbon programs enroll acres faster than they can prove the outcome, and practice evidence stitched from spreadsheets and one-off models will not survive third-party verification.
        who_benefits: Sustainability
        how_built: Imagery, practice and soil data feed carbon models scored in Model Serving, with Unity Catalog holding auditable lineage from field practice to issued credit in the Carbon Registry.
        components:
          - Carbon Registry
          - Model Serving
          - Regrow MRV
          - Unity Catalog
          - Planet Labs Imagery
        stories:
          - title: Agerpoint partners with Databricks for agriculture and nature systems
            url: https://www.agerpoint.com/blog/agerpoint-partners-with-databricks-to-scale-enterprise-data-intelligence-for-agriculture-and-nature-systems
      - name: Supply Chain Traceability
        short: Traceability
        icon: product
        summary: Lot lineage from field through elevator to customer.
        problem: Provenance from field to customer is scattered across ERP, elevator and grower systems, so lot lineage and sourcing claims are assembled by hand and hard to defend to a buyer or auditor.
        who_benefits: Sustainability
        how_built: Field, elevator and ERP data are conformed under Unity Catalog and published as governed data products shared to food-company buyers and lenders over OpenSharing.
        components:
          - SAP S/4HANA Agribusiness
          - Unity Catalog
          - Data Products
          - OpenSharing
          - Delta Lake
        stories:
          - title: UPL optimizes supply chain operations with demand forecasting
            url: https://www.databricks.com/customers/upl
      - name: Input Cost Optimization
        short: Finance
        icon: erp
        summary: Seed and chemical spend per bushel against plan.
        problem: Seed and chemical spend is reconciled against plan long after the season, so overspend on an acre or a hybrid is found at close rather than while there is still time to change the order.
        who_benefits: Finance & Risk
        how_built: Application records, ERP purchases and yield outcomes are conformed on Delta Lake and tracked in AI/BI, so cost per bushel is measured against plan by field, hybrid and input.
        components:
          - Traction Ag
          - SAP S/4HANA Agribusiness
          - Delta Lake
          - AI/BI
          - Genie One
        stories:
          - title: UPL optimizes supply chain operations with demand forecasting
            url: https://www.databricks.com/customers/upl
          - title: FMC optimizes harvests with data and AI
            url: https://www.databricks.com/customers/fmc-corporation
      - name: Weather Risk Alerts
        short: Risk
        icon: stream
        summary: Frost, drought and spray window alerts pushed to operations.
        problem: Frost, drought and spray-window warnings arrive as generic regional forecasts, so operations cannot tell which fields are actually at risk or act before the window to protect them closes.
        who_benefits: Co-op Executive Board
        how_built: Hyperlocal forecasts stream into Lakehouse//RT and are joined to field boundaries, so frost, drought and spray-window alerts push to operations in Harvest Command as risk emerges.
        components:
          - Harvest Command
          - DTN Weather
          - Lakehouse//RT
          - Planet Labs Imagery
          - AI Functions
        stories:
          - title: Real-Time Agricultural Risk Portfolio Management
            url: https://www.databricks.com/resources/demos/videos/real-time-agricultural-risk-portfolio-management
      - name: Patronage Planning
        short: Finance
        icon: chart
        summary: Patronage pools modeled before fiscal close.
        problem: Patronage pools are modeled in spreadsheets against provisional volumes, so the board reaches fiscal close without a reliable view of what can be returned to grower-members.
        who_benefits: Finance & Risk
        how_built: Grain accounting, volume and margin data are conformed on Delta Lake and modeled in AI/BI, so patronage pools and member returns can be scenario-tested before fiscal close.
        components:
          - Agvance (SSI)
          - Delta Lake
          - AI/BI
          - Genie One
          - Unity Catalog
medallion:
  Bronze:
    short: Raw field and market feeds
    summary: Telemetry from equipment, weather stations, satellite imagery and exchange ticks, landed exactly as received so a yield estimate can be replayed.
  Silver:
    short: Conformed fields and assets
    summary: Fields, parcels, equipment and contracts resolved into single entities across FMIS, ERP and trading systems.
  Gold:
    short: Yield, margin and carbon
    summary: 'Contracted products agronomy and finance run on: yield per acre, input cost per bushel, basis and carbon intensity scores.'
