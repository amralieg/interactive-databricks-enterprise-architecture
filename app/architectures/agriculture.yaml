  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Yield & Input Cost
        icon: aibi
        summary: Yield per acre, input cost per bushel and prescription performance by field.
        kpis:
          - Yield per acre
          - Input cost per bushel
          - Nitrogen use efficiency
