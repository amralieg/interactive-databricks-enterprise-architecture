  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Predictive Maintenance
        short: Rolling stock
        icon: iot
        summary: Predicting component removal from sensor, telematics and defect history so a failure in service becomes a planned depot visit.
        problem: A traction motor or door fault discovered in service cancels trains and cascades across the diagram. Removals need predicting from actual condition, not a calendar, so the fix becomes a planned depot visit.
        who_benefits: Fleet & Assets
        how_built: Fleet telematics, sensor and Maximo defect history feed remaining-useful-life models tracked in MLflow and scored in Model Serving; predicted removals raise work orders from Asset Health Watch.
        components:
          - Asset Health Watch
          - IBM Maximo
          - MLflow
          - Model Serving
          - Wayside Detectors
        stories:
          - title: 'Hitachi: predictive maintenance on railway overhead lines'
            url: https://www.databricks.com/customers/hitachi
          - title: Predictive maintenance on the Databricks Lakehouse
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
      - name: Track Inspection
        short: Infrastructure
        icon: gauge
        summary: Turning track-geometry and wayside inspection data into defect predictions so a rail or bearing fault is caught before it becomes a slow order or a derailment risk.
        problem: Track and structures are inspected on a fixed cycle; a geometry defect or a hot bearing that develops between inspections is found late, forcing an emergency slow order or worse.
        who_benefits: Fleet & Assets
        how_built: Track-geometry runs, wayside detector readings and inspection notes are conformed in Delta Lake; defect and severity models score each segment through Model Serving and AI Functions triages the backlog.
        components:
          - Track Geometry
          - Wayside Detectors
          - Model Serving
          - AI Functions
          - Asset Health Watch
        stories:
          - title: ARTC unifies 8,500km of rail network data on Databricks
            url: https://www.databricks.com/customers/artc
          - title: 'Sporveien: analysing Oslo metro operations on Databricks'
            url: https://www.databricks.com/blog/2017/06/14/analyzing-metro-operations-using-apache-spark.html
      - name: Delay Prediction
        short: Punctuality
        icon: stream
        summary: Predicting where the network will run late from live movement, signaling and knock-on effects, so controllers intervene before the delay propagates.
        problem: On-time performance is lost to knock-on delay that propagates faster than a controller can see it. Explained after the fact it is a report; predicted, it is a decision.
        who_benefits: Network Ops
        how_built: AVL, signaling and GTFS-RT feeds stream into Lakehouse//RT; delay-probability models score each service through Model Serving and surface in the Dispatch Cockpit and AI/BI.
        components:
          - Dispatch Cockpit
          - Lakehouse//RT
          - Model Serving
          - GTFS / GTFS-RT
          - AI/BI
        stories:
          - title: BKK transforms Budapest city mobility with Databricks
            url: https://www.databricks.com/blog/driving-budapest-forward-how-bkk-uses-databricks-transform-city-mobility
      - name: Network Dispatch Opt
        short: Movement planning
        icon: network
        summary: Optimising train movements, meets and passes across a congested network so throughput and reliability rise without new track.
        problem: On a single-track or congested network, meet-and-pass and dispatch decisions made locally leave capacity and reliability on the table that a network-wide view would recover.
        who_benefits: Network Ops
        how_built: Movement, TMS and infrastructure feeds are conformed and served in Lakehouse//RT; movement-optimisation models are scored through Model Serving and actioned from the Dispatch Cockpit on Lakebase.
        components:
          - Dispatch Cockpit
          - RailConnect TMS
          - Model Serving
          - Lakehouse//RT
          - Lakebase
        stories:
          - title: J.B. Hunt builds its transportation network on Databricks
            url: https://www.databricks.com/customers/jbhunt
          - title: A major freight railroad scales pipelines with Genie Code
            url: https://www.databricks.com/blog/how-major-freight-railroad-scaled-pipeline-creation-genie-code
      - name: Ridership Forecast
        short: Demand
        icon: market
        summary: Forecasting ridership and origin-destination demand from AFC taps, schedules and events so service and capacity match how people actually travel.
        problem: Service and capacity are planned on last year's timetable while demand shifts with events, seasons and land use. Overcrowding and empty trains are both the same missing forecast.
        who_benefits: Revenue & Fares
        how_built: AFC tap and ridership data are conformed with schedule and event feeds; demand models score each line and time band through Model Serving and Feature Store, explored in Ridership Studio.
        components:
          - Ridership Studio
          - Cubic AFC
          - Model Serving
          - AI/BI
          - Feature Store
        stories:
          - title: BKK transforms Budapest city mobility with Databricks
            url: https://www.databricks.com/blog/driving-budapest-forward-how-bkk-uses-databricks-transform-city-mobility
          - title: Grab unifies transport data with C360 on Databricks
            url: https://www.databricks.com/customers/grab
      - name: Energy & Traction Opt
        short: Cost & emissions
        icon: chart
        summary: Cutting traction energy and emissions through driving-style, timetable and route decisions scored against live speed and load data.
        problem: Traction energy is a top controllable cost and emissions line, yet driving-style and timetable decisions are made without the speed, gradient and load data that would optimise them.
        who_benefits: Network Ops
        how_built: AVL, speed and load data are conformed to Gold; energy-optimisation recommendations are scored in Model Serving and reconciled against the network's sustainability reporting.
        components:
          - AVL / GPS Telemetry
          - Model Serving
          - AI/BI
          - Lakeflow
        stories:
          - title: BKK optimises route performance and energy with Databricks
            url: https://www.databricks.com/blog/driving-budapest-forward-how-bkk-uses-databricks-transform-city-mobility
      - name: Crew & Scheduling
        short: Planning
        icon: people
        summary: Building legal, low-cost crew rosters and repairing them when the operation moves, without tipping a crew into a duty-hours breach.
        problem: Legal, low-cost rosters must hold under duty-hours rules and then be repaired the moment the operation moves, without ever running a crew past their limits.
        who_benefits: Network Ops
        how_built: HASTUS roster and duty state is conformed and served in Lakehouse//RT; disruption models flag crews nearing limits so rosters are repaired before they break.
        components:
          - GIRO HASTUS
          - Model Serving
          - Lakehouse//RT
          - AI/BI
        stories:
          - title: 'BKK: dynamic scheduling and capacity on Databricks'
            url: https://www.databricks.com/blog/driving-budapest-forward-how-bkk-uses-databricks-transform-city-mobility
      - name: Safety Event Analytics
        short: Safety
        icon: gavel
        summary: Mining signaling, PTC and incident data for the precursors that precede a SPAD or a collision, so the risk is retired before it becomes an event.
        problem: Signaling exceedances, PTC enforcements and near-misses hold the precursors of the next serious event, but scattered across systems they are counted after the fact rather than acted on.
        who_benefits: Safety & Reg
        how_built: PTC, signaling and incident feeds are governed in Unity Catalog and analysed in Delta Lake; AI Functions classifies incident narratives and Safety Insights surfaces precursor patterns.
        components:
          - Safety Insights
          - Wabtec I-ETMS PTC
          - AI Functions
          - Unity Catalog
          - Delta Lake
        stories:
          - title: Hitachi makes railways safer with AI on Databricks
            url: https://www.databricks.com/customers/hitachi
      - name: Live Passenger Info
        short: Rider experience
        icon: chat
        summary: Turning live movement and prediction into accurate arrivals and disruption messaging pushed to riders through open feeds and journey planners.
        problem: Riders judge a service on whether the arrival board is right. When real-time prediction lags the actual train, trust in the whole network erodes.
        who_benefits: Network Ops
        how_built: GTFS-RT and AVL feeds stream into Lakehouse//RT; predicted arrivals are published through GTFS-RT open feeds to journey planners and surfaced in AI/BI.
        components:
          - GTFS / GTFS-RT
          - Lakehouse//RT
          - GTFS-RT Open Feeds
          - AI/BI
        stories:
          - title: Grab unifies transport data with C360 on Databricks
            url: https://www.databricks.com/customers/grab
          - title: BKK transforms Budapest city mobility with Databricks
            url: https://www.databricks.com/blog/driving-budapest-forward-how-bkk-uses-databricks-transform-city-mobility
      - name: Revenue Protection
        short: Fare integrity
        icon: market
        summary: Detecting fare evasion, AFC leakage and reconciliation gaps so revenue that is being earned actually lands.
        problem: Fare revenue leaks through evasion, mis-taps and reconciliation gaps between the AFC estate and the general ledger, and the leakage is invisible until an audit finds it.
        who_benefits: Revenue & Fares
        how_built: AFC tap, gate and reconciliation data are joined in the lakehouse; evasion and anomaly models score patterns through Model Serving and AI Functions flags reconciliation breaks in Ridership Studio.
        components:
          - Ridership Studio
          - Cubic AFC
          - Model Serving
          - AI Functions
          - Scheidt & Bachmann
medallion:
  Bronze:
    short: Raw operational feeds
    summary: PTC and signaling event logs, AVL and GPS position pings, AFC tap and ticketing transactions, Maximo and SAP work orders, wayside detector and track-geometry readings, and GTFS-RT trip updates, landed exactly as received so a delay code or a fare can always be replayed as it stood.
  Silver:
    short: Conformed train, asset, trip
    summary: Trains, rolling-stock and track assets, and scheduled trips resolved into single conformed entities across the signaling, dispatch, maintenance and fare estates, with station and stop codes reconciled and multi-leg journeys stitched to one trip.
  Gold:
    short: OTP, availability, ridership
    summary: 'Contracted products the operations and commercial teams run on: on-time performance and delay attribution by cause, asset availability and mean distance between failures, ridership and farebox recovery by line, and energy per train-kilometre.'
