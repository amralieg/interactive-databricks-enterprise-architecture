name: Rail & Transit
description: 'Freight railroads and passenger transit: rolling-stock and track maintenance, signaling and PTC, network dispatch, fare collection and ridership, scheduling and safety reporting.'
sources:
  - name: Asset & Maintenance
    icon: erp
    tiles:
      - name: IBM Maximo
        icon: erp
        summary: 'Enterprise asset management for rolling stock and infrastructure: work orders, component lifing, defect history and maintenance planning against every asset.'
        citations:
          - maximo
        category: Enterprise Asset Management (EAM)
        what_it_is: Holds work orders, component lifing, defect history and maintenance plans against every rolling-stock and infrastructure asset, the system of record for asset condition.
        who_uses_it: Fleet & Assets, Rolling-stock engineering and Maintenance planning teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Nightly batch + hourly work-order deltas
      - name: SAP EAM
        icon: erp
        summary: Plant maintenance and enterprise asset management where SAP is the incumbent, feeding the same asset, work-order and spares entities.
        citations:
          - sap-eam
        category: Enterprise Asset Management (EAM)
        what_it_is: Runs plant maintenance and asset management where SAP is the incumbent, feeding the same asset, work-order and spares entities into the fleet view.
        who_uses_it: Fleet & Assets, Maintenance planning and Data Engineers.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Nightly batch + hourly deltas
      - name: Bentley AssetWise
        icon: db
        summary: 'Linear and infrastructure asset management: track, structures and signaling assets, their condition and their inspection and renewal history.'
        citations:
          - assetwise
        category: Linear/Infrastructure Asset Management
        what_it_is: Manages linear and infrastructure assets, track, structures and signaling, with their condition and inspection and renewal history for renewal planning.
        who_uses_it: Fleet & Assets, Infrastructure & track and Maintenance planning teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-10 GB/day
            interval: Daily batch + inspection loads
  - name: Signaling & Control
    icon: network
    tiles:
      - name: Wabtec I-ETMS PTC
        icon: network
        summary: 'Interoperable positive train control: on-board and back-office enforcement of movement authority, the source of exceedance and enforcement events.'
        citations:
          - ptc
        category: Positive Train Control (PTC)
        what_it_is: Enforces movement authority on-board and in the back office, emitting exceedance and enforcement events that carry the precursors of a serious signaling event.
        who_uses_it: Safety & Reg, Safety assurance and Network Ops teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds-thousands of events/sec
            interval: Continuous enforcement events
      - name: Siemens Trainguard
        icon: network
        summary: CBTC and automatic train control for mass transit, the moving-block signaling basis for headway, throughput and energy-optimised driving.
        citations:
          - trainguard
        category: CBTC / Automatic Train Control
        what_it_is: Provides moving-block CBTC and automatic train control for mass transit, the basis for headway, throughput and energy-optimised driving.
        who_uses_it: Network Ops, Dispatchers and Energy & traction teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: thousands of state messages/sec
            interval: Continuous (sub-second)
      - name: Alstom Signalling
        icon: iot
        summary: Interlockings, ETCS and wayside signaling, the source of route setting, occupancy and aspect state across the network.
        citations:
          - alstom-sig
        category: Signaling & Interlocking (ETCS)
        what_it_is: Runs interlockings, ETCS and wayside signaling, the source of route setting, track occupancy and aspect state across the network.
        who_uses_it: Network Ops, Safety assurance and Dispatchers.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds-thousands of events/sec
            interval: Continuous signaling events
  - name: Dispatch & Network Ops
    icon: stream
    tiles:
      - name: RailConnect TMS
        icon: stream
        summary: 'Wabtec transportation management: train sheets, crew calling, waybills and movement authority, the operational backbone of a freight railroad.'
        citations:
          - wabtec
        category: Rail Transportation Management System
        what_it_is: Manages train sheets, crew calling, waybills and movement authority, the operational backbone a freight railroad dispatches from.
        who_uses_it: Network Ops, Dispatchers and Crew control teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Hourly batch
          stream:
            types:
              - semi-structured
            volume: hundreds of movement events/sec
            interval: Continuous movement events
      - name: Alstom Onvia
        icon: gauge
        summary: 'Integrated traffic management and control centre: dispatcher decisions, conflict detection and network-wide movement supervision.'
        citations:
          - alstom-sig
        category: Traffic Management System (TMS)
        what_it_is: Provides integrated traffic management and control-centre supervision, capturing dispatcher decisions, conflict detection and network-wide movement.
        who_uses_it: Network Ops, Dispatchers and Passenger information teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous control-centre events
      - name: AVL / GPS Telemetry
        icon: iot
        summary: Automatic vehicle location and GPS pings from locomotives and transit vehicles, the ground truth for position, speed and run adherence.
        category: Vehicle Location (AVL/GPS)
        what_it_is: Streams automatic vehicle location and GPS pings from locomotives and transit vehicles, the ground truth for position, speed and run adherence.
        who_uses_it: Network Ops, Passenger information and Energy & traction teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-10k pings/sec across fleet
            interval: Continuous (seconds)
  - name: Fare & Ridership
    icon: market
    tiles:
      - name: Cubic AFC
        icon: market
        summary: 'Automated fare collection: gates, validators, account-based ticketing and the tap transactions that measure ridership and revenue.'
        citations:
          - cubic
        category: Automated Fare Collection (AFC)
        what_it_is: Runs gates, validators and account-based ticketing, the tap transactions that measure ridership and revenue across the network.
        who_uses_it: Revenue & Fares, Fare collection and Commercial planning teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-20 GB/day
            interval: Hourly reconciliation batch
          stream:
            types:
              - semi-structured
            volume: hundreds-thousands of taps/sec at peak
            interval: Continuous tap events
      - name: INIT
        icon: partner
        summary: 'Fare collection and CAD/AVL for public transit: ticketing, vehicle location and passenger counting on one integrated estate.'
        citations:
          - init
        category: Fare Collection & CAD/AVL
        what_it_is: Integrates fare collection with CAD/AVL and automatic passenger counting on one estate, joining ticketing to vehicle location and loads.
        who_uses_it: Revenue & Fares, Fare collection and Network Ops teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-8 GB/day
            interval: Hourly batch
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous validation events
      - name: Scheidt & Bachmann
        icon: product
        summary: 'Fare collection and ticketing systems: validators, ticket vending and the back office that reconciles fares to revenue.'
        citations:
          - scheidt
        category: Fare Collection & Ticketing
        what_it_is: Provides validators, ticket vending and the back office that reconciles fares to revenue, a source for revenue-protection analysis.
        who_uses_it: Revenue & Fares, Fare collection and Revenue protection teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Daily reconciliation batch
  - name: Scheduling & Sensors
    icon: sheet
    tiles:
      - name: GIRO HASTUS
        icon: sheet
        summary: 'Transit scheduling and crew rostering: timetables, blocking, runcutting and rosters, the plan the operation is measured against.'
        citations:
          - hastus
        category: Transit Scheduling & Rostering
        what_it_is: Builds timetables, blocking, runcutting and crew rosters, the plan the operation is measured against and repaired from during disruption.
        who_uses_it: Network Ops, Crew control and Commercial planning teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-5 GB/day
            interval: Daily + schedule-change batch
      - name: GTFS / GTFS-RT
        icon: stream
        summary: General Transit Feed Specification static schedules and real-time trip updates, the open standard for stops, trips and live arrivals.
        citations:
          - gtfs
        category: Transit Data Standard (GTFS)
        what_it_is: Carries static GTFS schedules and GTFS-RT real-time trip updates, the open standard for stops, trips and live arrivals used for delay and passenger info.
        who_uses_it: Network Ops, Passenger information and Revenue & demand teams.
        data_out:
          batch:
            types:
              - structured
            volume: 100s of MB
            interval: Daily static feed
          stream:
            types:
              - semi-structured
            volume: hundreds of trip updates/sec
            interval: Continuous (seconds)
      - name: Wayside Detectors
        icon: iot
        summary: Hot bearing, wheel-impact and dragging-equipment detectors along the track, catching a failing axle before it becomes a derailment.
        citations:
          - hotbox
        category: Wayside Condition Monitoring
        what_it_is: Reads hot-bearing, wheel-impact and dragging-equipment detectors along the track, catching a failing axle before it becomes a derailment.
        who_uses_it: Fleet & Assets, Infrastructure & track and Safety assurance teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: tens-hundreds of detections/sec
            interval: Continuous per train pass
      - name: Track Geometry
        icon: iot
        summary: Track-geometry inspection car runs measuring gauge, alignment and cant, the basis for slow orders and renewal planning.
        citations:
          - trackgeo
        category: Track Geometry Inspection
        what_it_is: Records track-geometry inspection car runs measuring gauge, alignment and cant, the basis for slow orders and renewal planning.
        who_uses_it: Fleet & Assets, Infrastructure & track and Maintenance planning teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs per inspection run
            interval: Per inspection run (weekly/monthly)
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Cost & Revenue Marts
        icon: fed
        summary: Finance, farebox recovery and subsidy marts left where they are and queried in place under Unity Catalog, which avoids a second copy of the audited numbers.
        category: Finance Data Warehouse
        what_it_is: Finance, farebox-recovery and subsidy marts kept in the incumbent warehouse and queried in place through federation, avoiding a second copy of the audited numbers.
        who_uses_it: Executive Team, CFO & Finance and Revenue & demand analysts.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: Mobile Ticketing
        icon: api
        summary: Account-based and mobile ticketing platforms carrying purchases and validations inbound, joined to AFC taps for ridership and revenue.
        citations:
          - masabi
        category: Mobile / Account-Based Ticketing
        what_it_is: Account-based and mobile ticketing platforms carrying purchases and validations inbound, joined to AFC taps for a full ridership and revenue picture.
        who_uses_it: Revenue & Fares, Fare collection and Commercial planning teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds of purchases/validations/sec
            interval: Continuous (API / webhook)
      - name: Weather & Geo
        icon: globe
        summary: Weather, geospatial and land-use feeds joined to movement and demand for delay, energy and ridership analysis.
        category: Weather & Geospatial Data
        what_it_is: Weather, geospatial and land-use feeds joined to movement and demand for delay, energy and ridership analysis.
        who_uses_it: Network Ops, Revenue & demand and Data Scientists.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 1-5 GB/day
            interval: Hourly forecast + daily geo
      - name: IoT Event Streams
        icon: stream
        summary: Existing Kafka or event-hub topics carrying AVL, sensor and PTC events, landed generically as structured events.
        category: Event Streaming Platform
        what_it_is: Existing Kafka or event-hub topics carrying AVL, sensor and PTC events, landed generically as structured events for downstream conforming.
        who_uses_it: Data Engineers, Streaming engineers and Network Ops teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: thousands of events/sec
            interval: Continuous (sub-second)
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Executive Team
        mark: Genie One
        summary: The CEO on network reliability, the capital program and the trade between growth and cost; the CFO on farebox recovery, subsidy and cost per train-kilometre; the Chief Operating Officer on on-time performance, disruption cost and the safety record.
        uses:
          - - Genie One
            - Ask what yesterday's punctuality or asset availability was, without booking analyst time.
          - - AI/BI
            - On-time performance, ridership, asset availability and cost per train-km on one certified set of Metric Views.
          - - Unity Catalog
            - Certification and the glossary so "on time" and "availability" mean one thing across the network.
        sub:
          - name: CEO
            cares: network reliability, the capital program and the safety record.
          - name: CFO & Finance
            cares: farebox recovery, subsidy and cost per train-kilometre.
          - name: Chief Operating Officer
            cares: on-time performance, disruption cost and asset availability.
        ucs:
          - Delay Prediction
          - Predictive Maintenance
          - Ridership Forecast
          - Network Dispatch Opt
      - name: Network Ops
        mark: Lakehouse//RT
        summary: Dispatchers and network controllers running a live railroad; crew control repairing rosters when the operation moves; passenger information teams keeping riders accurately informed through disruption.
        uses:
          - - Dispatch Cockpit
            - Movement and dispatch decisions costed across trains, crews and infrastructure together.
          - - Lakehouse//RT
            - Live network state at the latency a train movement moves at.
          - - Model Serving
            - Delay-probability and conflict-resolution models scored inside the operational path.
        sub:
          - name: Dispatchers
            cares: train movement, conflicts and network control from the control centre.
          - name: Crew control
            cares: roster repair and duty-limit compliance when the operation moves.
          - name: Passenger information
            cares: real-time arrivals and disruption messaging to riders.
        ucs:
          - Delay Prediction
          - Network Dispatch Opt
          - Energy & Traction Opt
          - Crew & Scheduling
          - Live Passenger Info
      - name: Fleet & Assets
        mark: Model Serving
        summary: Rolling-stock and infrastructure engineers on predicted component removals, track condition and the Maximo work orders raised against the fleet and network they already run.
        uses:
          - - Asset Health Watch
            - Predicted component and track failures raised as work orders before they strand a train.
          - - MLflow
            - Remaining-useful-life and defect models tracked for audit and reproduction.
          - - Model Serving
            - Removal and defect models scored against live sensor and inspection data.
        sub:
          - name: Rolling-stock engineering
            cares: component lifing and predicted removals across the fleet.
          - name: Infrastructure & track
            cares: track geometry, structures and wayside asset condition.
          - name: Maintenance planning
            cares: depot capacity, spares and the planned-work window against fleet availability.
        ucs:
          - Predictive Maintenance
          - Track Inspection
          - Energy & Traction Opt
      - name: Revenue & Fares
        mark: AI/BI
        summary: Revenue and ridership teams on farebox recovery, demand and fares; fare collection teams on AFC integrity, reconciliation and revenue protection.
        uses:
          - - Ridership Studio
            - Ridership, origin-destination demand and farebox recovery on certified definitions.
          - - AI/BI
            - Demand, ridership and revenue on the same definitions the executive team reads.
          - - Feature Store
            - Demand and revenue features defined once and read identically in training and serving.
        sub:
          - name: Revenue & demand
            cares: ridership forecasting, fares and farebox recovery.
          - name: Fare collection
            cares: AFC integrity, reconciliation and revenue protection.
          - name: Commercial planning
            cares: fare policy, concession schemes and origin-destination demand by line.
        ucs:
          - Ridership Forecast
          - Revenue Protection
          - Live Passenger Info
      - name: Safety & Reg
        mark: Unity Catalog
        summary: Safety and compliance teams on signaling and PTC event analysis, incident investigation and the punctuality, safety and emissions reporting filed with the authority.
        uses:
          - - Safety Insights
            - Signaling, PTC and incident events analysed for precursors before they become events.
          - - Unity Catalog
            - Governed, auditable safety and regulatory tables with lineage end to end.
          - - AI Functions
            - Incident reports and inspection notes classified and summarised at scale.
        sub:
          - name: Safety assurance
            cares: precursor analysis on signaling, PTC and near-miss data.
          - name: Regulatory reporting
            cares: punctuality, safety and emissions submissions to the authority.
          - name: Incident investigation
            cares: root-cause analysis and corrective actions after a SPAD or incident.
        ucs:
          - Safety Event Analytics
          - Track Inspection
          - Predictive Maintenance
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land the EAM, signaling and PTC, AVL, AFC and GTFS-RT feeds; own the Bronze to Silver path and the pager when a pipeline breaks.
        uses:
          - - Lakeflow Connect
            - Managed connectors for Maximo, SAP and the AFC and scheduling systems.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on movement, sensor and tap feeds.
          - - Lakewatch
            - Freshness on the tables dispatch and revenue teams read every morning.
        sub:
          - name: Ingestion engineers
            cares: EAM, AFC and scheduling feeds into Bronze.
          - name: Streaming engineers
            cares: AVL, PTC and GTFS-RT events into Lakehouse//RT.
          - name: Platform & governance
            cares: Unity Catalog permissions and pipeline SLAs.
        ucs:
          - Delay Prediction
          - Predictive Maintenance
          - Network Dispatch Opt
      - name: Data Scientists
        mark: MLflow
        summary: Delay-probability, remaining-useful-life, demand and energy-optimisation models, and whether they still hold six months after deployment.
        uses:
          - - Feature Store
            - Features defined once and read identically in training and serving.
          - - MLflow
            - Every run tracked for audit and reproduction.
          - - Model Serving
            - Delay, RUL and demand models scored in the operational path.
        sub:
          - name: Reliability modelers
            cares: remaining-useful-life on sensor and defect history.
          - name: Ops & demand modelers
            cares: delay-probability and ridership demand models.
          - name: MLOps
            cares: tracking and serving models in the operational path.
        ucs:
          - Predictive Maintenance
          - Delay Prediction
          - Ridership Forecast
      - name: App Developers
        mark: Apps
        summary: Ship the dispatch, asset-health, ridership and safety applications the railroad works in, hosted next to governed data.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for dispatch decisions and work-order writes.
          - - Agent Bricks
            - Agents that draft a recovery plan or work order against governed tools.
        sub:
          - name: Operational app developers
            cares: dispatch, asset-health and ridership screens.
          - name: Backend & Lakebase
            cares: dispatch and work-order state with governed writes.
          - name: Agent developers
            cares: recovery-plan and work-order drafting agents.
        ucs:
          - Network Dispatch Opt
          - Predictive Maintenance
consumers:
  - name: BI & Productivity
    icon: chart
    from: bi
    tiles:
      - name: Tableau / Power BI
        icon: chart
        summary: External BI against SQL warehouses, with Unity Catalog permissions enforced end to end.
      - name: Microsoft Teams
        icon: chat
        summary: Genie in Teams for Unity Catalog-governed answers from the lakehouse, and delay and disruption updates in the channel the operation already works in (Beta).
      - name: Notebooks & IDEs
        icon: notebook
        summary: Notebooks, VS Code and JetBrains against governed data and Genie Code.
  - name: Riders & Partners
    icon: partner
    tiles:
      - name: GTFS-RT Open Feeds
        icon: share
        summary: Live arrivals and disruption published as GTFS-RT to journey planners and rider apps from the same predictions the operation runs on.
        citations:
          - gtfs
      - name: Delta Sharing
        icon: share
        summary: Neighbouring operators, authorities and infrastructure owners reading live schedule and disruption state rather than nightly file exchange.
      - name: Journey Planner APIs
        icon: api
        summary: Trip planning and arrival APIs served to rider apps and third-party mobility platforms.
  - name: Operational Writeback
    icon: opdb
    tiles:
      - name: Maximo Work Orders
        icon: erp
        summary: Predicted component and track removals raised as maintenance work orders against the asset, in the system engineering already works in.
        citations:
          - maximo
      - name: Dispatch Writeback
        icon: db
        summary: Recovery and movement decisions written back into the dispatch and TMS estate so the answer reaches the controller's screen.
      - name: Crew & Field Mobile
        icon: apps
        summary: Roster changes, standby calls and inspection tasks pushed to the devices crew and field teams actually carry.
  - name: Regulatory & Reporting
    icon: gavel
    tiles:
      - name: Safety Submissions
        icon: gavel
        summary: Punctuality, safety and incident reporting to the rail safety authority, produced from the same governed tables the railroad runs on.
        citations:
          - fra
      - name: Energy & ESG Report
        icon: share
        summary: Traction energy and emissions accounting and the network's sustainability reporting, filed from contracted Gold products.
  - name: Published Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Published, contracted products discoverable in Unity Catalog Domains and shared over OpenSharing.
      - name: Sharing Recipients
        icon: share
        summary: Lessors, maintenance partners and infrastructure owners reading live tables with no copy and no egress duplication.
  - name: Databricks Apps
    icon: apps
    tiles:
      - name: Dispatch Cockpit
        icon: gauge
        short: Network control
        summary: 'The screen dispatchers run a live railroad from: movement conflicts, delay probability and recovery options costed across trains, crews and infrastructure, on Databricks Apps over Lakebase.'
      - name: Asset Health Watch
        icon: iot
        short: Fleet & track health
        summary: Component and track condition and predicted failures by asset, so engineering plans the fix at a depot overnight instead of stranding a train in service.
      - name: Ridership Studio
        icon: market
        short: Demand & revenue
        summary: Where revenue and ridership analysts see origin-destination demand, farebox recovery and the revenue at risk on a line before a service or fare change.
      - name: Safety Insights
        icon: gavel
        short: Safety & compliance
        summary: Signaling, PTC and incident events surfaced with precursor scoring, and the regulatory submissions produced from the same governed tables the railroad runs on.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: On-Time Performance
        icon: aibi
        summary: Punctuality and delay attribution by line, cause and time of day.
        kpis:
          - On-time performance
          - Delay minutes
          - Delay by cause
          - Cancellations
          - Headway adherence
        teams:
          - Network Ops
          - Executive Team
          - Dispatchers
      - name: Asset Availability & Reliability
        icon: aibi
        summary: Fleet and infrastructure availability, MDBF and maintenance backlog.
        kpis:
          - Asset availability
          - Mean distance between failures
          - Work-order backlog
          - Track defects
          - Predicted removals
        teams:
          - Fleet & Assets
          - Rolling-stock engineering
          - Maintenance planning
      - name: Ridership & Farebox
        icon: aibi
        summary: Ridership, origin-destination demand and farebox recovery by line.
        kpis:
          - Ridership
          - Origin-destination demand
          - Farebox recovery
          - Load factor
          - Fare revenue
        teams:
          - Revenue & Fares
          - Revenue & demand
          - Commercial planning
      - name: Safety & Energy
        icon: aibi
        summary: Signaling and PTC events, incident precursors and traction energy per train-km.
        kpis:
          - PTC enforcements
          - Signaling exceedances
          - Incident rate
          - Energy per train-km
          - Precursor closure
        teams:
          - Safety & Reg
          - Safety assurance
          - Network Ops
  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface. A managed Beta is available.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity AI Gateway
      - name: Claude Code
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity AI Gateway.
      - name: OpenAI Codex
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity AI Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity AI Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Network Punctuality Agent
        icon: genie
        summary: Ask about on-time performance, delay causes and where the network is running late right now.
        feeds:
          - AVL / GPS Telemetry
          - GTFS / GTFS-RT
          - Alstom Onvia
          - OTP, availability, ridership
        teams:
          - Network Ops
          - Dispatchers
          - Executive Team
        questions:
          - What was on-time performance by line yesterday and this week?
          - Which delay causes are driving the most lost minutes right now?
          - Where is knock-on delay propagating across the network this hour?
          - Which services are most at risk of running late in the next window?
          - How does punctuality compare to the same period last year?
      - name: Asset Health & Maintenance Agent
        icon: genie
        summary: Explore component condition, predicted removals and the work-order backlog.
        feeds:
          - IBM Maximo
          - Wayside Detectors
          - Track Geometry
          - Conformed train, asset, trip
        teams:
          - Fleet & Assets
          - Rolling-stock engineering
          - Maintenance planning
        questions:
          - Which components are predicted to be removed in the next 30 days?
          - What is mean distance between failures by fleet class?
          - Which track segments have the worst geometry defects right now?
          - How large is the maintenance work-order backlog by depot?
          - Which wayside detector alarms have not yet been actioned?
      - name: Ridership & Revenue Agent
        icon: genie
        summary: Answer ridership, origin-destination demand and farebox recovery questions.
        feeds:
          - Cubic AFC
          - GIRO HASTUS
          - GTFS / GTFS-RT
          - OTP, availability, ridership
        teams:
          - Revenue & Fares
          - Revenue & demand
          - Commercial planning
        questions:
          - What is ridership by line and time band this week versus last?
          - Which origin-destination pairs are growing fastest?
          - What is farebox recovery by line this quarter?
          - Where is capacity most mismatched to demand at peak?
          - How did the last fare change affect ridership and revenue?
      - name: Safety & Compliance Agent
        icon: genie
        summary: Ask about signaling and PTC events, incident precursors and regulatory metrics.
        feeds:
          - Wabtec I-ETMS PTC
          - Alstom Signalling
