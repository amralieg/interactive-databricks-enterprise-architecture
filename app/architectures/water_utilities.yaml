name: Water Utilities
description: 'Municipal and investor-owned water utilities: SCADA and AMI metering, network asset management, customer billing, field work orders, and regulatory quality reporting.'
sources:
  - name: CIS & Billing
    icon: erp
    tiles:
      - name: Oracle Utilities C2M
        icon: erp
        summary: Customer information, billing, payments and credit collections.
        citations:
          - oracle-c2m
        category: Customer Information System (CIS)
        what_it_is: Holds customer information, billing, payments and credit collections across the meter-to-cash process.
        who_uses_it: Billing analysts, contact centre and credit & collections teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-10 GB/day
            interval: Nightly batch + billing cycles
          stream:
            types:
              - semi-structured
            volume: tens of events/sec
            interval: Continuous CDC
      - name: SAP IS-U
        icon: market
        summary: Utility billing and device management for multi-commodity utilities.
        citations:
          - sap-isu
        category: Utility Customer Information System (CIS)
        what_it_is: Runs utility billing and device management for multi-commodity utilities on the SAP IS-U core.
        who_uses_it: Billing operations, device management and Finance teams.
        data_out:
          batch:
            types:
              - structured
            volume: 2-10 GB/day
            interval: Nightly batch + billing cycles
      - name: VertexOne CIS
        icon: chart
        summary: Cloud CIS for water and wastewater with customer self-service.
        citations:
          - vertexone
        category: Cloud Customer Information System (CIS)
        what_it_is: Cloud CIS for water and wastewater with customer self-service, billing and engagement.
        who_uses_it: Billing analysts, customer operations and digital teams.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Hourly / nightly sync
  - name: SCADA & Operations
    icon: stream
    tiles:
      - name: AVEVA PI System
        icon: stream
        summary: Historian for pumps, tanks, pressure and flow across the distribution network.
        citations:
          - aveva-pi
        category: Process/Time-Series Historian
        what_it_is: Stores pump, tank, pressure and flow tags across the distribution network as the operational time-series system of record.
        who_uses_it: Control-room operators, pump & energy leads and hydraulic modellers.
        data_out:
          batch:
            types:
              - structured
            volume: 10-50 GB/day tag history
            interval: Hourly aggregates
          stream:
            types:
              - semi-structured
            volume: 10-100k tags/sec
            interval: Continuous (sub-second)
      - name: Ignition SCADA
        icon: iot
        summary: Plant and remote site SCADA for treatment and pumping stations.
        citations:
          - ignition
        category: SCADA / Control System
        what_it_is: Plant and remote-site SCADA for treatment and pumping stations, emitting analogs, states and alarms.
        who_uses_it: Plant operators, control-room operators and instrumentation teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: 1-20k signals/sec
            interval: Continuous (sub-second)
      - name: Schneider EcoStruxure
        icon: partner
        summary: Edge control and telemetry for lift stations and PRVs.
        citations:
          - schneider-eco
        category: Edge Control & Telemetry Platform
        what_it_is: Edge control and telemetry for lift stations and pressure-reducing valves across the network.
        who_uses_it: Distribution operations, pressure management and field teams.
        data_out:
          stream:
            types:
              - semi-structured
            volume: hundreds-thousands of readings/sec
            interval: Continuous telemetry
  - name: AMI & Metering
    icon: iot
    tiles:
      - name: Itron OpenWay
        icon: iot
        summary: 'Advanced metering infrastructure: interval reads, tamper and leak flags.'
        citations:
          - itron
        category: AMI Head-End System
        what_it_is: Collects interval meter reads, tamper flags and leak alerts from the advanced metering estate.
        who_uses_it: Metering operations, leak & NRW team and billing analysts.
        data_out:
          batch:
            types:
              - structured
            volume: 10-60 GB/day interval reads
            interval: Hourly / daily reads
          stream:
            types:
              - semi-structured
            volume: hundreds-thousands of events/sec
            interval: Continuous meter events
      - name: Sensus FlexNet
        icon: api
        summary: AMI head-end for residential and commercial meter populations.
        citations:
          - sensus
        category: AMI Head-End System
        what_it_is: RF-mesh AMI head-end collecting reads and endpoint alarms for residential and commercial meter populations.
        who_uses_it: Metering operations and leak & NRW analytics teams.
        data_out:
          batch:
            types:
              - structured
            volume: 5-30 GB/day
            interval: Hourly reads
          stream:
            types:
              - semi-structured
            volume: hundreds of events/sec
            interval: Continuous endpoint alarms
      - name: Badger Beacon
        icon: db
        summary: Encoder registers and mobile collection for legacy meter routes.
        citations:
          - badger
        category: Meter Data Collection System
        what_it_is: Encoder registers and mobile/drive-by collection for legacy meter routes feeding billing determinants.
        who_uses_it: Metering operations, meter readers and billing teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Route cycle (daily/monthly)
  - name: GIS & Assets
    icon: db
    tiles:
      - name: Esri ArcGIS Utility
        icon: globe
        summary: Pipe network, valves, hydrants and service connections geospatially modeled.
        citations:
          - esri-utility
        category: Geographic Information System (GIS)
        what_it_is: Holds the pipe network, valves, hydrants and service connections geospatially modelled for planning and risk analysis.
        who_uses_it: GIS & asset data, reliability engineers and distribution planning.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: 5-20 GB network model
            interval: Daily / weekly model syncs
      - name: IBM Maximo
        icon: erp
        summary: Asset registry, work orders and preventive maintenance for treatment plants.
        citations:
          - maximo
        category: Enterprise Asset Management (EAM)
        what_it_is: Manages the asset registry, work orders and preventive maintenance for treatment plants and network assets.
        who_uses_it: Reliability engineers, maintenance planning and asset management.
        data_out:
          batch:
            types:
              - structured
            volume: 1-4 GB/day
            interval: Nightly batch
      - name: Cityworks AMS
        icon: sheet
        summary: Work management for mains breaks, service line replacements and inspections.
        citations:
          - cityworks
        category: Work & Asset Management System
        what_it_is: Work management for mains breaks, service-line replacements and inspections across the distribution network.
        who_uses_it: Field service dispatch, capital planning and operations teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day
            interval: Continuous work orders + daily batch
  - name: Lab & Quality
    icon: gavel
    tiles:
      - name: Hach WIMS
        icon: gavel
        summary: Water quality lab results, chain of custody and regulatory limits.
        citations:
          - hach-wims
        category: Water Quality LIMS
        what_it_is: Manages water-quality lab results, chain of custody and regulatory limits for drinking-water compliance.
        who_uses_it: Compliance officers, water-quality lab and public-notification teams.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-2 GB/day results
            interval: Per-sample + daily
      - name: KISTERS WISKI
        icon: chart
        summary: Hydrological and water quality time series for source water monitoring.
        citations:
          - kisters
        category: Hydrological Time-Series System
        what_it_is: Stores hydrological and water-quality time series for source-water monitoring and quality analytics.
        who_uses_it: Source water team, compliance officers and hydrologists.
        data_out:
          batch:
            types:
              - structured
            volume: 0.5-3 GB/day
            interval: Hourly / daily
          stream:
            types:
              - semi-structured
            volume: tens-hundreds of readings/sec
            interval: Continuous sensor series
  - name: Federation Sources
    icon: fed
    from: fed
    tail: true
    tiles:
      - name: Regional Agency Marts
        icon: fed
        summary: Wholesale and intertie flow marts queried in place under Unity Catalog.
        category: Enterprise Data Warehouse
        what_it_is: Wholesale and intertie flow marts kept in the regional-agency warehouse and queried in place through federation rather than copied.
        who_uses_it: Source water team, operations planning and regulatory teams.
        data_out:
          batch:
            types:
              - structured
            volume: TB-scale historical marts
            interval: Queried on demand (federated)
cloud_integrations:
  - name: Cloud ETL
    icon: etl
    from: ingest
    tiles: []
  - name: 3rd Party
    icon: zplug
    tiles:
      - name: EPA SDWIS Feed
        icon: gavel
        summary: Safe Drinking Water Information System reference for compliance benchmarking.
        citations:
          - epa-sdwis
        category: Regulatory Reference Data
        what_it_is: Safe Drinking Water Information System reference data used for compliance benchmarking and reporting.
        who_uses_it: Compliance officers and regulatory affairs teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: MBs-GBs reference data
            interval: Periodic (regulatory updates)
      - name: NOAA Hydrology API
        icon: stream
        summary: River flow and drought indices for source water planning.
        citations:
          - noaa
        category: Hydrology & Drought Data Provider
        what_it_is: River flow, reservoir and drought-index feeds used for source-water planning and drought contingency.
        who_uses_it: Source water team and GM & executive office.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs/day
            interval: Hourly / daily updates
      - name: Weather Forecast API
        icon: observ
        summary: Demand and infiltration forecasting inputs from meteorological services.
        citations:
          - noaa
        category: Weather & Climate Data Provider
        what_it_is: Forecast temperature and precipitation feeds used as inputs to demand and infiltration forecasting models.
        who_uses_it: Demand forecasting, distribution operations and planning teams.
        data_out:
          batch:
            types:
              - structured
              - semi-structured
            volume: GBs/day gridded forecasts
            interval: Multiple forecast cycles daily
pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: GM & Executive Office
        mark: Genie One
        summary: The general manager on cost per gallon and the capital plan; the COO on non-revenue water and the response time on a distribution outage.
        uses:
          - - Genie One
            - Ask what last month's NRW was without analyst delay.
          - - AI/BI
            - Pressure and quality KPIs on certified Metric Views.
          - - Unity Catalog
            - One consumption definition across AMI and billing.
        sub:
          - name: General Manager
            cares: cost per thousand gallons and the capital plan the board and rate case rest on.
          - name: Chief Operating Officer
            cares: non-revenue water and the response time when a main breaks or a zone loses pressure.
          - name: CFO & Rates
            cares: the revenue requirement, collections and the capital budget behind the next rate filing.
        ucs:
          - Capital Planning
          - Leak Detection
          - Drought Contingency
      - name: Distribution Ops
        mark: Lakehouse//RT
        summary: Control room operators on pressure, storage and pump scheduling, holding pressure zones in compliance while trimming energy at the pumps.
        uses:
          - - Network Control Center
            - Live SCADA, AMI leak flags and crew dispatch on one screen.
          - - Lakehouse//RT
            - Telemetry at control-room latency.
        sub:
          - name: Control Room Operators
            cares: pressure, storage and pump status held in compliance across every zone each shift.
          - name: Pump & Energy Lead
            cares: pumping energy cost against tariff windows and tank targets.
          - name: Leak & NRW Team
            cares: night-flow anomalies and where to send crews to cut non-revenue water.
        ucs:
          - Pressure Management
          - Pump Optimization
          - Leak Detection
          - Outage Response
      - name: Customer Operations
        mark: CustomerLake
        summary: Call centre and field service on outages, high-bill disputes and leak investigations, giving agents restoration ETA and account context.
        uses:
          - - Customer Impact Console
            - Outage map, estimated restoration and high-bill triage.
          - - CustomerLake
            - Account context without copying into a separate CRM.
        sub:
          - name: Call Centre Agents
            cares: outage restoration ETAs and high-bill disputes answered on the first call.
          - name: Field Service Dispatch
            cares: leak, meter and service-line work orders routed to the right crew.
          - name: Billing Analysts
            cares: unusual consumption explained from meter intervals before a bill is disputed.
        ucs:
          - Outage Response
          - High Bill Investigation
      - name: Asset Management
        mark: AI/BI
        summary: Engineers on main-replacement priority, pump health and capex planning, ranking mains on break risk, age and soil against renewal budget.
        uses:
          - - AI/BI
            - Asset risk and remaining life on certified views.
          - - Genie One
            - Ask which mains exceed break rate thresholds.
        sub:
          - name: Reliability Engineers
            cares: main break risk, pipe condition and pump health across the network.
          - name: Capital Planning
            cares: the renewal and growth program ranked on risk, consequence and ROI.
          - name: GIS & Asset Data
            cares: the pipe, valve and hydrant network kept accurate for every risk model.
        ucs:
          - Main Break Prediction
          - Capital Planning
          - Pump Optimization
      - name: Water Quality
        mark: Lakeflow
        summary: Quality teams on sample results, regulatory exceedances and public notification, tying lab and sensor data to limits before a deadline.
        uses:
          - - Quality Compliance Hub
            - Lab results against limits with notification workflows.
          - - Lakeflow
            - SCADA, lab and AMI feeds conformed for quality analytics.
        sub:
          - name: Compliance Officers
            cares: sampling results against limits and the primacy-agency reporting deadlines.
          - name: Source Water Team
            cares: raw-water quality and the drought and contamination risks to supply.
          - name: Public Notification
            cares: boil-water and exceedance notices issued to customers on time.
        ucs:
          - Water Quality Exceedance
          - Drought Contingency
  - name: Technical
    icon: code
    tiles:
      - name: Data Engineers
        mark: Lakeflow
        summary: Land SCADA historian tags, AMI interval reads, work orders and lab results; own Bronze to Silver and the pager when an NRW table stalls.
        uses:
          - - Lakeflow Connect
            - Managed connectors for CIS, SCADA and AMI sources.
          - - Lakeflow Designer
            - Declarative pipelines with expectations on meter and telemetry feeds.
          - - Lakewatch
            - Freshness on the NRW tables the control room reads each shift.
        sub:
          - name: Ingestion Engineers
            cares: SCADA historian, AMI reads, work orders and lab results landed reliably.
          - name: Pipeline Owners
            cares: Bronze-to-Silver quality and the pager when an NRW table stalls before a shift.
          - name: Streaming Engineers
            cares: control-room latency on pressure and leak-flag telemetry.
        ucs:
          - Leak Detection
          - Demand Forecasting
          - Water Quality Exceedance
      - name: Data Scientists
        mark: MLflow
        summary: Leak-detection, demand-forecast, main-break and pump-optimisation models, and whether they still hold as weather and network state shift.
        uses:
          - - Feature Store
            - Meter and asset features read identically in training and serving.
          - - MLflow
            - Every leak and break-risk experiment tracked for audit.
          - - Model Serving
            - Leak and demand models scored in the operational path.
        sub:
          - name: Hydraulic Modellers
            cares: leak, demand and pressure models that hold as weather and network state shift.
          - name: Asset Risk Modellers
            cares: main-break and pump remaining-life scoring against condition data.
          - name: MLOps
            cares: every leak and break-risk model tracked, evaluated and monitored for audit.
        ucs:
          - Leak Detection
          - Demand Forecasting
          - Main Break Prediction
          - Pump Optimization
      - name: App Developers
        mark: Apps
        summary: Ship the Network Control Center, Customer Impact and Quality Compliance apps control-room and quality teams work in, next to governed SCADA data.
        uses:
          - - Apps
            - Control-room screens with no separate web tier to secure.
          - - Lakebase
            - Serverless Postgres for work order and notification state writes.
          - - Agent Bricks
            - Agents that draft pump setpoints against governed tools.
        sub:
          - name: App Engineers
            cares: the control-room, customer and quality screens built on governed data.
          - name: Integration Engineers
            cares: work order and notification writeback state on Lakebase.
          - name: Agent Developers
            cares: agents that draft pump setpoints and outage notices against governed tools.
        ucs:
          - Outage Response
          - High Bill Investigation
          - Water Quality Exceedance
