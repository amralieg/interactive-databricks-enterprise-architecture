agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Network & NRW Agent
        icon: genie
        summary: Ask about pressure, non-revenue water, leaks and pump energy across the network in plain language.
        feeds:
          - AVEVA PI System
          - Itron OpenWay
          - Schneider EcoStruxure
          - NRW, pressure, compliance
        teams:
          - Distribution Ops
          - Leak & NRW Team
          - Pump & Energy Lead
        questions:
          - What was non-revenue water by district last month?
          - Which zones show the largest night-flow anomalies right now?
          - Where is pressure out of compliance across the network?
          - How much pumping energy did we use against tariff windows this week?
          - Which areas should crews investigate first for leaks?
      - name: Customer & Billing Agent
        icon: genie
        summary: Explore outages, high-bill disputes and consumption from AMI intervals.
        feeds:
          - Oracle Utilities C2M
          - Itron OpenWay
          - Cityworks AMS
          - Conformed meter, asset, account
        teams:
          - Customer Operations
          - Call Centre Agents
          - Billing Analysts
        questions:
          - Which accounts have open high-bill disputes right now?
          - What is the restoration ETA for the current outages?
          - Which premises show consumption spikes that look like private-side leaks?
          - What is first-call resolution in the contact centre this week?
          - How many service orders are open past their SLA?
      - name: Asset & Capital Agent
        icon: genie
        summary: Answer questions on main-break risk, pump health and replacement priority.
        feeds:
          - Esri ArcGIS Utility
          - IBM Maximo
          - AVEVA PI System
          - Conformed meter, asset, account
        teams:
          - Asset Management
          - Reliability Engineers
          - Capital Planning
        questions:
          - Which mains exceed our break-rate threshold this year?
          - Where is main-break risk highest by material and soil type?
          - Which pumps are showing the worst condition trend?
          - What replacement candidates give the most risk reduction per dollar?
          - What is remaining life on our aging cast-iron mains?
      - name: Water Quality Agent
        icon: genie
        summary: Ask about sample results, exceedances and source-water risk against regulatory limits.
        feeds:
          - Hach WIMS
          - KISTERS WISKI
          - EPA SDWIS Feed
          - NRW, pressure, compliance
        teams:
          - Water Quality
          - Compliance Officers
          - Source Water Team
        questions:
          - Which sample results are approaching a regulatory limit right now?
          - Are there any exceedances that need public notification today?
          - How is source-water quality trending against drought conditions?
          - Which sites are behind on their sampling schedule?
          - What is our chlorine residual trend across the distribution system?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Leak Detection
        short: NRW
        icon: iot
        summary: Distribution leaks inferred from AMI night flow and pressure transients.
        problem: Distribution leaks hide as background loss until a main bursts, and crews chase them across thousands of miles of buried pipe with little night-flow evidence to say where to dig first.
        who_benefits: Distribution Ops
        how_built: AMI night-flow and PI pressure transients land in Lakehouse//RT and score against leak models in Model Serving, so anomalies surface on the Network Control Center for crew dispatch.
        components:
          - Network Control Center
          - Itron OpenWay
          - AVEVA PI System
          - Model Serving
          - Lakehouse//RT
          - Delta Lake
        stories:
          - title: Turning smart digital water meter data into autonomous actions
            url: https://www.databricks.com/customers/water-link
          - title: Pipeline Flow Monitoring
            url: https://www.databricks.com/blog/pipeline-flow-monitoring
      - name: Demand Forecasting
        short: Planning
        icon: chart
        summary: Consumption forecast by district, weather and season.
        problem: Demand is planned off last year's averages, so pumping, storage and purchases are set blind to weather, growth and seasonal swings, and the utility over-pumps or runs storage too low.
        who_benefits: Distribution Ops
        how_built: AMI intervals, weather and calendar features are engineered in Feature Store and forecast per district through Model Serving, published to planners on certified AI/BI Metric Views.
        components:
          - AI/BI
          - Weather Forecast API
          - Itron OpenWay
          - Model Serving
          - Feature Store
          - Delta Lake
        stories:
          - title: Sabesp Transforms Water Utility Operations with Lakehouse
            url: https://www.databricks.com/customers/sabesp
      - name: Pressure Management
        short: Operations
        icon: stream
        summary: Pressure zones optimised for compliance and energy cost.
        problem: Pressure zones are tuned by hand to avoid low-pressure complaints, so the network runs over-pressured, wasting pump energy and driving the main breaks and leakage it was meant to prevent.
        who_benefits: Distribution Ops
        how_built: PI pressure and Schneider PRV telemetry land in Lakehouse//RT and feed optimisation models in Model Serving, so setpoints hold compliance at lowest energy from the Network Control Center.
        components:
          - Network Control Center
          - AVEVA PI System
          - Schneider EcoStruxure
          - Model Serving
          - Lakehouse//RT
      - name: Pump Optimization
        short: Energy
        icon: iot
        summary: Pump scheduling minimising energy while meeting storage targets.
        problem: Pumps run on fixed schedules blind to tariff windows and tank state, so the utility burns energy at peak price and cycles equipment harder than storage targets actually require.
        who_benefits: Distribution Ops
        how_built: Pump, tank and tariff data feed scheduling models tracked in MLflow and scored in Model Serving, so optimised setpoints reach SCADA from the Network Control Center within hydraulic limits.
        components:
          - Network Control Center
          - AVEVA PI System
          - Model Serving
          - MLflow
          - Lakehouse//RT
        stories:
          - title: Vattenfall Builds Real-Time Energy Intelligence
            url: https://www.databricks.com/customers/vattenfall/genie
          - title: What is Predictive Maintenance?
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
      - name: Water Quality Exceedance
        short: Compliance
        icon: gavel
        summary: Lab and online sensor exceedances flagged before reporting deadlines.
        problem: Lab results and online sensor readings sit in separate systems, so a chlorine or turbidity exceedance can be missed until a reporting deadline or notification clock has already started.
        who_benefits: Water Quality
        how_built: Hach WIMS lab results and WISKI sensor series are conformed through Lakeflow under Unity Catalog and checked against limits, flagging exceedances early in the Quality Compliance Hub.
        components:
          - Quality Compliance Hub
          - Hach WIMS
          - KISTERS WISKI
          - Lakeflow
          - Unity Catalog
        stories:
          - title: Turning smart digital water meter data into autonomous actions
            url: https://www.databricks.com/customers/water-link
      - name: Main Break Prediction
        short: Assets
        icon: db
        summary: Pipe material, age and soil corrosivity scored for break risk.
        problem: Mains are replaced on age alone, so sound pipe is dug up while corrosive-soil segments fail without warning, flooding streets and cutting service before any renewal budget reaches them.
        who_benefits: Asset Management
        how_built: Pipe material, age, break history and soil corrosivity from GIS and Maximo feed break-risk models in Model Serving tracked in MLflow, ranking segments in the Main Replacement Planner.
        components:
          - Main Replacement Planner
          - Esri ArcGIS Utility
          - IBM Maximo
          - Model Serving
          - MLflow
          - Feature Store
        stories:
          - title: What is Predictive Maintenance?
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
          - title: Pipeline Flow Monitoring
            url: https://www.databricks.com/blog/pipeline-flow-monitoring
      - name: Outage Response
        short: Customer
        icon: gauge
        summary: Outage scope, crew dispatch and restoration ETA for public communication.
        problem: When a main breaks the call centre learns the scope from complaints, so agents cannot give a restoration time and crews are dispatched without knowing who is affected or how many.
        who_benefits: Customer Operations
        how_built: Network state, work orders and account data conform under Unity Catalog and surface in the Customer Impact Console on Lakebase, giving agents outage scope and a restoration ETA.
        components:
          - Customer Impact Console
          - Cityworks AMS
          - CustomerLake
          - Lakebase
          - AI/BI
      - name: High Bill Investigation
        short: Billing
        icon: market
        summary: Unusual consumption patterns explained from AMI intervals.
        problem: A high-bill dispute lands with no way to see the meter's own intervals, so agents open a field visit for what is usually a private-side leak or a seasonal fill the data already explains.
        who_benefits: Customer Operations
        how_built: AMI interval reads from Itron join billing from Oracle C2M in the Customer Impact Console, so agents and Genie explain a spike from the consumption pattern before a truck rolls.
        components:
          - Customer Impact Console
          - Itron OpenWay
          - Oracle Utilities C2M
          - Genie One
          - AI/BI
        stories:
          - title: Turning smart digital water meter data into autonomous actions
            url: https://www.databricks.com/customers/water-link
          - title: Sabesp Transforms Water Utility Operations with Lakehouse
            url: https://www.databricks.com/customers/sabesp
      - name: Capital Planning
        short: Finance
        icon: erp
        summary: Asset replacement and growth capital prioritised on risk and ROI.
        problem: Renewal and growth capital is argued in spreadsheets, so replacement dollars chase the last failure instead of the risk-and-consequence ranking that would defend the plan to the board.
        who_benefits: Asset Management
        how_built: Asset condition, break risk and hydraulic constraint data are conformed under Unity Catalog and ranked on ROI in the Main Replacement Planner, published to finance on certified AI/BI views.
        components:
          - Main Replacement Planner
          - IBM Maximo
          - Esri ArcGIS Utility
          - AI/BI
          - Unity Catalog
        stories:
          - title: How Scottish Water Made Its Capital Investment Data Conversational
            url: https://www.databricks.com/blog/how-scottish-water-made-its-capital-investment-data-conversational-databricks-genie
      - name: Drought Contingency
        short: Resilience
        icon: globe
        summary: Stage restrictions and supply alternatives modeled against source levels.
        problem: Drought stages are called late off manual reservoir reads, so restrictions and alternative-supply moves lag the shortage and the utility loses the lead time to soften customer impact.
        who_benefits: GM & Executive Office
        how_built: NOAA hydrology and forecast feeds join source-level and demand data on Delta Lake and model supply scenarios in Model Serving, so restriction stages and interties are planned in AI/BI.
        components:
          - NOAA Hydrology API
          - Weather Forecast API
          - Model Serving
          - AI/BI
          - Delta Lake
medallion:
  Bronze:
    short: Raw network and meter feeds
    summary: SCADA historian tags, AMI interval reads, work orders, billing cycles and lab sample results, landed exactly as received so a leak alert or a quality exceedance can always be replayed.
  Silver:
    short: Conformed meter, asset, account
    summary: Meters, assets, service accounts and pressure zones resolved into single conformed entities across CIS, SCADA and GIS, with consumption intervals stitched to one account.
  Gold:
    short: NRW, pressure, compliance
    summary: 'Contracted products operations and regulators run on: non-revenue water, pressure compliance, boil-water event response, and cost per thousand gallons by district.'
