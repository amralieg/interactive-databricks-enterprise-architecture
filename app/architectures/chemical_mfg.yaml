agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Batch Performance Agent
        icon: genie
        summary: Ask about batch yield, golden-batch deviation and off-spec drivers by plant and product in plain language.
        feeds:
          - AVEVA PI System
          - Honeywell Uniformance
          - Siemens Opcenter PSM
          - Yield, OEE, compliance
        teams:
          - Plant Operations
          - Process Engineering
          - Plant Manager
        questions:
          - What was batch yield by plant and product last month?
          - Which batches deviated most from the golden-batch trajectory?
          - What is OEE by unit and line this week?
          - Which deviations are open and on which batches?
          - What is energy per ton by product versus target?
      - name: Quality & Release Agent
        icon: genie
        summary: Explore CoA release, off-spec root-cause and regulatory filing status across the lab estate.
        feeds:
          - LabWare LIMS
          - Thermo SampleManager
          - Sphera Product Steward
          - Conformed batches and materials
        teams:
          - Quality & Regulatory
          - QC Manager
          - Regulatory Affairs
        questions:
          - What is right-first-time CoA release rate by product?
          - Which batches are on quality hold and why?
          - What is the off-spec rate trend by plant and grade?
          - Which REACH and TRI filings are approaching their deadline?
          - Which SDS records are out of date for shipped products?
      - name: Reliability & Maintenance Agent
        icon: genie
        summary: Answer rotating-equipment health, remaining-life and maintenance-cost questions.
        feeds:
          - IBM Maximo
          - AVEVA PI System
          - Yield, OEE, compliance
        teams:
          - Plant Operations
          - Reliability Engineer
          - Reliability Data Scientist
        questions:
          - Which rotating assets are predicted to fail in the next month?
          - What is unplanned downtime by asset class this quarter?
          - Which pumps and agitators drive the most maintenance cost?
          - Which work orders are overdue on critical equipment?
          - What is MTBF trend on the assets that stop the plant?
      - name: Supply & Allocation Agent
        icon: genie
        summary: Ask about grade demand, feedstock planning and OTIF across the network.
        feeds:
          - SAP TM
          - ORBCOMM Tank Monitoring
          - AspenTech Supply
          - Yield, OEE, compliance
        teams:
          - Supply Chain
          - S&OP Planner
          - Logistics Manager
        questions:
          - Which scarce products should be allocated to which contracts first?
          - Which orders are at risk of missing OTIF this week?
          - Which tanks are near empty or overdue for a bulk movement?
          - What is contract-fill rate by key account this month?
          - Where is margin leaking to low-value spot orders under allocation?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Off-Spec Root-Cause
        short: Quality
        icon: gavel
        summary: Off-spec batches traced to the in-process deviation that caused them, in flight.
        problem: When a batch goes off-spec, the deviation that caused it is buried across historian, phase and lab records, so root-cause takes days of manual correlation and the same failure repeats on the next run.
        who_benefits: Quality & Regulatory
        how_built: In-process historian tags conform to batch-and-phase records and feed quality models scored in Model Serving, so the Batch Cockpit flags the driving deviation and its root cause before the run completes.
        components:
          - Batch Cockpit
          - AVEVA PI System
          - Model Serving
          - MLflow
          - Feature Store
        stories:
          - title: Corning streamlines data with Databricks Lakeflow Jobs
            url: https://www.databricks.com/customers/corning
          - title: Chevron Phillips Chemical tackles GenAI with Databricks
            url: https://www.databricks.com/customers/chevron-phillips-chemical
      - name: Golden Batch
        short: Process
        icon: iot
        summary: Optimal trajectories identified and enforced on new runs.
        problem: Two operators run the same recipe and get different yields, yet the best batch's trajectory lives in tribal memory, so no run can be held against what good actually looked like.
        who_benefits: Process Engineering
        how_built: Historian trajectories conform to golden-batch references on Delta Lake, and deviation from the best profile is scored and shown in Golden Batch Analytics so operators steer the run in flight.
        components:
          - Golden Batch Analytics
          - AVEVA PI System
          - Model Serving
          - Delta Lake
          - AI/BI
        stories:
          - title: Chevron Phillips Chemical tackles GenAI with Databricks
            url: https://www.databricks.com/customers/chevron-phillips-chemical
      - name: Steam & Power per Ton
        short: Energy
        icon: chart
        summary: Steam and power minimized per ton produced, unit by unit.
        problem: Steam and power are the biggest cost after feedstock, yet usage is trended per site weeks later, so nobody sees which units and setpoints drive energy per ton while the batch still runs.
        who_benefits: Process Engineering
        how_built: Utility and process tags conform alongside batch data, and AI Functions and models in Golden Batch Analytics rank the setpoints that cut energy per ton without pushing the batch off spec.
        components:
          - Golden Batch Analytics
          - Honeywell Uniformance
          - Model Serving
          - AI Functions
          - AI/BI
        stories:
          - title: Databricks and Shell collaborate to simplify industrial time series analytics on the Lakehouse
            url: https://www.databricks.com/blog/developing-time-series-lakehouse-shell
      - name: Rotating-Equipment Reliability
        short: Reliability
        icon: zplug
        summary: Pump, agitator and compressor failures predicted before an unplanned trip.
        problem: Pumps, agitators and compressors fail without warning, and an unplanned trip on a continuous line cascades into lost batches and emergency repairs costlier than any planned fix.
        who_benefits: Plant Operations
        how_built: Vibration and process tags from the historian conform to asset records and feed remaining-life models in Model Serving, so predicted failures raise work orders in IBM Maximo before the trip.
        components:
          - IBM Maximo
          - AVEVA PI System
          - Model Serving
          - MLflow
          - Lakehouse//RT
        stories:
          - title: Databricks and Shell collaborate to simplify industrial time series analytics on the Lakehouse
            url: https://www.databricks.com/blog/developing-time-series-lakehouse-shell
      - name: Batch Genealogy
        short: Traceability
        icon: product
        summary: Full lineage from raw lots through finished goods.
        problem: When a recall or complaint hits, tracing a finished lot back through intermediates, raw lots and equipment means stitching MES, ERP and lab exports by hand, and one answer can take days.
        who_benefits: Quality & Regulatory
        how_built: Batch records, material moves and lab results land and resolve to common batch, material and equipment keys under Unity Catalog, so the CoA Workbench shows full forward-and-back lineage at once.
        components:
          - CoA Workbench
          - Siemens Opcenter PSM
          - SAP S/4HANA PP-PI
          - Unity Catalog
          - Delta Lake
        stories:
          - title: How DuPont achieved 11x latency reduction and 4x cost reduction with Photon
            url: https://www.databricks.com/blog/how-dupont-achieved-11x-latency-reduction-and-4x-cost-reduction-photon
      - name: Carbon Intensity & Circularity
        short: EHS
        icon: gavel
        summary: Scope 1 and 2 intensity and material circularity by plant and product.
        problem: Scope 1 and 2 emissions and recycled-content figures are assembled each quarter from spreadsheets and utility bills, so intensity and circularity by plant and product are estimates that land too late to change how a batch is run.
        who_benefits: CEO & EHS Council
        how_built: Energy, process and material-recovery data conform with emissions factors on Delta Lake and are processed with Apache Spark under Unity Catalog, giving auditable Scope 1 and 2 intensity and circularity by plant and product in AI/BI.
        components:
          - AVEVA PI System
          - Apache Spark
          - Delta Lake
          - Unity Catalog
          - AI/BI
        stories:
          - title: How Dow Built a Carbon Footprint Ledger on Databricks to Accelerate Sustainability at Scale
            url: https://www.databricks.com/blog/how-dow-built-carbon-footprint-ledger-databricks-accelerate-sustainability-scale
      - name: Workforce Safety
        short: HSE
        icon: gavel
        summary: Process-safety and permit signals surfaced so unsafe conditions are caught before an incident.
        problem: Process-safety incidents, near-misses and permit-to-work records sit across EHS, historian and shift systems, so leading indicators of an unsafe condition are only joined up after a loss-of-containment event when the investigation reconstructs them.
        who_benefits: CEO & EHS Council
        how_built: Incident, permit and process-alarm data conform under Unity Catalog on Delta Lake, and leading-indicator models scored in Model Serving surface unsafe trends on the Batch Cockpit before an incident.
        components:
          - Batch Cockpit
          - Enablon EHS
          - AVEVA PI System
          - Model Serving
          - Unity Catalog
          - Delta Lake
      - name: Feedstock & Bulk Planning
        short: Supply
        icon: stream
        summary: Feedstock supply and bulk movements planned against tanks, rail and vessel windows.
        problem: Feedstock arrives and product ships in bulk against narrow rail and vessel windows, but tank levels, material plans and transport slots sit in separate systems, so a missed window means demurrage, a stockout of raw feed, or a tank running dry.
        who_benefits: Supply Chain
        how_built: Tank telemetry, material plans and transport windows conform to production schedules on Delta Lake, and models scored in Lakehouse//RT sequence feedstock replenishment and bulk movements against live rail and vessel windows for the planner.
        components:
          - SAP TM
          - ORBCOMM Tank Monitoring
          - Model Serving
          - Lakehouse//RT
          - AI/BI
      - name: Molecular Design-Space Simulation
        short: R&D
        icon: network
        summary: Candidate molecules and formulations screened across a simulated property design space before lab work.
        problem: New molecules and materials are found by physical trial, so the design space is explored one slow, costly experiment at a time and promising candidates are never simulated or ranked before reactor time is committed.
        who_benefits: Process Engineering
        how_built: Historical experiment, property and formulation data conform on Delta Lake, and Mosaic AI models tracked in MLflow simulate the property design space so chemists screen and rank candidates virtually before committing lab and reactor time.
        components:
          - LabWare LIMS
          - Delta Lake
          - Mosaic AI
          - MLflow
          - AI/BI
      - name: Autonomous Formulation Lab
        short: Formulation
        icon: product
        summary: Formulations optimized and translated to plant setpoints by a self-driving lab-to-plant loop.
        problem: A formulation that works in the lab behaves differently at plant scale, and with lab and plant data apart, recipe control and scale-up are trial and error that burn weeks of reactor time and off-spec material.
        who_benefits: Process Engineering
        how_built: Lab and plant historian data conform to common material and equipment keys, and Mosaic AI models tracked in MLflow propose and rank formulations, turning lab recipes into governed plant setpoints with risk guards before the first run.
        components:
          - Golden Batch Analytics
          - LabWare LIMS
          - AVEVA PI System
          - MLflow
          - Mosaic AI
