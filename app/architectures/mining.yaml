  - name: Published Products
    icon: product
    tiles:
      - name: Data Products
        icon: product
        summary: Published, contracted products discoverable in Unity Catalog Domains and shared over OpenSharing.
      - name: Sharing Recipients
        icon: share
        summary: Traders, smelters and joint-venture partners reading live tables with no copy.
  - name: Databricks Apps
    icon: apps
    tiles:
      - name: Pit Control Tower
        icon: gauge
        short: Fleet dispatch
        summary: Shovel queues, payload variance and reallocation options on Databricks Apps over Lakebase.
      - name: Plant Performance
        icon: stream
        short: Recovery live
        summary: Mill throughput and recovery against plan with constraint flags before metal is lost.
      - name: Grade Control
        icon: sheet
        short: Block model
        summary: Blast, dig and assay reconciled for short-term model updates before the shovel moves.
      - name: Shipment Tracker
        icon: globe
        short: Export cargo
        summary: Port stock, vessel laytime and assay disputes on one surface for marketing.
  - name: AI/BI Dashboards
    icon: aibi
    tiles:
      - name: Pit & Fleet Productivity
        icon: aibi
        summary: Payload, cycle time, queue and fleet productivity on certified operations Metric Views.
        kpis:
          - Fleet productivity
          - Payload variance
          - Truck queue time
          - Cycle time
          - Idle time
        teams:
          - Mine Operations
          - Site Leadership
          - Dispatch Controller
      - name: Grade & Recovery
        icon: aibi
        summary: Head grade, recovery, throughput and metal accounting across mine and plant.
        kpis:
          - Mill recovery
          - Head grade
