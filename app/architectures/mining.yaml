  - name: Agent Harnesses
    icon: agents
    tiles:
      - name: Omnigent OSS
        icon: omni
        short: Databricks, open source
        summary: Open-source meta-harness above existing agent frameworks, enabling agent composition, collaboration and centralised governance from one interface. A managed Beta is available.
        capabilities:
          - Build
          - Deploy
          - Optimize
          - Govern
        related:
          - Agent Bricks
          - Unity AI Gateway
      - name: Claude Code
        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity AI Gateway.
      - name: OpenAI Codex
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity AI Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity AI Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Pit Operations Agent
        icon: genie
        summary: Ask about payload, cycle time, queue and fleet productivity across the pit in plain language.
        feeds:
          - Modular Mining DISPATCH
          - Hexagon MineOperate
          - High-Precision GPS
          - Conformed block, fleet
        teams:
          - Mine Operations
          - Site Leadership
          - Dispatch Controller
        questions:
          - What was fleet productivity by shift yesterday?
          - Where are truck queues building right now and why?
          - Which trucks and shovels are underperforming their payload target?
          - How much did idle time cost us in diesel this week?
          - Which pit areas are limiting dig rate against the plan?
      - name: Recovery & Metallurgy Agent
        icon: genie
        summary: Explore head grade, recovery and metal accounting across mine and plant.
        feeds:
          - LIMS Assay Lab
          - Maptek BlastLogic
          - AVEVA PI System
          - Grade, cost, recovery
        teams:
          - Processing
          - Grade Control Geologist
          - Plant Metallurgist
        questions:
          - What was mill recovery yesterday versus plan?
          - Which circuit is constraining recovery today?
          - How does reconciled grade compare to the block model this month?
          - How much metal did we lose to tailings this shift?
          - Which blast blocks are diluting mill feed right now?
      - name: Logistics & Market Agent
        icon: genie
        summary: Answer questions on realised price, TC/RC terms, cargoes and demurrage.
        feeds:
          - SAP IS-Mining
          - Metal Bulletin
          - Port Community System
          - Rail Wagon Telemetry
        teams:
          - Marketing & Sales
          - Logistics & Shipping
          - Treasury & Hedging
        questions:
          - What is our realised price versus benchmark by cargo this month?
          - What is our current demurrage exposure across vessels?
          - Which cargoes are at risk of missing their laycan?
          - How effective are our hedges against the physical book?
          - Which contracts have open assay disputes right now?
      - name: Safety & Environment Agent
        icon: genie
        summary: Ask about safety leading indicators, permits and emissions across the operation.
        feeds:
          - Intelex EHS
          - Wearable Proximity
          - Envirosuite
          - Corporate Risk Ledger
        teams:
          - Safety & ESG
          - HSE Manager
          - Environment Lead
        questions:
          - What is our TRIFR trend this year?
          - How many proximity or zone-breach events happened this week?
          - Which permits are closest to a breach right now?
          - What is our Scope 1 emissions intensity per tonne this month?
          - Where are dust or vibration readings approaching community thresholds?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Orebody & Grade Control
        short: Ore body
        icon: sheet
        summary: Orebody knowledge and short-term grade models updated from drilling, blast, dig and assay before material is misrouted.
        problem: The block model lags the dig face and exploration and grade-control data sit apart, so ore and waste are called from sparse assays, misrouted material dilutes mill feed and grade is reconciled long after the shovel has moved.
        who_benefits: Mine Operations
        how_built: Drillhole, blast, dig, assay and survey feeds land through Lakeflow and conform on Delta Lake under Unity Catalog, then grade-control and orebody models score short-term block updates in the Grade Control app before the shovel moves.
        components:
          - Grade Control
          - Maptek BlastLogic
          - LIMS Assay Lab
          - Satellite Imagery
          - Model Serving
          - Delta Lake
        stories:
          - title: Nexa mines less waste and more value with AI-driven insights
            url: https://www.databricks.com/customers/nexa
      - name: Fleet Optimisation
        short: Productivity
        icon: iot
        summary: Truck and shovel matching tuned to queue time and fuel not static rules.
        problem: Truck and shovel assignment runs on static rules and a controller's judgement, so queues build at shovel and crusher, diesel burns idling and fleet productivity swings shift to shift.
        who_benefits: Mine Operations
        how_built: Dispatch, GPS and payload state stream into Lakehouse//RT, and matching models scored in Model Serving feed reallocation options to the Pit Control Tower before the shift plan changes.
        components:
          - Pit Control Tower
          - Modular Mining DISPATCH
          - High-Precision GPS
          - Lakehouse//RT
          - Model Serving
          - Delta Lake
        stories:
          - title: Sandvik enables collaboration and real-time equipment insight
            url: https://www.databricks.com/customers/sandvik
      - name: Mill Recovery
        short: Processing
        icon: gauge
        summary: Circuit recovery maximised when feed grade and hardness shift.
        problem: Feed grade and ore hardness drift through the shift, and by the time recovery drops in the lab result metal has already been lost to tailings that no reagent change can bring back.
        who_benefits: Processing
        how_built: Concentrator historian and assay tags conform on Delta Lake, and recovery models scored in Model Serving flag circuit constraints in the Plant Performance app before metal is lost.
        components:
          - Plant Performance
          - AVEVA PI System
          - Metso Metrics
          - Model Serving
          - MLflow
          - Delta Lake
        stories:
          - title: Nexa mines less waste and more value with AI-driven insights
            url: https://www.databricks.com/customers/nexa
      - name: Haul Fleet & Mill Reliability
        short: Assets
        icon: stream
        summary: Haul-truck, shovel and mill failures predicted from telemetry before they remove capacity from the plan.
        problem: Mobile fleet and fixed plant fail between inspections and pull capacity out of the plan, so a component is found broken after the machine stops rather than predicted from the telemetry it was already emitting.
        who_benefits: Mine Operations
        how_built: Fleet and concentrator telemetry streams into Lakehouse//RT and feeds remaining-life models tracked in MLflow and scored in Model Serving, raising a CMMS work order before the truck or mill leaves service.
        components:
          - Metso Metrics
          - AVEVA PI System
          - Lakehouse//RT
          - Model Serving
          - MLflow
          - Feature Store
        stories:
          - title: Sandvik enables collaboration and real-time equipment insight
            url: https://www.databricks.com/customers/sandvik
          - title: What is predictive maintenance on the Databricks platform
            url: https://www.databricks.com/blog/what-is-predictive-maintenance
      - name: Consumables & Supply Planning
        short: Materials
        icon: partner
        summary: Reagents, tyres, grinding media and explosives planned to real consumption and lead times so a stockout never stops the pit or plant.
        problem: Critical consumables are planned from static reorder points and spreadsheets, so the operation carries too much of the wrong stock and still runs short on the reagent, tyre or grinding media that stops a shovel or a mill.
        who_benefits: Marketing & Sales
        how_built: SAP consumption and supplier lead-time data conform on Delta Lake and are scored in Model Serving, so the Shipment Tracker and certified AI/BI views tune buffers to real variability and flag single-source exposure before a stockout.
        components:
          - Shipment Tracker
          - SAP IS-Mining
          - Model Serving
          - AI/BI
          - Delta Lake
      - name: Mine-to-Market Traceability
        short: Provenance
        icon: globe
        summary: Every tonne traced from pit through stockpile and rail to vessel, with product provenance and metal accounting reconciled end to end.
        problem: Movements across pit, stockpile, rail and port are reconciled by nightly spreadsheet, so metal accounting drifts, a cargo waits on ore or a ship on a berth, and provenance for responsibly-sourced metal cannot be proven to a buyer.
        who_benefits: Marketing & Sales
        how_built: Dispatch, survey, rail telemetry and port feeds land through Lakeflow and conform on Delta Lake under Unity Catalog, so the Shipment Tracker reconciles mine-to-vessel movement, metal accounting and provenance for the marketing desk.
        components:
          - Shipment Tracker
          - Rail Wagon Telemetry
          - Port Community System
          - Unity Catalog
          - Delta Lake
          - AI/BI
      - name: Fatal-Risk & Safety
        short: Risk
        icon: gavel
        summary: Fatal-risk leading indicators and proximity events surfaced before a recordable occurs.
        problem: Incidents, near-misses and proximity events sit in separate systems and are read after the fact, so leading indicators of fatal-risk exposure are joined up only after a recordable happens.
        who_benefits: Safety & ESG
        how_built: Incident, permit and proximity feeds conform on Delta Lake under Unity Catalog, and fatal-risk leading indicators are surfaced in AI/BI and the Safety Dashboard before a recordable occurs.
        components:
          - Intelex EHS
          - Wearable Proximity
          - Unity Catalog
          - Delta Lake
          - AI/BI
          - Model Serving
        stories:
          - title: BP's geospatial AI engine transforms safety and operations
            url: https://www.databricks.com/blog/bps-geospatial-ai-engine-transforming-safety-and-operations-databricks
          - title: Nexa mines less waste and more value with AI-driven insights
            url: https://www.databricks.com/customers/nexa
      - name: Emissions & Tailings
        short: ESG
        icon: observ
        summary: Diesel, power and water intensity per tonne plus tailings and reuse tracked for disclosure, cost and circularity.
        problem: Diesel, power, water and tailings are metered per site weeks late, so intensity per tonne is a month-end estimate and neither the cost lever, the Scope 1 disclosure nor the water-reuse case traces back to the equipment and process that drove it.
        who_benefits: Safety & ESG
        how_built: Fuel, power, water and tailings data conform on Delta Lake under Unity Catalog, and intensity per tonne with reuse and circularity metrics is served in AI/BI with lineage from meter to the emissions and cost disclosure.
        components:
          - Envirosuite
          - AVEVA PI System
          - Unity Catalog
          - Delta Lake
          - AI/BI
          - Data Products
        stories:
          - title: Gerdau delivers world-class steel with Databricks
            url: https://www.databricks.com/customers/gerdau
          - title: How Dow built a carbon footprint ledger on Databricks
            url: https://www.databricks.com/blog/how-dow-built-carbon-footprint-ledger-databricks-accelerate-sustainability-scale
      - name: Commodity Demand Forecasting
        short: Demand
        icon: market
        summary: Commodity demand and price signals forecast so production, sales and hedging plan against the market not the spreadsheet.
        problem: Demand and price live in benchmark feeds and analyst spreadsheets disconnected from production, so sales commitments, stockpile plans and hedge cover are set on stale views and margin is left on the table.
        who_benefits: Marketing & Sales
        how_built: Benchmark price, contract and production feeds conform on Delta Lake under Unity Catalog and are scored in Model Serving, so demand and price forecasts drive sales, stockpile and hedge decisions in AI/BI and Genie One for the marketing desk.
        components:
          - Metal Bulletin
          - SAP IS-Mining
          - Model Serving
          - AI/BI
          - Genie One
        stories:
          - title: Vale transforms finance with agentic AI at scale
            url: https://www.databricks.com/customers/vale/agent-bricks
      - name: Regulatory & ESG Reporting
        short: Compliance
        icon: gavel
        summary: Mine-safety, emissions and resource-and-reserve disclosures produced from the same governed tables the operation runs on.
        problem: Regulator submissions and ESG disclosures are assembled by hand from EHS, environmental and production systems, so filing is slow, every regulator's format is a fresh manual export and the numbers cannot be traced to source.
        who_benefits: Safety & ESG
        how_built: EHS, environmental and production feeds conform under Unity Catalog on Delta Lake, so mine-safety, emissions and resource disclosures are produced with lineage from the certified Gold products the operation already runs on.
        components:
          - Intelex EHS
          - Envirosuite
          - SAP IS-Mining
          - Unity Catalog
          - Delta Lake
          - Data Products
medallion:
  Bronze:
    short: Raw pit feeds
    summary: Fleet dispatch, shovel and truck cycles, plant SCADA tags, lab assays and port load events, landed exactly as received so a ton or a grade can always be replayed as it stood.
  Silver:
    short: Conformed block, fleet
    summary: Blocks, benches, equipment and shipments resolved into single conformed entities across dispatch, plant and commercial systems, with sample IDs reconciled and stockpile movements stitched to one inventory position.
  Gold:
    short: Grade, cost, recovery
    summary: 'Contracted products operations and commercial teams run on: recovered metal per tonne milled, unit cash cost, fleet productivity and port demurrage exposure by cargo.'
