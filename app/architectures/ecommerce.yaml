agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Growth & Revenue Agent
        icon: genie
        summary: Ask about conversion, revenue, CAC and channel performance in plain language.
        feeds:
          - Shopify Plus
          - Google Analytics 4
          - Klaviyo
          - Conversion, AOV, LTV
        teams:
          - Growth Marketing
          - CEO & Growth CFO
          - Merchandising
        questions:
          - What was yesterday's conversion rate by channel?
          - What is blended CAC and LTV-to-CAC by acquisition channel?
          - Which campaigns drove the most incremental revenue this week?
          - How is AOV trending across paid, owned and marketplace?
          - What is return on ad spend by channel and campaign?
      - name: Fulfillment & Inventory Agent
        icon: genie
        summary: Explore delivery SLA, available-to-promise and cost to serve across nodes.
        feeds:
          - Manhattan Active Omni
          - ShipBob WMS
          - Flexport Logistics
          - Conformed customers and orders
        teams:
          - Operations
          - Customer Experience
          - Growth Marketing
        questions:
          - What is on-time delivery by node and carrier right now?
          - Where is available-to-promise drifting from actual stock?
          - What is cost to serve per order by fulfillment node?
          - Which orders are at risk of missing the promise date?
          - Which nodes have the highest split-shipment rate?
      - name: Payments & Fraud Agent
        icon: genie
        summary: Answer questions on payment success, disputes and checkout fraud.
        feeds:
          - Stripe Payments
          - Adyen Platform
          - Manhattan Active Omni
        teams:
          - CEO & Growth CFO
          - Operations
          - Customer Experience
        questions:
          - What is our payment authorization rate by processor?
          - How is the chargeback rate trending this month?
          - Which fraud patterns are driving the most declines?
          - What is dispute volume by reason code and market?
          - Where are false-positive declines costing us good orders?
      - name: Customer & Lifecycle Agent
        icon: genie
        summary: Ask about retention, LTV segments and CX health across cohorts.
        feeds:
          - Klaviyo
          - Braze
          - Narvar Post-Purchase
        teams:
          - Customer Experience
          - Growth Marketing
          - CEO & Growth CFO
        questions:
          - What is repeat purchase rate by acquisition cohort?
          - Which LTV segments respond best to lifecycle journeys?
          - What is our return rate by category and reason?
          - How does CSAT compare across support channels?
          - Which cohorts are at highest churn risk right now?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Personalization
        short: Growth
        icon: custlake
        summary: Product recommendations and content ranked per visitor.
        problem: Every visitor sees the same merchandising, so relevant products stay buried and conversion leaks, and the signals to rank per shopper sit split across web, CRM and order systems.
        who_benefits: Growth Marketing
        how_built: Clickstream and order features are engineered in Feature Store and scored through Model Serving in the storefront path, so recommendations rank per visitor at page latency.
        components:
          - Model Serving
          - Feature Store
          - MLflow
          - AI Functions
          - Klaviyo
        stories:
          - title: Flaconi delivers real-time recommendations that lift conversion
            url: https://www.databricks.com/customers/flaconi
          - title: Myntra powers personalized shopping for 70M monthly users
            url: https://www.databricks.com/customers/myntra
      - name: Cart Abandonment
        short: Lifecycle
        icon: apps
        summary: Recovery sequences timed to session behavior.
        problem: Most carts are abandoned and recovery fires on a fixed timer that ignores intent, so shoppers are nagged or missed and the session context that would time the nudge is already gone.
        who_benefits: Growth Marketing
        how_built: Live session and cart state land in Lakebase and Lakehouse//RT, and propensity scores from Model Serving trigger recovery journeys in Klaviyo and Braze at the right moment.
        components:
          - Lakebase
          - Lakehouse//RT
          - Model Serving
          - Klaviyo
          - Braze
        stories:
          - title: Pandora scales personalized email recommendations across markets
            url: https://www.databricks.com/customers/pandora
      - name: Dynamic Pricing
        short: Merchandising
        icon: market
        summary: Prices adjusted to elasticity and competitive signals.
        problem: Prices are set on cost-plus rules and stale competitor checks, so margin leaks on some SKUs and demand is left on the table on others while true elasticity goes unmeasured.
        who_benefits: Merchandising
        how_built: Demand, inventory and competitive signals feed elasticity models in Pricing Workbench, scored with Model Serving and pushed to the storefront and marketplaces.
        components:
          - Pricing Workbench
          - Model Serving
          - AI Functions
          - Delta Lake
          - Unity Catalog
        stories:
          - title: Seven ways AI reshapes retail pricing and operations
            url: https://www.databricks.com/blog/top-7-ways-ai-retail-enhances-customer-experience-and-operations
      - name: Inventory ATP
        short: Operations
        icon: stream
        summary: Available-to-promise accurate at add-to-cart.
        problem: Available-to-promise is computed from a nightly snapshot, so the cart shows stock that is already gone and oversells trigger cancellations, split shipments and refunds.
        who_benefits: Operations
        how_built: OMS and WMS events stream through Zerobus into Lakehouse//RT, and Fulfillment Command serves an ATP position accurate at add-to-cart across every node.
        components:
          - Fulfillment Command
          - Lakehouse//RT
          - Zerobus
          - Manhattan Active Omni
          - Delta Lake
        stories:
          - title: Walgreens right-sizes inventory across 9,000 stores on Databricks
            url: https://www.databricks.com/customers/walgreens
      - name: Fraud Prevention
        short: Payments
        icon: gavel
        summary: Checkout fraud scored before capture.
        problem: Checkout fraud and chargebacks eat margin, but rules-only screening blocks good customers and misses new patterns, and the score has to land before capture in milliseconds.
        who_benefits: CEO & Growth CFO
        how_built: Per-card velocity features are served from Lakebase and scored by Model Serving in the checkout path, with every model tracked in MLflow for audit and dispute defense.
        components:
          - Model Serving
          - Feature Store
          - MLflow
          - Lakebase
          - Stripe Payments
        stories:
          - title: Real-time fraud detection with Spark Real-Time Mode and Lakebase
            url: https://www.databricks.com/blog/how-build-real-time-fraud-detection-using-spark-real-time-mode-and-lakebase
      - name: Search Relevance
        short: Discovery
        icon: observ
        summary: Query understanding and ranking tuned to conversion.
        problem: On-site search misreads intent and synonyms, so shoppers land on empty or irrelevant results and bounce, and merchandisers cannot see which queries quietly lose the sale.
        who_benefits: Merchandising
        how_built: Query and catalog embeddings in AI Search rank results with Model Serving, and AI/BI surfaces zero-result and low-conversion queries merchandisers tune against.
        components:
          - AI Search
          - Model Serving
          - AI Functions
          - Feature Store
          - AI/BI
      - name: Returns Optimization
        short: CX
        icon: partner
        summary: Return reasons analyzed to reduce preventable volume.
        problem: Returns are processed blind to why they happen, so preventable returns from sizing, defects or misleading detail keep recurring and reverse-logistics cost climbs every season.
        who_benefits: Customer Experience
        how_built: Return reasons, reviews and order history are conformed on Delta Lake and analysed with AI Functions in the CX Console, feeding fixes back to detail pages and sizing.
        components:
          - CX Console
          - AI Functions
          - Narvar Post-Purchase
          - Delta Lake
          - AI/BI
      - name: Marketplace Sync
        short: Channels
        icon: globe
        summary: Listings, fees and ads optimized across marketplaces.
        problem: Listings, fees, inventory and ad spend live in each marketplace console, so price and stock drift out of sync, buy-box is lost and true per-channel profit is never clear.
        who_benefits: Merchandising
        how_built: Amazon and eBay order, fee and ad feeds land through Lakeflow onto Delta Lake, and AI/BI reconciles price, stock and margin per channel into a single sync view.
        components:
          - Amazon Seller Central
          - eBay Managed Payments
          - Lakeflow
          - Delta Lake
          - AI/BI
      - name: LTV Segmentation
        short: CRM
        icon: custlake
        summary: Cohorts scored for retention and upsell campaigns.
        problem: Campaigns target broad lists because lifetime value is guessed from last purchase, so budget chases one-time buyers while high-value cohorts get the same generic offer.
        who_benefits: Growth Marketing
        how_built: Purchase, engagement and margin features in Feature Store drive LTV and churn models in Model Serving, and Klaviyo activates the scored cohorts for retention and upsell.
        components:
          - Model Serving
          - Feature Store
          - MLflow
          - Klaviyo
          - AI/BI
        stories:
          - title: Skechers lifts CTR 324% and cuts acquisition cost with segmentation
            url: https://www.databricks.com/customers/skechers
      - name: Fulfillment Network
        short: Logistics
        icon: stream
        summary: Orders routed to the lowest-cost node meeting SLA.
        problem: Orders route on static warehouse rules, so shipments travel farther than needed, split across nodes and miss the promise date while carrier and labor cost creep up.
        who_benefits: Operations
        how_built: Inventory, carrier-rate and demand signals are scored in Model Serving and served through Fulfillment Command, routing each order to the lowest-cost node that still meets SLA.
        components:
          - Fulfillment Command
          - Model Serving
          - Manhattan Active Omni
          - ShipBob WMS
          - Delta Lake
