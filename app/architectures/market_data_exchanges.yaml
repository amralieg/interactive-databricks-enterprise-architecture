        icon: code
        short: 3rd-party harness
        summary: Anthropic's coding harness working against the platform through MCP, with spend, routing and policy governed by Unity AI Gateway.
      - name: OpenAI Codex
        icon: code
        short: 3rd-party harness
        summary: OpenAI's coding harness connected over MCP, governed at runtime by Unity AI Gateway rather than trusted by configuration.
      - name: Any MCP Harness
        icon: mcp
        short: Cursor, IDEs, frameworks
        summary: Cursor and other IDE agents, LangGraph and CrewAI frameworks, and any other harness that speaks MCP, admitted and scoped in the Unity AI Gateway registry.
agent_usecases:
  - name: Genie Agents
    icon: genie
    span: 3
    cols: 2
    tiles:
      - name: Market Quality & Latency Agent
        icon: genie
        summary: Ask about matching latency, spreads, depth and fairness by symbol in plain language.
        feeds:
          - Nasdaq Matching
          - TotalView-ITCH
          - Latency, quality, index, usage
        teams:
          - Market Ops
          - Matching-engine ops
          - Market quality
        questions:
          - What is our matching latency by symbol right now versus yesterday?
          - Which symbols show the widest spreads and thinnest depth today?
          - Where did message rates spike and did any gateway degrade?
          - Are there fairness concerns in fill sequencing for any symbol?
          - Which gateways are closest to capacity at peak?
      - name: Data Revenue & Entitlements Agent
        icon: genie
        summary: Explore data-subscription revenue, usage and entitlement coverage.
        feeds:
          - Market Data Billing
          - LSEG Real-Time
          - Latency, quality, index, usage
        teams:
          - Data Business
          - Exchange Exec
          - Licensing & entitlements
        questions:
          - What did data-subscription revenue do last quarter by product?
          - Which subscribers consume the most billable usage right now?
          - Where is usage exceeding entitlement, and by how much?
          - Which feeds have the strongest adoption this year?
          - Which clients recently churned from a feed and what did they consume?
      - name: Index & Benchmarks Agent
        icon: genie
        summary: Ask about index levels, constituent weights and rebalance impact.
        feeds:
          - S&P DJI Indices
          - FTSE Russell
          - MSCI Indexes
          - Conformed books, instruments, indices
        teams:
          - Index Products
          - Index calculation
          - Benchmark governance
        questions:
          - What are today's levels and the largest movers across our indices?
          - What is the projected turnover for the next rebalance?
          - Which constituents drive the most weight change this review?
          - How many restatements occurred this quarter and why?
          - Are all index calculations meeting their publication SLA?
      - name: Surveillance & Integrity Agent
        icon: genie
        summary: Investigate manipulation, member conduct and order-trail completeness.
        feeds:
          - Nasdaq SMARTS
          - CTA/UTP SIP
          - Conformed books, instruments, indices
        teams:
          - Surveil & Reg
          - Market surveillance
          - Regulatory reporting
        questions:
          - Which members showed spoofing or layering patterns this week?
          - What was a member's activity around this print?
          - Which alert types have the worst false-positive rate?
          - How many surveillance cases are open past their SLA?
          - Is our order and trade trail complete for the reporting period?
  - name: Business Use Cases
    icon: ztarget
    span: 8
    cols: 5
    tiles:
      - name: Market Data Feeds
        short: Distribution
        icon: stream
        summary: Capturing full order-by-order depth, consolidated ticks and quotes and republishing them to subscribers and internal analytics on one governed platform instead of a separate real-time silo.
        problem: Tick feeds land in a low-latency plant that analytics cannot touch, so the same ITCH and OPRA data is copied into a second estate for research, billing and distribution, and the copies never agree.
        who_benefits: Data Business
        how_built: ITCH, OPRA and SIP feeds land through the Multicast Feed Bus and Zerobus into Lakehouse//RT; conformed depth and trade products are served to internal teams and out to subscribers over Delta Sharing Feeds.
        components:
          - Feed Ops Monitor
          - Multicast Feed Bus
          - Lakehouse//RT
          - Delta Sharing Feeds
          - Zerobus
        stories:
          - title: Nasdaq reinvents finance with Databricks
            url: https://www.databricks.com/customers/nasdaq
          - title: 'The boom of SOON: Coinbase streaming ingestion'
            url: https://www.databricks.com/customers/coinbase/streaming
      - name: Matching & Fairness
        short: Market quality
        icon: gauge
        summary: Watching matching latency, spread, depth and fill fairness by symbol so market-quality problems and gateway issues are caught in the trading day rather than in a post-mortem.
        problem: Matching-engine and gateway telemetry sits in operational logs no analytics can reach, so latency drift and fairness questions are answered days later from partial exports.
        who_benefits: Market Ops
        how_built: Gateway logs and order-book events stream into Lakehouse//RT; latency, spread and fairness metrics are computed to Gold and watched in the Market Quality app on the market-quality team's own definitions.
        components:
          - Market Quality
          - Nasdaq Matching
          - Lakehouse//RT
          - TotalView-ITCH
          - AI/BI
        stories:
          - title: Nasdaq reinvents finance with Databricks
            url: https://www.databricks.com/customers/nasdaq
          - title: Modernizing investment data platforms
            url: https://www.databricks.com/blog/2021/01/29/strategies-for-modernizing-investment-data-platforms.html
      - name: Index Calculation
        short: Benchmarks
        icon: chart
        summary: Running real-time and end-of-day index levels, weights and rebalances at the scale of thousands of benchmarks, with a methodology audit trail for every restatement.
        problem: Index calculation runs in bespoke engines that cannot scale to thousands of custom benchmarks or replay a methodology change, so launches are slow and restatements are hard to defend.
        who_benefits: Index Products
        how_built: Constituent, pricing and corporate-actions data are conformed in the lakehouse; levels and rebalance impact are computed in Model Serving and signed off in the Index Cockpit against certified Metric Views.
        components:
          - Index Cockpit
          - S&P DJI Indices
          - Model Serving
          - AI/BI
          - Index Publication
        stories:
          - title: Nasdaq reinvents finance with Databricks
            url: https://www.databricks.com/customers/nasdaq
          - title: S&P Global unifies data intelligence
            url: https://www.databricks.com/customers/sp-global
      - name: Market Surveillance
        short: Market abuse
        icon: gavel
        summary: Detecting spoofing, layering, wash trades and manipulation across the venue's own order flow, with an audit trail and completeness a regulator will accept.
        problem: Surveillance runs in a vendor silo with gappy data, so alerts are noisy, investigations are slow, and completeness across the venue's order flow cannot be proven to an examiner.
        who_benefits: Surveil & Reg
        how_built: Orders, executions and messages are unified in the lakehouse with Unity Catalog completeness checks; detectors and AI Functions score patterns and cases open in the Surveillance Console.
        components:
          - Surveillance Console
          - Nasdaq SMARTS
          - AI Functions
          - Model Serving
          - Lakehouse//RT
        stories:
          - title: 'FINRA: predictive fraud detection at scale'
            url: https://www.databricks.com/blog/2019/06/05/customer-spotlight-finra.html
          - title: Real-time fraud detection at Coinbase
            url: https://www.databricks.com/customers/coinbase/lakeflow
      - name: Data Monetization
        short: Commercial
        icon: product
        summary: Packaging tick, reference, corporate-actions and index data as contracted products and selling them to subscribers over sharing and marketplaces instead of bespoke file feeds.
        problem: Every new data product is a custom extract-and-FTP build, so time-to-launch is long, copies proliferate, and the venue cannot see who consumes what or prove entitlement.
        who_benefits: Exchange Exec
        how_built: Curated feeds are published as contracted Data Products, discoverable in Unity Catalog and delivered over OpenSharing and Cloud Marketplaces to entitled Sharing Recipients with no copy.
        components:
          - Data Products
          - Sharing Recipients
          - OpenSharing
          - Cloud Marketplaces
          - Unity Catalog
        stories:
          - title: LSEG and Databricks partner on AI-ready data via Delta Sharing
            url: https://www.lseg.com/en/media-centre/press-releases/2025/lseg-databricks-partner-bring-ai-ready-financial-data-natively-analytics-ai-apps-agents
          - title: S&P Global unifies data intelligence
            url: https://www.databricks.com/customers/sp-global
      - name: Data Entitlements
        short: Licensing
        icon: identity
        summary: Metering exactly which subscriber consumed which feed and republishing usage into billing, so market-data revenue is accurate and reporting to licensees is defensible.
        problem: Usage is reconstructed from delivery logs weeks after the fact, so under-reporting and over-entitlement go undetected and market-data revenue leaks between the feed and the invoice.
        who_benefits: Data Business
        how_built: Delivery and access events are conformed against entitlements in Unity Catalog; consumption is metered to Gold, reconciled against Market Data Billing and written back through Entitlement Writeback.
        components:
          - Entitlement Writeback
          - Unity Catalog
          - Subscriber APIs
          - AI/BI
          - Market Data Billing
        stories:
          - title: Governing B-PIPE entitlements on Databricks (industry solution)
            url: https://github.com/databricks-industry-solutions/bpipe-spark
      - name: Corporate Actions
        short: Reference
        icon: cdc
        summary: Ingesting and normalising dividends, splits, mergers and re-organisations and applying them to instruments and index constituents so downstream products stay correct.
        problem: Corporate actions arrive from many sources in incompatible formats and must be applied point-in-time; a missed split or wrong ex-date silently corrupts prices, indices and client feeds.
        who_benefits: Data Business
        how_built: SIX and vendor corporate-actions feeds are ingested with Lakeflow and versioned as slowly-changing records in Delta Lake, applied to instruments under Unity Catalog lineage so history is replayable.
        components:
          - SIX Reference Data
          - Bloomberg FIGI
          - Lakeflow
          - Delta Lake
          - Unity Catalog
        stories:
          - title: Investment management reference architecture
            url: https://www.databricks.com/resources/architectures/financial-services-investment-management-reference-architecture
          - title: Modernizing investment data platforms
            url: https://www.databricks.com/blog/2021/01/29/strategies-for-modernizing-investment-data-platforms.html
      - name: Reference Data Master
        short: Symbology
        icon: db
        summary: Mastering instruments, issuers and identifiers across FIGI, ISIN, LEI and internal symbols so every feed, index and report resolves to the same security.
        problem: Vendor, venue and internal symbologies disagree, so the same instrument appears under many keys and joins across feeds, indices and reports break in ways nobody can trace.
        who_benefits: Data Business
        how_built: FIGI, ISIN, LEI and vendor identifiers are conformed into one governed security master in Delta Lake, with Unity Catalog lineage so every product resolves to a single instrument.
        components:
          - GLEIF LEI
          - ANNA DSB ISIN/UPI
          - Bloomberg FIGI
          - Unity Catalog
          - Delta Lake
        stories:
          - title: S&P Global unifies data intelligence
            url: https://www.databricks.com/customers/sp-global
          - title: Investment management reference architecture
            url: https://www.databricks.com/resources/architectures/financial-services-investment-management-reference-architecture
      - name: Clearing & Settlement
        short: Post-trade
        icon: partner
        summary: Reconciling matched trades, cleared positions and margin across the CCP and settlement systems so fails and margin risk are seen intraday, not at settlement.
        problem: Cleared-position, margin and settlement records live in separate CCP and settlement systems reconciled in batch, so fails and margin shortfalls surface late when they are expensive to fix.
        who_benefits: Market Ops
        how_built: Matched trades, OCC and LCH margin and DTCC settlement feeds stream into the lakehouse; reconciliation runs continuously and fails and margin risk are surfaced to AI/BI intraday.
        components:
          - OCC Clearing
          - DTCC Settlement
          - LCH / CCP
          - Lakeflow
          - AI/BI
        stories:
          - title: Investment management reference architecture
            url: https://www.databricks.com/resources/architectures/financial-services-investment-management-reference-architecture
      - name: Regulatory Reporting
        short: Reporting
        icon: gavel
        summary: Producing CAT, MiFID and transparency reports as the market operator from the same governed data the venue matches on, complete and on time.
        problem: Operator reporting is assembled from reconciled extracts under deadline, so late fixes and re-submissions are routine and proving completeness and lineage to the regulator is hard.
        who_benefits: Surveil & Reg
        how_built: Order, trade and reference data are conformed to Gold with Unity Catalog lineage; CAT and MiFID submissions are generated and filed from contracted products with a full audit trail via Genie.
        components:
          - CAT / MiFID Reports
          - Reg Submissions
          - Unity Catalog
          - Data Products
          - Genie
        stories:
          - title: 'FINRA: predictive fraud detection at scale'
            url: https://www.databricks.com/blog/2019/06/05/customer-spotlight-finra.html
          - title: Modernizing investment data platforms
            url: https://www.databricks.com/blog/2021/01/29/strategies-for-modernizing-investment-data-platforms.html
medallion:
  Bronze:
    short: Raw feeds and messages
    summary: ITCH and OUCH order-book messages, OPRA and consolidated-tape ticks, matching-engine gateway logs, corporate-actions announcements and index constituent files, landed exactly as received so a print or a quote can always be replayed as it stood.
  Silver:
    short: Conformed books, instruments, indices
    summary: Order books, executions, instruments and index constituents resolved into single conformed entities across the matching, reference and index estates, with FIGI, ISIN and LEI identifiers reconciled and every print stitched to one security.
  Gold:
    short: Latency, quality, index, usage
    summary: 'Contracted products the venue and data teams run on: matching latency and fairness by symbol, quote and trade quality, index levels and rebalance impact, and market-data consumption by subscriber and entitlement.'
