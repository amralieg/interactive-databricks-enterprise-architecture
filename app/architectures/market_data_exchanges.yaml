pipelines:
  - name: Business
    icon: zbrief
    tiles:
      - name: Exchange Exec
        mark: Genie One
        summary: The CEO on trading volumes, listings and the growth of the data and index franchise; the CFO on transaction, data and index revenue against the cost of running the venue; the Chief Commercial Officer on how market-data and index products are packaged, priced and sold.
        uses:
          - - Genie One
            - Ask what data and index revenue did last quarter, or which feed a client churned from, without booking an analyst.
          - - AI/BI
            - Trading volume, data-subscription and index revenue on one certified set of Metric Views.
          - - Unity Catalog
            - One governed glossary, so "billable usage" and "active subscriber" mean one thing across the group.
        sub:
          - name: CEO
            cares: trading volumes, listings and the growth of the data and index franchise.
          - name: CFO
            cares: transaction, data and index revenue against the cost of running the venue.
          - name: Chief Commercial Officer
            cares: how market-data and index products are packaged, priced and sold.
        ucs:
          - Data Monetization
          - Market Data Feeds
          - Index Calculation
      - name: Market Ops
        mark: Lakehouse//RT
        summary: Matching-engine operators watching fill rates, message rates and gateway health; the market-quality team on spreads, depth and fairness; the clearing and settlement operations team on margin, fails and settlement risk across the trading day.
        uses:
          - - Lakehouse//RT
            - Order-book, gateway and clearing state at the latency the matching engine actually runs at.
          - - Model Serving
            - Fairness, anomaly and settlement-risk models scored inside the trading day.
          - - AI/BI
            - Latency, spread, depth and fails on the same definitions the market-quality team defends.
        sub:
          - name: Matching-engine ops
            cares: fill rates, message rates and gateway health.
          - name: Market quality
            cares: spreads, depth and execution fairness by symbol.
          - name: Clearing & settlement ops
            cares: margin, fails and settlement risk across the day.
        ucs:
          - Matching & Fairness
          - Clearing & Settlement
          - Market Surveillance
      - name: Data Business
        mark: Data Products
        summary: The Chief Data Officer on the market-data and reference-data catalogue; data product managers packaging tick, depth and corporate-actions feeds; the licensing and entitlements team metering consumption and billing subscribers for what they actually use.
        uses:
          - - Data Products
            - Tick, depth, reference and corporate-actions feeds published as contracted, discoverable products.
          - - OpenSharing
            - Live feeds delivered to subscribers and vendors with no copy and no egress duplication.
          - - Unity Catalog
            - Entitlements, lineage and usage governed from the same catalogue the products live in.
        sub:
          - name: Chief Data Officer
            cares: the market-data and reference-data catalogue end to end.
          - name: Data product managers
            cares: packaging tick, depth and corporate-actions feeds.
          - name: Licensing & entitlements
            cares: metering consumption and billing subscribers for actual use.
        ucs:
          - Market Data Feeds
          - Corporate Actions
          - Data Entitlements
          - Data Monetization
          - Reference Data Master
      - name: Index Products
        mark: AI/BI
        summary: Index product managers launching and maintaining benchmarks; the index calculation team running real-time and end-of-day levels and rebalances; benchmark governance proving methodology, restatements and IOSCO compliance to regulators and licensees.
        uses:
          - - AI/BI
            - Index levels, constituent weights and rebalance impact on one certified set of Metric Views.
          - - MLflow
            - Every index restatement and methodology change tracked for audit and reproduction.
          - - Unity Catalog
            - Constituent data and methodology governed with lineage from source to published level.
        sub:
          - name: Index product managers
            cares: launching and maintaining benchmarks and custom indices.
          - name: Index calculation
            cares: real-time and end-of-day levels and rebalances.
          - name: Benchmark governance
            cares: methodology, restatements and IOSCO compliance.
        ucs:
          - Index Calculation
          - Reference Data Master
          - Data Monetization
      - name: Surveil & Reg
        mark: AI Functions
        summary: Market-surveillance analysts investigating spoofing, layering and manipulation across the venue's order flow; the market-integrity team on member conduct; the regulatory reporting team filing CAT, MiFID and transaction reports as the market operator.
        uses:
          - - AI Functions
            - Order and trade patterns screened for manipulation across the whole venue at scale.
          - - Genie One
            - Investigators ask for a member's activity around a print in plain language.
          - - Unity Catalog
            - Complete, auditable order-and-trade trails that satisfy a regulatory examination.
        sub:
          - name: Market surveillance
            cares: spoofing, layering and manipulation across order flow.
          - name: Market integrity
            cares: member conduct and disciplinary referrals.
          - name: Regulatory reporting
            cares: CAT, MiFID and transaction reporting as operator.
        ucs:
          - Market Surveillance
          - Regulatory Reporting
          - Matching & Fairness
  - name: Technical
    icon: code
    tiles:
      - name: Feed Engineers
        mark: Lakeflow
        summary: Capture ITCH and OUCH multicast, OPRA and consolidated-tape feeds and Exegy-style feed handlers off Kafka, curate the depth and trade tables, and keep every tick feed fresh for calculation and distribution.
        uses:
          - - Lakeflow Connect
            - Managed connectors for matching-engine, reference and vendor sources.
          - - Auto Loader
            - Continuous ingestion of multicast and file feeds into Bronze with schema evolution.
          - - Lakewatch
            - Freshness on the tick and reference tables every desk and subscriber depends on.
        sub:
          - name: Ingestion Engineers
            cares: ITCH and OUCH multicast, OPRA and consolidated-tape feeds captured off the wire on time.
          - name: Pipeline Engineers
            cares: depth and trade tables conformed with expectations on every tick feed.
          - name: Platform Reliability
            cares: freshness of the tick and reference tables every desk and subscriber depends on.
      - name: Index Quants
        mark: MLflow
        summary: Turn index methodology in Python and kdb+/q into production calculation, rebalancing and backtests, and own the libraries the index and benchmark teams run against.
        uses:
          - - Feature Store
            - Constituent and factor features defined once and read identically in research and calculation.
          - - MLflow
            - Every index calculation, restatement and backtest versioned and reproducible for audit.
          - - Model Serving
            - Index levels and rebalance impact computed in the live calculation path.
        sub:
          - name: Calculation Engineers
            cares: index methodology turned into production calculation and rebalancing.
          - name: Backtest Engineers
            cares: index restatements and backtests versioned and reproducible for audit.
          - name: Reference Data Engineers
            cares: constituent, identifier and corporate-actions data conformed for calculation.
      - name: App Developers
        mark: Apps
        summary: Ship the market-quality, feed-operations, index and surveillance applications the venue works in, hosted next to governed data.
        uses:
          - - Apps
            - Operational screens with no separate web tier to run or secure.
          - - Lakebase
            - Serverless Postgres for entitlement, case and index-publication state with governed writes.
          - - Agent Bricks
            - Agents that draft a surveillance case or a feed-outage summary against governed tools.
        sub:
          - name: Full-Stack Engineers
            cares: the market-quality, feed-operations and index screens the venue works in.
          - name: Agent Developers
            cares: agents that draft a surveillance case or feed-outage summary on governed tools.
          - name: Integration Engineers
            cares: entitlement, case and index-publication writeback into venue systems.
consumers:
  - name: BI & Productivity
